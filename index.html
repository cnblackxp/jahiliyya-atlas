/wiki/Dahis_and_al-Ghabra"},{"id":"kulab-ii","year":600,"endYear":null,"title":"Yawm al-Kulāb II and al-Ṣafqa","ar":"يوم الكلاب الثاني","evidence":"TRAD","dateCertainty":"legendary","dateRange":[590,615],"estimated":true,"dateNote":"Undated; placed late because Ibn al-Athīr pairs it in one chapter with Yawm al-Ṣafqa.","placeId":"al-kulab","category":"battle","summary":"Banū Tamīm against Banū al-Ḥārith and Madhḥij, with Khusraw Parvīz's deputy in the background and a Tamīmī raid on his envoys as the cause. Banū al-Ḥārith gathered on the advice of a soothsayer, and Madhḥij marched despite being told not to.","dispute":"Ibn al-Athīr pairs it in one chapter with Yawm al-Ṣafqa, and so does al-ʿIqd al-Farīd. Fajernet calls it Tamīm against Banū ʿAbd al-Madān of Najrān; al-Khāqānī has Tamīm over Madhḥij. All three fit if ʿAbd al-Madān is a clan of Banū al-Ḥārith of Najrān allied with Madhḥij. The Arabic sources supply the Persian frame in detail — Khusraw Parvīz's deputy sent to Yemen, a Tamīmī raid on his envoys, and Hawdha ibn ʿAlī al-Ḥanafī rising in the king's regard for treating the robbed men well — which is the same chain that produces Yawm al-Ṣafqa. Undated.","peopleIds":["khusraw-ii","qays-ibn-asim"],"politiesIds":["sasanians"],"source":"https://www.islamweb.net/ar/library/content/126/183/"},{"id":"nabigha-returns","year":600,"endYear":null,"title":"Al-Nābigha comes back from exile","ar":"عودة النابغة","evidence":"TRAD","dateCertainty":"approximate","dateRange":[598,602],"estimated":true,"dateNote":"Placed with ʿAdī ibn Zayd's killing, c. 600.","placeId":"hira","category":"poetry","summary":"The poet who had fled to the Ghassanids after verses about the queen returned to al-Ḥīra, and withdrew to his tribe when al-Nuʿmān fell. The one well-attested case of a poet shuttling between the two client courts.","dispute":null,"peopleIds":["al-nabigha","al-numan-iii"],"politiesIds":["lakhmids","ghassanids"],"source":"https://en.wikipedia.org/wiki/Al-Nabigha"},{"id":"shaqiqa-bistam","year":600,"endYear":null,"title":"Yawm al-Shaqīqa and the death of Bisṭām","ar":"يوم الشقيقة ومقتل بسطام","evidence":"TRAD","dateCertainty":"legendary","dateRange":[580,620],"estimated":true,"dateNote":"A chapter heading in Ibn al-Athīr's list with no narrative recovered and no date.","placeId":"najd","category":"battle","summary":"The day on which the famous raider Bisṭām ibn Qays was killed.","dispute":"A chapter heading in Ibn al-Athīr's list of days with no narrative recovered. Undated.","peopleIds":["bistam"],"politiesIds":[],"source":"https://shamela.ws/book/21712/449"},{"id":"urwa-dies","year":600,"endYear":null,"title":"Death of ʿUrwa ibn al-Ward","ar":"وفاة عروة بن الورد","evidence":"TRAD","dateCertainty":"contested","dateRange":[520,600],"estimated":false,"dateNote":"Dates given as 520 and 600 with no apparatus behind either; c. 600 is the convention.","placeId":"najd","category":"birth-death","summary":"The outlaw of ʿAbs who stole to feed the poor, and was called the most generous of the ancient Arabs. Some of his verse is about the wife he divorced while drunk and despaired over when sober.","dispute":"Dates given as 520–600 with no apparatus behind either figure.","peopleIds":["urwa-ibn-al-ward"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Urwa_ibn_al-Ward"},{"id":"numan-deposed","year":602,"endYear":null,"title":"Khusraw II destroys the Lakhmid kingdom","ar":"خلع النعمان الثالث","evidence":"EXT","dateCertainty":"fixed","dateRange":[602,602],"estimated":false,"dateNote":null,"placeId":"ctesiphon","category":"politics","summary":"The king was deposed, seized at Ctesiphon, imprisoned at Khānaqīn, and died there of plague. Al-Ḥīra went to Iyās ibn Qabīṣa al-Ṭāʾī and the dynasty was over. In the same year Phocas murdered Maurice and Khusraw declared the war that ran to 628. The structural pivot of the whole period.","dispute":"Two Syriac chronicles give rival accounts of his end, one a feast at which he was dishonoured and trapped, one a capture with his sons who were then poisoned. One tradition has him crushed by elephants. The Arabic sources blame his refusal to hand over a horse or a daughter; the likelier cause is the ʿAdī ibn Zayd affair.","peopleIds":["al-numan-iii","khusraw-ii","iyas-ibn-qabisa","maurice","phocas"],"politiesIds":["lakhmids","sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Nu%27man_III_ibn_al-Mundhir"},{"id":"quraysh-split-605","year":605,"endYear":null,"title":"Umayya and Nawfal break with the Perfumed","ar":"انقسام قريش","evidence":"TRAD","dateCertainty":"approximate","dateRange":[605,605],"estimated":false,"dateNote":"The tradition gives a bare 605 for the split and there is nothing external to check it against; Mecca has no dated record at all before 632.","placeId":"mecca","category":"politics","summary":"The Banū Umayya and Banū Nawfal split from the al-Muṭayyabūn faction. One of only two usable fixed points in Meccan internal politics.","dispute":null,"peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Quraysh"},{"id":"kaba-rebuilt-black-stone","year":605,"endYear":null,"title":"The Kaʿba rebuilt and the Black Stone arbitration","ar":"بناء الكعبة وتحكيم الحجر الأسود","evidence":"TRAD","dateCertainty":"contested","dateRange":[595,610],"estimated":true,"dateNote":"Counted five years before the revelation in the usual reckoning, which anchors it to 610; the competing reckoning by his age of thirty-five ties it instead to the contested birth year and would widen the span by two decades.","placeId":"mecca","category":"religion","summary":"The Quraysh took the sanctuary down and rebuilt it, and the clans then fell out over who would set the Black Stone back in its corner. The settlement reported is that the stone was carried in a cloak whose edges the clan representatives held together, so that all of them placed it. Whatever happened, the story is about the Meccan habit of arbitration rather than about the building.","dispute":"The year is derived, not transmitted — five years before the revelation in one reckoning, his thirty-fifth year in another, and the second makes it move with the contested birth. The veneration of a quadrangular stone at Mecca is independently plausible: Marinus of Tyre described Arabs venerating one in the 2nd century. But Robin argues the Kaʿba only rose to prominence in the late 6th century, and Webb argues it was a regional rather than a pan-Arabian pilgrimage site.","peopleIds":["muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"dhi-qar","year":607,"endYear":null,"title":"Yawm Dhū Qār","ar":"يوم ذي قار","evidence":"RECON","dateCertainty":"contested","dateRange":[602,624],"estimated":true,"dateNote":"Muslim tradition spreads it 602-624; the Arabic sources prefer 609 and give 604 as well, with late 609 or early 610 as the likeliest, and they reject the 624 end of the range outright. The 602 deposition is a hard lower bound because every account chains the battle to al-Nuʿmān's fall.","placeId":"dhi-qar","category":"battle","summary":"Bakr ibn Wāʾil beat a Sasanian force with Ṭayyiʾ, Taghlib and Iyād auxiliaries at a desert watering place. The traditional figures are two thousand Persians and three thousand Arab allies. Leadership among the Bakr shifted from warrior to warrior with no commander-in-chief. It is remembered as the day the Arabs first beat the Persians.","dispute":"Muslim tradition spreads it from 602 to 624; modern scholarship narrows it to 604–611, and the Arabic sources prefer 609, with late 609 or early 610 as the likeliest, al-Khāqānī's list saying only 'the year forty', near the Prophet's birth. The upper end is not merely awkward but refuted in the Arabic reference itself: al-Iṣfahānī's Aghānī reports that the battle fell some months after Badr and that the Prophet commented on it at Medina, no historian confirms it, and al-Albānī graded that hadith weak — so 624 is rejected on Arabic ground, as well as being impossible because every account chains the battle to the aftermath of al-Nuʿmān's deposition in 602. The site is disputed too: the Arabic sources put it at Ṭarīf, south of Medina in the north of the peninsula, not in southern Iraq near the modern Dhī Qār governorate, and the common placement is an inference from that modern province name. No source locates it definitively. Persian sources do not mention the battle at all, and Rezakhani holds it may have been no more than a skirmish — which makes its fame retrospective, and dramatically more interesting, not less. The Arabic sources add that Iyād withdrew under a secret agreement with Bakr, and count the forces as about three thousand Arabs, a thousand Persian asāwira and a thousand khanābirīn. Al-Nuʿmān III was not killed in or just before the battle: he was deposed in 602, taken to Ctesiphon, held at Khānaqīn and died, most likely of plague.","peopleIds":["iyas-ibn-qabisa","hanzala","al-asha"],"politiesIds":["sasanians","lakhmids"],"source":"https://en.wikipedia.org/wiki/Battle_of_Dhi_Qar"},{"id":"antara-dies","year":608,"endYear":null,"title":"Death of ʿAntara","ar":"وفاة عنترة","evidence":"TRAD","dateCertainty":"contested","dateRange":[568,615],"estimated":false,"dateNote":"The traditional 608 sits alongside 615 and al-Ziriklī's 600 inside a single Arabic article, and alongside versions that kill him in the Dāḥis fighting decades earlier or have him die of old age.","placeId":"hail","category":"birth-death","summary":"The slave-born ʿAbsī warrior-poet died of a wound taken on a raid he led as an old man against the Banū Nabhān of Ṭayyiʾ — shot by Zurr ibn Jābir al-Nabhānī, carried home, dead among his own people. Eighty-two or eighty-three by the traditional reckoning, about ninety by another line of the same page.","dispute":"Mutually exclusive versions, and the Arabic sources both prefer one and correct a name. Their preferred account, from Abū al-Faraj al-Iṣfahānī: as an old man he raided the Banū Nabhān of Ṭayyiʾ and drove off a herd, was shot by Zurr ibn Jābir al-Nabhānī, and went home wounded and died there. Ibn al-Kalbī reports that the killer was nicknamed al-Asad al-Rahīṣ al-Ṭāʾī. The name in the English sources, 'Wasr ibn Jābir', is wrong; it is Zurr. The rival versions — killed in the Dāḥis fighting, or dead of old age on Abū ʿUbayda's account — survive, but the first contradicts the 608 date held in the same corpus. The year itself is unstable inside one Arabic article: 608 in its lead, a life of 525–615 in its death section, and 600 from al-Ziriklī, with the page saying he reached about ninety and the infobox saying he died at eighty-three.","peopleIds":["antara"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Antarah_ibn_Shaddad"},{"id":"quss-dies","year":610,"endYear":null,"title":"Death of Quss ibn Sāʿida","ar":"وفاة قس بن ساعدة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[600,620],"estimated":true,"dateNote":"c. 610 is a convention; a reported lifespan of 380, 600 or 700 years shows how little is behind it.","placeId":"ukaz","category":"birth-death","summary":"The preacher who stood up in the market at ʿUkāẓ and spoke rhymed prose about one God and the resurrection died and was buried, probably in north Syria. One sermon survives, opening 'O People! Listen and retain!'","dispute":"He is considered legendary or semi-legendary and is known only from Muslim sources. His lifespan is given as 380, 600 or 700 years, which is the clearest possible marker of legendary accretion. He is also called a bishop of Najrān in some accounts and a pagan sage in others.","peopleIds":["quss"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Quss_Ibn_Sa%27ida_al-Iyadi"},{"id":"taabbata-dies","year":610,"endYear":null,"title":"Taʾabbaṭa Sharran killed on a raid","ar":"مقتل تأبط شرا","evidence":"TRAD","dateCertainty":"legendary","dateRange":[590,625],"estimated":true,"dateNote":"His dates are explicitly unknown; late 6th or early 7th century is inferred from personal names in the poems.","placeId":"sarawat","category":"birth-death","summary":"Killed raiding Banū Hudhayl, his body thrown into a cave called al-Rakhmān. His dīwān runs to two hundred and thirty-eight verses in thirty-two pieces.","dispute":"His dates are explicitly unknown; late 6th or early 7th century is inferred from personal names in the poems. The nickname has three mutually exclusive explanations in Kitāb al-Aghānī alone — he carried a ram that turned out to be a ghūl, he filled his mother's truffle-bag with snakes, or he carried his sword under his arm — and modern scholars say none should be taken at face value.","peopleIds":["taabbata-sharran"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Ta%27abbata_Sharran"},{"id":"revelation-begins","year":610,"endYear":null,"title":"The revelation begins at Ḥirāʾ","ar":"بدء الوحي في غار حراء","evidence":"TRAD","dateCertainty":"approximate","dateRange":[608,612],"estimated":true,"dateNote":"Twelve years before the Hijra in the standard reckoning, which is counted from a fixed epoch; the traditional age of forty would instead tie the same moment to the contested birth year.","placeId":"hiraa","category":"religion","summary":"On a retreat in a cave on Jabal al-Nūr outside Mecca, Muḥammad reported an encounter and a command to recite. The tradition has him go home shaken, Khadīja accept the account, and her cousin Waraqa ibn Nawfal — named among the pre-Islamic Arab monotheists — identify it in terms drawn from the earlier scriptures. Preaching stayed private for about three years.","dispute":"The whole episode is sīra narrative. Being dated in years before the Hijra makes it firmer than anything reckoned by his age, but nothing external touches it, and the sources disagree about where other early episodes such as the night journey belong in the sequence.","peopleIds":["muhammad","khadija"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"khansa-muawiya","year":612,"endYear":null,"title":"Al-Khansāʾ loses her brothers","ar":"مقتل أخوي الخنساء","evidence":"TRAD","dateCertainty":"approximate","dateRange":[612,613],"estimated":false,"dateNote":"Muʿāwiya's death is dated 612-613 and Ṣakhr's is inferred as about a year later.","placeId":"najd","category":"birth-death","summary":"Her brother Muʿāwiya was killed in Banū Sulaym's skirmishes with Murra and Asad. Her brother Ṣakhr avenged him and died of his wounds about a year later. Over a hundred elegies for those two deaths survive, nearly a thousand lines.","dispute":"Ṣakhr's death is inferred as 'about a year later'. Al-Khansāʾ herself has no birth or death date in any accessible source.","peopleIds":["al-khansa"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Al-Khansa"},{"id":"public-preaching-begins","year":613,"endYear":null,"title":"The daʿwa goes public","ar":"بدء الدعوة الجهرية","evidence":"TRAD","dateCertainty":"approximate","dateRange":[611,615],"estimated":true,"dateNote":"Nine years before the Hijra in the standard reckoning; the figure is a round interval in the tradition rather than a dated event.","placeId":"mecca","category":"religion","summary":"After about three years of private preaching Muḥammad began addressing Mecca openly, calling for one God and warning of a judgement. The message bore directly on the sanctuary the Quraysh kept and on the gods whose shrines drew tribes from across the Ḥijāz, and organised Qurashī opposition dates from here.","dispute":"A round three-year interval after the first revelation, which is how the tradition structures the period rather than how it dates it. Nothing external.","peopleIds":["muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"jerusalem-falls","year":614,"endYear":null,"title":"Jerusalem falls and the Cross goes east","ar":"سقوط القدس","evidence":"EXT","dateCertainty":"fixed","dateRange":[614,614],"estimated":false,"dateNote":null,"placeId":"jerusalem","category":"battle","summary":"Three weeks of siege, then the city, then the True Cross carried off to Ctesiphon. The whole Christian East felt this one.","dispute":null,"peopleIds":["khusraw-ii"],"politiesIds":["sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_602%E2%80%93628"},{"id":"aksum-migrations","year":615,"endYear":616,"title":"Migrations to Aksum","ar":"الهجرة إلى الحبشة","evidence":"TRAD","dateCertainty":"contested","dateRange":[613,616],"estimated":true,"dateNote":"Counted in years before the Hijra, but the sources give the first group 7 BH (615) or 9 BH (613) and the second 6 BH (616) or 7 BH (615), and some accounts date the first departure only to 'Rajab of the fifth year after the mission'.","placeId":"aksum","category":"religion","summary":"Groups of Muḥammad's followers crossed the Red Sea to Christian Aksum and were given asylum by the ruler the Arabic sources call al-Najāshī, the Negus. A Qurashī delegation is said to have gone after them and been refused. Mecca's trouble with its own preacher thereby entered the Red Sea politics that Aksum and Ḥimyar had been fighting over for a century — and the refugees from Najrān had taken the same route to the same court ninety years earlier.","dispute":"Caetani and Watt doubted there were two distinct migrations at all; Watt read Ibn Isḥāq's wording as smaller groups arriving one after another, and traced the two canonical lists to later disputes over precedence in the registers under ʿUmar. The Negus cannot be matched to the Aksumite king-list with confidence: the identification with Armah dates from 1895, Ella Tsaham is the alternative, and Hahn has argued Armah was a son of Kāleb under another name.","peopleIds":["muhammad","al-najashi"],"politiesIds":["quraysh","aksum"],"source":"https://en.wikipedia.org/wiki/Migration_to_Abyssinia"},{"id":"hashim-boycott","year":616,"endYear":619,"title":"The boycott of the Banū Hāshim","ar":"حصار بني هاشم في الشعب","evidence":"TRAD","dateCertainty":"approximate","dateRange":[615,620],"estimated":true,"dateNote":"A span counted in years before the Hijra, roughly 7 BH to 3 BH; the tradition gives it as about three years rather than as dated start and end.","placeId":"mecca","category":"politics","summary":"Qurashī clans agreed to break off marriage and trade with the Banū Hāshim and the Banū al-Muṭṭalib, who withdrew to a shiʿb, a defile on the edge of the town. It was a sanctions regime against a clan that would not surrender one of its own, not a siege: the mechanism being used was the ordinary one of clan protection, which is why the boycott had to be aimed at the whole clan rather than at the man. It broke down after about three years.","dispute":"Dated only as an interval before the Hijra, with the beginning given as c. 616 and the lifting as 619. The document said to have been hung in the Kaʿba, and the story of its being eaten away, are narrative detail with nothing external behind them.","peopleIds":["muhammad","abu-talib"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"buath","year":617,"endYear":null,"title":"Yawm Buʿāth","ar":"يوم بعاث","evidence":"TRAD","dateCertainty":"approximate","dateRange":[615,619],"estimated":true,"dateNote":"Counted back from the Hijra, which is the one fixed point the Arabic tradition really has.","placeId":"buath","category":"battle","summary":"Aws, backed by the Jewish Qurayẓa and Naḍīr, beat Khazraj, backed by Qaynuqāʿ. The Khazraj chief ʿAmr ibn al-Nuʿmān al-Bayāḍī had seized hostages from the Jewish tribes and killed them, which is what drove those tribes to the other side. He was killed in the fighting. Afterwards the two exhausted tribes chose ʿAbd Allāh ibn Ubayy to keep the peace — and the vacancy his weakness left is the one Muḥammad walked into in 622.","dispute":"Dated by counting back from the Hijra, which is the one fixed point the Arabic tradition really has. One reference article calls the day inconclusive while another says the Aws won.","peopleIds":["hudayr","amr-ibn-al-numan","ibn-ubayy"],"politiesIds":["yathrib"],"source":"https://en.wikipedia.org/wiki/Yawm_al-Buath"},{"id":"alexandria-falls","year":619,"endYear":null,"title":"Alexandria falls","ar":"سقوط الإسكندرية","evidence":"EXT","dateCertainty":"approximate","dateRange":[618,620],"estimated":false,"dateNote":"The year-long siege ends 619 in the usual reckoning; the Greek chronology allows 618-620.","placeId":"alexandria","category":"battle","summary":"Egypt went after a year-long siege, and the grain dole at Constantinople was abolished. Plague followed.","dispute":null,"peopleIds":["khusraw-ii"],"politiesIds":["sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_602%E2%80%93628"},{"id":"year-of-sorrow","year":619,"endYear":null,"title":"The Year of Sorrow: Khadīja and Abū Ṭālib die","ar":"عام الحزن","evidence":"TRAD","dateCertainty":"approximate","dateRange":[619,620],"estimated":true,"dateNote":"Three years before the Hijra in the standard reckoning; the year is given as 619 or 620 and the two deaths are placed within months of each other without either being dated.","placeId":"mecca","category":"birth-death","summary":"Khadīja and Abū Ṭālib died in the same year, shortly after the boycott ended. The second death mattered politically as much as the first mattered personally: Abū Ṭālib had held the Hāshimī protection over his nephew, and his successor as clan head did not. Within two years Muḥammad was looking for a tribe outside Mecca to take him in.","dispute":"Neither death carries a date of its own. The sequence — boycott ends, protector dies, search for an outside ally — is the tradition's own causal chain, and it is sounder as a sequence than as a chronology.","peopleIds":["khadija","abu-talib","muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"musaylima-claims","year":620,"endYear":null,"title":"Musaylima claims prophethood in the Falj","ar":"دعوى مسيلمة","evidence":"TRAD","dateCertainty":"approximate","dateRange":[615,622],"estimated":true,"dateNote":"Placed only as 'before the Hijra'.","placeId":"falj","category":"religion","summary":"A Ḥanīfa soothsayer in his village of Haddār, in the Falj valley, declared himself a prophet before the Hijra. Central Arabia produced its own claimants, and the Yamāma was settled farming country with its own religious life.","dispute":null,"peopleIds":["musaylima"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Al-Yamama"},{"id":"aqaba-pledge-first","year":621,"endYear":null,"title":"The first pledge at al-ʿAqaba","ar":"بيعة العقبة الأولى","evidence":"TRAD","dateCertainty":"approximate","dateRange":[620,621],"estimated":true,"dateNote":"One year before the Hijra in the standard reckoning, at a pilgrimage season; no calendar date.","placeId":"mina","category":"politics","summary":"Twelve men of Yathrib, mostly Khazraj, met Muḥammad at al-ʿAqaba near Minā during the pilgrimage and undertook to follow him. Yathrib had come out of Yawm Buʿāth four years earlier with its two Arab tribes exhausted and a consensus leader whose authority was thin, and the oasis was looking for an arbitrator from outside — which is the opening these meetings exploit.","dispute":"The whole negotiation is sīra material, dated only by its position relative to the Hijra and the pilgrimage calendar.","peopleIds":["muhammad"],"politiesIds":["quraysh","yathrib"],"source":"https://madainproject.com/pledges_of_aqabah"},{"id":"hijra","year":622,"endYear":null,"title":"The Hijra","ar":"الهجرة","evidence":"TRAD","dateCertainty":"fixed","dateRange":[622,622],"estimated":false,"dateNote":"The epoch of the Hijrī calendar, from which the rest of the Arabic chronology is counted; the tradition places the arrival at Yathrib in September 622.","placeId":"yathrib","category":"religion","summary":"Muḥammad moved from Mecca to Yathrib with the followers who had not already gone, after oaths taken at al-ʿAqaba in the two previous pilgrimage seasons; the tradition puts the arrival in September. The year became the epoch of the Islamic calendar, which is why so much of the Arabian chronology in this atlas is counted backwards from it.","dispute":"The year is the epoch of the Hijrī calendar and so the one date in the Arabic tradition not reckoned off something else — but it is not fixed by anything external either, and the earliest Greek and Syriac notices of the Arabs begin later. The event is attested only in the later Arabic tradition, which is why it is graded TRAD here even though the year itself is not in doubt. Heraclius leaving Constantinople in the same year is a separate, Byzantine-sourced event and is listed on its own.","peopleIds":["muhammad"],"politiesIds":["quraysh","yathrib"],"source":"https://en.wikipedia.org/wiki/Hijrah"},{"id":"heraclius-counteroffensive","year":622,"endYear":null,"title":"Heraclius opens the counteroffensive","ar":"هرقل يبدأ هجومه المضادّ","evidence":"EXT","dateCertainty":"fixed","dateRange":[622,622],"estimated":false,"dateNote":"Dated in the Byzantine record to 4 April 622.","placeId":"constantinople","category":"politics","summary":"Heraclius left Constantinople on 4 April to begin the campaign that would break Persia within six years. It falls in the same year as the Hijra, months apart, and the two together close the period this atlas covers: the empire that had fought Persia to exhaustion was about to meet a power that had not existed when the war began.","dispute":"Independent of the Hijra and sourced separately. The two were previously carried as a single entry here, which left one source link standing for two unrelated events.","peopleIds":["heraclius"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_602%E2%80%93628"},{"id":"aqaba-pledge-second","year":622,"endYear":null,"title":"The second pledge at al-ʿAqaba","ar":"بيعة العقبة الثانية","evidence":"TRAD","dateCertainty":"approximate","dateRange":[621,622],"estimated":true,"dateNote":"Placed in June 622, months before the move to Yathrib; the year is firm because it is the Hijra year itself, the month is tradition.","placeId":"mina","category":"politics","summary":"A much larger party from Yathrib — seventy-three men and two women of both Aws and Khazraj by the usual count — pledged at the same place, this time undertaking to defend him. The emigration followed within months.","dispute":"The numbers and the terms come from the sīra. The timing is the firmest thing about it, because it sits immediately before the one date the Arabic tradition really has.","peopleIds":["muhammad"],"politiesIds":["quraysh","yathrib"],"source":"https://madainproject.com/pledges_of_aqabah"},{"id":"ganzaka-624","year":624,"endYear":null,"title":"Heraclius in the Persian heartland","ar":"حملة هرقل","evidence":"EXT","dateCertainty":"fixed","dateRange":[624,624],"estimated":false,"dateNote":null,"placeId":"ctesiphon","category":"battle","summary":"He sacked Dvin and beat Khusraw's army at Ganzaka with help from loyal Arabs — the Arab clients fighting in an imperial war as both empires ran out of men.","dispute":null,"peopleIds":["heraclius","khusraw-ii"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_602%E2%80%93628"},{"id":"nineveh","year":627,"endYear":null,"title":"Battle of Nineveh","ar":"معركة نينوى","evidence":"EXT","dateCertainty":"fixed","dateRange":[627,627],"estimated":false,"dateNote":null,"placeId":"ctesiphon","category":"battle","summary":"On 12 December Heraclius broke the Persian army and then plundered Dastagird. Within a year Khusraw II was dead and his son was suing for peace.","dispute":null,"peopleIds":["heraclius","khusraw-ii"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_602%E2%80%93628"},{"id":"badhan-ends","year":628,"endYear":null,"title":"Bādhān, last Persian governor of Yemen","ar":"باذان","evidence":"EXT","dateCertainty":"fixed","dateRange":[628,628],"estimated":false,"dateNote":null,"placeId":"sanaa","category":"politics","summary":"The last Sasanian governor in South Arabia served until 628. Persian Yemen ends as Persia itself falls apart.","dispute":null,"peopleIds":["badhan"],"politiesIds":["sasanian-yemen","sasanians"],"source":"https://en.wikipedia.org/wiki/Sasanian_Yemen"},{"id":"asha-dies","year":629,"endYear":null,"title":"Death of al-Aʿshā","ar":"وفاة الأعشى","evidence":"TRAD","dateCertainty":"contested","dateRange":[625,630],"estimated":true,"dateNote":"Given only as 'shortly before 630'.","placeId":"najd","category":"birth-death","summary":"The poet who alluded to Dhū Qār under the name of the battle of Hinw, and who composed a poem honouring Muḥammad, died not long before 630.","dispute":"His name, tribe and dates beyond 'died shortly before 630' could not be retrieved. He credited a jinnī named Misḥal with inspiring his poetry.","peopleIds":["al-asha"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Mu%27allaqat"},{"id":"khansa-converts","year":629,"endYear":null,"title":"Al-Khansāʾ comes to Medina","ar":"إسلام الخنساء","evidence":"TRAD","dateCertainty":"fixed","dateRange":[629,629],"estimated":false,"dateNote":"Counted in the Hijrī era from 622.","placeId":"yathrib","category":"poetry","summary":"She came with a deputation from her clan and embraced Islam. Muḥammad asked her to recite and told her to go on, and is said to have rated her above Imruʾ al-Qays.","dispute":null,"peopleIds":["al-khansa","muhammad"],"politiesIds":["yathrib"],"source":"https://en.wikipedia.org/wiki/Al-Khansa"},{"id":"allat-shrine-demolished","year":630,"endYear":null,"title":"Allāt's shrine at al-Ṭāʾif pulled down","ar":"هدم بيت اللات","evidence":"TRAD","dateCertainty":"approximate","dateRange":[630,631],"estimated":false,"dateNote":"Dated by the Hijrī chronology of the Ṭāʾif settlement, given as 630 or 631.","placeId":"taif","category":"religion","summary":"The cubic rock with its building over it, kept by the Banū ʿAttāb of Thaqīf, was demolished as a condition of the tribe's reconciliation. Her precinct had been ground where trees, game and human blood were all off-limits.","dispute":null,"peopleIds":["muhammad"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Al-Lat"},{"id":"durayd-dies","year":630,"endYear":null,"title":"Durayd ibn al-Ṣimma killed at Ḥunayn","ar":"مقتل دريد بن الصمة","evidence":"TRAD","dateCertainty":"fixed","dateRange":[630,630],"estimated":false,"dateNote":"Ḥunayn is dated in the Hijrī era, 8 AH.","placeId":"taif","category":"birth-death","summary":"An old man carried to the field in a litter, who had fought in about a hundred battles and, Abū ʿUbayda says, lost none. He stayed a pagan to the end. Ibn Sallām called him the first poet of the knights.","dispute":null,"peopleIds":["durayd","muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Durayd_ibn_al-Simma"},{"id":"wadd-demolished","year":631,"endYear":null,"title":"Wadd at Dūmat al-Jandal destroyed","ar":"هدم ود","evidence":"TRAD","dateCertainty":"fixed","dateRange":[631,631],"estimated":false,"dateNote":"The expedition is dated April 631 in the Hijrī chronology.","placeId":"dumat-al-jandal","category":"religion","summary":"An expedition in April 631 was sent to break the idol Wadd, kept by the Banū Kalb at the oasis. Wadd is one of the few of these gods with a genuinely deep inscriptional life — temples, amulets, even Levites in his house at Dadan.","dispute":null,"peopleIds":["muhammad"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Dumat_al-Jandal"},{"id":"dhu-al-khalasa-demolished","year":632,"endYear":null,"title":"Dhū al-Khalaṣa pulled down","ar":"هدم ذي الخلصة","evidence":"TRAD","dateCertainty":"fixed","dateRange":[632,632],"estimated":false,"dateNote":"Dated April-May 632 in the Hijrī chronology.","placeId":"tabala","category":"religion","summary":"In April or May the white quartz block called the southern Kaʿba was demolished and burned on Muḥammad's orders. Bajīla had kept it and Khathʿam had defended it; blood-revenge had been decided at it by three arrows.","dispute":"There is no epigraphic evidence for this cult at all. It is attested only in hadith and in Ibn al-Kalbī's catalogue.","peopleIds":["muhammad"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Dhu_al-Khalasa"},{"id":"muhammad-dies","year":632,"endYear":null,"title":"Death of Muḥammad at Medina","ar":"وفاة محمد بن عبد الله","evidence":"TRAD","dateCertainty":"fixed","dateRange":[632,632],"estimated":false,"dateNote":"Dated 8 June 632, 11 AH — the pivot the whole Hijrī chronology is counted from, and the one date in his life that is not reckoned off something else.","placeId":"yathrib","category":"birth-death","summary":"He died at Medina a few months after the farewell pilgrimage, about sixty-one or sixty-two by the traditional reckoning. Within a year the forces that would take al-Ḥīra and reach the Yarmūk were in the field, and the shrine demolitions that close this atlas — Wadd in 631, Dhū al-Khalaṣa in 632 — belong to the last two years of his life.","dispute":"The year is as firm as the Arabic tradition gets, being the epoch everything after it is counted from. What it is not is externally attested: the contemporary Greek and Syriac notices of the Arab conquests begin a few years later.","peopleIds":["muhammad"],"politiesIds":["quraysh","yathrib"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"hira-surrenders","year":633,"endYear":null,"title":"Al-Ḥīra surrenders","ar":"تسليم الحيرة","evidence":"EXT","dateCertainty":"fixed","dateRange":[633,633],"estimated":false,"dateNote":"Dated 12 AH in the conquest narratives.","placeId":"hira","category":"politics","summary":"The city gave itself up to Khālid ibn al-Walīd in 12 AH. The court that had paid poets, killed poets, administered in Persian and sent embassies to Constantinople was absorbed into something new.","dispute":null,"peopleIds":[],"politiesIds":["lakhmids","sasanians"],"source":"https://www.iranicaonline.org/articles/hira"},{"id":"basus-hanw","year":512,"endYear":null,"title":"Yawm al-Ḥanw","ar":"يوم الحَنْو","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated; the year only holds the day's place in Ibn al-Athīr's order, fifth, between Wāridāt and al-Quṣaybāt.","placeId":"al-hanw","category":"battle","summary":"A day Bakr won against Taghlib — one of the two days of this war that the English reconstruction does not record at all. Ibn al-Athīr states it plainly and gives it no narrative beyond the outcome. It falls in his order after Wāridāt, where Hammām ibn Murra was killed, and before al-Quṣaybāt.","dispute":"The English version lists seven days of the Basūs war and does not mention this one or al-Naqiyya, so the count is nine, not seven — while Ibn al-Athīr himself frames the war as 'five great days', meaning his own formal number is five even though he names nine. No location and no date. Al-ʿIqd al-Farīd lists only five days of the war and does not include this one.","peopleIds":["al-harith-ibn-ubad"],"politiesIds":[],"source":"https://www.marefa.org/حرب_البسوس"},{"id":"basus-naqiyya","year":527,"endYear":null,"title":"Yawm al-Naqiyya","ar":"يوم النَّقِيّة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,545],"estimated":true,"dateNote":"Undated; the year only holds the day's place in Ibn al-Athīr's order, eighth, between Quḍa and al-Fuṣayl.","placeId":"al-naqiyya","category":"battle","summary":"Another day to Bakr, after the shaving of the forelocks and before al-Fuṣayl — on the losing side of the hinge, like everything that follows Bujayr's killing. Ibn al-Athīr does no more than name it and give the outcome.","dispute":"Absent from the English reconstruction entirely, as al-Ḥanw is; with the two of them the war has nine named days rather than seven, though Ibn al-Athīr's own framing calls the great days five. Al-ʿIqd al-Farīd's list of five does not include it. No location, no date, no narrative.","peopleIds":["al-harith-ibn-ubad"],"politiesIds":[],"source":"https://www.marefa.org/حرب_البسوس"},{"id":"hira-palmyrene-garrison","year":132,"endYear":null,"title":"Palmyrene troops at al-Ḥīra","ar":"تمركز قوّات تَدمُريّة بالحيرة","evidence":"EXT","dateCertainty":"fixed","dateRange":[132,132],"estimated":false,"dateNote":"The Arabic sources give 132 CE as the oldest documented mention of al-Ḥīra, from a stationing of Palmyrene forces there; the English sources do not carry it and begin with the 4th century.","placeId":"hira","category":"politics","summary":"The earliest documented mention of al-Ḥīra: Palmyrene troops stationed at the place, nearly two centuries before the Lakhmid kings make it a capital. The desert-edge site was already worth garrisoning when Palmyra, not Ctesiphon, was the power reaching into the Euphrates steppe.","dispute":"Outside the file's 300–640 window, so it is reachable by search rather than by the year slider. The English reconstruction does not mention this date at all and starts al-Ḥīra's history in the late 4th century, where Encyclopaedia Iranica puts the arrival of the Lakhm shaykhs; the Arabic sources supply 132 as the oldest documented reference. Nothing connects the garrison to the later Arab city except the place.","peopleIds":[],"politiesIds":[],"source":"https://www.marefa.org/الحيرة"}],"people":[{"id":"imru-al-qays-poet","name":"Imruʾ al-Qays","ar":"امرؤ القيس","role":"poet","birth":496,"death":565,"lifeCertainty":"contested","lifeNote":"Three sets of dates, not two, and no one of them is free of an objection. The Arabic sources give 496–544. The English sources give c. 496 – 565 and c. 526 – 565, and state outright that historians are divided. The Arabic figure of 544 for the death removes the embassy to Caesar of 561–565 altogether, since it would put him seventeen years in the grave before it; c. 496 – 565 makes a man of sixty-three or sixty-four cross the world on a diplomatic journey; c. 526 – 565 makes him an infant when his father was killed c. 525, which cannot be squared with an adult vengeance quest. Present the three as a standing conflict; do not pick one in silence. No inscriptional or external attestation exists for the poet's existence or his dates at all, and he is not the Imruʾ al-Qays of the Namāra inscription of 328.","tribe":"Kinda","blurb":"A dispossessed Kindite prince called the Errant King because he never got his father's throne back. His father Ḥujr took the tribute from the Banū Asad harshly, drove them out when they refused it, and was killed by stealth; the son swore off wine and ornament until he had his revenge, was offered a noble's life or a blood-price in sheep and camels or war, and chose war. He lost his allies when Bakr and Taghlib decided the revenge was enough, hid in a Jewish lord's fortress at al-Ablaq and left three pledges there — his daughter Hind, his cousin and his mail — and never took them back. He rode north with a letter of introduction and died in Anatolia of a skin disease he had already written about in his own verse. The first great poet in Arabic.","path":[{"year":525,"placeId":"najd","what":"Learns the Banū Asad have killed his father Ḥujr"},{"year":535,"placeId":"najd","what":"Fights the vengeance war with Bakr and Taghlib, who then desert him"},{"year":555,"placeId":"al-ablaq","what":"Takes refuge with al-Samawʾal at al-Ablaq and leaves his daughter, his cousin and his armour in trust"},{"year":560,"placeId":"al-jabiya","what":"Passes through Ghassanid territory with a letter of introduction"},{"year":562,"placeId":"constantinople","what":"Reaches Justinian and comes away with promises"},{"year":565,"placeId":"ankara","what":"Falls ill on the road home and dies"}]},{"id":"tarafa","name":"Ṭarafa ibn al-ʿAbd","ar":"طرفة بن العبد","role":"poet","birth":543,"death":569,"lifeCertainty":"contested","lifeNote":"Both dates are reconstructions, giving him about twenty-six years. Nothing independent fixes either.","tribe":"Bakr","blurb":"A young poet at al-Ḥīra who mocked the king and was sent home carrying a sealed letter ordering his own death. His uncle had his read by a boy and threw it in a stream; Ṭarafa would not break a royal seal and carried his to the governor of Baḥrayn. One of the Muʿallaqāt is his.","path":[{"year":565,"placeId":"hira","what":"At ʿAmr ibn Hind's court, companion of the king's brother"},{"year":569,"placeId":"hajar-bahrayn","what":"Delivers his own death warrant unopened and is executed"}]},{"id":"al-mutalammis","name":"Al-Mutalammis","ar":"المتلمس","role":"poet","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"No dates in any accessible source. He exists in the record almost entirely as the other half of Ṭarafa's story.","tribe":"Bakr","blurb":"Ṭarafa's uncle, and the one who had the sense to get his sealed letter read by a boy from the city before he had walked far enough to be caught. He threw it in the stream and lived.","path":[{"year":569,"placeId":"hira","what":"Has his death warrant read aloud and destroys it"}]},{"id":"amr-ibn-kulthum","name":"ʿAmr ibn Kulthūm","ar":"عمرو بن كلثوم","role":"poet","birth":null,"death":584,"lifeCertainty":"legendary","lifeNote":"No dates found beyond the floruit implied by ʿAmr ibn Hind's reign, 554–568/9. The death year here is a placeholder, not an estimate.","tribe":"Taghlib","blurb":"Chief of Taghlib and the author of a Muʿallaqa. The king insulted his mother at dinner and he killed the king for it, which is the single most direct piece of violence any Arabic poet is credited with. His verse is also the only reason anybody remembers Yawm Khazāz.","path":[{"year":568,"placeId":"hira","what":"Kills ʿAmr ibn Hind at his own table and rides out"}]},{"id":"al-harith-ibn-hilliza","name":"Al-Ḥārith ibn Ḥilliza","ar":"الحارث بن حلزة","role":"poet","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"His dates are nowhere given. The only anchor is that his ode addresses ʿAmr ibn Hind, which puts him in 554–568/9.","tribe":"Bakr","blurb":"A Bakrī chieftain whose Muʿallaqa is a legal brief in verse, addressed to the Lakhmid king against Taghlib. Its presence in the canon may owe something to the anthologist's own Bakr patrons.","path":[{"year":560,"placeId":"hira","what":"Delivers his ode before ʿAmr ibn Hind"}]},{"id":"zuhayr","name":"Zuhayr ibn Abī Sulmā","ar":"زهير بن أبي سلمى","role":"poet","birth":520,"death":609,"lifeCertainty":"contested","lifeNote":"Contradictory inside a single Arabic page: born c. 520 in Najd and died c. 608 in one place, born c. 530 and died between 611 and 627 a few lines further on. Nöldeke gives only 'productive at the end of the 6th century'. The tribe is settled in the Arabic sources — Muzayna, with Murra of the Ḥijāz on his father's mother's side — and he was raised among Ghaṭafān in the house of his maternal uncle Bashāma ibn al-Ghadīr.","tribe":"Muzayna","blurb":"The moralist of the Muʿallaqāt, whose closing gnomic lines are the most quoted wisdom verse of the age. His ode was composed after the Dāḥis war ran itself out, and it praises Harim ibn Sinān and al-Ḥārith ibn ʿAwf by name for paying the blood-money of both sides — about three thousand camels — out of their own property. Harim swore to give him something every time he greeted him, until the poet grew ashamed of what he was taking and would wish a gathering good morning man by man, leaving Harim out. His son Kaʿb later praised Muḥammad. Beware the name-collision with Qays ibn Zuhayr, a different man entirely.","path":[]},{"id":"antara","name":"ʿAntara ibn Shaddād","ar":"عنترة بن شداد","role":"poet","birth":525,"death":608,"lifeCertainty":"contested","lifeNote":"Traditional and reconstructed, not documented, and unstable inside a single Arabic article: the lead gives 608 for the death, the death section gives a life of 525–615, al-Ziriklī gives 600, the text says he reached about ninety and the table says eighty-three. The birth is placed in the first quarter of the 6th century and fixed at 525 from his part in the Dāḥis fighting — so the date is extracted from the battle rather than the battle from the date. Nöldeke places his productive period at the end of the 6th century, which fits the feuds his ode alludes to but sits badly with a 525 birth. The epic's requirement that he fetch a thousand she-camels from al-Nuʿmān III (r. 580–602) is chronologically impossible against that birth date, which is one reason the ʿAbla material belongs to the popular romance layer and not to the old akhbār. His killer is Zurr ibn Jābir al-Nabhānī, not the 'Wasr ibn Jābir' of the English sources.","tribe":"ʿAbs","blurb":"Son of a free ʿAbsī warrior and an enslaved Ethiopian woman named Zabība, with two enslaved half-brothers, Jarīr and Shaybūb. He was born a slave because the Arabs did not acknowledge the sons of slave women unless they distinguished themselves in war or in poetry — the Arabic sources state that mechanism outright, and it is how he came to be attached to his father's line. One of the three 'crows of the Arabs'. The historical man is a hard-edged boast-and-battle poet with a small dīwān, firmly attested in only two places: the elegy for Mālik ibn Zuhayr and his courage at Dhāt al-Jarājir. The ʿAbsī horseman named at al-Habāʾa is his father Shaddād on the mare Jarwa, not him. The chivalric hero of the ʿAbla romance is a vastly later epic grown by oral accretion from about the twelfth century.","path":[{"year":570,"placeId":"najd","what":"Composes the elegy for Mālik ibn Zuhayr"},{"year":589,"placeId":"najd","what":"Singled out for courage at Yawm Dhāt al-Jarājir"},{"year":608,"placeId":"hail","what":"Dies at Ḥāʾil, by the account that lets him reach old age"}]},{"id":"labid","name":"Labīd ibn Rabīʿa","ar":"لبيد بن ربيعة","role":"poet","birth":560,"death":661,"lifeCertainty":"contested","lifeNote":"c. 560 to c. 661 is the conventional range and implies an extreme lifespan. Both figures are conjectural.","tribe":"Banū ʿĀmir","blurb":"The only one of the Muʿallaqāt poets still alive when Muḥammad began preaching, and he converted. He had elegised a Lakhmid king earlier; later a governor of Kūfa sent him a hundred camels so he could keep a vow to feed people whenever the east wind blew.","path":[{"year":600,"placeId":"hira","what":"Composes an elegy for a Lakhmid king"},{"year":630,"placeId":"yathrib","what":"Comes to Medina and accepts Islam"}]},{"id":"al-nabigha","name":"Al-Nābigha al-Dhubyānī","ar":"النابغة الذبياني","role":"poet","birth":535,"death":604,"lifeCertainty":"contested","lifeNote":"c. 535 to c. 604, both conjectural, the death explicitly called uncertain.","tribe":"Dhubyān","blurb":"Real name Ziyād ibn Muʿāwiya. The one poet attested shuttling between both client courts: verses about the Lakhmid queen forced him to flee to the Ghassanids, and he came back around 600, then withdrew to his tribe when his patron fell. Al-Mufaḍḍal and Abū ʿUbayda reportedly put his ode among the Seven in place of ʿAntara's and al-Ḥārith's.","path":[{"year":585,"placeId":"hira","what":"At al-Nuʿmān III's court"},{"year":590,"placeId":"al-jabiya","what":"In exile with the Ghassanids after offending the king"},{"year":600,"placeId":"hira","what":"Returns to al-Ḥīra"}]},{"id":"al-asha","name":"Al-Aʿshā","ar":"الأعشى","role":"poet","birth":null,"death":629,"lifeCertainty":"contested","lifeNote":"Only 'died not long before 630' is sourced. His name and tribe, conventionally Maymūn ibn Qays of Bakr, could not be confirmed.","tribe":"Bakr","blurb":"He credited a jinnī named Misḥal with his poetry, sang the day of Dhū Qār under another name, and ended up composing a poem in honour of Muḥammad. Sometimes added to the Muʿallaqāt.","path":[]},{"id":"al-khansa","name":"Al-Khansāʾ","ar":"الخنساء","role":"poet","birth":null,"death":null,"lifeCertainty":"contested","lifeNote":"No birth or death date exists in any accessible source. Her life is pinned only by three events: her brothers' deaths in 612–613, her conversion in 629, and her four sons killed at Qādisiyya in 636.","tribe":"Banū Sulaym","blurb":"Tumāḍir bint ʿAmr, 'the snub-nosed', daughter of a clan head. Over a hundred elegies for two dead brothers, nearly a thousand surviving lines of short despairing verse that raised the lament to the standing of high poetry. Her elegies were collected two centuries after her by Ibn al-Sikkīt.","path":[{"year":612,"placeId":"najd","what":"Her brother Muʿāwiya is killed; Ṣakhr avenges him and dies of his wounds"},{"year":629,"placeId":"yathrib","what":"Comes to Medina with her clan's deputation and converts"}]},{"id":"al-muhalhil","name":"Al-Muhalhil","ar":"المهلهل","role":"poet","birth":null,"death":540,"lifeCertainty":"legendary","lifeNote":"Entirely undated. Even his identification with ʿAdī ibn Rabīʿa, standard in Arabic literature, could not be confirmed from the accessible sources, which name him only as Abū Laylā al-Muhalhil.","tribe":"Taghlib","blurb":"Kulayb's brother, Taghlib's war-leader and poet, who swore off perfume and wine until he had killed a man of Bakr for every limb of his brother's body. He won every great day until he killed the young man who came to him with a peace letter, and lost every one after. He ended in Yemen, married into Madhḥij, and died of thirst in a captor's hands.","path":[{"year":500,"placeId":"al-nahy","what":"Leads Taghlib at al-Nahy"},{"year":505,"placeId":"al-dhanaib","what":"Wins the war's greatest encounter"},{"year":510,"placeId":"waridat","what":"Composes an elegy over Hammām ibn Murra's body"},{"year":525,"placeId":"quda","what":"Taken prisoner at Quḍa and released without being recognised"},{"year":535,"placeId":"hadramawt","what":"Settles in Yemen among Janb of Madhḥij"},{"year":540,"placeId":"hajar-bahrayn","what":"Dies of thirst in captivity near Hajar"}]},{"id":"adi-ibn-zayd","name":"ʿAdī ibn Zayd","ar":"عدي بن زيد","role":"poet","birth":550,"death":600,"lifeCertainty":"approximate","lifeNote":"Born c. 550, died c. 600; both approximate but tied to a documented 579 embassy and a reign, so better anchored than most.","tribe":"Tamīm","blurb":"The best insider in the whole period: born at al-Ḥīra into an ʿIbādī Christian family whose grandfather and father had both served the Lakhmids, schooled at the Persian court, speaking Arabic and Persian and probably Syriac, serving as secretary for Arab affairs under two Sasanian kings, sent to Constantinople in 579 and bringing back books. He married into the royal house, helped put his king on the throne, and was imprisoned and strangled by him.","path":[{"year":565,"placeId":"ctesiphon","what":"Educated at the Sasanian court at al-Madāʾin"},{"year":579,"placeId":"constantinople","what":"Goes as a Sasanian envoy and returns with books"},{"year":585,"placeId":"hira","what":"Chief councillor to al-Nuʿmān III"},{"year":600,"placeId":"hira","what":"Imprisoned and strangled"}]},{"id":"al-shanfara","name":"Al-Shanfarā","ar":"الشنفرى","role":"poet","birth":null,"death":525,"lifeCertainty":"legendary","lifeNote":"No dates whatsoever in the accessible sources; mid-to-late 6th century is a handbook convention nobody could cite, and the c. 525 death figure circulates without apparatus. His tribe, conventionally Azd or Banū Salāmān, is likewise unsourced.","tribe":"Azd","blurb":"An outlaw poet of Taʾabbaṭa Sharran's band, famous as a runner. He had vowed a hundred Azdī dead and got to ninety-nine; an Azdī who later kicked his skull took a splinter and died of it, which the tradition counts as the hundredth. The Lāmiyyat al-ʿArab that made him famous has been credited since medieval times to a known 8th-century forger.","path":[]},{"id":"taabbata-sharran","name":"Taʾabbaṭa Sharran","ar":"تأبط شرا","role":"poet","birth":null,"death":610,"lifeCertainty":"legendary","lifeNote":"His dates are explicitly unknown; late 6th or early 7th century is inferred from personal names in the poems.","tribe":"Fahm","blurb":"Thābit ibn Jābir, 'he who carried evil under his arm' — a nickname with three mutually exclusive explanations, one of them that he carried off a ram that turned out to be a ghūl. Unusually for a ṣuʿlūk his own tribe never disowned him. He led a band out of the Sarawāt mountains against Bajīla, Hudhayl, Azd and Khathʿam, and was killed on a raid and thrown into a cave.","path":[{"year":600,"placeId":"sarawat","what":"Raiding out of the Sarawāt with his band"},{"year":610,"placeId":"sarawat","what":"Killed raiding Banū Hudhayl; his body thrown into the cave of al-Rakhmān"}]},{"id":"urwa-ibn-al-ward","name":"ʿUrwa ibn al-Ward","ar":"عروة بن الورد","role":"poet","birth":520,"death":600,"lifeCertainty":"contested","lifeNote":"520–600 is given with nothing behind either figure.","tribe":"ʿAbs","blurb":"The outlaw who stole to feed the poor and was called the most generous of the ancient Arabs. Some of his verse is about the wife he divorced while drunk and could not get back when sober.","path":[]},{"id":"al-samawal","name":"Al-Samawʾal ibn ʿĀdiyāʾ","ar":"السموأل بن عادياء","role":"patron","birth":505,"death":560,"lifeCertainty":"contested","lifeNote":"Born early 6th century at Taymāʾ, died c. 560; both reconstructed. His genealogy is disputed — Ibn Durayd makes him a priest's son, al-Jawālīqī gives him a Ghassanid mother and an Azdī father. Whether Imruʾ al-Qays was alive or dead at the time of the siege is unknown.","tribe":"Jewish clan of Taymāʾ","blurb":"A Jewish lord of Taymāʾ whose grandfather built the piebald fortress of al-Ablaq on a hill above the Syrian road. He took in Imruʾ al-Qays and kept his deposits, and when a besieger captured his son coming back from a hunt and offered him the choice, he let the boy be killed in front of him rather than hand the property over. 'More faithful than al-Samawʾal' outlived everything else about him.","path":[{"year":555,"placeId":"al-ablaq","what":"Takes in Imruʾ al-Qays and accepts his three deposits"},{"year":558,"placeId":"al-ablaq","what":"Watches his son killed rather than surrender the trust"},{"year":560,"placeId":"tayma","what":"Dies at Taymāʾ"}]},{"id":"imru-al-qays-namara","name":"Imruʾ al-Qays ibn ʿAmr","ar":"امرؤ القيس بن عمرو","role":"king","birth":null,"death":328,"lifeCertainty":"fixed","lifeNote":"The only pre-Islamic Arab ruler whose death is fixed by a dated inscription: 7 Kaslūl, year 223 of the Bosra era.","tribe":"Lakhm","blurb":"Called king of all the Arabs on his own funerary stone. He broke the Asad, drove Madhḥij to the gates of Najrān, subdued Maʿadd and set nobles over them who then served Rome as phylarchs — which makes the 4th-century Lakhmid line Roman-facing, not Persian-facing. Not the poet.","path":[{"year":328,"placeId":"namara","what":"Buried under the inscription that fixes the century"}]},{"id":"al-mundhir-iii-lakhmid","name":"Al-Mundhir III ibn al-Nuʿmān","ar":"المنذر بن النعمان","role":"king","birth":null,"death":554,"lifeCertainty":"fixed","lifeNote":"Reign 503 or 505 to 554, with the death at Ḥalīma externally dated to June 554. The first Lakhmid who is genuinely historical year by year.","tribe":"Lakhm","blurb":"Fifty years of raiding from the Euphrates to Egypt and down into Najd, two Roman commanders captured, Syria burned twice, four hundred nuns reportedly brought home and sacrificed, a victory over Belisarius at Callinicum, and a death on a field in northern Syria at the hands of the Ghassanid he had fought all his life. Anything before him in the Lakhmid list is free narrative space.","path":[{"year":503,"placeId":"bosra","what":"Raids Palaestina Salutaris and Arabia Petraea"},{"year":529,"placeId":"antioch","what":"Reaches Apamea, fails at Antioch, comes home with plunder"},{"year":531,"placeId":"callinicum","what":"Helps beat Belisarius"},{"year":554,"placeId":"chalcis","what":"Falls at Yawm Ḥalīma"}]},{"id":"amr-ibn-hind","name":"ʿAmr ibn Hind","ar":"عمرو بن هند","role":"king","birth":null,"death":569,"lifeCertainty":"contested","lifeNote":"Reign 554–569 or 570, with the killing given as 568/9 or 569/70. Ry 506 has him acting in 552, two years before the conventional accession, possibly as his father's deputy.","tribe":"Lakhm","blurb":"Named after his Kindite mother, and remembered for a violent, implacable temper. He hosted the best poets of his generation, executed one of them by sealed letter, received a Ḥimyarite heir and sent him on to Khusraw, and was killed at his own dinner table by another of his poets over an insult to the man's mother.","path":[{"year":552,"placeId":"murayghan","what":"Submits to Abraha and gives up his own son as hostage"},{"year":560,"placeId":"hira","what":"Patron of Ṭarafa, al-Mutalammis, al-Ḥārith ibn Ḥilliza and ʿAmr ibn Kulthūm"},{"year":568,"placeId":"hira","what":"Killed at dinner"}]},{"id":"al-mundhir-iv","name":"Al-Mundhir IV","ar":"المنذر الرابع","role":"king","birth":null,"death":580,"lifeCertainty":"contested","lifeNote":"Reign given as 574 or 575 to 580 in the conventional table, which is a late reconstruction and unverifiable.","tribe":"Lakhm","blurb":"A short-reigning Lakhmid who matters mainly because his name appears among the leaders at Shiʿb Jabala — which is the one detail that makes Caskel's c. 580 date for that battle work and all the others fail.","path":[]},{"id":"al-numan-iii","name":"Al-Nuʿmān III ibn al-Mundhir","ar":"النعمان بن المنذر","role":"king","birth":null,"death":602,"lifeCertainty":"contested","lifeNote":"Accession given as both 580 and 582 inside a single reference article, and the reign end as 595 in one passage and 602 in another. The 602 fall is externally fixed.","tribe":"Lakhm","blurb":"The last Lakhmid king, and the first of his line to convert openly to Nestorian Christianity. He sheltered Khusraw II when the man was a fugitive and fought beside him, then had his own chief councillor strangled, and twelve years later the king he had saved deposed him, seized him at Ctesiphon and left him to die of plague in a prison in the hills. His fall is the hinge of the whole period.","path":[{"year":590,"placeId":"nahrawan","what":"Shelters the fugitive Khusraw II and fights beside him"},{"year":600,"placeId":"hira","what":"Has ʿAdī ibn Zayd imprisoned and strangled"},{"year":602,"placeId":"ctesiphon","what":"Seized at Ctesiphon after being deposed"},{"year":602,"placeId":"khanaqin","what":"Imprisoned at Khānaqīn, where he dies of plague"}]},{"id":"iyas-ibn-qabisa","name":"Iyās ibn Qabīṣa al-Ṭāʾī","ar":"إياس بن قبيصة الطائي","role":"king","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"Held al-Ḥīra from 602 to 617/18 alongside a Persian co-governor, per the conventional table.","tribe":"Ṭayyiʾ","blurb":"The man Khusraw gave al-Ḥīra to after destroying its dynasty. He had already been made governor of the area, and he is on the Persian side at Dhū Qār — an Arab chief administering an Arab city for an empire whose grip was about to fail.","path":[{"year":602,"placeId":"hira","what":"Given al-Ḥīra after the dynasty ends"},{"year":607,"placeId":"dhi-qar","what":"On the Sasanian side when Bakr ibn Wāʾil wins"}]},{"id":"jabalah-iv","name":"Jabalah IV ibn al-Ḥārith","ar":"جبلة بن الحارث","role":"king","birth":null,"death":528,"lifeCertainty":"approximate","lifeNote":"Reign 512–529 in the conventional table; the death at Thannuris is externally dated 528, and Simeon's letter puts his camp at al-Jābiya around 520 — an unusually solid early anchor.","tribe":"Ghassān","blurb":"A Ghassanid king whose capital was a tent camp between the Ḥawrān and the Golan, and who died fighting the Persians in upper Mesopotamia.","path":[{"year":520,"placeId":"al-jabiya","what":"His camp at al-Jābiya is described in a Syriac letter"},{"year":528,"placeId":"thannuris","what":"Killed at Thannuris"}]},{"id":"al-harith-ibn-jabala","name":"Al-Ḥārith ibn Jabala","ar":"الحارث بن جبلة","role":"king","birth":null,"death":569,"lifeCertainty":"fixed","lifeNote":"Reign c. 528 or 529 to 569; the discrepancy sits between two reference articles. Externally attested throughout by Procopius, Malalas and others.","tribe":"Ghassān","blurb":"Greek Arethas. Justinian made him a king and a patrikios and put all Byzantium's Arab allies under him, the highest title ever given a foreign ruler. He fought at Callinicum, where one Greek source says he ran and another says he held; raided Assyria with Belisarius; got the empress to appoint the bishop who built the Syriac Orthodox church; killed the Lakhmid king at Ḥalīma and lost his own eldest son doing it; and at ʿAyn Ubāgh loaded two dead sons on a camel with an enemy king's corpse on top.","path":[{"year":528,"placeId":"thannuris","what":"Succeeds his father as phylarch"},{"year":529,"placeId":"constantinople","what":"Raised to kingship and patrikios by Justinian"},{"year":531,"placeId":"callinicum","what":"Commands five thousand Arabs; the sources disagree whether he held or fled"},{"year":542,"placeId":"constantinople","what":"Petitions Theodora and gets Jacob Baradaeus appointed"},{"year":554,"placeId":"chalcis","what":"Kills al-Mundhir III at Ḥalīma and loses his son Jabala"},{"year":569,"placeId":"al-jabiya","what":"Dies, reportedly during an earthquake"}]},{"id":"al-mundhir-ghassanid","name":"Al-Mundhir ibn al-Ḥārith","ar":"المنذر بن الحارث","role":"king","birth":null,"death":null,"lifeCertainty":"contested","lifeNote":"Reign 569 to c. 581 or 582, with the arrest dated both ways across sources. A late Syriac chronicle says he came home after Maurice fell in 602.","tribe":"Ghassān","blurb":"Greek Alamoundaros. His own emperor ordered him assassinated; he found out and broke with the empire, was reconciled three years later at the shrine of St Sergius, sacked al-Ḥīra in the same year, then was arrested over a failed campaign and exiled to Sicily. A Greek inscription at Ruṣāfa still names him on a building he paid for.","path":[{"year":572,"placeId":"al-jabiya","what":"Discovers Justin II's plot and breaks with Byzantium"},{"year":575,"placeId":"rusafa","what":"Reconciled with the empire at Sergiopolis"},{"year":575,"placeId":"hira","what":"Sacks the Lakhmid capital"},{"year":582,"placeId":"constantinople","what":"Arrested, then exiled to Sicily"}]},{"id":"al-numan-vi","name":"Al-Nuʿmān VI ibn al-Mundhir","ar":"النعمان بن المنذر الغساني","role":"king","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"Reign 581–583 in the conventional table; the 584 arrest is externally dated.","tribe":"Ghassān","blurb":"Arrested by the Byzantines and tried for treason in 584, after which the Ghassanid confederation came apart into its member tribes. Maurice is said to have put it back together two or three years later because the empire could not hold the desert without it.","path":[{"year":584,"placeId":"constantinople","what":"Arrested and tried for treason"}]},{"id":"hujr-akil-al-murar","name":"Ḥujr Ākil al-Murār","ar":"حجر آكل المرار","role":"king","birth":null,"death":458,"lifeCertainty":"contested","lifeNote":"The English sources state that no regnal dates exist for him at all and place him in the early-to-mid 5th century only by inference from his Ḥimyarite sponsor's reign. The Arabic sources give dates: installed in 425 by Ḥasan ibn ʿAmr ibn Tubbāʿ, king of Ḥimyar, and reigning 425–458. The 458 here is the end of that reign and is used as the death year; nothing independent confirms it, and he is also said simply to have reigned long and died of old age at Baṭn ʿAqīl.","tribe":"Kinda","blurb":"'Eater of bitter herbs', set over the Maʿadd tribes in 425 by a Ḥimyarite king. Kinda's kingship begins with him, as a southern crown's delegated instrument for governing nomads, and the Arabic sources run his reign to 458.","path":[]},{"id":"amr-al-maqsur","name":"ʿAmr al-Maqṣūr ibn Ḥujr","ar":"عمرو المقصور بن حُجر","role":"king","birth":null,"death":489,"lifeCertainty":"contested","lifeNote":"The English sources have nothing but 'probably killed in battle against the Rabīʿa in the late 5th century'. The Arabic sources give the reign as 458–489, which is where the 489 death year comes from. They also spell the epithet al-Manṣūr, not al-Maqṣūr — a disagreement about the pointing of the name itself, not about the man.","tribe":"Kinda","blurb":"Ḥujr's successor in Najd, reigning 458–489 by the Arabic reckoning, rejected by the Rabīʿa tribes and probably killed fighting them. The Arabic sources write his epithet al-Manṣūr where the English ones write al-Maqṣūr.","path":[]},{"id":"al-harith-ibn-amr","name":"Al-Ḥārith ibn ʿAmr","ar":"الحارث بن عمرو","role":"king","birth":null,"death":528,"lifeCertainty":"approximate","lifeNote":"The 502 federate treaty and his existence are externally attested; the manner of his death is contested. The Arabic sources add a reign — 489–528 — and a foundation date of 425 for the kingdom he inherited, where the English ones say no regnal dates were found.","tribe":"Kinda","blurb":"The best-known Kindite king and the first to appear in Byzantine sources, holding a Ḥimyarite mandate, a Byzantine federate treaty and a phylarchate in Palestine at once. He converted to Mazdakism under one Persian king and lost al-Ḥīra when the next one restored the Lakhmids. Killed in the Syrian Desert — by the Lakhmid al-Mundhir III or by the Banū Kalb, depending which source you take. His four sons divided his command and ruined it.","path":[]},{"id":"hujr-ibn-al-harith","name":"Ḥujr ibn al-Ḥārith","ar":"حجر بن الحارث","role":"king","birth":null,"death":525,"lifeCertainty":"contested","lifeNote":"Dated purely by inference from the collapse of Kinda's Ḥimyarite sponsor in 525.","tribe":"Kinda","blurb":"Imruʾ al-Qays's father, set as Kindite regent over the Asad and Ghaṭafān and killed when the Asad revolted. Everything in the most famous biography in Arabic poetry starts from his death.","path":[]},{"id":"shurahbil","name":"Shuraḥbīl ibn al-Ḥārith","ar":"شرحبيل بن الحارث","role":"king","birth":null,"death":530,"lifeCertainty":"legendary","lifeNote":"Entirely undated; placed only after his father's death.","tribe":"Kinda","blurb":"One of the four sons who split the Maʿadd command. He marched on his own brother with the outcasts who attached themselves to kings, each side offering a hundred camels for the other's head, and lost. A man owed blood-money speared him and sent the head to his brother, who wept.","path":[{"year":530,"placeId":"al-kulab","what":"Defeated and killed at Yawm al-Kulāb I"}]},{"id":"salama-ibn-al-harith","name":"Salama ibn al-Ḥārith","ar":"سلمة بن الحارث","role":"king","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Kinda","blurb":"Shuraḥbīl's brother and the winner at al-Kulāb, who then showed remorse over the head delivered to him. Taghlib expelled him afterwards and he took refuge with Bakr ibn Wāʾil.","path":[]},{"id":"shammar-yuharish","name":"Shammar Yuharʿish","ar":"شمر يهرعش","role":"king","birth":null,"death":300,"lifeCertainty":"approximate","lifeNote":"Conventionally 275–300 from the inscriptional ruler list; the boundaries are soft.","tribe":"Ḥimyar","blurb":"The king who finished unifying South Arabia under Ḥimyar and gave the dynasty its long title.","path":[]},{"id":"malkikarib","name":"Malkīkarib Yuhaʾmin","ar":"ملكيكرب يهأمن","role":"king","birth":null,"death":400,"lifeCertainty":"approximate","lifeNote":"c. 375–400 from the ruler list.","tribe":"Ḥimyar","blurb":"The king under whom Judaism became Ḥimyar's de facto state religion, though legend gives the credit to his son.","path":[]},{"id":"abu-karib-asad","name":"Abū Karib Asʿad","ar":"أبو كرب أسعد","role":"king","birth":null,"death":440,"lifeCertainty":"approximate","lifeNote":"c. 390–440 in the ruler list; the figures are reconstructions from inscriptions and not sharp.","tribe":"Ḥimyar","blurb":"Credited by legend as Ḥimyar's first Jewish convert, and attested campaigning into central Arabia and installing Ḥujr over the Maʿadd — the act that creates the kingdom of Kinda.","path":[]},{"id":"sharahbiil-yafur","name":"Sharaḥbiʾīl Yaʿfar","ar":"شرحبئل يعفر","role":"king","birth":null,"death":465,"lifeCertainty":"approximate","lifeNote":"c. 450–465 in the ruler list; his 450 dam repair is inscription-fixed.","tribe":"Ḥimyar","blurb":"The king who rebuilt the Maʾrib dam in 450 after two consecutive years of breaches.","path":[{"year":450,"placeId":"marib-dam","what":"Rebuilds the dam"}]},{"id":"dhu-nuwas","name":"Dhū Nuwās","ar":"ذو نواس","role":"king","birth":450,"death":527,"lifeCertainty":"contested","lifeNote":"Accession given as 517, 522, and '518 or 522' across two reference articles. The death is 527 in the Arabic sources — which put the reign at 517–527 and say he died 'at the Red Sea' — and 530 in the English ones, so the death year here follows the Arabic figure while the range stays open. His birth is contradicted inside one Arabic article: the lead has him living 468–527 and the sidebar has him born in 450. The Aksumite conquest that killed him is itself spread 525–543.","tribe":"Ḥimyar","blurb":"Yūsuf Asʾar Yathʾar, the last native Ḥimyarite king and a Jew, who put down the revolt at Najrān and had its Christian leaders killed — an event that brought an Ethiopian army across the Red Sea and ended his kingdom and his line. He is said to have ridden his horse into the sea. The Arabic sources put his death in 527, the English ones in 530, and one Arabic article gives his birth as 468 in its lead and 450 in its table.","path":[{"year":523,"placeId":"najran","what":"Represses the revolt at Najrān"},{"year":527,"placeId":"sanaa","what":"Killed as the Aksumites take the country"}]},{"id":"al-harith-najran","name":"Al-Ḥārith of Najrān","ar":"الحارث النجراني","role":"holy-figure","birth":null,"death":523,"lifeCertainty":"fixed","lifeNote":"The killing is dated 523, in November by one reckoning, and is the best-documented event in all of pre-Islamic Arabia.","tribe":"Banū al-Ḥārith","blurb":"Greek Arethas. The leader of Najrān's Christians, killed with some three hundred and forty followers. A Syriac letter written within months, a Syriac book, a hagiography and three Sabaic inscriptions all bear on his death — and the inscriptions, the only contemporary ones, are political texts that barely mention religion.","path":[]},{"id":"kaleb","name":"Kāleb / Ella Asbeha","ar":"كالب","role":"king","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"His reign is not fixed in the accessible sources; the invasion he ordered is spread 525–543.","tribe":"Aksum","blurb":"The Christian king of Aksum who sent an army across the Red Sea after the Najrān killings, deposed the Ḥimyarite king and installed a viceroy — and then lost control of his own occupation when one army defected to Abraha and a second was beaten.","path":[]},{"id":"abraha","name":"Abraha","ar":"أبرهة","role":"king","birth":null,"death":570,"lifeCertainty":"contested","lifeNote":"Tenure given as 535 to 560 or 570, but the detailed inscriptions cover only 547 to 559. Robin argues he probably died c. 570, reasoning back from his sons' reigns in the early 570s. The firm epigraphic window is 547–559, not 535–570.","tribe":"Aksum","blurb":"An Ethiopian general who took Yemen off his own king's viceroy, kept two armies sent against him from retaking it, repaired the Maʾrib dam and celebrated with a mass, hosted envoys from Aksum, Byzantium, Persia and the Ghassanids in one room, raided north into Maʿadd four times and took the son of the king of al-Ḥīra as a hostage. Someone later scratched his name off line 4 of his own inscription. The tradition makes him the man who marched elephants on Mecca.","path":[{"year":547,"placeId":"marib-dam","what":"Commissions the great dam repairs"},{"year":548,"placeId":"marib","what":"Hosts a conference of Aksumite, Byzantine, Persian and Ghassanid envoys"},{"year":552,"placeId":"murayghan","what":"Fourth raid on Maʿadd; takes ʿAmr ibn al-Mundhir's son hostage"},{"year":559,"placeId":"sanaa","what":"Last dated text of his reign — the record goes dark"}]},{"id":"masruq","name":"Masrūq ibn Abraha","ar":"مسروق بن أبرهة","role":"king","birth":null,"death":572,"lifeCertainty":"contested","lifeNote":"571–572 in the ruler list, in a window so tight it strains against the 570 Persian conquest.","tribe":"Aksum","blurb":"Abraha's son by a Ḥimyarite noblewoman, and Sayf ibn Dhī Yazan's half-brother. He was killed in battle when the Persians came, and Ethiopian rule in Yemen ended with him.","path":[]},{"id":"sayf-ibn-dhi-yazan","name":"Sayf ibn Dhī Yazan","ar":"سيف بن ذي يزن","role":"king","birth":516,"death":576,"lifeCertainty":"contested","lifeNote":"Born around 516 at Ṣanʿāʾ, killed between 575 and 578. There is also a chronological problem on the record: he is said to have been helped by the Lakhmid al-Nuʿmān III, whose reign begins after Sayf's death.","tribe":"Dhū Yazan","blurb":"A Ḥimyarite heir from a family that had converted to Judaism, whose father Abraha exiled in order to marry his mother. He went begging to Byzantium, which refused because it shared a faith with his half-brother; then to al-Ḥīra; then to Khusraw's own court, where he got his army on condition Yemen became a Persian vassal. He came home a king who owed tribute and was stabbed to death by one of his own Abyssinian servants. The epic that grew around him sends him into the land of the jinn and gets the Aksumites' religion wrong.","path":[{"year":565,"placeId":"constantinople","what":"Refused help by Byzantium"},{"year":567,"placeId":"hira","what":"Comes to the Lakhmid court seeking a road to Persia"},{"year":568,"placeId":"ctesiphon","what":"Granted an army by Khusraw I on condition of vassalage"},{"year":571,"placeId":"sanaa","what":"Installed as vassal king"},{"year":576,"placeId":"sanaa","what":"Stabbed to death by a servant"}]},{"id":"wahriz","name":"Wahrīz","ar":"وهرز","role":"warrior","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"The 570 conquest is externally dated; his return is given as 575 or 578.","tribe":"Persian","blurb":"The Sasanian general who took Yemen with a small expedition and at least eight ships, two of them said to have sunk, besieged Ṣanʿāʾ in 570, and came back after the vassal king was murdered with four thousand men to rule it himself.","path":[{"year":570,"placeId":"sanaa","what":"Besieges Ṣanʿāʾ and ends Ethiopian rule"},{"year":577,"placeId":"sanaa","what":"Returns with four thousand men and governs"}]},{"id":"badhan","name":"Bādhān","ar":"باذان","role":"king","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"Served until 628.","tribe":"Persian","blurb":"The last Sasanian governor of Yemen, unrelated to Wahrīz's family, in post as the empire that appointed him fell apart.","path":[]},{"id":"khusraw-i","name":"Khusraw I Anūshirwān","ar":"خسرو أنوشروان","role":"king","birth":null,"death":579,"lifeCertainty":"fixed","lifeNote":"Reign 531–579, externally fixed.","tribe":"Sasanian","blurb":"He took the throne and immediately bought peace for eleven thousand pounds of Byzantine gold, took Dara after a four-month siege, invaded Anatolia and was beaten near Melitene, sent an army to take Yemen off the Ethiopians, and died with a peace half-negotiated. He reportedly barred future Persian kings from leading armies in person except against another monarch.","path":[]},{"id":"khusraw-ii","name":"Khusraw II Parvīz","ar":"خسرو برويز","role":"king","birth":null,"death":628,"lifeCertainty":"fixed","lifeNote":"Reign 590–628, externally fixed.","tribe":"Sasanian","blurb":"He fled his own throne as a young man and was sheltered by the Lakhmid king, and twelve years later destroyed him and his dynasty, clearing the southern flank before declaring the war that took Jerusalem, Egypt and the True Cross — and then lost everything and was killed by his own son.","path":[{"year":590,"placeId":"nahrawan","what":"Sheltered by al-Nuʿmān III in flight from Bahrām Chōbīn"},{"year":602,"placeId":"ctesiphon","what":"Deposes and seizes al-Nuʿmān III, ending the Lakhmid kingdom"},{"year":614,"placeId":"jerusalem","what":"His armies take Jerusalem and the True Cross"},{"year":628,"placeId":"ctesiphon","what":"Overthrown and killed"}]},{"id":"justinian","name":"Justinian I","ar":"يوستنيانوس","role":"king","birth":null,"death":565,"lifeCertainty":"fixed","lifeNote":"Reign 527–565, externally fixed.","tribe":"Byzantine","blurb":"The emperor who made one Arab king answer for the whole eastern frontier, paid for a Perpetual Peace that lasted eight years, and — in the story Arabs told afterwards — received a dispossessed poet-prince and sent him home with a poisoned robe.","path":[]},{"id":"theodora","name":"Theodora","ar":"تيودورا","role":"patron","birth":null,"death":548,"lifeCertainty":"fixed","lifeNote":"Died 548.","tribe":"Byzantine","blurb":"The empress an Arab Miaphysite king petitioned in 542, and who answered by appointing the bishop who went on to build what became the Syriac Orthodox church.","path":[]},{"id":"jacob-baradaeus","name":"Jacob Baradaeus","ar":"يعقوب البرادعي","role":"holy-figure","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"Appointed 542.","tribe":"Syriac","blurb":"Appointed bishop at a Ghassanid king's request, and the man who turned Miaphysite Syria into a church with its own hierarchy. The most consequential thing any Arab client ever caused.","path":[]},{"id":"justin-ii","name":"Justin II","ar":"يوستينوس الثاني","role":"king","birth":null,"death":578,"lifeCertainty":"fixed","lifeNote":"Reign 565–578.","tribe":"Byzantine","blurb":"He stopped paying Persia tribute, started a twenty-year war, and ordered his own best Arab ally assassinated.","path":[]},{"id":"maurice","name":"Maurice","ar":"موريكيوس","role":"king","birth":null,"death":602,"lifeCertainty":"fixed","lifeNote":"Reign 582–602, murdered.","tribe":"Byzantine","blurb":"He exiled one Arab client king to Sicily, broke up the other's confederation, restored a Persian king to his throne — and was murdered by Phocas in 602, which gave that same Persian king his pretext for the final war.","path":[]},{"id":"phocas","name":"Phocas","ar":"فوقاس","role":"king","birth":null,"death":610,"lifeCertainty":"fixed","lifeNote":"Reign 602–610.","tribe":"Byzantine","blurb":"A usurper whose murder of his predecessor handed Khusraw II a casus belli, in the same year Khusraw destroyed the Lakhmids.","path":[]},{"id":"heraclius","name":"Heraclius","ar":"هرقل","role":"king","birth":null,"death":641,"lifeCertainty":"fixed","lifeNote":"Reign 610–641.","tribe":"Byzantine","blurb":"He left Constantinople on 4 April 622 — within weeks of the Hijra — and over six years broke Persia completely, which left both empires too exhausted to hold the desert frontier they had just dismantled.","path":[{"year":622,"placeId":"constantinople","what":"Leaves to begin the counteroffensive"},{"year":624,"placeId":"ctesiphon","what":"Beats Khusraw's army at Ganzaka with Arab help"},{"year":627,"placeId":"ctesiphon","what":"Breaks the Persian army at Nineveh"}]},{"id":"hind-bint-al-harith","name":"Hind bint al-Ḥārith","ar":"هند بنت الحارث","role":"patron","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. The Lakhmid women called Hind are repeatedly conflated in the tradition, and the sources call one of them both daughter and granddaughter of al-Nuʿmān.","tribe":"Kinda","blurb":"A Kindite princess married to the Lakhmid al-Mundhir III and mother of ʿAmr ibn Hind. She converted to Christianity and founded a monastery in the capital; her husband never converted.","path":[]},{"id":"kulayb","name":"Kulayb ibn Rabīʿa","ar":"كليب بن ربيعة","role":"warrior","birth":null,"death":494,"lifeCertainty":"legendary","lifeNote":"The 494 death comes from one modern Arabic compilation and nothing else. The whole war it starts is now
