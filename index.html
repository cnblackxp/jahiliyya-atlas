The campaign runs across 528-529 in the Greek sources.","placeId":"antioch","category":"battle","summary":"The Lakhmid took Khabour, raided Arzona and Nisibis, reached Apamea and failed at Antioch, and came home with plunder said to include four hundred nuns, reportedly sacrificed to al-ʿUzzā.","dispute":"The nun-sacrifice detail comes through hostile Christian reporting and should be handled as what the enemy said about him.","peopleIds":["al-mundhir-iii-lakhmid"],"politiesIds":["lakhmids","sasanians"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Nu%27man"},{"id":"basus-fusayl","year":530,"endYear":null,"title":"Yawm al-Fuṣayl","ar":"يوم الفصيل","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,545],"estimated":true,"dateNote":"Undated, and Ibn al-Athīr does no more than name it; the year holds the day's place in the sequence.","placeId":"al-fusayl","category":"battle","summary":"The last day of the war, won by Bakr. Its name means 'the camel calf' — the same creature one version of the trigger-story has Kulayb shooting first.","dispute":"Undated, and Ibn al-Athīr does no more than name it. Al-Maʿrifa gives no account of al-Fuṣayl as a day or a place at all. The echo between the name and the trigger-story may be a beautiful irony or may be evidence that the trigger grew backward out of the day-name — that link is inference, not a sourced claim.","peopleIds":["al-harith-ibn-ubad"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"kulab-i","year":530,"endYear":null,"title":"Yawm al-Kulāb I","ar":"يوم الكلاب الأول","evidence":"TRAD","dateCertainty":"legendary","dateRange":[520,560],"estimated":true,"dateNote":"Entirely undated; the window is a guess at the generation.","placeId":"al-kulab","category":"battle","summary":"After the Kindite king died his sons fell out, and Shuraḥbīl marched on his brother Salama with the outcasts who attached themselves to kings. Each side's herald offered a hundred camels for the other brother's head. Taghlib and Salama won the day; a man who had been owed blood-money speared Shuraḥbīl and sent his head to his brother, and Salama wept over it.","dispute":"Entirely undated. Al-Khāqānī's list locates al-Kulāb as a water between Kūfa and Baṣra and agrees on the outcome; Fajernet gives a different alignment of the tribes.","peopleIds":["shurahbil","salama-ibn-al-harith"],"politiesIds":["kinda"],"source":"https://mail.almerja.com/more.php?idm=66664"},{"id":"callinicum","year":531,"endYear":null,"title":"Battle of Callinicum","ar":"معركة قلينيقوس","evidence":"EXT","dateCertainty":"fixed","dateRange":[531,531],"estimated":false,"dateNote":null,"placeId":"callinicum","category":"battle","summary":"Belisarius was defeated on the Euphrates by Persians and Lakhmids and dismissed after an inquiry. Al-Ḥārith ibn Jabala brought five thousand Arabs to the Roman side.","dispute":"Procopius says the Arabs fled and cost Byzantium the battle; Malalas says al-Ḥārith stood firm while the other Arabs ran. Two contemporary Greek sources in direct contradiction — and al-Ḥārith kept his command either way.","peopleIds":["al-harith-ibn-jabala","al-mundhir-iii-lakhmid"],"politiesIds":["byzantines","sasanians","lakhmids","ghassanids"],"source":"https://en.wikipedia.org/wiki/Iberian_War"},{"id":"perpetual-peace","year":532,"endYear":null,"title":"The Perpetual Peace","ar":"الصلح الأبدي","evidence":"EXT","dateCertainty":"fixed","dateRange":[532,532],"estimated":false,"dateNote":null,"placeId":"ctesiphon","category":"politics","summary":"Khusraw I had just taken the Persian throne and both empires wanted out. Conquests went back, and Byzantium paid eleven thousand pounds of gold. It held for eight years.","dispute":null,"peopleIds":["khusraw-i","justinian"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Perpetual_Peace_(532)"},{"id":"hujras-kills-jassas","year":535,"endYear":null,"title":"Hujras kills his uncle","ar":"مقتل جساس","evidence":"TRAD","dateCertainty":"legendary","dateRange":[510,560],"estimated":true,"dateNote":"Undated akhbār; placed after the war's main days because that is where the narrative puts it.","placeId":"al-yamama","category":"battle","summary":"Jassās had raised Kulayb's son Hujras as his own. When the boy learned who had killed his father he killed Jassās.","dispute":"Undated akhbār.","peopleIds":["jassas","jalila"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"imru-vengeance-war","year":535,"endYear":null,"title":"Imruʾ al-Qays's war of vengeance","ar":"حرب امرئ القيس","evidence":"TRAD","dateCertainty":"legendary","dateRange":[528,545],"estimated":true,"dateNote":"No dates at all. The episode is akhbār built around the poems, and the late birth scheme for the poet makes it impossible.","placeId":"najd","category":"battle","summary":"Asad offered him a choice: kill a noble of his father's rank, take blood-money in sheep and camels, or war. He took war. Bakr and Taghlib rode with him, and then walked away once they judged the revenge sufficient, leaving him with nothing. A Ḥimyarite king is said to have sent him five hundred men.","dispute":"No dates at all. The whole episode is akhbār built around the poems. It is also the part of his life that the late birth-date of c. 526 makes impossible.","peopleIds":["imru-al-qays-poet"],"politiesIds":["kinda","himyar"],"source":"https://en.wikipedia.org/wiki/Imru%27_al-Qais"},{"id":"muhalhil-dies","year":540,"endYear":null,"title":"Al-Muhalhil dies of thirst","ar":"موت المهلهل","evidence":"TRAD","dateCertainty":"legendary","dateRange":[530,555],"estimated":true,"dateNote":"Undated, and the death is told twice with different names; the year only keeps him after the war.","placeId":"hajar-bahrayn","category":"birth-death","summary":"After forty years he called his own people to peace and left for Yemen, settled among Janb of Madhḥij and married there. He was taken prisoner near Hajar by a man who had sworn not to give him water until something lost was returned, was handed brackish water, and died of thirst.","dispute":"Al-Maʿrifa tells the same death with different names — an oath, withheld water, and the thing returned three days too late. Two variants of one story; a dramatist should not name a single canonical captor. Undated.","peopleIds":["al-muhalhil"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"dam-breach-542","year":542,"endYear":null,"title":"The dam breaks again","ar":"انكسار السد مرة أخرى","evidence":"EPI","dateCertainty":"fixed","dateRange":[542,542],"estimated":false,"dateNote":"Fixed by the dam inscriptions.","placeId":"marib-dam","category":"disaster","summary":"Ninety years after the last repair the barrage failed again, and this time in the middle of a change of regime.","dispute":null,"peopleIds":["abraha"],"politiesIds":["aksum","himyar"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"theodora-jacob","year":542,"endYear":null,"title":"Al-Ḥārith asks Theodora for bishops","ar":"شفاعة الحارث عند تيودورا","evidence":"EXT","dateCertainty":"fixed","dateRange":[542,542],"estimated":false,"dateNote":null,"placeId":"constantinople","category":"religion","summary":"A Miaphysite Arab king petitioned the empress for Miaphysite bishops in Syria, and she appointed Jacob Baradaeus. Jacob went on to build what became the Syriac Orthodox church. It is the most consequential thing any Ghassanid ever did.","dispute":null,"peopleIds":["al-harith-ibn-jabala","theodora","jacob-baradaeus"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Harith_ibn_Jabalah"},{"id":"ukaz-founded","year":542,"endYear":null,"title":"The fair at ʿUkāẓ","ar":"سوق عكاظ","evidence":"TRAD","dateCertainty":"contested","dateRange":[501,542],"estimated":false,"dateNote":"The same article gives 501 as the founding and c. 542-726 as the active period; 542 is the later of the two figures.","placeId":"ukaz","category":"trade","summary":"Twenty-one days every year in Dhū al-Qaʿda, just before the pilgrimage: trade, lawsuits settled, treaties concluded, athletics, recited poetry, preaching. Its position on the western spice route drove its growth through the 6th century.","dispute":"Founding given as 501 in an infobox and an active period of c. 542–726 in the text of the same article. The familiar claim that poets competed here and the winning ode was hung in the Kaʿba could not be sourced either way, and most scholars reject the Kaʿba part.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Souk_Okaz"},{"id":"abraha-dam-repair","year":543,"endYear":null,"title":"Abraha repairs the dam","ar":"ترميم أبرهة للسد","evidence":"EPI","dateCertainty":"contested","dateRange":[543,548],"estimated":false,"dateNote":"543 in one source against CIH 541's 548 - either two campaigns of work or one wrong figure.","placeId":"marib-dam","category":"politics","summary":"The Ethiopian general turned king of Yemen put the dam back together and celebrated its completion with a mass. The inscription recording it was first published by Eduard Glaser in 1897.","dispute":"The 543 date clashes with CIH 541's record of repairs in 548. Either two separate campaigns of work, or one of the two dates is wrong; the sources do not resolve it.","peopleIds":["abraha"],"politiesIds":["aksum"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"awara-i","year":545,"endYear":null,"title":"Yawm Awāra I","ar":"يوم أوارة الأول","evidence":"TRAD","dateCertainty":"legendary","dateRange":[505,554],"estimated":true,"dateNote":"Undated; the window is simply al-Mundhir III's reign.","placeId":"awara","category":"battle","summary":"Al-Mundhir ibn Māʾ al-Samāʾ against Banū Bakr.","dispute":"Undated; the window is simply al-Mundhir III's reign. One of many day-names doubled into a first and second.","peopleIds":["al-mundhir-iii-lakhmid"],"politiesIds":["lakhmids"],"source":"https://fajernet.net/article.php?cid=12&id=6820"},{"id":"cih541","year":548,"endYear":null,"title":"CIH 541","ar":"نقش CIH 541","evidence":"EPI","dateCertainty":"fixed","dateRange":[548,548],"estimated":false,"dateNote":"Fixed by the inscription's own Ḥimyarite era date.","placeId":"marib-dam","category":"inscription","summary":"The dam's key document and the last archaeological reference to it before the end. It lists what the work crews ate — 50,806 measures of flour, 26,000 of dates, meat worth 3,000 cattle, 7,200 small stock, 300 camel-loads of wine — records a plague and Abraha's campaigns, describes a conference of envoys from Aksum, Byzantium, Persia and the Ghassanids, and notes the appointment of a deputy-governor for Kinda.","dispute":"Abraha's name on line 4 is damaged or erased, possibly deliberately by people who wanted Ethiopian rule forgotten. None of the sub-events in the text carries its own date, and the dam repair is dated 543 in one place and 548 by this inscription — either two work seasons or an error, and the matter is unresolved. A gap in the Arabic reference literature belongs on this record: the general Arabic works never name CIH 541, and never mention the Murayghān inscriptions or the year 552 either. They describe this text accurately without naming it — a tablet at the dam of a hundred and thirty-six lines and about four hundred and seventy words — so the object is known in Arabic and its siglum is not, which is why the epigraphic argument about the Year of the Elephant cannot be followed from Arabic sources alone.","peopleIds":["abraha"],"politiesIds":["aksum","byzantines","sasanians","ghassanids","kinda"],"source":"https://en.wikipedia.org/wiki/CIH_541"},{"id":"dam-breach-548","year":548,"endYear":null,"title":"Breach and rebuilding","ar":"انكسار وترميم","evidence":"EPI","dateCertainty":"fixed","dateRange":[548,548],"estimated":false,"dateNote":"Fixed by CIH 541.","placeId":"marib-dam","category":"disaster","summary":"Another major breach, answered by the largest documented repair effort of the century.","dispute":null,"peopleIds":["abraha"],"politiesIds":["aksum"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"duma-graffito","year":548,"endYear":null,"title":"Dūmat al-Jandal Christian graffito","ar":"نقش دومة الجندل","evidence":"EPI","dateCertainty":"fixed","dateRange":[548,549],"estimated":false,"dateNote":"The graffito's own era date, year 443, converts to 548/549.","placeId":"dumat-al-jandal","category":"inscription","summary":"A Paleo-Arabic Christian graffito dated year 443 of its era, published in 2017, opening 'May be remembered. May God remember' a man and his son. Christian Arabic writing in the middle of the northern desert.","dispute":null,"peopleIds":[],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Dumat_al-Jandal"},{"id":"murayghan-1","year":552,"endYear":null,"title":"Ry 506 / Murayghān 1","ar":"نقش مريغان","evidence":"EPI","dateCertainty":"fixed","dateRange":[552,552],"estimated":false,"dateNote":"Fixed by the internal date: year 662 of the Ḥimyarite era, month dhu-ʿallān.","placeId":"murayghan","category":"inscription","summary":"Dated internally to year 662, month dhu-ʿallān, which is September 552. Abraha's fourth raid on Maʿadd after the Banū ʿĀmir revolted: Maʿadd beaten, hostages taken, and ʿAmr ibn al-Mundhir of al-Ḥīra submitting and handing over his own son. Mecca is not named anywhere in it.","dispute":"This is the central document of the Year of the Elephant argument — Iwona Gajda accepts 552 as the date of the northern expedition precisely because this is the only dated one. It also puts ʿAmr ibn al-Mundhir in the field two years before the conventional table has him taking the Lakhmid throne.","peopleIds":["abraha","amr-ibn-hind"],"politiesIds":["himyar","aksum","lakhmids"],"source":"https://en.wikipedia.org/wiki/Abraha"},{"id":"amr-ibn-hind-accession","year":554,"endYear":569,"title":"ʿAmr ibn Hind takes al-Ḥīra","ar":"تولي عمرو بن هند","evidence":"TRAD","dateCertainty":"approximate","dateRange":[552,554],"estimated":false,"dateNote":"The conventional table gives 554, but Ry 506 has ʿAmr ibn al-Mundhir already acting in 552 - he may have been deputising for his father; endYear carries the reign to his killing, itself given as 568/9, 569 or 570.","placeId":"hira","category":"politics","summary":"A man with a violent temper and a Kindite mother came to the Lakhmid throne. His court drew Ṭarafa, al-Mutalammis, al-Ḥārith ibn Ḥilliza and ʿAmr ibn Kulthūm — and he killed one of them and was killed by another.","dispute":"Ry 506 has him already acting as 'ʿAmr ibn al-Mundhir' in 552, before the conventional accession; he may have been deputising for his father.","peopleIds":["amr-ibn-hind"],"politiesIds":["lakhmids"],"source":"https://en.wikipedia.org/wiki/Amr_ibn_Hind"},{"id":"yawm-halima","year":554,"endYear":null,"title":"Yawm Ḥalīma","ar":"يوم حليمة","evidence":"EXT","dateCertainty":"fixed","dateRange":[554,554],"estimated":false,"dateNote":"Fixed to June 554 through the Greek account of the battle near Chalcis; identifying that battle with Yawm Ḥalīma is itself a modern reconstruction.","placeId":"chalcis","category":"battle","summary":"In June the Ghassanids broke a Lakhmid army near Chalcis. Al-Mundhir III fell on the field after fifty years of raiding; al-Ḥārith ibn Jabala lost his eldest son Jabala. The day is named for Ḥalīma, al-Ḥārith's own daughter, and it is the one fighting day of the Arabs that can be nailed to an externally dated battle.","dispute":"The battle near Chalcis in June 554 is externally sourced; the name Yawm Ḥalīma is from the Arabic tradition, so the identification of the two is itself a scholarly reconstruction. One reference article's infobox spreads the battle across Iraq, Jordan and Syria while its text puts it near Chalcis. The Arabic sources identify Ḥalīma as al-Ḥārith's own daughter, which is sharper than the English 'a Ghassanid princess who helped her tribe's fighters'. They also keep Yawm Ḥalīma and Yawm ʿAyn Ubāgh firmly apart, as two consecutive and separate entries: ʿAyn Ubāgh is the killing of al-Mundhir ibn Māʾ al-Samāʾ, the father, and Marj Ḥalīma the killing of al-Mundhir ibn al-Mundhir, the son — two battles, two generations, the same family and the same Ghassanid enemy.","peopleIds":["al-mundhir-iii-lakhmid","al-harith-ibn-jabala","halima","abu-karib-son"],"politiesIds":["ghassanids","lakhmids","byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Yawm_Halima"},{"id":"ayn-ubagh","year":556,"endYear":null,"title":"Yawm ʿAyn Ubāgh","ar":"يوم عين أباغ","evidence":"TRAD","dateCertainty":"legendary","dateRange":[540,570],"estimated":true,"dateNote":"Undated in every source reached. Placed between the two Lakhmid generations, since Ibn al-Athīr files it one generation before Marj Ḥalīma.","placeId":"ayn-ubagh","category":"battle","summary":"Al-Mundhir camped at the spring and demanded ransom or war. Al-Ḥārith the Ghassanid proposed instead that each side send out a son to single combat, and when the sons were used up the two old men would come out themselves. Al-Mundhir sent a champion dressed as his son; a defector told al-Ḥārith; the armies clashed next day, al-Mundhir was killed, and al-Ḥārith loaded his two dead sons on a camel with the enemy king's corpse on top — the origin of a proverb about the top-load above the two panniers. He then burned al-Ḥīra and buried his sons there.","dispute":"Undated in every source reached. It is routinely confused with Yawm Ḥalīma in modern writing, but Ibn al-Athīr files them as two consecutive separate chapters, one generation apart: ʿAyn Ubāgh is the killing of al-Mundhir ibn Māʾ al-Samāʾ, Marj Ḥalīma the killing of his son. The confusion belongs to the secondary literature, not the Arabic sources.","peopleIds":["al-mundhir-iii-lakhmid","al-harith-ibn-jabala","abu-karib-son"],"politiesIds":["ghassanids","lakhmids"],"source":"https://almerja.com/aklam/indexv.php?id=7949"},{"id":"dam-repair-557","year":557,"endYear":null,"title":"The last repairs","ar":"آخر ترميم للسد","evidence":"EPI","dateCertainty":"fixed","dateRange":[557,557],"estimated":false,"dateNote":"Dated by the repair inscription; one brief gives 558 and the publication reads 557.","placeId":"marib-dam","category":"politics","summary":"The final recorded work on the Maʾrib dam. After this nobody with the authority to call out the labour is left.","dispute":null,"peopleIds":["abraha"],"politiesIds":["aksum"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"last-himyarite-text","year":559,"endYear":null,"title":"The record goes dark","ar":"آخر نقش حميري مؤرخ","evidence":"EPI","dateCertainty":"fixed","dateRange":[559,560],"estimated":false,"dateNote":"Era conversion gives 559/560.","placeId":"sanaa","category":"inscription","summary":"A church inscription is the last known dated Ḥimyarite text. The South Arabian epigraphic record, the only real chronology in Arabia, goes silent ten years before the traditional Year of the Elephant.","dispute":null,"peopleIds":["abraha"],"politiesIds":["aksum"],"source":"https://en.wikipedia.org/wiki/Abraha"},{"id":"barqi-robin-naiit","year":560,"endYear":null,"title":"Bāriqī-Robin-Nāʿiṭ 1","ar":"نقش ناعط","evidence":"EPI","dateCertainty":"contested","dateRange":[552,570],"estimated":true,"dateNote":"The inscription carries no date; the range is the plausible span of Abraha's northern campaigns.","placeId":"naiit","category":"inscription","summary":"A fragmentary nine-line Sabaic relief from Nāʿiṭ, published in 2025, naming Abraha and describing military activity around Ṣanʿāʾ. Line 5 may read 'elephants' and line 6 'lions'; line 7 has 'Raḥmānān who is in Heaven', a formula previously found mainly in Jewish texts.","dispute":"The elephant reading is unconfirmed — the word is damaged and its etymology uncertain. If it holds it would be the first epigraphic elephant in South Arabia. Treat as live scholarship. The event's own date is unknown; the range here is the plausible span of Abraha's northern campaigns.","peopleIds":["abraha"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/B%C4%81riq%C4%AB-Robin-N%C4%81%CA%BFi%E1%B9%AD_1"},{"id":"harith-aaraj-vs-taghlib","year":560,"endYear":null,"title":"The war between al-Ḥārith al-Aʿraj and Taghlib","ar":"الحرب بين الحارث الأعرج وبني تغلب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[550,569],"estimated":true,"dateNote":"Undated; the window is al-Ḥārith al-Aʿraj's reign.","placeId":"al-jabiya","category":"battle","summary":"A separate Ghassanid campaign against Taghlib, in which ʿAmr ibn Kulthūm clashed with al-Ḥārith ibn Abī Shamir.","dispute":"Known as a chapter heading in Ibn al-Athīr with the names attached; undated. It is the one attested link between ʿAmr ibn Kulthūm and the Ghassanid court.","peopleIds":["al-harith-ibn-jabala","amr-ibn-kulthum"],"politiesIds":["ghassanids"],"source":"https://www.islamweb.net/ar/library/content/126/157/"},{"id":"samawal-dies","year":560,"endYear":null,"title":"Death of al-Samawʾal at Taymāʾ","ar":"وفاة السموأل","evidence":"TRAD","dateCertainty":"contested","dateRange":[550,570],"estimated":true,"dateNote":"c. 560 is a reconstruction, and it is not known whether Imruʾ al-Qays was alive when the siege happened.","placeId":"tayma","category":"birth-death","summary":"The Jewish lord of al-Ablaq died at Taymāʾ, remembered for one refusal: he would not hand over Imruʾ al-Qays's deposits, and watched his besiegers kill his son in front of him rather than break trust. 'More faithful than al-Samawʾal' was still a proverb centuries later.","dispute":"The c. 560 date is a reconstruction. His genealogy is disputed — Ibn Durayd makes him the son of a priest, al-Jawālīqī gives him a Ghassanid mother and an Azdī father. And it is not known whether Imruʾ al-Qays was alive or dead when the siege happened.","peopleIds":["al-samawal","imru-al-qays-poet"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Samaw%27al_ibn_%27Adiya"},{"id":"awara-ii","year":562,"endYear":null,"title":"Yawm Awāra II","ar":"يوم أوارة الثاني","evidence":"TRAD","dateCertainty":"legendary","dateRange":[554,570],"estimated":true,"dateNote":"Undated; the window is ʿAmr ibn Hind's reign.","placeId":"awara","category":"battle","summary":"ʿAmr ibn Hind against Banū Tamīm.","dispute":"Undated; the window is ʿAmr ibn Hind's reign.","peopleIds":["amr-ibn-hind"],"politiesIds":["lakhmids"],"source":"https://fajernet.net/article.php?cid=12&id=6820"},{"id":"fifty-year-peace","year":562,"endYear":null,"title":"The Fifty-Year Peace","ar":"صلح الخمسين سنة","evidence":"EXT","dateCertainty":"fixed","dateRange":[562,562],"estimated":false,"dateNote":null,"placeId":"ctesiphon","category":"politics","summary":"The long war of 540–562 was closed by treaty. It lasted less than a decade.","dispute":null,"peopleIds":["khusraw-i","justinian"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_572%E2%80%93591"},{"id":"imru-constantinople","year":562,"endYear":null,"title":"Imruʾ al-Qays reaches Constantinople","ar":"سفارة امرئ القيس","evidence":"TRAD","dateCertainty":"contested","dateRange":[561,565],"estimated":true,"dateNote":"Dated only backward from the poet's death, which is itself given across 561-565 - and the Arabic dating of his life to 496-544 removes the embassy from the record altogether.","placeId":"constantinople","category":"politics","summary":"Carrying a letter of introduction through Ghassanid territory, the dispossessed Kindite prince reached Justinian and came away with promises and perhaps some troops. Justinian is said to have asked Aksum to back him, and Aksum refused because of its feud with Kinda.","dispute":"The journey is akhbār, not record, and one of the three date-schemes abolishes it. The Arabic sources put the poet's life at 496–544, which would have him dead seventeen years before the embassy; on the early English birth scheme he is a man of sixty-three or sixty-four making a diplomatic trip across the world; on the late one he is the right age but was an infant when his father was killed. The mediator is named in the Arabic sources as al-Ḥārith, the Ghassanid king.","peopleIds":["imru-al-qays-poet","justinian"],"politiesIds":["kinda","byzantines","ghassanids"],"source":"https://en.wikipedia.org/wiki/Imru%27_al-Qais"},{"id":"imru-death","year":565,"endYear":null,"title":"Imruʾ al-Qays dies near Ankara","ar":"وفاة امرئ القيس","evidence":"TRAD","dateCertainty":"contested","dateRange":[561,565],"estimated":false,"dateNote":"Given across 561-565; no source fixes the year. The Arabic sources date his death to 544 instead, which is a third chronology rather than a variant of this one.","placeId":"ankara","category":"birth-death","summary":"He fell ill on the road home and died in Anatolia. The story says Justinian sent him a poisoned robe over an affair at court; most historians think it was the chronic skin disease he names in his own verse. A statue was later said to stand at his tomb, still visible in 1262.","dispute":"The poisoned robe is an international folklore type, the 'poison dress', not a story specific to him; use it as in-world rumour, which is exactly what it was. The Arabic sources give 544 for the death, not 565 — a figure that cancels the embassy to Constantinople entirely and is the sharpest conflict to come out of the Arabic review. The skin disease is the usual explanation and gives him the epithet Dhū al-Qurūḥ, the man of ulcers. It is also not known whether he died before or after the siege of al-Ablaq in which al-Samawʾal's son was killed over his pledges.","peopleIds":["imru-al-qays-poet","justinian"],"politiesIds":["kinda","byzantines"],"source":"https://en.wikipedia.org/wiki/Imru%27_al-Qais"},{"id":"amr-ibn-hind-killed","year":568,"endYear":null,"title":"ʿAmr ibn Kulthūm kills the king at dinner","ar":"مقتل عمرو بن هند","evidence":"TRAD","dateCertainty":"contested","dateRange":[568,570],"estimated":false,"dateNote":"Given as 568/9 in one source and 569 or 570 in another.","placeId":"hira","category":"battle","summary":"Hind insulted the poet's mother. ʿAmr ibn Kulthūm of Taghlib killed the Lakhmid king at his own table for it, and rode out of al-Ḥīra. His brother Qābūs took the throne.","dispute":"Given as 568/9 in one source and 569 or 570 in another.","peopleIds":["amr-ibn-kulthum","amr-ibn-hind"],"politiesIds":["lakhmids"],"source":"https://en.wikipedia.org/wiki/Amr_ibn_Hind"},{"id":"dahis-race","year":568,"endYear":609,"title":"The rigged horse race","ar":"سباق داحس والغبراء","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,590],"estimated":true,"dateNote":"The race is undated; the war's conventional bracket of c. 568-609 is Sir William Muir's Victorian reconstruction rather than a source date, and endYear carries that bracket so the war can be drawn as a band.","placeId":"najd","category":"culture","summary":"Before the horses there was a coat of mail. Qays ibn Zuhayr of ʿAbs bought one from Uḥayḥa ibn al-Julāḥ; al-Rabīʿ ibn Ziyād took it and would not give it back; Qays raided al-Rabīʿ's camels, sold them at Mecca and bought horses with the money, Dāḥis among them — and then his own mare foaled al-Ghabrāʾ. So the quarrel at the root of the war is about armour, not a horse. Then Qays matched his two against Ḥudhayfa ibn Badr's Khaṭṭār and Ḥanfāʾ over a course run across forty nights, for a stake of ten camels. Men hidden in the ravines turned the leading horse away from the finish. The loser refused to pay, the winner's kin were killed, and forty years of war followed in which neither tribe bred a camel or a horse.","dispute":"Three incompatible versions of the race and two accounts of what caused the war. On the cause, the Arabic sources put something earlier than the race, which the usual retelling drops: Qays bought a coat of mail from Uḥayḥa ibn al-Julāḥ, al-Rabīʿ ibn Ziyād seized it and kept it, and Qays raided his camels, sold them at Mecca and bought the horses with the proceeds — so the origin is a mail-coat, not a horse. Both narrations should stand. On the race: in al-ʿIqd al-Farīd it is Ḥamal ibn Badr, not Ḥudhayfa, who hid the men, and Dāḥis is Qays's horse cheated of the win; in Ibn al-Athīr both Dāḥis and al-Ghabrāʾ are Qays's, a man of Banū Asad threw Dāḥis in the water and crippled his run, Ḥanfāʾ fell, and al-Ghabrāʾ came in ahead of Khaṭṭār — so the war's name pairs two horses that one source makes rivals and another makes stablemates. The escalation is doubled too: Ḥudhayfa's son Nadba, or his son Mālik, came to demand the stake and Qays killed him, after which the tribes agreed on a hundred she-camels in blood-money that al-Rabīʿ ibn Ziyād paid by himself. The whole war's conventional bracket of c. 568–609 is Muir's reconstruction, not a source date.","peopleIds":["qays-ibn-zuhayr","hudhayfa","hamal","al-rabi-ibn-ziyad"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Dahis_and_al-Ghabra"},{"id":"harran-inscription","year":568,"endYear":null,"title":"Ḥarrān inscription","ar":"نقش حران","evidence":"EPI","dateCertainty":"fixed","dateRange":[568,568],"estimated":false,"dateNote":"Fixed by the local era date: year 463 after the destruction of Khaybar, epoch c. 105 CE.","placeId":"harran-al-laja","category":"inscription","summary":"A Greek-Arabic bilingual on the martyrium of St John, south of Damascus. Sharaḥīl son of Ṭalimu built it in 'year 463 after the destruction of Khaybar' — which means there was a local Arabian dating era running from a raid on an oasis around 105 CE.","dispute":"The builder's patronym is read Ṭalimu in the publication, not Ẓālim as often reported.","peopleIds":[],"politiesIds":["ghassanids"],"source":"https://www.islamic-awareness.org/history/islam/inscriptions/harran"},{"id":"dahis-ghadaq","year":569,"endYear":null,"title":"Yawm al-Ghadaq","ar":"يوم الغدق","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated; the year holds the day's place in al-ʿIqd al-Farīd's ordering.","placeId":"najd","category":"battle","summary":"Called the first major clash of the war. Fazāra were routed and Ḥudhayfa himself was taken prisoner by al-Rabīʿ ibn Ziyād, and a man who tried to kill him there failed.","dispute":"Undated; known only from the almerja text of Ibn al-Athīr.","peopleIds":["hudhayfa","al-rabi-ibn-ziyad"],"politiesIds":[],"source":"https://almerja.com/more.php?idm=66592"},{"id":"harith-ibn-jabala-dies","year":569,"endYear":null,"title":"Death of al-Ḥārith ibn Jabala","ar":"وفاة الحارث بن جبلة","evidence":"EXT","dateCertainty":"fixed","dateRange":[569,569],"estimated":false,"dateNote":null,"placeId":"al-jabiya","category":"birth-death","summary":"Forty years a king, a patrikios, a Miaphysite kingmaker and the victor of Ḥalīma, he died during a reported earthquake. His son al-Mundhir took over and lasted twelve years.","dispute":null,"peopleIds":["al-harith-ibn-jabala","al-mundhir-ghassanid"],"politiesIds":["ghassanids"],"source":"https://en.wikipedia.org/wiki/Al-Harith_ibn_Jabalah"},{"id":"letter-archimandrites","year":569,"endYear":null,"title":"The Letter of the Archimandrites","ar":"رسالة رؤساء الأديرة","evidence":"EXT","dateCertainty":"approximate","dateRange":[569,570],"estimated":false,"dateNote":"The letter is dated 569 or 570.","placeId":"al-jabiya","category":"religion","summary":"A conference the Ghassanids convened produced a letter signed by representatives of a hundred and thirty-seven monasteries. The measure of what an Arab client kingdom's church patronage actually amounted to.","dispute":null,"peopleIds":[],"politiesIds":["ghassanids"],"source":"https://en.wikipedia.org/wiki/Christianity_in_pre-Islamic_Arabia"},{"id":"tarafa-executed","year":569,"endYear":null,"title":"Ṭarafa carries his own death warrant","ar":"إعدام طرفة","evidence":"TRAD","dateCertainty":"contested","dateRange":[565,570],"estimated":true,"dateNote":"Placed c. 569 inside ʿAmr ibn Hind's reign; the episode is akhbār grown around the poems.","placeId":"hajar-bahrayn","category":"birth-death","summary":"He mocked the king in verse. ʿAmr ibn Hind sent him and his uncle al-Mutalammis home, each with a sealed letter for the governor of Baḥrayn. Neither could read. Al-Mutalammis had a boy from al-Ḥīra open his, found it ordered him buried alive, threw it in a stream and told Ṭarafa to do the same — and Ṭarafa would not break a royal seal. He was about twenty-six.","dispute":"Burial alive is one version among several. The whole episode is akhbār grown around the poems.","peopleIds":["tarafa","al-mutalammis","amr-ibn-hind"],"politiesIds":["lakhmids"],"source":"https://en.wikipedia.org/wiki/Tarafa"},{"id":"malik-ibn-zuhayr-killed","year":570,"endYear":null,"title":"Mālik ibn Zuhayr killed at al-Luqāṭa","ar":"مقتل مالك بن زهير","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated; placed by its position in the Dāḥis sequence.","placeId":"najd","category":"birth-death","summary":"Qays's brother camped at al-Luqāṭa, was betrayed to Ḥudhayfa and killed. ʿAntara's elegy for him is one of the few things the early sources actually attribute to ʿAntara.","dispute":"Undated. Terms of two hundred camels and four slaves were accepted for the death at one point, with hostages held — one of several interim settlements the war chewed through.","peopleIds":["antara","qays-ibn-zuhayr","hudhayfa"],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"monasteries-of-hind","year":570,"endYear":null,"title":"The monasteries of Hind","ar":"ديري هند","evidence":"TRAD","dateCertainty":"approximate","dateRange":[550,600],"estimated":true,"dateNote":"Dated only to the second half of the 6th century.","placeId":"hira","category":"religion","summary":"Two monasteries at al-Ḥīra, of Hind the Elder and Hind the Younger, both built in the second half of the 6th century. Hind was a Kindite princess married to al-Mundhir III; she converted and founded hers in the capital while her husband did not convert.","dispute":"The Lakhmid women called Hind — the Elder, the Younger, al-Ḥurqa — are repeatedly conflated in the tradition, and the sources call one Hind both daughter and granddaughter of al-Nuʿmān.","peopleIds":["hind-bint-al-harith"],"politiesIds":["lakhmids","kinda"],"source":"https://en.wikipedia.org/wiki/Al-Hirah"},{"id":"sasanian-conquest-yemen","year":570,"endYear":null,"title":"The Persians take Yemen","ar":"الفتح الساساني لليمن","evidence":"EXT","dateCertainty":"fixed","dateRange":[570,570],"estimated":false,"dateNote":"The siege of Ṣanʿāʾ is dated 570 in the external record; one strand of the literature puts the Sasanian annexation at 575 or 578 instead.","placeId":"sanaa","category":"battle","summary":"A small expedition under Wahrīz, sailing with at least eight ships of which two are said to have sunk, besieged Ṣanʿāʾ and ended Ethiopian rule. South Arabia became a Sasanian province, and the conquest is formally listed among the causes of the next Byzantine-Persian war.","dispute":null,"peopleIds":["wahriz","sayf-ibn-dhi-yazan","khusraw-i","masruq"],"politiesIds":["sasanians","sasanian-yemen","aksum"],"source":"https://en.wikipedia.org/wiki/Sasanian_Yemen"},{"id":"satih-prophecy","year":570,"endYear":null,"title":"Saṭīḥ's deathbed prophecy","ar":"نبوءة سطيح","evidence":"TRAD","dateCertainty":"legendary","dateRange":[552,628],"estimated":true,"dateNote":"Undated. Placed at the traditional eve of Muḥammad's birth because that is where the narrative puts it, not where any source dates it.","placeId":"hira","category":"religion","summary":"An earthquake toppled pillars in the Persian throne room, the sacred fire at Iṣṭakhr went out, Lake Sāwa sank, and the chief priest dreamed of camels leading Arabian horses across the Tigris. Khusraw sent for an Arab sage, and the Lakhmid king sent a Christian who rode to Syria to find Saṭīḥ — boneless, near death, his companion Shiqq already dead. Saṭīḥ said an Arab prophet would come, that Persian rule would pass to the Arabs, and that the number of fallen pillars was the number of kings left. Then he died.","dispute":"Savran reads Saṭīḥ and Shiqq as early-ʿAbbāsid literary constructions, 'connectors' inserted to tie ancient Arabia, the Sasanians and the rise of Islam into one master narrative, and legitimising agents making Jāhiliyya Arabs carry a hidden monotheist current. Al-Masʿūdī and Ibn Durayd put the Persian omens under Khusraw II instead of Khusraw I. The isnād of the main report is spurious. Using these two as 6th-century characters reproduces an ʿAbbāsid ideology rather than a 6th-century reality.","peopleIds":["satih","shiqq","khusraw-i"],"politiesIds":["sasanians","lakhmids"],"source":"https://www.academia.edu/63286164/The_Two_Old_Soothsayers_in_the_Islamic_Historiographical_Tradition"},{"id":"tikhfa-day","year":570,"endYear":null,"title":"Yawm Ṭikhfa","ar":"يوم طخفة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[540,600],"estimated":true,"dateNote":"Undated, and the sources disagree over which Lakhmid king - father or son - fought there.","placeId":"tikhfa","category":"battle","summary":"Banū Yarbūʿ beat a Lakhmid king's force.","dispute":"Which king is contested: al-Qalqashandī's list says Qābūs ibn al-Mundhir, Fajernet says al-Mundhir ibn Māʾ al-Samāʾ — father or son. Spelled Ṭikhfa in Ibn al-Athīr's contents and Ṭaḥfa in al-ʿIqd al-Farīd's. Undated.","peopleIds":[],"politiesIds":["lakhmids"],"source":"https://almerja.com/more.php?idm=66589"},{"id":"year-of-elephant","year":570,"endYear":null,"title":"The Year of the Elephant","ar":"عام الفيل","evidence":"TRAD","dateCertainty":"contested","dateRange":[552,572],"estimated":true,"dateNote":"Contested in five directions across 552-572. The traditional 570-571 is a synchronism built to anchor a birth, and the one dated Abraha campaign northward, Ry 506 of 552, does not name Mecca.","placeId":"mecca","category":"battle","summary":"The tradition says Abraha marched north on Mecca with war elephants, took the Ṭāʾif road, lost a guide near al-Mughammas, and was turned back. The same year is given for Muḥammad's birth, and Meccan chronology is reckoned from it.","dispute":"Contested in at least five directions: the traditional c. 570–571; 568 or 569 from South Arabian finds; 552 on the strength of Ry 506, which Gajda accepts and which does not mention Mecca; 'one or two decades earlier than 570'; and 14 February 572, proposed by Zein and el-Wakil. The Arabic sources add a support the English ones do not carry — al-Masʿūdī puts the expedition in the year corresponding to the fortieth of Khusraw Anūshirwān's reign, that is 571 — and al-Zuhrī, transmitted by ʿAbd al-Razzāq al-Ṣanʿānī, has a tradition placing it before Muḥammad's father was born, which contradicts the 570 birth synchronism from inside the tradition. Abraha's epigraphic record stops at 559/560. A gap in the Arabic reference literature has to be stated here: the general Arabic works do not name CIH 541, do not mention the Murayghān inscriptions, and do not mention the year 552 at all — so the whole epigraphic side of the Year of the Elephant question is absent from the common Arabic reference shelf, and a reader working in Arabic has to go to DASI for it.","peopleIds":["abraha","muhammad"],"politiesIds":["himyar","quraysh"],"source":"https://en.wikipedia.org/wiki/Year_of_the_Elephant"},{"id":"muhammad-born","year":570,"endYear":null,"title":"Muḥammad born at Mecca","ar":"مولد محمد بن عبد الله","evidence":"TRAD","dateCertainty":"contested","dateRange":[552,572],"estimated":true,"dateNote":"Pegged to the Year of the Elephant, which this atlas dates across 552-572, so the birth year inherits that whole spread; 570 is the conventional synchronism, not a transmitted date.","placeId":"mecca","category":"birth-death","summary":"A posthumous son of ʿAbd Allāh ibn ʿAbd al-Muṭṭalib, of the Banū Hāshim of Quraysh, born at Mecca. The traditional birthday is 12 Rabīʿ al-Awwal, with 17 Rabīʿ al-Awwal also given. Meccan chronology is reckoned forward from this year, which is why the uncertainty in it propagates through everything dated by his age.","dispute":"The year rests on a synchronism with the Year of the Elephant, and that event is contested in five directions across 552-572 — including 552 on the strength of Ry 506, which does not mention Mecca, and al-Zuhrī's tradition placing the Elephant before ʿAbd Allāh was born, which contradicts the birth synchronism from inside the tradition. There is no inscriptional, archaeological or external documentary evidence for Mecca or Quraysh before 632; the whole Meccan record is literary and was written down about a century and a half later.","peopleIds":["muhammad","abd-allah-ibn-abd-al-muttalib","amina-bint-wahb","abd-al-muttalib"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"abd-allah-dies","year":570,"endYear":null,"title":"ʿAbd Allāh dies before his son is born","ar":"وفاة عبد الله بن عبد المطلب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[552,572],"estimated":true,"dateNote":"Dated only relative to the birth — about six months before it — so the year moves with a birth year that is itself contested across 552-572.","placeId":"mecca","category":"birth-death","summary":"ʿAbd Allāh ibn ʿAbd al-Muṭṭalib died away from Mecca on a trading journey, leaving Āmina bint Wahb pregnant. The child was born into his grandfather's household rather than his father's.","dispute":"No source dates the death independently; it is told as a measured interval before the birth. Al-Zuhrī's tradition putting the Year of the Elephant before ʿAbd Allāh was born cannot be reconciled with the standard scheme that makes the Elephant year the birth year.","peopleIds":["abd-allah-ibn-abd-al-muttalib","amina-bint-wahb","muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"dahis-muraqqab","year":571,"endYear":null,"title":"Yawm al-Muraqqab","ar":"يوم المريقب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"An index entry with no narrative and no date; the year holds its place in the sequence.","placeId":"al-muraqqab","category":"battle","summary":"First day in the only ordered day-list the sources give for this war: ʿAbs over Fazāra.","dispute":"An index entry with no narrative recovered. Undated.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"sayf-vassal-king","year":571,"endYear":575,"title":"Sayf ibn Dhī Yazan rules as Persia's vassal","ar":"حكم سيف بن ذي يزن","evidence":"EXT","dateCertainty":"approximate","dateRange":[571,578],"estimated":false,"dateNote":"His rule is given as 571-575, and the killing as 575 or 578.","placeId":"sanaa","category":"politics","summary":"The Ḥimyarite heir who had gone begging first to Byzantium, then to al-Ḥīra, then to Khusraw's own court came home as a king who owed tribute. He was stabbed to death by an Abyssinian servant.","dispute":"Death given as 575 or 578. There is also a chronological problem on the record: he is said to have been brokered by the Lakhmid al-Nuʿmān III, whose reign begins after Sayf's death.","peopleIds":["sayf-ibn-dhi-yazan","wahriz","khusraw-i"],"politiesIds":["sasanian-yemen","sasanians"],"source":"https://en.wikipedia.org/wiki/Sasanian_Yemen"},{"id":"dam-final-breach","year":572,"endYear":null,"title":"The dam is left unrepaired","ar":"انهيار سد مأرب","evidence":"RECON","dateCertainty":"contested","dateRange":[570,575],"estimated":true,"dateNote":"Given as 570 or 575, with no source behind either figure.","placeId":"marib-dam","category":"disaster","summary":"The barrage was overtopped and this time nobody fixed it. What the inscriptions show is not one catastrophic flood but a six-hundred-year maintenance cycle ending in the collapse of the political capacity to repair — exactly as Yemen changed hands from Aksum to Persia.","dispute":"Given as 570 or 575 with no source for either figure. The Qurʾān's flood of the dam is read against this, though some scholars tie the scriptural passage to a breach around 145 BCE instead. The often-quoted figure of up to 50,000 migrants is flagged as uncited and should not be reported as fact.","peopleIds":[],"politiesIds":["sasanian-yemen","himyar"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"justin-assassination-plot","year":572,"endYear":null,"title":"Justin II orders a Ghassanid king killed","ar":"محاولة قتل المنذر الغساني","evidence":"EXT","dateCertainty":"fixed","dateRange":[572,572],"estimated":false,"dateNote":null,"placeId":"constantinople","category":"politics","summary":"The emperor ordered al-Mundhir assassinated. Al-Mundhir found out, and broke with the empire his father had served for forty years.","dispute":null,"peopleIds":["al-mundhir-ghassanid","justin-ii"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Harith"},{"id":"dahis-dhu-husa","year":573,"endYear":null,"title":"Yawm Dhū Ḥusā","ar":"يوم ذي حسى","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"An index entry with no narrative and no date; the year holds its place in the sequence.","placeId":"dhu-husa","category":"battle","summary":"Dhubyān over ʿAbs — the one clear ʿAbs defeat in the sequence, and still being thrown at them in verse after al-Habāʾa.","dispute":"An index entry with no narrative recovered. Undated.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"dahis-yamariyya","year":575,"endYear":null,"title":"Yawm al-Yaʿmariyya","ar":"يوم اليعمرية","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"An index entry with no narrative, no location and no date; the year holds its place in the sequence.","placeId":"najd","category":"battle","summary":"An ʿAbs win sitting between Dhū Ḥusā and al-Habāʾa. It is missing from most popular lists of the war entirely.","dispute":"An index entry with no narrative recovered, and no location given. Undated.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"ghassanids-sack-hira","year":575,"endYear":null,"title":"The Ghassanids sack al-Ḥīra","ar":"إحراق الحيرة","evidence":"EXT","dateCertainty":"fixed","dateRange":[575,575],"estimated":false,"dateNote":null,"placeId":"hira","category":"battle","summary":"In the same year they were reconciled with Constantinople, the Ghassanids burned the Lakhmid capital.","dispute":null,"peopleIds":["al-mundhir-ghassanid"],"politiesIds":["ghassanids","lakhmids"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_572%E2%80%93591"},{"id":"rusafa-reconciliation","year":575,"endYear":null,"title":"Reconciliation at Sergiopolis","ar":"الصلح في الرصافة","evidence":"EXT","dateCertainty":"fixed","dateRange":[575,575],"estimated":false,"dateNote":"Dated 575 in the Greek record; the Ruṣāfa inscription itself is undated.","placeId":"rusafa","category":"politics","summary":"Three years of estrangement ended at the shrine of St Sergius in the desert, brokered by a Byzantine general. Al-Mundhir commissioned a building there, which a Greek inscription still identifies.","dispute":"The Ruṣāfa inscription itself is undated in every source reached.","peopleIds":["al-mundhir-ghassanid"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Harith"},{"id":"dahis-habaa","year":577,"endYear":null,"title":"Yawm al-Habāʾa","ar":"يوم الهباءة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated; the year holds the day's place in al-ʿIqd al-Farīd's ordering.","placeId":"al-habaa","category":"battle","summary":"They met in summer heat beside the well, fought from morning to midday, and the heat parted them. Ḥudhayfa, suffering in his thighs, fell back to the water as Qays had predicted, and ʿAbs followed the hoofprints. Ḥamal asked his men whom they would least like to see coming; they named Qays and al-Rabīʿ, and those were the two who came. Ḥamal begged by God and by kinship and Qays refused, answering their cries for help with a taunting 'here I am' — an echo of children who had called out as they were killed. A broad-bladed spear broke the spine, and swords finished it. About four hundred dead on the Dhubyān side against twenty of ʿAbs. Fazāra called the day the Perdition instead.","dispute":"Undated. The ʿIqd al-Farīd text does not name the man killed; two almerja texts state directly that Qarāwash ibn ʿAmr killed Ḥudhayfa and that his brother Ḥamal and his son died there too. The mutilation of the body is reported as a return of what he had done to boys earlier.","peopleIds":["hudhayfa","hamal","qays-ibn-zuhayr","al-rabi-ibn-ziyad","shaddad","qarawash"],"politiesIds":[],"source":"https://shamela.ws/book/23789/1834"},{"id":"wahriz-returns","year":577,"endYear":null,"title":"Wahrīz comes back with four thousand men","ar":"عودة وهرز","evidence":"EXT","dateCertainty":"contested","dateRange":[575,578],"estimated":true,"dateNote":"Dated 575 or 578; the sources do not choose.","placeId":"sanaa","category":"battle","summary":"After the vassal king was murdered the Persian general returned, cleared the Ethiopians out for good, and ruled as governor himself, installing Sayf's son as a figurehead.","dispute":"Dated 575 or 578; the sources do not choose.","peopleIds":["wahriz"],"politiesIds":["sasanian-yemen","sasanians","aksum"],"source":"https://en.wikipedia.org/wiki/Sasanian_Yemen"},{"id":"amina-dies","year":577,"endYear":null,"title":"Āmina bint Wahb dies","ar":"وفاة آمنة بنت وهب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[558,578],"estimated":true,"dateNote":"Counted as her son's sixth year, so the year moves with a birth placed anywhere in 552-572.","placeId":"mecca","category":"birth-death","summary":"Āmina died when her son was about six, leaving him an orphan on both sides. The tradition has her die on the road back from a visit to her late husband's kin at Yathrib.","dispute":"Dated only by the boy's age. Nothing external touches her at all.","peopleIds":["amina-bint-wahb","muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"abd-al-muttalib-guardianship","year":577,"endYear":579,"title":"ʿAbd al-Muṭṭalib's guardianship, then Abū Ṭālib's","ar":"كفالة عبد المطلب ثم أبي طالب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[558,580],"estimated":true,"dateNote":"A two-year span counted as the boy's sixth to eighth years, so it slides with a birth placed anywhere in 552-572; no source dates ʿAbd al-Muṭṭalib's own floruit at all.","placeId":"mecca","category":"politics","summary":"The orphan passed to his grandfather ʿAbd al-Muṭṭalib, head of the Banū Hāshim, and on the old man's death about two years later to his uncle Abū Ṭālib. That transfer is what put him under Hāshimī protection for the next forty years, and the protection is the thing the Meccan opposition later had to work around.","dispute":"Both the span and ʿAbd al-Muṭṭalib's death are arithmetic off the contested birth year. The research found no date at all for ʿAbd al-Muṭṭalib's floruit, and the Meccan genealogical chronology behind him is internally contradictory by a full century.","peopleIds":["abd-al-muttalib","abu-talib","muhammad"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"hatim-dies","year":578,"endYear":null,"title":"Death of Ḥātim al-Ṭāʾī","ar":"وفاة حاتم الطائي","evidence":"TRAD","dateCertainty":"contested","dateRange":[552,580],"estimated":false,"dateNote":"The 578 date is from Kitāb al-Aghānī alone, and another tradition puts his death in the year of Muḥammad's birth.","placeId":"tuwarin","category":"birth-death","summary":"The chief of Ṭayyiʾ who gave away everything but his mount and his weapons died and was buried near Ḥāʾil. 'More generous than Ḥātim' is still a living proverb. Ibn ʿAbd Rabbih counted him one of the three most generous men of the Jāhiliyya, with Kaʿb ibn Māma and Harim ibn Sinān.","dispute":"The 578 date comes from Kitāb al-Aghānī alone. Another tradition puts his death in the year of Muḥammad's birth, and d'Herbelot reports the tomb somewhere else entirely. No birth date exists.","peopleIds":["hatim-al-tai"],"politiesIds":["lakhmids"],"source":"https://en.wikipedia.org/wiki/Hatim_al-Tai"},{"id":"adi-embassy","year":579,"endYear":null,"title":"ʿAdī ibn Zayd's embassy to Constantinople","ar":"سفارة عدي بن زيد","evidence":"TRAD","dateCertainty":"fixed","dateRange":[579,579],"estimated":false,"dateNote":"A court record under Hormizd IV. The year is transmitted by the Arabic tradition, not checked externally.","placeId":"constantinople","category":"politics","summary":"The Sasanian king sent his Arab-affairs secretary — a Nestorian Christian of al-Ḥīra, raised at the Persian court, fluent in Arabic and Persian and probably Syriac — to the Byzantine capital. He came back with books.","dispute":null,"peopleIds":["adi-ibn-zayd"],"politiesIds":["lakhmids","sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Adi_ibn_Zayd"},{"id":"dahis-faruq","year":579,"endYear":null,"title":"Yawm al-Farūq","ar":"يوم الفروق","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated, and al-Khāqānī files al-Farūq as a Qays-against-Tamīm day instead; the year holds its place in the sequence.","placeId":"al-faruq","category":"battle","summary":"ʿAbs defeated a Kindite leader and the people of Hajar.","dispute":"Al-Khāqānī's list instead makes al-Farūq a Qays-against-Tamīm day, which conflicts with reading it inside the Dāḥis cycle. The name has probably been reused for more than one engagement. Undated.","peopleIds":[],"politiesIds":["kinda"],"source":"https://almerja.com/more.php?idm=66592"},{"id":"rahrahan","year":579,"endYear":null,"title":"Yawm Raḥraḥān","ar":"يوم رحرحان","evidence":"TRAD","dateCertainty":"legendary","dateRange":[550,601],"estimated":true,"dateNote":"Undated; placed about a year before Shiʿb Jabala, which is the only link the sources give.","placeId":"rahrahan","category":"battle","summary":"Banū ʿĀmir and a Lakhmid column came to the nearest waters of Banū Dārim. A woman who saw the armies told Zurāra who the commanders were, and he got his family and herds away. Banū ʿĀmir took his son Maʿbad, who stayed their prisoner until he died — which is the whole reason for the war that followed.","dispute":"Undated; placed here only because it is said to be about a year before Shiʿb Jabala. The victor is contested: Ibn al-Athīr has Banū ʿĀmir and the Lakhmids routed when Qays ibn Zuhayr arrived, al-ʿIqd al-Farīd's index tags the day for ʿĀmir over Tamīm, and al-Qalqashandī's list suggests the name covers two engagements.","peopleIds":["zurara","mabad","qays-ibn-zuhayr","al-ahwas"],"politiesIds":["lakhmids"],"source":"https://almerja.com/reading.php?idm=66646"},{"id":"al-waqit","year":580,"endYear":null,"title":"Yawm al-Waqīṭ","ar":"يوم الوقيط","evidence":"TRAD","dateCertainty":"legendary","dateRange":[500,620],"estimated":true,"dateNote":"Undated and unlocated; the year is a placement inside the period.","placeId":"najd","category":"battle","summary":"Bakr of Rabīʿa over Tamīm. Al-ʿIqd al-Farīd heads a whole cluster of Bakr-over-Tamīm days with it.","dispute":"Undated and unlocated. Fajernet gives the tribes without naming a winner.","peopleIds":[],"politiesIds":[],"source":"https://almerja.com/more.php?idm=66589"},{"id":"shib-jabala","year":580,"endYear":null,"title":"Yawm Shiʿb Jabala","ar":"يوم شعب جبلة","evidence":"RECON","dateCertainty":"contested","dateRange":[551,602],"estimated":true,"dateNote":"A spread of about sixty years once both Arabic reckonings are admitted - 551, 553, al-ʿIqd al-Farīd's 'forty years before Islam, the year the Prophet was born' which is c. 570, al-Khāqānī's 'fifty-seven years before Islam' which is c. 565, Caskel's c. 580 and Bosworth's 582-602 - and only c. 580 fits al-Mundhir IV being among the leaders.","placeId":"shib-jabala","category":"battle","summary":"Laqīṭ ibn Zurāra called in his allies to avenge his brother: all of Ghaṭafān answered except the Banū Badr, all of Tamīm except the Banū Saʿd, the Banū Asad came in on an old pact, al-Jawn al-Kalbī king of Hajar sent his two sons Muʿāwiya and ʿAmr, and al-Nuʿmān sent his half-brother Ḥassān ibn Barra. The muster was set for the turn of the year from Yawm Raḥraḥān. ʿĀmir and ʿAbs took the blind pass on Qays ibn Zuhayr's advice, moved their women and goods inside, and left the camels hobbled, unwatered and unfed for twelve nights. Then they cut the hobbles. The herd's roar in the gorge made the besiegers think the mountain had come down on them, and the footmen came out holding the camels' tails, and the horse behind the footmen. Laqīṭ was killed; Ḥājib ibn Zurāra was taken, and Sinān ibn Abī Ḥāritha, whose forelock ʿUrwa al-Raḥḥāl cut before letting him go, and ʿAmr ibn ʿAmr ibn ʿUdus. Kindite power in northern Arabia was finished.","dispute":"The field's best demonstration of how bad the chronology is. The two oldest Arabic sources give different counts of years before Islam and the English version carried only the second: al-ʿIqd al-Farīd says 'forty years before Islam, and it is the year in which the Prophet was born', which is about 570 and is the most widely repeated figure, while al-Khāqānī's list says 'fifty-seven years before Islam', about 565. With 551, 553, Caskel's c. 580 and Bosworth's placement under al-Nuʿmān III (582–602), the spread for one famous battle runs to roughly sixty years rather than fifty. Worse, the data contradict most of the options: al-Mundhir IV (r. 575–580) among the leaders fits Caskel's c. 580 and nothing else. And the Arabic text contradicts itself inside one passage — al-ʿIqd al-Farīd dates the day to about 570 and then names among its commanders al-Nuʿmān ibn al-Mundhir (580–602), who sent his half-brother Ḥassān ibn Barra, a king who did not reign until ten years later. Recommended handling: c. 580 internally, with 570 as the folk date characters cite, since 570 is exactly what al-ʿIqd al-Farīd says.","peopleIds":["laqit","qays-ibn-zuhayr","al-ahwas","al-mundhir-iv"],"politiesIds":["kinda","lakhmids"],"source":"https://en.wikipedia.org/wiki/Battle_of_Shi%27b_Jabala"},{"id":"dahis-qatan","year":581,"endYear":null,"title":"Yawm Qaṭan","ar":"يوم قطن","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"An index entry with no narrative, no location and no date; the year holds its place in the sequence.","placeId":"najd","category":"battle","summary":"A day in the Dāḥis sequence known only from the ordered index.","dispute":"Index entry only: no narrative, no location, no date.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"dhi-najab","year":581,"endYear":null,"title":"Yawm Dhū Najab","ar":"يوم ذي نجب","evidence":"TRAD","dateCertainty":"contested","dateRange":[552,603],"estimated":true,"dateNote":"Dated only as one year after Shiʿb Jabala, per al-Khāqānī. That relative link is firmer than either absolute date.","placeId":"dhi-najab","category":"battle","summary":"A year after Shiʿb Jabala the Yarbūʿ clan of Tamīm took their revenge, killed Ibn Kabsha and cut up several Kilābī chiefs.","dispute":"Dated only relative to Shiʿb Jabala — one year after, per al-Khāqānī, who gives Jabala as 57 years before Islam. That relative link is firmer than either absolute date.","peopleIds":[],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Battle_of_Shi%27b_Jabala"},{"id":"numan-iii-accession","year":581,"endYear":602,"title":"Al-Nuʿmān III at al-Ḥīra","ar":"تولي النعمان الثالث","evidence":"TRAD","dateCertainty":"contested","dateRange":[580,582],"estimated":true,"dateNote":"Given as both 580 and 582 inside a single reference article; 581 is a midpoint of the two, and endYear carries the reign to the fixed 602 deposition rather than to the 595 one passage of the same article gives.","placeId":"hira","category":"politics","summary":"The last Lakhmid king took the throne. He converted openly to Nestorian Christianity, probably after the peace of 591, and al-Ḥīra became a major church centre with a bishopric and missions down the Gulf.","dispute":"His accession is given as both 580 and 582 inside a single reference article, and his reign end as 595 in one passage and 602 in another.","peopleIds":["al-numan-iii"],"politiesIds":["lakhmids","sasanians"],"source":"https://en.wikipedia.org/wiki/Al-Nu%27man_III_ibn_al-Mundhir"},{"id":"mundhir-ghassanid-exiled","year":582,"endYear":null,"title":"Al-Mundhir arrested and exiled to Sicily","ar":"نفي المنذر الغساني","evidence":"EXT","dateCertainty":"contested","dateRange":[581,582],"estimated":false,"dateNote":"Dated 581 in one place and 582 in another.","placeId":"constantinople","category":"politics","summary":"After a failed campaign on Ctesiphon, Maurice and al-Mundhir each blamed the other. Al-Mundhir was arrested, held in Constantinople, and sent to Sicily once Maurice was emperor. A 13th-century Syriac chronicle says he came home after Maurice fell in 602.","dispute":"Dated 581 in one place and 582 in another, within the same cluster of sources.","peopleIds":["al-mundhir-ghassanid","maurice"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Harith"},{"id":"dahis-ghadir-qalha","year":583,"endYear":null,"title":"Yawm Ghadīr Qalhā","ar":"يوم غدير قلهى","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"An index entry with no narrative, no location and no date; the year holds its place in the sequence.","placeId":"najd","category":"battle","summary":"A day at a rain pool, known only from the ordered index.","dispute":"Index entry only: no narrative, no location, no date.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"ghassanid-phylarchate-broken","year":584,"endYear":null,"title":"The Ghassanid phylarchate breaks up","ar":"تفتت الإمارة الغسانية","evidence":"EXT","dateCertainty":"fixed","dateRange":[584,584],"estimated":false,"dateNote":null,"placeId":"al-jabiya","category":"politics","summary":"Byzantium arrested al-Nuʿmān VI and tried him for treason, and the confederation came apart — split, one source says, into fifteen member tribes. Maurice is reported to have patched it back together two or three years later because the empire could not hold the desert without it.","dispute":null,"peopleIds":["al-numan-vi","maurice"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Ghassanids"},{"id":"dahis-raqam","year":585,"endYear":null,"title":"Yawm al-Raqam","ar":"يوم الرقم","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated, and the day is not an ʿAbs-against-Dhubyān fight at all; the year only holds its place in the index.","placeId":"al-raqam","category":"battle","summary":"Ghaṭafān over Banū ʿĀmir.","dispute":"Filed inside the Dāḥis cycle in the indexes but it is not an ʿAbs-against-Dhubyān day at all. Al-Khāqānī has it as Banū Fazāra against Banū ʿĀmir. Another reused name. Undated.","peopleIds":[],"politiesIds":[],"source":"https://shamela.ws/book/23789/1829"},{"id":"fijar-trigger","year":585,"endYear":null,"title":"Al-Barrāḍ breaks the sacred month","ar":"مقتل عروة الرحال","evidence":"TRAD","dateCertainty":"contested","dateRange":[566,592],"estimated":true,"dateNote":"The whole cycle is dated only by Muḥammad's reported age at it, given anywhere from 14 to 20.","placeId":"ukaz","category":"battle","summary":"Al-Barrāḍ ibn Qays, a Kinānī man expelled by his own tribe, ambushed ʿUrwa al-Raḥḥāl of Banū ʿĀmir during a sacred month and seized the Lakhmid king's caravan. That is the sacrilege the Fijār wars are named for.","dispute":"Dated only by Muḥammad's reported age at the wars, given anywhere from 14 to 20, which puts the cycle in the 580s–590s. Landau-Tasseron reads the cause differently: Quraysh and ʿĀmir shared an interest in Lakhmid caravans, and al-Barrāḍ's branch was hostile to the Jaʿfar clan over a cancelled protection covenant.","peopleIds":["al-barrad","urwa-al-rahhal","al-numan-iii"],"politiesIds":["quraysh","lakhmids"],"source":"https://en.wikipedia.org/wiki/Fijar_Wars"},{"id":"fijar-nakhla","year":586,"endYear":null,"title":"Yawm Nakhla","ar":"يوم نخلة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[566,592],"estimated":true,"dateNote":"Undated. The order of the eight days is firmer than any of their years.","placeId":"nakhla","category":"battle","summary":"Hawāzin fell on Quraysh and Kināna, who got away into the sanctuary at nightfall. Usually counted the fourth day of the Fijār, after three brawls that the sources count sometimes as one war and sometimes as three.","dispute":"Undated. The order of the eight days is firmer than any of their years.","peopleIds":["abu-bara"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Fijar_Wars"},{"id":"dahis-araair","year":587,"endYear":null,"title":"Yawm ʿArāʿir","ar":"يوم عراعر","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated, and the two mirrors of the same source disagree about which tribe lost; the year holds its place in the sequence.","placeId":"araair","category":"battle","summary":"Masʿūd ibn Miṣād, chief of Kalb, was killed here and Kalb routed.","dispute":"One almerja text says that; the mirror of the same text says Fazāra fought ʿAbs here and Fazāra won. The identity of the losing tribe at ʿArāʿir is genuinely contested. Undated.","peopleIds":[],"politiesIds":[],"source":"https://almerja.com/more.php?idm=66592"},{"id":"fijar-shamta","year":587,"endYear":null,"title":"Yawm Shamṭa","ar":"يوم شمطة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[566,592],"estimated":true,"dateNote":"Undated. The order of the eight days is firmer than any of their years.","placeId":"shamta","category":"battle","summary":"A Fijār day near ʿUkāẓ the following year. Hawāzin won.","dispute":"Undated.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Fijar_Wars"},{"id":"fijar-abla","year":588,"endYear":null,"title":"Yawm al-ʿAblāʾ","ar":"يوم العبلاء","evidence":"TRAD","dateCertainty":"legendary","dateRange":[566,592],"estimated":true,"dateNote":"Undated. The order of the eight days is firmer than any of their years.","placeId":"al-abla","category":"battle","summary":"Fighting at the fairground itself. Hawāzin won again.","dispute":"Undated.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Fijar_Wars"},{"id":"fijar-ukaz","year":588,"endYear":null,"title":"Yawm ʿUkāẓ","ar":"يوم عكاظ","evidence":"TRAD","dateCertainty":"legendary","dateRange":[566,592],"estimated":true,"dateNote":"Undated. The order of the eight days is firmer than any of their years.","placeId":"ukaz","category":"battle","summary":"Also called Yawm Sharab. The one day of the whole cycle that Quraysh and Kināna won.","dispute":"Undated.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Fijar_Wars"},{"id":"dahis-dhat-al-jarajir","year":589,"endYear":null,"title":"Yawm Dhāt al-Jarājir","ar":"يوم ذات الجراجر","evidence":"TRAD","dateCertainty":"legendary","dateRange":[560,609],"estimated":true,"dateNote":"Undated and unlocated; the year holds its place in the sequence.","placeId":"najd","category":"battle","summary":"Two consecutive days of fighting between ʿAbs and Dhubyān, and the one day on which the sources specifically single out ʿAntara's courage.","dispute":"Undated, and no location given. The sources are notably sparse on ʿAntara generally: he is attested composing an elegy for Mālik ibn Zuhayr and as the hero of this day, and that is nearly all.","peopleIds":["antara"],"politiesIds":[],"source":"https://almerja.com/more.php?idm=66592"},{"id":"fijar-hurayra","year":589,"endYear":null,"title":"Yawm al-Ḥurayra and the peace","ar":"يوم الحريرة","evidence":"TRAD","dateCertainty":"contested","dateRange":[584,592],"estimated":false,"dateNote":"Al-Khāqānī's list gives 589 for the end of Fijār II - the only CE date anywhere in the minor-days corpus for this cycle.","placeId":"al-hurayra","category":"battle","summary":"The eighth and last day, on the lava field near ʿUkāẓ, won by Hawāzin. A few skirmishes and then peace. Hawāzin had taken four days, Quraysh one, and the rest were brawls.","dispute":"Al-Khāqānī's list gives 589 as the end of Fijār II — the single CE date anywhere in the minor-days corpus for this cycle. Everything else is dated off Muḥammad's age.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://almerja.com/more.php?idm=66589"},{"id":"numan-shelters-khusraw","year":590,"endYear":591,"title":"Al-Nuʿmān III shelters a fugitive king","ar":"إيواء النعمان لخسرو","evidence":"EXT","dateCertainty":"fixed","dateRange":[590,591],"estimated":false,"dateNote":"The flight and the fighting at al-Nahrawān run across 590-591.","placeId":"nahrawan","category":"politics","summary":"Khusraw II, driven out by the usurper Bahrām Chōbīn, was sheltered by the Lakhmid king and fought beside him at al-Nahrawān. Maurice backed the restoration. Twelve years later Khusraw destroyed him.","dispute":null,"peopleIds":["al-numan-iii","khusraw-ii","maurice"],"politiesIds":["lakhmids","sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Nu%27man_III_ibn_al-Mundhir"},{"id":"sullan-ii","year":590,"endYear":null,"title":"Yawm al-Sullān II, also Qāʿ al-Qurayṭayn","ar":"يوم السلان الثاني (قاع القُرَيتَين / يوم السُّوبان)","evidence":"TRAD","dateCertainty":"legendary","dateRange":[580,602],"estimated":true,"dateNote":"Undated; the window is al-Nuʿmān III's reign.","placeId":"al-sullan","category":"battle","summary":"Banū ʿĀmir seized the trading caravan al-Nuʿmān sent to ʿUkāẓ every year, so he raised an army under his half-brother Wabra and the clans of Tamīm. Quraysh got word and ʿAbd Allāh ibn Judʿān warned Banū ʿĀmir, who were ready. Wabra was captured in the charge and the army broke. The old man Ḍirār ibn ʿAmr forbade his men to flee and held the command with his sons shielding him while Abū Barāʾ knocked him down again and again. Abū Barāʾ asked him to point out a man worth ransoming; Ḍirār pointed to Ḥubaysh ibn Dalaf, who was thin and black and looked like a slave, so Abū Barāʾ thought he had been tricked — and Ḥubaysh ransomed himself for four hundred camels. Wabra went for a thousand camels and a horse, which made his captor rich.","dispute":"Three names for one day: al-Sullān II, Yawm al-Sūbān, and Qāʿ al-Qurayṭayn. The Arabic sources confirm the third, which resolves the otherwise unidentified 'Yawm al-Qurnatayn' — it is Qāʿ al-Qurayṭayn, an alternative name for this day, so no separate battle needs to be posited. Undated; the window is al-Nuʿmān III's reign. The Arabic criticism of the secondary literature belongs here: Jawād ʿAlī confused the two Sullāns and tied Khazāz to this one, so dated Khazāz to al-Nuʿmān's time, which is a serious error; al-Maydānī confused them too, putting ʿĀmir's title 'Mulāʿib al-Asinna' at al-Sullān I when it was earned here, and assigning to al-Sullān a verse of Zuhayr ibn Janāb that belongs to Khazāz.","peopleIds":["al-numan-iii","abu-bara","dirar","wabra"],"politiesIds":["lakhmids"],"source":"http://mdmf1439.blogspot.com/2018/09/blog-post_8.html"},{"id":"peace-591","year":591,"endYear":null,"title":"The treaty of 591","ar":"صلح ٥٩١","evidence":"EXT","dateCertainty":"fixed","dateRange":[591,591],"estimated":false,"dateNote":null,"placeId":"dara","category":"politics","summary":"Khusraw II returned Dara and Martyropolis and the Caucasus was repartitioned — and for the first time Byzantium paid nothing at all. A real shift in the balance between the two empires, and the last peace before the war that ruined both.","dispute":null,"peopleIds":["khusraw-ii","maurice"],"politiesIds":["byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_572%E2%80%93591"},{"id":"numan-converts","year":592,"endYear":null,"title":"Al-Nuʿmān III converts","ar":"إسلام النعمان للنصرانية","evidence":"TRAD","dateCertainty":"approximate","dateRange":[591,600],"estimated":true,"dateNote":"Dated only by inference from the 591 peace.","placeId":"hira","category":"religion","summary":"The last Lakhmid king became the first of his line to convert openly to Nestorian Christianity, probably after the peace of 591, with the bishop of al-Ḥīra instrumental. The Persians disapproved and tried to make him go back.","dispute":"Dated only by inference from the 591 peace. One tradition instead makes Imruʾ al-Qays I the first Lakhmid convert, centuries earlier.","peopleIds":["al-numan-iii"],"politiesIds":["lakhmids","sasanians"],"source":"https://en.wikipedia.org/wiki/Al-Nu%27man_III_ibn_al-Mundhir"},{"id":"hilf-al-fudul","year":595,"endYear":null,"title":"Ḥilf al-Fuḍūl","ar":"حلف الفضول","evidence":"TRAD","dateCertainty":"legendary","dateRange":[580,605],"estimated":true,"dateNote":"Undated in every source reached, and the causal chain from the Fijār that would date it is unverified.","placeId":"mecca","category":"politics","summary":"A compact among Meccan clans to stand up for the wronged man against his own kin's interest, sworn after an incident over a cheated outsider.","dispute":"Undated in every source reached, and the Fijār article does not connect the two, so any causal chain from the Fijār to this oath is unverified. The clans conventionally named — Hāshim, Zuhra, Asad, Taym, al-Muṭṭalib — are not confirmed by anything accessible.","peopleIds":[],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Quraysh"},{"id":"muhammad-marries-khadija","year":595,"endYear":null,"title":"Marriage to Khadīja bint Khuwaylid","ar":"زواج محمد بخديجة بنت خويلد","evidence":"TRAD","dateCertainty":"contested","dateRange":[577,597],"estimated":true,"dateNote":"Counted as his twenty-fifth year, so the conventional c. 595 slides with a birth placed anywhere in 552-572.","placeId":"mecca","category":"politics","summary":"Khadīja bint Khuwaylid, a twice-widowed Qurashī businesswoman of the Banū Asad who financed caravans, employed him on a Syrian journey and then married him. She was about forty by the tradition's reckoning and he about twenty-five. He took no other wife while she lived, and her money and standing are what freed him from working for a living.","dispute":"Dated only by his age. Her commercial role is repeated in every sīra account and examined in none: the searches turned up only devotional and popular treatments, no critical scholarship on whether a woman financing Meccan caravans is historically plausible.","peopleIds":["muhammad","khadija"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Muhammad"},{"id":"adi-strangled","year":600,"endYear":null,"title":"ʿAdī ibn Zayd strangled","ar":"مقتل عدي بن زيد","evidence":"TRAD","dateCertainty":"approximate","dateRange":[598,602],"estimated":true,"dateNote":"Placed c. 600, before al-Nuʿmān III's own fall in 602.","placeId":"hira","category":"birth-death","summary":"Al-Nuʿmān III had his chief councillor imprisoned and strangled on suspicion of plotting. ʿAdī's son had Khusraw's ear, and the killing is believed to have poisoned Sasanian-Lakhmid relations and helped bring the dynasty down. The third poet al-Ḥīra killed in forty-five years.","dispute":null,"peopleIds":["adi-ibn-zayd","al-numan-iii"],"politiesIds":["lakhmids","sasanians"],"source":"https://en.wikipedia.org/wiki/Adi_ibn_Zayd"},{"id":"al-safqa","year":600,"endYear":null,"title":"Yawm al-Ṣafqa and al-Mushaqqar","ar":"يوم الصفقة والمشقَّر","evidence":"TRAD","dateCertainty":"legendary","dateRange":[590,615],"estimated":true,"dateNote":"Undated in every source; the Arabic narrative fixes what happened without fixing when. Its only chronological handle is the Sasanian frame, Khusraw Parvīz's reign.","placeId":"al-mushaqqar","category":"battle","summary":"Tamīm raided a caravan of Khusraw's and robbed his envoys with it. The king called up Hawdha ibn ʿAlī al-Ḥanafī, his man in al-Yamāma, to punish them, and sent the Persian commander al-Mukaʿbir with a force of heavy cavalry. The two of them took the fortress of al-Mushaqqar in Hajar, and in a year of famine they put out word of grain for sale. The Tamīmīs were let in a few at a time and killed a few at a time. When it came out, a man of ʿAbs cut the chain off the door so that those standing at the gate got clear; al-Mukaʿbir shut the gates and killed everyone still inside. That shutting is the name — al-Ṣafqa, the closing. The day fell on Easter, so Hawdha asked for a hundred Tamīmī prisoners and let them go, and al-Aʿshā put it in a poem.","dispute":"The English version found only a one-line gloss in al-Khāqānī's list and filed the day under what could not be recovered; Tawfīq Barrū's Tārīkh al-ʿArab al-Qadīm gives the full narrative summarised here, so the day is solved. A different version in the same source's footnote, from Jād al-Mawlā, inverts it: Tamīm ambushed Hawdha in a valley and held him until three hundred camels were paid for his release. Ibn al-Athīr and al-ʿIqd al-Farīd both pair the day in one chapter with Yawm al-Kulāb II. Still undated, and al-Mushaqqar itself is unlocated.","peopleIds":["khusraw-ii","hawdha-ibn-ali","al-mukabbir","al-asha"],"politiesIds":["sasanians"],"source":"https://almerja.com/more.php?idm=66589"},{"id":"dahis-peace","year":600,"endYear":null,"title":"Harim ibn Sinān and al-Ḥārith ibn ʿAwf buy the peace","ar":"صلح داحس","evidence":"TRAD","dateCertainty":"legendary","dateRange":[590,610],"estimated":true,"dateNote":"The war's c. 568-609 bracket is Muir's reconstruction; no source dates the settlement.","placeId":"najd","category":"politics","summary":"Two cousins of Murra, Harim ibn Sinān and al-Ḥārith ibn ʿAwf, went into the mediation together and paid the blood-price of the dead on both sides out of their own property — some three thousand camels, handed over across three years. Forty years of killing between ʿAbs and Dhubyān stopped. Zuhayr named them both in his Muʿallaqa for it. Qays ibn Zuhayr would not go with his tribe: he said he would not be a Ghaṭafānī, turned Christian, wandered as far as Oman and lived as a monk there until a man of ʿAbd al-Qays killed him.","dispute":"The Arabic sources settle what the English reconstruction could not confirm and had marked unverified: Harim ibn Sinān and his cousin al-Ḥārith ibn ʿAwf entered the mediation together, carried the blood-money out of their own wealth at about three thousand camels over three years, and were praised by name in Zuhayr's Muʿallaqa for their stand on the war — figures, duration and amount all stated. The English version credited al-Ḥārith ibn ʿAwf alone, treated the Harim-blood-money-Muʿallaqa chain as unverified, and found Harim's father Sinān only as a failed coalition-builder on the opposing side; father and son on two sides of one matter is not a contradiction. The Arabic sources further correct the claim that Harim's brother Khārija carried the blood-money, which is not sound. Still undated: the war's conventional bracket of c. 568–609 is Sir William Muir's Victorian reconstruction, not a source date, and no source dates the settlement itself. Qays ibn Zuhayr's end is doubled — he went with ʿAbs to Dhubyān and the peace was made, or he refused, took the cross and died a monk's death in Oman.","peopleIds":["harim-ibn-sinan","al-harith-ibn-awf","zuhayr","qays-ibn-zuhayr"],"politiesIds":[],"source":"https://en.wikipedia.org
