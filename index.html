<title>Jāhiliyya Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed map under a fixed timeline rail, with a docked evidence panel
   that becomes a bottom sheet on phones. Palette from basalt, sand and oxidised bronze. */
:root{
  --bg:#e9e4d9; --panel:#f7f3ea; --panel2:#efe9dc; --fg:#241f18; --muted:#6d6555; --faint:#8e8674;
  --line:#d2c9b6; --line2:#bfb49c;
  --accent:#b45a2b; --accent2:#2b7f70;
  --sea:#b4c9d4; --sea2:#9db6c4; --land:#e0d3b1; --sand:#ecdcad; --sandline:#cbb98a;
  --ridge:#b09a74; --river:#6e9fb6; --coast:#9d8e73; --mapfg:#3c3528; --mapfaint:#7c7259;
  --epi:#1d7a68; --ext:#2c6a9e; --trad:#b06a1e; --recon:#7a6596;
  --shadow:0 1px 2px rgba(40,32,20,.12), 0 8px 24px rgba(40,32,20,.08);
  --f-display:'Amiri',Georgia,'Times New Roman',serif;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151a; --panel:#191e25; --panel2:#141920; --fg:#e9e3d5; --muted:#9a9282; --faint:#7b7466;
  --line:#2b323c; --line2:#3a434f;
  --accent:#d9814f; --accent2:#54b8a4;
  --sea:#0d1620; --sea2:#0a111a; --land:#3a3528; --sand:#453f2e; --sandline:#5a5240;
  --ridge:#6a6149; --river:#36687f; --coast:#6e6650; --mapfg:#d8d0bb; --mapfaint:#8d856e;
  --epi:#4fd0b4; --ext:#74b6ee; --trad:#e3a964; --recon:#b5a6dc;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151a; --panel:#191e25; --panel2:#141920; --fg:#e9e3d5; --muted:#9a9282; --faint:#7b7466;
  --line:#2b323c; --line2:#3a434f;
  --accent:#d9814f; --accent2:#54b8a4;
  --sea:#0d1620; --sea2:#0a111a; --land:#3a3528; --sand:#453f2e; --sandline:#5a5240;
  --ridge:#6a6149; --river:#36687f; --coast:#6e6650; --mapfg:#d8d0bb; --mapfaint:#8d856e;
  --epi:#4fd0b4; --ext:#74b6ee; --trad:#e3a964; --recon:#b5a6dc;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- timeline rail ---------- */
#rail{zoom:var(--us,1);background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:7px;position:relative;z-index:6}
.railtop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.yearbox{display:flex;align-items:baseline;gap:8px;margin-left:auto}
#yearNum{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.yearce{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
#eraName{font-size:12px;color:var(--muted);font-style:italic;max-width:42ch}

.trackwrap{position:relative;height:54px;margin-top:2px;direction:ltr}
#range,.ticks,#eras,#density{direction:ltr}
#eras,#density{position:absolute;left:0;right:0;width:100%}
#eras{top:0;height:17px}
#density{top:18px;height:19px}
#range{position:absolute;left:0;right:0;bottom:0;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none}
#range::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
#range::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
#range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2.5px solid var(--panel);box-shadow:0 0 0 1px var(--accent);margin-top:-6px}
#range::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:2.5px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.ticks{position:absolute;left:0;right:0;bottom:-3px;height:12px;pointer-events:none}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}

.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--fg);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--line2)}
.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:4px 8px;font-size:11.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ctl-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:1px}
:root[data-lang="ar"] #panel,:root[data-lang="ar"] #rail{direction:rtl}
:root[data-lang="ar"] .trackwrap,:root[data-lang="ar"] #range,:root[data-lang="ar"] .ticks{direction:ltr}
:root[data-lang="ar"] .ev .ar,:root[data-lang="ar"] #tip .ar,:root[data-lang="ar"] .arx{direction:rtl;text-align:start}
:root[data-lang="ar"] .ev .r1{flex-direction:row}
:root[data-lang="ar"] .brand,:root[data-lang="ar"] .phead,:root[data-lang="ar"] .detail h3,
:root[data-lang="ar"] .ev .ti,:root[data-lang="ar"] .sgrow .nm b{font-family:var(--f-display)}
:root[data-lang="ar"] .sect,:root[data-lang="ar"] .ctl-label,:root[data-lang="ar"] .dhead,
:root[data-lang="ar"] .tiptype{letter-spacing:0;text-transform:none;font-size:11.5px}
:root[data-lang="ar"] .yearce{letter-spacing:0}
:root[data-lang="ar"] #pbody{text-align:start}
:root[data-lang="ar"] .ptabs button{min-width:0;padding:9px 6px;font-size:12.5px}
:root[data-lang="ar"] .ev{border-left-width:1px;border-right-width:3px}
.sgwrap{position:relative;display:inline-block}
#search{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;color:var(--fg);width:195px}
#search::placeholder{color:var(--faint)}
#sg{position:absolute;top:calc(100% + 4px);left:0;width:300px;max-height:330px;overflow-y:auto;z-index:20;
  background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.sgrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.sgrow[aria-selected="true"],.sgrow:hover{background:var(--panel2)}
.sgrow .nm{min-width:0}
.sgrow .nm b{display:block;font-family:var(--f-display);font-size:14px;font-weight:400;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgrow .nm span{font-size:10.5px;color:var(--muted)}
.sgrow .arx{font-family:var(--f-display);font-size:13px;color:var(--muted);direction:rtl}
.sghead{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:7px 8px 3px}
.sgnone{padding:10px;color:var(--faint);font-size:12px;font-style:italic}
.ic{width:1em;height:1em;flex:0 0 auto;vertical-align:-.13em}
.ic-event{color:var(--accent)} .ic-person{color:var(--accent)} .ic-place{color:var(--fg)}
.ic-tribe{color:var(--accent2)} .ic-polity{color:var(--accent)}
.sgrow .ic{width:17px;height:17px}
.tiptype{display:flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.tiptype .ic{width:13px;height:13px}
.dhead{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.dhead .ic{width:14px;height:14px}
.chip .ic{width:13px;height:13px;margin-right:3px}
.ev .ti .ic{width:13px;height:13px;margin-right:3px;opacity:.7}
.symkey{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:12px}
.symkey svg{width:22px;height:18px}

/* ---------- body split ---------- */
#split{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
#mapwrap{position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;z-index:3}
.mapctl button{width:30px;height:30px;border-radius:7px;background:var(--panel);border:1px solid var(--line);
  font-size:15px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
#tip{position:absolute;pointer-events:none;z-index:5;background:var(--panel);border:1px solid var(--line2);
  border-radius:7px;padding:7px 10px;max-width:250px;box-shadow:var(--shadow);font-size:12px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip b{font-family:var(--f-display);font-size:14px;display:block}
#tip .ar{font-family:var(--f-display);font-size:14px;color:var(--muted);direction:rtl}
#tip p{margin:4px 0 0;color:var(--muted);line-height:1.4}

/* ---------- panel ---------- */
#panel{zoom:var(--us,1);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 0 auto;min-width:68px;background:none;border:0;padding:9px 9px;font-size:12px;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;letter-spacing:.03em}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
#pbody{overflow-y:auto;padding:14px 16px 28px;min-height:0;flex:1}
.phead{font-family:var(--f-display);font-size:17px;margin:0 0 2px}
.psub{font-size:11.5px;color:var(--muted);margin:0 0 12px}

.ev{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--panel2);
  cursor:pointer;display:grid;gap:3px;border-left-width:3px}
.ev:hover{border-color:var(--line2)}
.ev.now{background:color-mix(in srgb,var(--accent) 9%,var(--panel2));border-color:var(--accent)}
.ev .r1{display:flex;align-items:baseline;gap:8px}
.ev .yr{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ev .ti{font-family:var(--f-display);font-size:15px;line-height:1.25;min-width:0}
.ev .ar{font-family:var(--f-display);font-size:13px;color:var(--muted);direction:rtl;text-align:right}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:1.5px 5px;border-radius:3px;
  border:1px solid currentColor;font-weight:500;white-space:nowrap}
.t-EPI{color:var(--epi)} .t-EXT{color:var(--ext)} .t-TRAD{color:var(--trad)} .t-RECON{color:var(--recon)}
.cert{font-size:10.5px;color:var(--faint)}
.cert.contested,.cert.legendary{color:var(--trad)}
.where{font-size:11px;color:var(--muted)}

.detail h3{font-family:var(--f-display);font-size:20px;margin:6px 0 1px;line-height:1.2}
.detail .arbig{font-family:var(--f-display);font-size:17px;color:var(--muted);direction:rtl;margin-bottom:8px}
.detail p{margin:0 0 10px;max-width:62ch}
.detail .disp{background:color-mix(in srgb,var(--trad) 10%,transparent);border-left:2px solid var(--trad);
  padding:8px 10px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:10px}
.detail .disp b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--trad);margin-bottom:2px}
.detail .disp.basis{background:color-mix(in srgb,var(--accent2) 10%,transparent);border-left-color:var(--accent2)}
.detail .disp.basis b{color:var(--accent2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin-bottom:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.back{background:none;border:0;padding:0;color:var(--accent);font-size:12px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px;background:var(--panel2);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .ar{font-family:var(--f-display);color:var(--muted)}
.lifeline{display:grid;grid-template-columns:1fr;gap:5px}
.lf{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;font-size:11.5px;cursor:pointer}
.lf:hover .lf-n{color:var(--accent)}
.lf-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-bar{position:relative;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.lf-bar i{position:absolute;top:-1px;bottom:-1px;border-radius:4px;opacity:.8}
.lf-bar u{position:absolute;top:-3px;width:2px;height:13px;background:var(--accent)}
.sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);
  margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sect:first-child{margin-top:0}
.none{color:var(--faint);font-size:12.5px;font-style:italic}
.leg{display:grid;gap:7px;font-size:12px}
.leg div{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.filters{display:grid;gap:4px}
.filters label{display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer}
.filters input{accent-color:var(--accent);margin:0}
a{color:var(--accent)}
.foot{margin-top:20px;font-size:11px;color:var(--faint);line-height:1.5;border-top:1px solid var(--line);padding-top:10px}

/* ---------- map type ---------- */
.lbl{font-family:var(--f-display);fill:var(--mapfg);pointer-events:none;paint-order:stroke;
  stroke:var(--land);stroke-width:calc(2.8px*var(--k,1)*var(--ms,1));stroke-linejoin:round}
.z2{display:none}
#map.zoomed .z2{display:inline}
.lbl-region{font-size:calc(10px*var(--k,1)*var(--ms,1));letter-spacing:.2em;text-transform:uppercase;fill:var(--mapfaint);font-family:var(--f-ui)}
.lbl-region-ar{font-size:calc(10.5px*var(--k,1)*var(--ms,1));fill:var(--mapfaint)}
.lbl-sea{font-size:calc(8.4px*var(--k,1)*var(--ms,1));letter-spacing:.18em;text-transform:uppercase;fill:var(--river);font-family:var(--f-ui);stroke:none;font-style:italic}
.lbl-sea-ar{font-size:calc(9px*var(--k,1)*var(--ms,1));fill:var(--river);stroke:none;opacity:.85}
.lbl-ridge{font-size:calc(8.2px*var(--k,1)*var(--ms,1));letter-spacing:.12em;fill:var(--ridge);font-family:var(--f-ui)}
.lbl-place{font-size:calc(10.8px*var(--k,1)*var(--ms,1))}
.lbl-tribe{font-size:calc(10.5px*var(--k,1)*var(--ms,1));fill:var(--accent2);opacity:.92}
.lbl-polity{font-size:calc(13px*var(--k,1)*var(--ms,1));letter-spacing:.06em;font-weight:700;opacity:.95;stroke:var(--land);stroke-width:calc(3.2px*var(--k,1)*var(--ms,1))}
.hit{cursor:pointer}

@media (max-width:860px){
  #focuspill{top:10px;left:10px;bottom:auto;max-width:calc(100vw - 110px)}
  #focuspill b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app{grid-template-rows:auto minmax(0,1fr)}
  #split{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);position:relative}
  #mapwrap{grid-row:1;grid-column:1}

  /* the panel becomes a sheet over the map, dragged by its handle */
  #panel{position:absolute;left:0;right:0;bottom:0;top:0;border-left:0;
    border-top:1px solid var(--line2);border-radius:16px 16px 0 0;
    box-shadow:0 -2px 20px rgba(0,0,0,.18);
    transform:translateY(var(--sheet-y,84%));
    transition:transform .28s cubic-bezier(.22,.9,.3,1);
    will-change:transform}
  #panel.dragging{transition:none}
  #grip{display:block;flex:0 0 auto;padding:7px 0 3px;cursor:grab;touch-action:none;
    border-radius:16px 16px 0 0;background:var(--panel)}
  #grip:active{cursor:grabbing}
  #grip .bar{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto}
  #grip .peek{display:flex;align-items:baseline;gap:8px;padding:5px 16px 7px;font-size:12px;color:var(--muted)}
  #grip .peek b{font-family:var(--f-mono);font-size:16px;color:var(--fg);font-weight:500}
  #pbody{padding-bottom:40px}
  .mapctl{bottom:auto;top:10px;right:10px}
  #scalebar{bottom:auto;top:46px;left:12px}
  #zoomlvl{right:52px;top:48px;bottom:auto}

  /* rail: one compact row, the rest folded away */
  #rail{padding-block:7px 6px;gap:5px}
  .brand{font-size:15px}
  #eraName{display:none}
  #yearNum{font-size:23px}
  .trackwrap{height:40px}
  #eras{display:none}
  #density{top:4px;height:14px}
  .controls{gap:5px}
  .controls.folded > *{display:none}
  .controls.folded > .btn-more,.controls.folded > #play,.controls.folded > #langBtn,
  .controls.folded > .sgwrap,.controls.folded > #themeBtn{display:inline-flex}
  .btn-more{display:inline-flex}
  #search{width:100%;min-width:0}
  .sgwrap{flex:1 1 120px;min-width:0}
  #sg{width:min(300px,calc(100vw - 32px))}
  .ptabs button{min-width:62px;font-size:11.5px;padding:9px 7px}
}
@media (min-width:861px){ #grip{display:none} .btn-more{display:none} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

:root[data-contrast="high"]{
  --fg:#000; --muted:#333; --faint:#444; --line:#8c8577; --line2:#6d6658;
  --land:#fffaea; --sand:#ffe9a8; --sea:#45758c; --coast:#000; --mapfg:#000; --mapfaint:#2a2519;
  --river:#1d5570; --ridge:#7d6a44; --accent:#8a3b11; --accent2:#0d5d4f;
  --epi:#0a5b4c; --ext:#17497a; --trad:#8a4d06; --recon:#51387a;
}
:root[data-contrast="high"] .L-land path{stroke-width:.9}
:root[data-contrast="high"] .L-rivers path{stroke-width:.9}
:root[data-contrast="high"] .lbl{stroke-width:calc(4px*var(--k,1)*var(--ms,1))}
:root[data-contrast="high"] .lbl-region,:root[data-contrast="high"] .lbl-sea{letter-spacing:.1em}
@media (prefers-color-scheme:dark){:root[data-contrast="high"]:not([data-theme="light"]){
  --fg:#fff; --muted:#d8d2c4; --faint:#bdb7a8; --line:#5c6672; --line2:#8a93a0;
  --land:#1e1b10; --sand:#2c2714; --sea:#000; --coast:#f2e8c6; --mapfg:#fff; --mapfaint:#ded5b8;
  --river:#7cc6ee; --ridge:#b4a67e; --accent:#ffa368; --accent2:#6fe7cd;
  --epi:#7cf0d6; --ext:#9bd0ff; --trad:#ffc98a; --recon:#d3c6ff;
}}
:root[data-contrast="high"][data-theme="dark"]{
  --fg:#fff; --muted:#d8d2c4; --faint:#bdb7a8; --line:#5c6672; --line2:#8a93a0;
  --land:#1e1b10; --sand:#2c2714; --sea:#000; --coast:#f2e8c6; --mapfg:#fff; --mapfaint:#ded5b8;

<script id="data" type="application/json">{"meta":{"title":"Pre-Islamic Arabia: a mapped chronology, 300–640 CE","range":[300,640],"note":"Hand-built timeline and gazetteer for an interactive historical map, graded entry by entry: EPI is inscription-fixed, EXT is an external Greek/Syriac/Latin/Persian source, TRAD is later Arabic-Islamic tradition, RECON is modern scholarly reconstruction. Dates in the Arabian interior are almost all back-calculations, and the certainty fields say which. Every event also carries dateNote, one sentence on what the date actually rests on, and the boolean estimated: true where the year is a convention or a midpoint rather than a transmitted date, so an interface should render it as 'c. 570'. dateRange is the honest spread and endYear is set where the span itself is the event. The revision of 2026-10-19 also applied corrections from the Arabic-language sources where they contradict the English reconstruction this file was first built on; REVISION.ar.md lists them entry by entry, and arabia.ar.json carries the Arabic text of every record.","revised":"2026-10-19"},"places":[{"id":"hira","name":"al-Ḥīra","ar":"الحيرة","lat":31.9,"lon":44.42,"kind":"capital","from":300,"to":640,"blurb":"The Lakhmid capital on the desert edge, about 7 km east-south-east of Najaf, near present-day Kūfa and close to the Euphrates, with a branch of the river reaching it. The Arabic sources date the oldest documented mention of the place to 132 CE, when Palmyrene forces were stationed there — two centuries before the Lakhm shaykhs. A Christian Arab city of palaces, monasteries and salaried scribes, with Persian-language administration, a local Hīrī script that fed into Arabic, and children from the nearby villages sent in to learn writing. It killed three of its own poets in forty-five years.","coordConfidence":"approximate"},{"id":"khawarnaq","name":"al-Khawarnaq","ar":"الخورنق","lat":31.95,"lon":44.47,"kind":"site","from":400,"to":640,"blurb":"The most famous Lakhmid building, near al-Ḥīra, said to have been put up by al-Nuʿmān I to house the Sasanian prince Bahrām V, and its Roman architect Sinimmār said to have been killed so he could not build its like anywhere else. Al-Nuʿmān III received the poets of the Arabs here and held a literary session in it called al-Muʾtamar; the palace kept craftsmen on, and a line of ʿAmr ibn Kulthūm is cited for it. Unlocated.","coordConfidence":"guessed"},{"id":"ctesiphon","name":"Ctesiphon / al-Madāʾin","ar":"المدائن","lat":33.09,"lon":44.58,"kind":"capital","from":300,"to":640,"blurb":"The Sasanian capital on the Tigris, where Arab client kings came to petition, where ʿAdī ibn Zayd was schooled, and where the True Cross was carried in 614. Al-Nuʿmān III was seized here in 602.","coordConfidence":"exact"},{"id":"khanaqin","name":"Khānaqīn","ar":"خانقين","lat":34.35,"lon":45.39,"kind":"town","from":300,"to":640,"blurb":"A Zagros-foothill town where Khusraw II imprisoned the last Lakhmid king after deposing him. Al-Nuʿmān III is said to have died here of plague.","coordConfidence":"approximate"},{"id":"nahrawan","name":"al-Nahrawān","ar":"النهروان","lat":33.3,"lon":44.9,"kind":"battlefield","from":580,"to":640,"blurb":"Canal country east of Ctesiphon where al-Nuʿmān III fought beside the fugitive Khusraw II against the usurper Bahrām Chōbīn.","coordConfidence":"guessed"},{"id":"dhi-qar","name":"Dhū Qār","ar":"ذو قار","lat":31.05,"lon":46.26,"kind":"battlefield","from":590,"to":640,"blurb":"The watering place where Bakr ibn Wāʾil beat a Sasanian column. Where it was is genuinely disputed: the Arabic sources put it at Ṭarīf, south of Medina in the north of the peninsula, while the usual placement in southern Iraq west of the Euphrates is an inference from the name of the modern Iraqi governorate. No source identifies the site. The coordinates here follow the common Iraqi placement and should be read as a guess with a rival candidate a thousand kilometres away.","coordConfidence":"guessed"},{"id":"constantinople","name":"Constantinople","ar":"القسطنطينية","lat":41.01,"lon":28.98,"kind":"capital","from":300,"to":640,"blurb":"The imperial city at the far end of the road from al-Ḥīra. Imruʾ al-Qays went there to beg troops from Justinian; ʿAdī ibn Zayd went in 579 as a Sasanian envoy and came back with books.","coordConfidence":"exact"},{"id":"ankara","name":"Ankara","ar":"أنقرة","lat":39.93,"lon":32.86,"kind":"city","from":300,"to":640,"blurb":"Anatolian city where Imruʾ al-Qays fell ill and died on the road home. A tomb at Hıdırlık is traditionally pointed out as his.","coordConfidence":"exact"},{"id":"chalcis","name":"Chalcis / Qinnasrīn","ar":"قنسرين","lat":35.86,"lon":37.03,"kind":"battlefield","from":300,"to":640,"blurb":"A fortified town south-west of Aleppo, now identified as the field of Yawm Ḥalīma in June 554, where the Lakhmid al-Mundhir III was killed.","coordConfidence":"approximate"},{"id":"rusafa","name":"Ruṣāfa / Sergiopolis","ar":"الرصافة","lat":35.63,"lon":38.76,"kind":"shrine","from":300,"to":640,"blurb":"The great desert shrine of St Sergius, patron of Arab Christians, with basilicas and a building commissioned by the Ghassanid al-Mundhir. Byzantium and the Ghassanids were reconciled here in 575.","coordConfidence":"exact"},{"id":"zabad","name":"Zabad","ar":"زبد","lat":35.86,"lon":37.47,"kind":"site","from":300,"to":640,"blurb":"A village south-east of Aleppo whose martyrium of St Sergius carries the earliest dated Paleo-Arabic inscription, trilingual in Greek, Syriac and Arabic, from 512.","coordConfidence":"approximate"},{"id":"callinicum","name":"Callinicum / al-Raqqa","ar":"الرقة","lat":35.95,"lon":39.01,"kind":"battlefield","from":300,"to":640,"blurb":"Euphrates crossing where Belisarius was beaten in 531 by Persians and Lakhmids, and where two Greek sources flatly contradict each other about whether the Ghassanid Arabs ran or held.","coordConfidence":"exact"},{"id":"thannuris","name":"Thannuris","ar":"ثنوريس","lat":36.46,"lon":40.86,"kind":"battlefield","from":300,"to":640,"blurb":"Mesopotamian battlefield of 528 where the Ghassanid king Jabalah IV was killed fighting for Byzantium.","coordConfidence":"approximate"},{"id":"dara","name":"Dara","ar":"دارا","lat":37.18,"lon":40.95,"kind":"city","from":300,"to":640,"blurb":"The fortress Anastasius built against Persian Nisibis from 505, lost to Khusraw I in 573 and handed back in 591. The hinge of the whole northern frontier.","coordConfidence":"approximate"},{"id":"antioch","name":"Antioch","ar":"أنطاكية","lat":36.2,"lon":36.16,"kind":"city","from":300,"to":640,"blurb":"The great city of Roman Syria, which al-Mundhir III raided up to but never took, and which the Persians looted in 613.","coordConfidence":"exact"},{"id":"damascus","name":"Damascus","ar":"دمشق","lat":33.51,"lon":36.29,"kind":"city","from":300,"to":640,"blurb":"Northern terminus of the Quraysh summer caravans and the city the Ghassanid camps sat behind. Fell to the Persians in 613.","coordConfidence":"exact"},{"id":"jerusalem","name":"Jerusalem","ar":"القدس","lat":31.78,"lon":35.23,"kind":"city","from":300,"to":640,"blurb":"Taken by the Persians in 614 after a three-week siege; the True Cross was carried off to Ctesiphon, a loss the whole Christian East felt.","coordConfidence":"exact"},{"id":"alexandria","name":"Alexandria","ar":"الإسكندرية","lat":31.2,"lon":29.92,"kind":"city","from":300,"to":640,"blurb":"Egypt's port and grain engine, which fell to the Persians after a year-long siege in 618 — after which the Constantinople bread dole was abolished.","coordConfidence":"exact"},{"id":"bosra","name":"Bosra","ar":"بصرى","lat":32.52,"lon":36.48,"kind":"city","from":300,"to":640,"blurb":"Capital of Roman Arabia and the market the Meccan caravans aimed at. Its civic era, epoch 105/106 CE, dates the Namāra, Jabal Usays and Ḥarrān inscriptions.","coordConfidence":"exact"},{"id":"al-jabiya","name":"al-Jābiya","ar":"الجابية","lat":32.8,"lon":35.98,"kind":"capital","from":300,"to":640,"blurb":"The Ghassanid royal camp between the Ḥawrān plain and the Golan — a seat of government that was a tent city, not a walled capital. Foreign envoys came out here to meet the kings.","coordConfidence":"approximate"},{"id":"jabal-says","name":"Jabal Says / Usays","ar":"جبل أسيس","lat":33.03,"lon":37.17,"kind":"site","from":300,"to":640,"blurb":"A volcanic hill about 105 km south-east of Damascus, source of the 528 Arabic inscription often called the only pre-Islamic Arabic text with historical content.","coordConfidence":"approximate"},{"id":"namara","name":"al-Namāra","ar":"النمارة","lat":33.18,"lon":37.29,"kind":"site","from":300,"to":640,"blurb":"A basalt site in the Ḥarra about 100 km south-east of Damascus where the funerary stone of Imruʾ al-Qays 'king of all the Arabs' was found. The stone is now in the Louvre.","coordConfidence":"approximate"},{"id":"harran-al-laja","name":"Ḥarrān in the Lejā","ar":"حران اللجاة","lat":32.73,"lon":36.63,"kind":"shrine","from":300,"to":640,"blurb":"A village south of Damascus whose martyrium of St John carries a Greek-Arabic bilingual of 568, dated by an Arabian era reckoned from the destruction of Khaybar.","coordConfidence":"approximate"},{"id":"yarmuk","name":"Yarmūk","ar":"اليرموك","lat":32.68,"lon":35.85,"kind":"battlefield","from":600,"to":640,"blurb":"The river valley where the Ghassanids and the Byzantine field army were broken in 636, closing the period.","coordConfidence":"exact"},{"id":"petra","name":"Petra","ar":"البتراء","lat":30.33,"lon":35.44,"kind":"site","from":300,"to":640,"blurb":"The dead Nabataean capital, annexed by Rome in 106, still standing in the landscape as carved facades and high places when travellers of the 6th century rode past.","coordConfidence":"exact"},{"id":"hegra","name":"Hegra / Madāʾin Ṣāliḥ","ar":"الحجر","lat":26.79,"lon":37.95,"kind":"site","from":300,"to":640,"blurb":"131 rock-cut Nabataean tombs across some 12 km², with Jabal Ithlib as the religious quarter. By the 6th century "lon":57.5,"kind":"region","from":300,"to":640,"blurb":"The Sasanian province of the south-east, with its own Christian diocese of Beth Mazūnāyē.","coordConfidence":"approximate"},{"id":"hail","name":"Ḥāʾil","ar":"حائل","lat":27.52,"lon":41.7,"kind":"town","from":300,"to":640,"blurb":"The oasis under the twin mountains of Ṭayyiʾ, where ʿAntara is said to have died and where Ḥātim was buried.","coordConfidence":"exact"},{"id":"tuwarin","name":"Tuwārin","ar":"توارن","lat":27.5,"lon":41.6,"kind":"site","from":300,"to":640,"blurb":"The burial place of Ḥātim al-Ṭāʾī near Ḥāʾil, though other traditions put his tomb elsewhere.","coordConfidence":"guessed"},{"id":"qusayba","name":"Qusayba","ar":"القصيبة","lat":26.3,"lon":43.6,"kind":"town","from":300,"to":640,"blurb":"A place in the Qaṣīm given as ʿAntara's birthplace.","coordConfidence":"guessed"},{"id":"wadi-abqar","name":"Wādī ʿAbqar","ar":"وادي عبقر","lat":25.5,"lon":43.5,"kind":"site","from":300,"to":640,"blurb":"A deep valley in Najd where, poets said, a man who sleeps out may be visited by a jinnī who teaches him verse. Nothing confirms it was ever a real identifiable place.","coordConfidence":"guessed"},{"id":"sarawat","name":"The Sarawāt","ar":"السروات","lat":19.0,"lon":42.0,"kind":"region","from":300,"to":640,"blurb":"The western mountain spine, cooler and wetter than the plains, where outlaw bands hid and Azd and Khathʿam ranged.","coordConfidence":"approximate"},{"id":"khazaz","name":"Khazāz","ar":"خزاز","lat":26.0,"lon":42.5,"kind":"battlefield","from":300,"to":640,"blurb":"A mountain on the road between Baṣra and Mecca, behind the desert of Munʿij, where Maʿadd lit beacons for three nights and refused to be eaten by the people of Yemen.","coordConfidence":"guessed"},{"id":"al-kulab","name":"al-Kulāb","ar":"الكلاب","lat":31.4,"lon":45.5,"kind":"battlefield","from":400,"to":640,"blurb":"A water between Kūfa and Baṣra, remembered as 'the stones of al-Kulāb', where two sons of the Kindite king set matching bounties on each other's heads.","coordConfidence":"guessed"},{"id":"rahrahan","name":"Raḥraḥān","ar":"رحرحان","lat":26.5,"lon":44.5,"kind":"battlefield","from":500,"to":640,"blurb":"Fighting ground at 'the nearest waters of Banū Dārim' in Najd, where Maʿbad ibn Zurāra was taken and died a prisoner. The sources name no toponym and disagree about who won.","coordConfidence":"guessed"},{"id":"dhi-najab","name":"Dhū Najab","ar":"ذو نجب","lat":26.3,"lon":44.7,"kind":"battlefield","from":500,"to":640,"blurb":"Where the Yarbūʿ of Tamīm took their revenge a year after Shiʿb Jabala.","coordConfidence":"guessed"},{"id":"al-habaa","name":"al-Habāʾa","ar":"الهباءة","lat":26.0,"lon":41.5,"kind":"battlefield","from":540,"to":640,"blurb":"A well in Fazāra country, and the dramatic centre of the Dāḥis war: morning-to-noon fighting in summer heat, oaths and curses at the water's edge, and a mutilated body.","coordConfidence":"guessed"},{"id":"dhu-husa","name":"Dhū Ḥusā","ar":"ذو حسى","lat":26.4,"lon":41.2,"kind":"battlefield","from":540,"to":640,"blurb":"The one clear defeat ʿAbs took in the Dāḥis sequence, still being thrown at them in verse a generation later.","coordConfidence":"guessed"},{"id":"al-muraqqab","name":"al-Muraqqab","ar":"المريقب","lat":26.8,"lon":41.0,"kind":"battlefield","from":540,"to":640,"blurb":"First day of the ordered Dāḥis list, ʿAbs over Fazāra.","coordConfidence":"guessed"},{"id":"al-faruq","name":"al-Farūq","ar":"الفروق","lat":25.5,"lon":45.5,"kind":"battlefield","from":540,"to":640,"blurb":"A day won by ʿAbs over a Kindite leader and the people of Hajar — though another list makes it a Qays-against-Tamīm day entirely.","coordConfidence":"guessed"},{"id":"al-raqam","name":"al-Raqam","ar":"الرقم","lat":25.8,"lon":42.0,"kind":"battlefield","from":540,"to":640,"blurb":"Listed inside the Dāḥis cycle but actually Ghaṭafān over Banū ʿĀmir — a day-name that has drifted.","coordConfidence":"guessed"},{"id":"araair","name":"ʿArāʿir","ar":"عراعر","lat":30.0,"lon":41.0,"kind":"battlefield","from":540,"to":640,"blurb":"A day whose loser the sources cannot agree on: one has the chief of Kalb killed here, another has Fazāra beating ʿAbs.","coordConfidence":"guessed"},{"id":"al-nahy","name":"al-Nahy","ar":"النهي","lat":30.0,"lon":45.0,"kind":"battlefield","from":480,"to":560,"blurb":"A water where Banū Shaybān were camped, and the Basūs war's first or second great day depending on which source you take.","coordConfidence":"guessed"},{"id":"al-dhanaib","name":"al-Dhanāʾib","ar":"الذنائب","lat":30.2,"lon":44.8,"kind":"battlefield","from":480,"to":560,"blurb":"Called the greatest encounter of the Basūs war. One source instead uses the name for the spot where Jassās speared Kulayb.","coordConfidence":"guessed"},{"id":"waridat","name":"Wāridāt","ar":"واردات","lat":30.4,"lon":45.2,"kind":"battlefield","from":480,"to":560,"blurb":"Slaughter among Bakr, and the day al-Muhalhil stood over Hammām ibn Murra's body and composed an elegy for the man he had killed.","coordConfidence":"guessed"},{"id":"al-qusaybat","name":"al-Quṣaybāt","ar":"القصيبات","lat":29.8,"lon":45.4,"kind":"battlefield","from":480,"to":560,"blurb":"A beating so bad Bakr thought they would never get up from it — though one source reverses the outcome.","coordConfidence":"guessed"},{"id":"quda","name":"Quḍa","ar":"قضة","lat":29.5,"lon":45.0,"kind":"battlefield","from":480,"to":560,"blurb":"Also called Taḥlāq al-Limam, the shaving of the forelocks: Bakr shaved their heads to know one another, and their women went among the wounded with water and clubs.","coordConfidence":"guessed"},{"id":"al-fusayl","name":"al-Fuṣayl","ar":"الفصيل","lat":29.7,"lon":45.6,"kind":"battlefield","from":480,"to":560,"blurb":"The last day of the Basūs war, named 'the camel calf' — the same creature whose killing is said to have started it.","coordConfidence":"guessed"},{"id":"ayn-ubagh","name":"ʿAyn Ubāgh","ar":"عين أباغ","lat":33.5,"lon":39.5,"kind":"battlefield","from":500,"to":640,"blurb":"A spring at Dhāt al-Khiyār, out in the steppe between Syria and Iraq, where the Lakhmid al-Mundhir ibn Māʾ al-Samāʾ was killed and his army broken.","coordConfidence":"guessed"},{"id":"al-sullan","name":"al-Sullān","ar":"السلان","lat":19.5,"lon":42.0,"kind":"battlefield","from":300,"to":640,"blurb":"A valley of water and halfa grass in Tihāma beside Mount Khazāz, on Yāqūt's description. There are two days of this name and the sources confuse them constantly; the second was fought in a different valley, one belonging to Banū ʿAmr of Tamīm, and is also called Yawm al-Sūbān and Qāʿ al-Qurayṭayn.","coordConfidence":"guessed"},{"id":"al-nisar","name":"al-Nisār","ar":"النسار","lat":27.0,"lon":45.0,"kind":"battlefield","from":400,"to":640,"blurb":"A day of Ḍabba and Banū Tamīm, surviving only as an index entry in two medieval lists.","coordConfidence":"guessed"},{"id":"tikhfa","name":"Ṭikhfa","ar":"طخفة","lat":25.6,"lon":44.2,"kind":"battlefield","from":500,"to":640,"blurb":"Where Banū Yarbūʿ beat a Lakhmid king — the sources disagree over whether it was the father or the son.","coordConfidence":"guessed"},{"id":"awara","name":"Awāra","ar":"أوارة","lat":29.5,"lon":46.5,"kind":"battlefield","from":500,"to":640,"blurb":"Two days of the same name, one against Bakr under al-Mundhir ibn Māʾ al-Samāʾ, the second against Tamīm under his son ʿAmr ibn Hind.","coordConfidence":"guessed"},{"id":"hiraa","name":"Ghār Ḥirāʾ on Jabal al-Nūr","ar":"غار حراء","lat":21.4578,"lon":39.8617,"kind":"site","from":300,"to":640,"blurb":"A cave near the summit of a steep hill about three kilometres north-east of the Meccan sanctuary. The tradition has Muḥammad withdrawing there for stretches at a time before the revelation began, which is in keeping with the solitary retreat (taḥannuth) the sīra reports of other Meccans as well.","coordConfidence":"exact"},{"id":"al-hanw","name":"al-Ḥanw","ar":"الحَنْو","lat":30.1,"lon":45.3,"kind":"battlefield","from":480,"to":560,"blurb":"A day of the Basūs war that Ibn al-Athīr names and the English reconstruction left out altogether. He gives it no location; the point on the map only holds it among the other days of the war. Al-Aʿshā uses the same name — 'the battle of al-Ḥinw' — for Dhū Qār, so the name was re-used.","coordConfidence":"guessed"},{"id":"al-naqiyya","name":"al-Naqiyya","ar":"النَّقِيّة","lat":29.6,"lon":45.3,"kind":"battlefield","from":480,"to":560,"blurb":"Another Basūs day named by Ibn al-Athīr and missing from the English reconstruction. No location is given for it in any source; the point only holds its place in the sequence.","coordConfidence":"guessed"}],"events":[{"id":"nabataea-annexed","year":106,"endYear":null,"title":"Rome annexes Nabataea","ar":"ضم مملكة الأنباط","evidence":"EXT","dateCertainty":"fixed","dateRange":[106,106],"estimated":false,"dateNote":"Fixed in the Roman record; the Bostran era that dates four of this file's inscriptions counts from it.","placeId":"petra","category":"politics","summary":"Trajan absorbed the Nabataean kingdom. Its era, counted from this annexation, is what dates the Namāra, Jabal Usays, Ḥimà and Ḥarrān inscriptions three and four centuries later — and its tombs and high places were still standing in the landscape the whole time.","dispute":"Outside the window, included because the Bostran era and the Nabataean ruins layer both run right through the period.","peopleIds":[],"politiesIds":["nabataean-legacy","byzantines"],"source":"https://en.wikipedia.org/wiki/Dumat_al-Jandal"},{"id":"thamud-temple-ruwafa","year":167,"endYear":null,"title":"The Thamūd dedicate a temple at Ruwāfa","ar":"معبد روافة","evidence":"EPI","dateCertainty":"approximate","dateRange":[165,169],"estimated":true,"dateNote":"Dated by the reigning emperors named in the Greek text, which gives a window in the 160s rather than a year.","placeId":"ruwafa","category":"inscription","summary":"A bilingual Greek and Nabataean Aramaic inscription records that 'the Thamūd of Robathū' built a temple with Roman support. They were Roman auxiliary troops. The people the Qurʾān and the pre-Islamic poets both treat as annihilated in the deep past were a going concern in the 2nd century — and the ruined-civilisation belief about them was itself live in the 6th.","dispute":"Outside the dataset's 300–640 window, included because it is the hard counter-evidence to the Thamūd legend that characters in the period believed. 'Thamudic' as an epigraphic label is a misnomer with no demonstrated link to the tribe.","peopleIds":[],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Thamud"},{"id":"zenobia-marid","year":269,"endYear":null,"title":"Zenobia at Mārid Castle","ar":"زنوبيا وقصر مارد","evidence":"TRAD","dateCertainty":"approximate","dateRange":[267,272],"estimated":true,"dateNote":"Placed by Zenobia's floruit; no source dates the siege itself.","placeId":"dumat-al-jandal","category":"battle","summary":"Zenobia of Palmyra mentioned the oasis city, and the fortress of Mārid is said to have held out against her attack. A standing building with a named siege attached.","dispute":"Just before the window; the Palmyrene layer is part of what the period inherited.","peopleIds":[],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Dumat_al-Jandal"},{"id":"himyar-conquers-saba","year":285,"endYear":null,"title":"Ḥimyar swallows Sabaʾ","ar":"حمير تضم سبأ","evidence":"EPI","dateCertainty":"approximate","dateRange":[275,300],"estimated":true,"dateNote":"Placed inside Shammar Yuharʿish's conventional reign of 275-300; the Ḥimyar literature declines a precise year.","placeId":"zafar","category":"politics","summary":"Shammar Yuharʿish finished what his house had begun and brought Sabaʾ, with Qatabān and Ḥaḍramawt already taken, under one crown at Ẓafār. From here the kings style themselves of Sabaʾ and dhū-Raydān.","dispute":"The ruler list gives Shammar 275–300; the Ḥimyar article says 'around 280' or 'late 3rd century' and declines the precise year.","peopleIds":["shammar-yuharish"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Himyarite_Kingdom"},{"id":"namara-inscription","year":328,"endYear":null,"title":"Namāra inscription","ar":"نقش النمارة","evidence":"EPI","dateCertainty":"fixed","dateRange":[328,328],"estimated":false,"dateNote":"Fixed by the Bostran era date cut on the stone: 7 Kaslūl, year 223.","placeId":"namara","category":"inscription","summary":"A funerary stone cut on 7 Kaslūl, year 223 of the Bosra era, for Imruʾ al-Qays son of ʿAmr, called king of all the Arabs. It says he broke the Asad, drove Madhḥij to the gates of Najrān, subdued Maʿadd, and set tribal nobles over them who then served Rome as phylarchs. It is the hardest single date in the whole 4th-century Arabian record and it is now in the Louvre.","dispute":"The reading is J. A. Bellamy's from 1985 and replaced earlier, different readings; part of the royal title still carries a question mark. It also makes a Lakhmid-line king Roman-facing, which cuts against the Arabic tradition's picture of the Lakhmids as Persian clients throughout.","peopleIds":["imru-al-qays-namara"],"politiesIds":["lakhmids","byzantines"],"source":"https://islamic-awareness.org/history/islam/inscriptions/namarah"},{"id":"marib-temple-last-pagan","year":379,"endYear":null,"title":"The last pagan inscription at Maʾrib","ar":"آخر نقش وثني في معبد مأرب","evidence":"EPI","dateCertainty":"fixed","dateRange":[379,380],"estimated":false,"dateNote":"Era conversion puts the temple's last dated polytheistic text in 379/380.","placeId":"awwam","category":"religion","summary":"The last dated polytheistic text in Maʾrib's Great Temple. Most South Arabian temples were already deserted. A story set in 6th-century Yemen should not have a functioning Almaqah cult in it — that world had closed two hundred years earlier.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://books.openbookpublishers.com/10.11647/obp.0219/ch7.xhtml"},{"id":"himyar-monotheist-reform","year":384,"endYear":null,"title":"Ḥimyar turns to the Lord of the Sky","ar":"إصلاح حمير الديني","evidence":"EPI","dateCertainty":"fixed","dateRange":[380,384],"estimated":false,"dateNote":"Fixed at the near end by the royal inscriptions of January 384; the window opens with the 379/380 silence, and Robin allows an earlier start.","placeId":"zafar","category":"religion","summary":"Royal inscriptions of January 384 drop the ancestral gods and invoke 'the Lord of the Sky'. Within a generation the kingdom's public religion is Judaic monotheism — about 140 to 150 inscriptions document it over the next century and a half, and not one of them states a creed.","dispute":"Robin keeps the 380–384 window but allows an earlier start. Whether this Judaism was rabbinic is a live dispute: Robin reads it as priestly and non-rabbinic because the texts never mention resurrection; Gajda reads it as rabbinic.","peopleIds":["malkikarib","abu-karib-asad"],"politiesIds":["himyar"],"source":"https://books.openbookpublishers.com/10.11647/obp.0219/ch7.xhtml"},{"id":"khazaz-day","year":400,"endYear":null,"title":"Yawm Khazāz","ar":"يوم خزاز","evidence":"TRAD","dateCertainty":"legendary","dateRange":[300,500],"estimated":true,"dateNote":"Undated in every source. Placed early because Abū ʿAmr ibn al-ʿAlāʾ argued the day was older than any of the men credited with leading it.","placeId":"khazaz","category":"battle","summary":"Maʿadd refused to be eaten by the people of Yemen. A Yemeni collector used to arrive with a scribe and a carpet to sit on and take whatever he liked of Nizār's property. They lit a fire on the mountain for three nights and made smoke for three days, and the tribes came in.","dispute":"The leadership is a genuine scholarly argument preserved verbatim: a Friday circle at Baṣra disputed whether al-Aḥwaṣ ibn Jaʿfar, Kulayb ibn Wāʾil or Zurāra ibn ʿUdus led there. Abū ʿAmr ibn al-ʿAlāʾ ruled against all three on the grounds that the day is older than those men, and said he had been asking for sixty years and had never found anybody who knew its chief. The ʿIqd page also notes the day would not be known at all but for one line of ʿAmr ibn Kulthūm's verse — the page is cut off before the battle itself. Undated.","peopleIds":["kulayb","abu-amr"],"politiesIds":[],"source":"https://shamela.ws/book/23789/1908"},{"id":"hira-bishop-410","year":410,"endYear":null,"title":"A bishop of al-Ḥīra at the synod","ar":"حضور أسقف الحيرة المجمع","evidence":"EXT","dateCertainty":"fixed","dateRange":[410,410],"estimated":false,"dateNote":null,"placeId":"hira","category":"religion","summary":"Bishop Hosea of al-Ḥīra attended the first synod of the Church of the East. The same synod records bishops out at Mashmahig, Dārayn, Hajar and Haṭṭā — so the Gulf littoral already had a church structure in 410.","dispute":null,"peopleIds":[],"politiesIds":["lakhmids","sasanians"],"source":"https://www.iranicaonline.org/articles/hira"},{"id":"rahmanan-first","year":420,"endYear":null,"title":"Raḥmānān appears","ar":"ظهور رحمانن","evidence":"EPI","dateCertainty":"approximate","dateRange":[415,425],"estimated":true,"dateNote":"A midpoint of the window in which RḤMNN starts appearing in the inscriptions.","placeId":"zafar","category":"religion","summary":"The divine name RḤMNN enters the Ḥimyarite inscriptions, alternating with Īlān and the plural Aʾlāhān. It is the same name the Qurʾān will use two centuries later as al-Raḥmān.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://books.openbookpublishers.com/10.11647/obp.0219/ch7.xhtml"},{"id":"sullan-i","year":420,"endYear":null,"title":"Yawm al-Sullān I","ar":"يوم السلان الأول","evidence":"TRAD","dateCertainty":"legendary","dateRange":[300,500],"estimated":true,"dateNote":"Undated; a placement inside the 5th century, and the compilers themselves confuse al-Sullān I with al-Sullān II.","placeId":"al-sullan","category":"battle","summary":"Maʿadd against the people of Yemen in a valley of water and halfa grass beside Mount Khazāz, between the Ḥijāz and Yemen. Victory to Maʿadd.","dispute":"Leadership contested three ways, and Yāqūt makes the opponents Madhḥij and Kalb. The Muʿjam al-Asāṭīr compiler explicitly accuses Jawād ʿAlī of confusing al-Sullān I with al-Sullān II, and al-Maydānī of the same error. Undated.","peopleIds":[],"politiesIds":[],"source":"http://mdmf1439.blogspot.com/2018/09/blog-post_8.html"},{"id":"hujr-akil-installed","year":425,"endYear":null,"title":"Ḥimyar sets Ḥujr over the Maʿadd","ar":"تولية حجر آكل المرار","evidence":"TRAD","dateCertainty":"contested","dateRange":[400,450],"estimated":true,"dateNote":"The Arabic sources date the founding of Kindite kingship to 425 and run Ḥujr's reign 425-458; the English ones say no regnal dates exist for him and infer a window from Abīkarib's conventional reign of c. 390-440. The year here is now the Arabic 425, with the inferred window kept as the range.","placeId":"najd","category":"politics","summary":"A Ḥimyarite king campaigned into central Arabia and installed Ḥujr Ākil al-Murār — 'eater of bitter herbs' — over the Maʿadd tribes. Kinda's kingship begins here, as a southern crown's instrument for governing nomads. The Arabic sources name the sponsor as Ḥasan ibn ʿAmr ibn Tubbāʿ and put it in 425.","dispute":"The English sources state flatly that no regnal dates exist for Ḥujr and infer the window from his Ḥimyarite sponsor's reign, conventionally c. 390–440; they also name that sponsor Abīkarib Asʿad. The Arabic sources give a founding year, 425, a sponsor, Ḥasan ibn ʿAmr ibn Tubbāʿ, and a full regnal series after it — Ḥujr 425–458, ʿAmr 458–489, al-Ḥārith 489–528. Nothing external confirms any of it. He is said to have reigned long and died of old age at Baṭn ʿAqīl, which does not sit easily with a reign ending in a fixed year.","peopleIds":["hujr-akil-al-murar","abu-karib-asad"],"politiesIds":["kinda","himyar"],"source":"https://en.wikipedia.org/wiki/Kingdom_of_Kinda"},{"id":"dam-breach-449","year":449,"endYear":450,"title":"The dam breaks","ar":"انكسار السد","evidence":"EPI","dateCertainty":"fixed","dateRange":[449,450],"estimated":false,"dateNote":"Fixed by the dam inscriptions, which record breaches in two consecutive years.","placeId":"marib-dam","category":"disaster","summary":"Two major breaches in consecutive years tore the Maʾrib barrage open. The first failure of the century, and the first one the kingdom was still strong enough to answer.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"al-bardan","year":450,"endYear":null,"title":"Yawm al-Bardān","ar":"يوم البردان","evidence":"TRAD","dateCertainty":"legendary","dateRange":[400,500],"estimated":true,"dateNote":"Undated; known only from a one-line entry in al-Khāqānī's list, so the year is a placement.","placeId":"najd","category":"battle","summary":"Ḥujr Ākil al-Murār of Kinda over Zayd ibn al-Habūla of Quḍāʿa — a purely southern-Arabian day with no northern party in it at all.","dispute":"Known only from al-Khāqānī's one-line entry. Undated.","peopleIds":["hujr-akil-al-murar"],"politiesIds":["kinda"],"source":"https://almerja.com/more.php?idm=66589"},{"id":"dam-repair-450","year":450,"endYear":null,"title":"Sharaḥbiʾīl Yaʿfar rebuilds the dam","ar":"ترميم شرحبئل يعفر للسد","evidence":"EPI","dateCertainty":"fixed","dateRange":[450,450],"estimated":false,"dateNote":"Fixed by the repair inscription.","placeId":"marib-dam","category":"politics","summary":"The king put the barrage back up. Six hundred years of this cycle lie behind the repair and only a century of it lies ahead.","dispute":null,"peopleIds":["sharahbiil-yafur"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Marib_Dam"},{"id":"faw-abandoned","year":450,"endYear":null,"title":"Qaryat al-Fāw runs dry","ar":"هجر قرية الفاو","evidence":"EPI","dateCertainty":"approximate","dateRange":[400,500],"estimated":true,"dateNote":"Dated only as 'around the 5th century'; 450 is the midpoint of that century.","placeId":"qaryat-al-faw","category":"disaster","summary":"A caravan city that had stood for nearly a thousand years — five temples, a market, seventeen or more wells, painted banqueters on its walls — was abandoned when its water was irreversibly depleted. For a story opening around 400–500 this is a great city dying inside living memory.","dispute":"Dated only as 'around the 5th century'. The same site article has the Kinda leaving around 300, which makes the common claim that Fāw was the capital of a 450–550 Kindite kingdom almost certainly a conflation of two phases a century and a half apart.","peopleIds":[],"politiesIds":["kinda"],"source":"https://whc.unesco.org/en/list/1712"},{"id":"cih540-456","year":456,"endYear":null,"title":"CIH 540 cut on the dam","ar":"نقش CIH 540","evidence":"EPI","dateCertainty":"fixed","dateRange":[456,456],"estimated":false,"dateNote":"Fixed by the inscription's own Ḥimyarite era date.","placeId":"marib-dam","category":"inscription","summary":"A dated Judaic royal inscription on the Maʾrib dam, one of the clearest markers that the kings who maintained the waterworks were by now monotheists.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://books.openbookpublishers.com/10.11647/obp.0219/ch7.xhtml"},{"id":"zm1-462","year":462,"endYear":null,"title":"ẒM 1","ar":"نقش ظ م ١","evidence":"EPI","dateCertainty":"fixed","dateRange":[462,462],"estimated":false,"dateNote":"Fixed by the inscription's own Ḥimyarite era date.","placeId":"zafar","category":"inscription","summary":"Another dated Judaic royal Ḥimyarite text, part of the thin but real spine of hard dates that South Arabia gives and the rest of the peninsula does not.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://books.openbookpublishers.com/10.11647/obp.0219/ch7.xhtml"},{"id":"hima-470","year":470,"endYear":null,"title":"Ḥimà-Sud PalAr 1","ar":"نقش حمى","evidence":"EPI","dateCertainty":"fixed","dateRange":[470,470],"estimated":false,"dateNote":"Fixed by the era date in the inscription itself.","placeId":"hima","category":"inscription","summary":"The earliest precisely dated Paleo-Arabic inscription, cut at Ḥimà about 90 km north of Najrān, Christian, with big ornate crosses. A literate, Arabic-writing Christian Arabian, a century before Muḥammad, with a date on him.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Hima_Paleo-Arabic_inscriptions"},{"id":"amr-al-maqsur-killed","year":489,"endYear":null,"title":"ʿAmr al-Maqṣūr killed by the Rabīʿa","ar":"مقتل عمرو المقصور","evidence":"TRAD","dateCertainty":"contested","dateRange":[458,500],"estimated":true,"dateNote":"The Arabic sources end his reign in 489, which is the year used here; the English ones have only 'probably killed in battle against the Rabīʿa in the late 5th century'.","placeId":"najd","category":"battle","summary":"Ḥujr's successor in Najd was rejected by the Rabīʿa tribes and probably killed fighting them. Kindite authority over the north was never again uncontested.","dispute":"No external attestation. The Arabic regnal series — Ḥujr 425–458, ʿAmr 458–489, al-Ḥārith 489–528 — is the only thing that dates this, and the English sources say outright that they found no dates for these kings. The Arabic sources also write the epithet al-Manṣūr rather than al-Maqṣūr.","peopleIds":["amr-al-maqsur"],"politiesIds":["kinda"],"source":"https://en.wikipedia.org/wiki/Kingdom_of_Kinda"},{"id":"basus-war-begins","year":494,"endYear":534,"title":"Kulayb kills the she-camel, Jassās kills Kulayb","ar":"مقتل كليب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,510],"estimated":true,"dateNote":"The killing itself is undated; the only date anywhere in the corpus is the war's overall 494-534 span, from one modern Arabic compilation, and endYear carries that span so the war can be drawn as a band.","placeId":"al-yamama","category":"battle","summary":"Kulayb ibn Rabīʿa, lord of Taghlib, enforced his reserved pasture with a stake and a puppy and was hated for it. He shot a she-camel that had strayed among Jassās ibn Murra's herd under the protection of al-Basūs. Her lament went round the camps, Jassās speared Kulayb, Jassās's father refused to hand his son over, and forty years of war followed.","dispute":"The camel is itself two stories welded together: Ibn al-Athīr makes her Sarāb, property of Saʿd ibn Shumays al-Jarmī, sheltered by al-Basūs who was Jassās's maternal aunt; al-Maʿrifa gives her no name, makes her al-Basūs's own, and has Kulayb shoot her calf first and then her udder. Modern scholarship treats the whole war as a composite of separate raid-stories, not one conflict.","peopleIds":["kulayb","jassas","al-basus","jalila","al-muhalhil"],"politiesIds":[],"source":"https://www.marefa.org/حرب_البسوس"},{"id":"basus-unayza","year":496,"endYear":null,"title":"Yawm ʿUnayza","ar":"يوم عنيزة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated. The year holds the day's place in the sequence the sources do give, which is worth more than any year.","placeId":"falj","category":"battle","summary":"The first fighting of the Basūs war, at Falj in al-Yamāma. The two sides were evenly matched and parted without a winner.","dispute":"Ibn al-Athīr calls it the first engagement; al-Maʿrifa gives that place to al-Nahy instead. Undated.","peopleIds":["al-muhalhil"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"al-nisar-day","year":500,"endYear":null,"title":"Yawm al-Nisār","ar":"يوم النسار","evidence":"TRAD","dateCertainty":"legendary","dateRange":[400,620],"estimated":true,"dateNote":"No source gives a date, a place or a narrative; 500 is a bare midpoint of the period.","placeId":"al-nisar","category":"battle","summary":"A day of Ḍabba and Banū Tamīm.","dispute":"Listed in the contents of both Ibn al-Athīr and al-ʿIqd al-Farīd and in al-Qalqashandī's roll, with no narrative recovered anywhere and no date. The year here is a bare midpoint of the period, not an estimate.","peopleIds":[],"politiesIds":[],"source":"https://almerja.com/more.php?idm=66589"},{"id":"basus-nahy","year":500,"endYear":null,"title":"Yawm al-Nahy","ar":"يوم النهي","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated, and al-Maʿrifa makes this the war's first engagement rather than its second; the year only holds a place in the sequence.","placeId":"al-nahy","category":"battle","summary":"At a water called al-Nahy where Banū Shaybān were camped. Al-Muhalhil led Taghlib against al-Ḥārith ibn Murra. Hard fighting, and not one man of Banū Murra was killed that day. Taghlib took it.","dispute":"Undated. Al-Maʿrifa makes this the war's first engagement rather than its second.","peopleIds":["al-muhalhil"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"qusayy-takes-kaba","year":500,"endYear":null,"title":"Qusayy takes the Kaʿba","ar":"قصي يستولي على الكعبة","evidence":"TRAD","dateCertainty":"contested","dateRange":[450,580],"estimated":true,"dateNote":"Meccan chronology before c. 600 is unanchored: Hawting's reading puts Qusayy's children in the later 5th century, Watt's puts Qusayy's own death in the later 6th.","placeId":"mecca","category":"politics","summary":"Qusayy ibn Kilāb pulled the scattered descendants of Fihr together and took control of the sanctuary, and the order of Meccan clan offices descends from him.","dispute":"The internal contradiction here is a full century wide. Hawting says that if the traditional sources are believed Qusayy's children must have lived in the second half of the fifth century; Watt says Qusayy himself likely died in the second half of the sixth. Nothing resolves it, so Meccan internal chronology before about 600 is effectively free, provided the sequence Qusayy to ʿAbd Manāf to Hāshim to ʿAbd al-Muṭṭalib stays intact.","peopleIds":["qusayy"],"politiesIds":["quraysh"],"source":"https://en.wikipedia.org/wiki/Quraysh"},{"id":"kinda-federates-502","year":502,"endYear":null,"title":"Kinda become Byzantine federates","ar":"كندة حلفاء الروم","evidence":"EXT","dateCertainty":"fixed","dateRange":[502,502],"estimated":false,"dateNote":null,"placeId":"najd","category":"politics","summary":"Byzantium took the Kinda into treaty as federates. For a while al-Ḥārith ibn ʿAmr held a Ḥimyarite mandate, a Byzantine treaty and a phylarchate in Palestine at the same time — which is probably why Kinda fractured faster than any other buffer power.","dispute":null,"peopleIds":["al-harith-ibn-amr"],"politiesIds":["kinda","byzantines"],"source":"https://en.wikipedia.org/wiki/Kingdom_of_Kinda"},{"id":"mundhir-iii-raids-503","year":503,"endYear":null,"title":"Al-Mundhir III raids the Roman frontier","ar":"غزو المنذر الثالث","evidence":"EXT","dateCertainty":"fixed","dateRange":[503,503],"estimated":false,"dateNote":null,"placeId":"bosra","category":"battle","summary":"The Lakhmid king struck into Palaestina Salutaris and Arabia Petraea during the Anastasian War. From 503 onward the external sources constrain Lakhmid history year by year; before him it is free narrative space.","dispute":null,"peopleIds":["al-mundhir-iii-lakhmid"],"politiesIds":["lakhmids","sasanians","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Nu%27man"},{"id":"basus-dhanaib","year":505,"endYear":null,"title":"Yawm al-Dhanāʾib","ar":"يوم الذنائب","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated; the year holds the day's place in the sequence, nothing more.","placeId":"al-dhanaib","category":"battle","summary":"Called the greatest encounter of the whole war. Many of Bakr were killed, including al-Ḥārith ibn Murra and ʿAmr ibn Sadūs. Taghlib's high point.","dispute":"Undated. Al-Maʿrifa uses the same place-name for the spot where Jassās speared Kulayb, which is a different use entirely.","peopleIds":["al-muhalhil"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"basus-waridat","year":510,"endYear":null,"title":"Yawm Wāridāt","ar":"يوم واردات","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated, and the sources cannot agree where Hammām died; the year holds the day's place in the sequence.","placeId":"waridat","category":"battle","summary":"Heavy slaughter among Bakr. Hammām ibn Murra was killed — by Nāshira, a Taghlibī he had raised himself — and al-Muhalhil stood over the body and composed an elegy for his own enemy.","dispute":"Undated, and the sources cannot agree where Hammām died: Wāridāt, al-Quṣaybāt or Quḍa. Al-Maʿrifa puts a single combat between Jassās and Abū Nuwayra on this day instead.","peopleIds":["al-muhalhil","hammam"],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"zabad-inscription","year":512,"endYear":null,"title":"Zabad inscription","ar":"نقش زبد","evidence":"EPI","dateCertainty":"fixed","dateRange":[512,512],"estimated":false,"dateNote":"Fixed by the inscription's own date.","placeId":"zabad","category":"inscription","summary":"A trilingual lintel on the martyrium of St Sergius, Greek and Syriac and Paleo-Arabic, dated year 823 of the Seleucid era. The Greek names the clergy, donors and the architects Symeon and Leontius; the Arabic simply asks God to remember a list of men. It is the earliest dated Paleo-Arabic text, and it opens by seeking help from al-ilāh.","dispute":null,"peopleIds":[],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Zabad_inscription"},{"id":"hima-513","year":513,"endYear":null,"title":"The second Ḥimà group","ar":"مجموعة حمى الثانية","evidence":"EPI","dateCertainty":"fixed","dateRange":[513,513],"estimated":false,"dateNote":"Fixed by the era dates in the inscriptions.","placeId":"hima","category":"inscription","summary":"A further set of Paleo-Arabic inscriptions at Ḥimà, dated by the Bostran era. One of them calls its writer 'servant of Christ'.","dispute":null,"peopleIds":[],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Hima_Paleo-Arabic_inscriptions"},{"id":"basus-qusaybat","year":515,"endYear":null,"title":"Yawm al-Quṣaybāt","ar":"يوم القصيبات","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,540],"estimated":true,"dateNote":"Undated, and the two main sources reverse the outcome; the year holds the day's place in the sequence.","placeId":"al-qusaybat","category":"battle","summary":"Bakr were hit so hard they thought they would never recover.","dispute":"Undated. Ibn al-Athīr gives the day to Taghlib; al-Maʿrifa reverses the outcome and also states flatly that Hammām was killed here, where Ibn al-Athīr says only 'it is also said'.","peopleIds":[],"politiesIds":[],"source":"https://mail.almerja.com/more.php?idm=66635"},{"id":"dhu-nuwas-accession","year":519,"endYear":null,"title":"Dhū Nuwās takes the Ḥimyarite throne","ar":"تولي ذي نواس","evidence":"EXT","dateCertainty":"contested","dateRange":[517,523],"estimated":true,"dateNote":"519 is a midpoint. The reported accession dates are 517, 522 and '518 or 522', and 519 is none of them.","placeId":"zafar","category":"politics","summary":"Yūsuf Asʾar Yathʾar, called Dhū Nuwās, seized power as the last native Ḥimyarite king, displacing an Aksumite client. His reign runs straight into the Najrān killings and the Ethiopian invasion.","dispute":"Three incompatible accession dates circulate across two reference articles: 517, 522, and '518 or 522'. Munro-Hay's 525 date for the Aksumite conquest depends on an 518 accession; a 523 accession pushes the conquest to about 530. The end of the reign is contested the same way: the Arabic sources give 517–527 with the death 'at the Red Sea' in 527, against 530 in the English ones, and one Arabic article has him born in 468 in its lead and in 450 in its sidebar.","peopleIds":["dhu-nuwas"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Dhu_Nuwas"},{"id":"jabalah-camp-jabiya","year":520,"endYear":null,"title":"Jabalah IV's camp at al-Jābiya","ar":"معسكر جبلة الرابع بالجابية","evidence":"EXT","dateCertainty":"approximate","dateRange":[518,522],"estimated":true,"dateNote":"Placed by Simeon of Bēth Arshām's letter, which is itself dated only to about 518-522.","placeId":"al-jabiya","category":"politics","summary":"A letter of Simeon of Bēth Arshām places the Ghassanid king's camp at al-Jābiya. Not a palace and not a walled capital — a royal tent city between the Ḥawrān and the Golan, which is what the Ghassanid state actually was.","dispute":null,"peopleIds":["jabalah-iv"],"politiesIds":["ghassanids"],"source":"https://en.wikipedia.org/wiki/Al-Jabiyah"},{"id":"tasm-jadis-destroyed","year":520,"endYear":null,"title":"Ḥimyar wipes out Jadīs","ar":"إبادة جديس","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,560],"estimated":true,"dateNote":"Undated, and the akhbār place these peoples both in the deep past and inside living memory of the 6th century.","placeId":"al-yamama","category":"disaster","summary":"The tyrant of Ṭasm claimed the right to the brides of Jadīs before their husbands. At a performance the men of Jadīs drew swords they had buried in the sand and killed him. Ḥimyar came in reprisal: a woman of Jadīs warned her people of the invasion and was ignored, the adults were slaughtered and the children taken.","dispute":"The akhbār's chronology is incoherent on purpose: Ṭasm and Jadīs are called contemporaries of ʿĀd and Thamūd, in the deep past, yet destroyed in the 6th century within living memory of the period. Al-Ṭabarī's version makes the reprisal payback for the killing of a Ḥimyarite ally. The tyrant is named ʿImlīq; the 'tyrant of Jaww' framing could not be verified.","peopleIds":["zarqa-al-yamama"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Tasm_and_Jadis"},{"id":"zarqa-blinded","year":520,"endYear":null,"title":"Zarqāʾ al-Yamāma is not believed","ar":"زرقاء اليمامة","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,560],"estimated":true,"dateNote":"Undated; placed with the destruction of Jadīs, a join the sources do not actually make.","placeId":"al-yamama","category":"disaster","summary":"The blue-eyed woman of al-Yamāma could see riders a week away. The enemy advanced hidden behind trees they carried, and she warned that the trees were moving, and her people thought she was going mad. After the camp's men were killed the invaders tore out her eyes and crucified her.","dispute":"Her story's sourcing is weak — a comparative-literature book and a newspaper feature, neither a specialist source — and the sight-range is given as a week, not the three days often repeated. The Ṭasm and Jadīs page does not mention her at all while her page makes her a Jadīsī, so the traditional join between the two stories could not be verified.","peopleIds":["zarqa-al-yamama"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Zarqa_al_Yamama"},{"id":"himyar-expels-lakhmids-najd","year":521,"endYear":null,"title":"Ḥimyar drives the Lakhmids out of Najd","ar":"إخراج حمير للخميين من نجد","evidence":"EXT","dateCertainty":"fixed","dateRange":[521,521],"estimated":false,"dateNote":null,"placeId":"najd","category":"battle","summary":"Central Arabian tribes appealed south, and Ḥimyar pushed Lakhmid power back out of the plateau. The interior was a theatre both client systems fought over, not an empty middle.","dispute":null,"peopleIds":["al-mundhir-iii-lakhmid","dhu-nuwas"],"politiesIds":["himyar","lakhmids"],"source":"https://en.wikipedia.org/wiki/Al-Mundhir_III_ibn_al-Nu%27man"},{"id":"najran-massacre","year":523,"endYear":524,"title":"The Najrān massacre","ar":"مذبحة نجران","evidence":"EXT","dateCertainty":"fixed","dateRange":[523,524],"estimated":false,"dateNote":"The killings are dated 523; the destruction of the town is separately dated to Tuesday, 15 Tishrī, Seleucid 835, which is 524.","placeId":"najran","category":"disaster","summary":"Dhū Nuwās put down a revolt at Najrān and had al-Ḥārith and some three hundred and forty of his followers killed, in November by one reckoning. Three Sabaic inscriptions bear on it, one of them dated June or July of that year — and they are political texts that barely mention religion at all.","dispute":"The killings are dated 523 and the destruction of the town separately to a Tuesday, 15 Tishrī, Seleucid 835, which is 524. The death toll is the clearest case of inflation in the whole record, and it inflates in three stages, not two: about 200 in the sources written soon after the event, eleven thousand in the Arabic sources — which say Dhū Nuwās's force at Najrān pulled down the bishopric, killed its bishop and eleven thousand Christians, and put the total killed across his campaigns against the Christians of Yemen at twenty-two thousand — and seventy thousand in sources written centuries later. The Arabic sources warn in the same breath that the Syriac accounts may have exaggerated. Robin warns that the Christian accounts frame a political repression as a religious war. The three Christian witnesses are Simeon of Bēth Arshām's letter of January 524, the Syriac Book of the Ḥimyarites, and the Martyrdom of Arethas; of the two published letters, only one may carry historical value and the attribution of the others is contested.","peopleIds":["dhu-nuwas","al-harith-najran"],"politiesIds":["himyar"],"source":"https://en.wikipedia.org/wiki/Christian_community_of_Najran"},{"id":"simeon-letter","year":524,"endYear":null,"title":"Simeon of Bēth Arshām writes from al-Ḥīra","ar":"رسالة شمعون","evidence":"EXT","dateCertainty":"fixed","dateRange":[524,524],"estimated":false,"dateNote":null,"placeId":"hira","category":"religion","summary":"In January, in the Lakhmid capital, a Miaphysite bishop wrote down what had happened at Najrān within months of its happening. It is the nearest thing to a contemporary document that pre-Islamic Arabia produced, and it was written at the court of the Persians' Arab king.","dispute":"Two further letters were published separately, by Guidi in 1881 and Shahîd in 1971. Only the original 'Letter C' may have historical value; the authorship of the others is disputed.","peopleIds":[],"politiesIds":["lakhmids"],"source":"https://en.wikipedia.org/wiki/Letter_on_the_Himyarite_Martyrs"},{"id":"aksumite-invasion","year":525,"endYear":530,"title":"Aksum invades Yemen","ar":"الغزو الأكسومي لليمن","evidence":"EXT","dateCertainty":"contested","dateRange":[525,543],"estimated":false,"dateNote":"A real 525-543 spread in the scholarship, turning on which accession date is taken for Dhū Nuwās. 525 is Procopius's.","placeId":"sanaa","category":"battle","summary":"King Kāleb sent an army across the Red Sea at Justin I's request. Dhū Nuwās was killed, the native Ḥimyarite kingship ended, and Ethiopian Christian rule began in South Arabia.","dispute":"A real 525–543 spread. Munro-Hay dates it 525 on an 518 accession for Dhū Nuwās; a 523 accession gives about 530; Jacques Ryckmans has suggested as late as 543. Procopius is the source for 525. The Arabic sources put Dhū Nuwās's death in 527 rather than 530, which is a fourth figure inside the same argument.","peopleIds":["dhu-nuwas","kaleb","abraha"],"politiesIds":["aksum","himyar","byzantines"],"source":"https://en.wikipedia.org/wiki/Dhu_Nuwas"},{"id":"basus-quda","year":525,"endYear":null,"title":"Yawm Quḍa, the shaving of the forelocks","ar":"يوم قضة / تحلاق اللمم","evidence":"TRAD","dateCertainty":"legendary","dateRange":[480,545],"estimated":true,"dateNote":"Undated; the year holds the day's place in the sequence. The sources disagree even on whose son Bujayr was.","placeId":"quda","category":"battle","summary":"Bakr shaved their heads so they would know each other in the press — in readiness for death, one source says — and their women went among the fighters with water and clubs. Al-Ḥārith ibn ʿUbād, who had sat out the whole war, came back to lead them after al-Muhalhil killed the young man he sent with a peace letter. He cut Taghlib to pieces, took al-Muhalhil prisoner, and let him go without recognising him.","dispute":"Undated. The sources disagree on whether Bujayr was al-Ḥārith's son or his nephew, and on whether he carried a peace offer or an announcement of withdrawal. His killing is the structural hinge of the whole war in both versions: Taghlib wins every day up to it and loses after it.","peopleIds":["al-harith-ibn-ubad","al-muhalhil","bujayr"],"politiesIds":[],"source":"https://www.marefa.org/حرب_البسوس"},{"id":"hujr-killed","year":525,"endYear":null,"title":"The Banū Asad kill Ḥujr","ar":"مقتل حجر بن الحارث","evidence":"TRAD","dateCertainty":"contested","dateRange":[520,535],"estimated":true,"dateNote":"Dated purely by inference from the fall of Kinda's Ḥimyarite sponsor in 525, and it collides with one of the two birth schemes for his son.","placeId":"najd","category":"battle","summary":"Ḥujr ibn al-Ḥārith, the Kindite set over the Asad and Ghaṭafān, was killed in an Asad revolt. His son Imruʾ al-Qays was the only one who went after the killers, and the whole vengeance quest that defines Arabic poetry's founding figure starts here.","dispute":"Dated purely by inference: Kinda's Ḥimyarite sponsor fell to Aksum in 525, so the revolt is placed alongside it. The date collides head-on with one of the two birth schemes for Imruʾ al-Qays, which would make him an infant in 525.","peopleIds":["hujr-ibn-al-harith","imru-al-qays-poet"],"politiesIds":["kinda"],"source":"https://en.wikipedia.org/wiki/Imru%27_al-Qais"},{"id":"shanfara-dies","year":525,"endYear":null,"title":"Al-Shanfarā dies one short","ar":"موت الشنفرى","evidence":"TRAD","dateCertainty":"legendary","dateRange":[510,540],"estimated":true,"dateNote":"No dates exist for al-Shanfarā at all; c. 525 is a handbook convention.","placeId":"sarawat","category":"birth-death","summary":"He had sworn to kill a hundred men of the Azd and died having killed ninety-nine. Later an Azdī man kicked his skull, took a splinter in his foot and died of the infection — which the tradition treats as completing the vow. The unfinished claim of the dead acting in the world, which is the same idea as the thirsty soul-bird of an unavenged killing.","dispute":"No dates whatsoever exist for al-Shanfarā in the accessible sources; c. 525 is a handbook convention. His tribe, conventionally Azd or Banū Salāmān, is likewise unsourced. The Lāmiyyat al-ʿArab that made him famous has been disputed since medieval times — al-Tibrīzī credited Khalaf al-Aḥmar, a known 8th-century forger of ancient verse.","peopleIds":["al-shanfara"],"politiesIds":[],"source":"https://en.wikipedia.org/wiki/Al-Shanfara"},{"id":"al-harith-ibn-amr-dies","year":528,"endYear":null,"title":"Death of al-Ḥārith ibn ʿAmr the Kindite","ar":"وفاة الحارث بن عمرو","evidence":"EXT","dateCertainty":"approximate","dateRange":[525,530],"estimated":true,"dateNote":"Placed c. 528 from the Byzantine notices, which do not fix the year.","placeId":"najd","category":"birth-death","summary":"The best-known Kindite king, and the first attested in Byzantine sources, was killed in the Syrian Desert. His four sons split the Maʿadd command between them and spent the next years killing each other.","dispute":"The sources cannot agree whether the Lakhmid al-Mundhir III killed him or the Banū Kalb did.","peopleIds":["al-harith-ibn-amr"],"politiesIds":["kinda","lakhmids"],"source":"https://en.wikipedia.org/wiki/Kingdom_of_Kinda"},{"id":"jabal-usays","year":528,"endYear":null,"title":"Jabal Usays inscription","ar":"نقش جبل أسيس","evidence":"EPI","dateCertainty":"fixed","dateRange":[528,528],"estimated":false,"dateNote":"Fixed by the Bostran era date on the stone.","placeId":"jabal-says","category":"inscription","summary":"Cut '423 after Bosra' on a volcanic hill about 105 km south-east of Damascus, and described as the only pre-Islamic Arabic inscription with real historical content.","dispute":"The accessible publication gives the date and findspot but not the text, so the names usually attached to it could not be confirmed.","peopleIds":[],"politiesIds":["ghassanids"],"source":"https://www.islamic-awareness.org/history/islam/inscriptions/usays.html"},{"id":"thannuris","year":528,"endYear":null,"title":"Battle of Thannuris","ar":"معركة ثنوريس","evidence":"EXT","dateCertainty":"fixed","dateRange":[528,528],"estimated":false,"dateNote":null,"placeId":"thannuris","category":"battle","summary":"Belisarius was beaten in upper Mesopotamia and the Ghassanid king Jabalah IV died on the field. His son al-Ḥārith took over the phylarchate.","dispute":null,"peopleIds":["jabalah-iv","al-harith-ibn-jabala"],"politiesIds":["ghassanids","byzantines","sasanians"],"source":"https://en.wikipedia.org/wiki/Iberian_War"},{"id":"harith-made-king","year":529,"endYear":569,"title":"Justinian makes al-Ḥārith a king","ar":"تنصيب الحارث ملكًا","evidence":"EXT","dateCertainty":"fixed","dateRange":[528,529],"estimated":false,"dateNote":"His elevation is given as c. 528 in one article and 529 in another; endYear carries his reign to his externally dated death in 569.","placeId":"constantinople","category":"politics","summary":"Justinian raised al-Ḥārith ibn Jabala to kingship and to patrikios, with command over all Byzantium's Arab allies in the East — the highest imperial title ever given a foreign ruler. One Arab king now answered for the whole frontier.","dispute":"His reign start is given as c. 528 in one article and 529 in another.","peopleIds":["al-harith-ibn-jabala","justinian"],"politiesIds":["ghassanids","byzantines"],"source":"https://en.wikipedia.org/wiki/Al-Harith_ibn_Jabalah"},{"id":"mundhir-syria-raid-529","year":529,"endYear":null,"title":"Al-Mundhir III burns through Syria","ar":"غزو المنذر للشام","evidence":"EXT","dateCertainty":"fixed","dateRange":[528,529],"estimated":false,"dateNote":"
