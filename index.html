ن سطرًا ونحو أربعمائة وسبعين كلمة» — فالشيءُ معروفٌ بالعربية ورَقمُه ليس كذلك، ولذلك يتعذّر تتبُّعُ الحُجّة النقشية في عام الفيل من المصادر العربية وحدها، والمَرجِعُ فيها DASI.","dateNote":"ثابتٌ بتاريخه الحِمْيَريّ المنقوش فيه."},"dam-breach-548":{"title":"انكسارٌ وترميم","summary":"انبثاقٌ كبيرٌ آخر، جُوبِه بأكبرِ حملةِ ترميمٍ موثَّقةٍ في القرن.","dispute":null,"dateNote":"ثابتٌ بنقش CIH 541."},"duma-graffito":{"title":"نقشُ دومة الجندل","summary":"خَربَشةٌ نصرانيةٌ بالعربية قديمةِ الخطّ، مؤرَّخةٌ بسنة 443 من تأريخها، نُشرت سنةَ 2017، تُفتَح بـ«ليُذكَرْ. ذكرَ اللهُ» رجلًا وابنَه. كتابةٌ عربيةٌ نصرانيةٌ في وسط البادية الشمالية.","dispute":null,"dateNote":"تاريخُ الخَربَشة نفسُها — سنةُ 443 — يُحوَّل إلى 548/549."},"murayghan-1":{"title":"نقشُ مريغان","summary":"مؤرَّخٌ من داخله بسنة 662 شهرَ ذي عِلّان، أي أيلولَ 552. غارةُ أبرهةَ الرابعةُ على مَعدٍّ بعد ثورة بني عامر: مَعدٌّ مَكسورة، ورَهائنُ مأخوذة، وعمرو بن المنذر صاحبُ الحيرةِ يَستسلِم ويُسلِّم ابنَه. ومكّةُ لا تُسمّى فيه في موضع.","dispute":"هذا هو مِحورُ الحُجّة في عام الفيل — تَقبَل إيوونا غايدا سنةَ 552 تاريخًا للحملة الشمالية لأنّ هذه وحدَها المؤرَّخة. وهو يَضَع عمرو بن المنذر في المَيدان سنتَين قبل أن يُجلِسه الجدولُ المُواضَعُ عليه على عرش لخم. والمصادر العربية لا تذكر نقوشَ مريغانَ ألبتّة.","dateNote":"ثابتٌ بتاريخه الداخلي: سنةُ 662 من التأريخ الحِمْيَريّ، شهرُ ذي عِلّان."},"amr-ibn-hind-accession":{"title":"تولّي عمرو بن هند","summary":"جاء إلى عرش لخمٍ رجلٌ شديدُ الغضب، أمُّه كِنديّة. وجَذَب بلاطُه طرفةَ والمتلمّسَ والحارثَ بن حِلِّزةَ وعمرو بن كلثوم — فقَتَل واحدًا منهم وقَتَله آخر. وأمُّه هندُ بنتُ الحارث بن عمرو بن حُجرٍ آكلِ المرار، وهي عمّةُ الشاعر امرئ القيس، ونُسب إليها تمييزًا له من أخيه عمروٍ الأصغرِ ابنِ أُمامة.","dispute":"نقشُ Ry 506 يَجعله عاملًا باسم «عمرو بن المنذر» سنةَ 552، قبل التولية المُواضَعِ عليها؛ ولعلّه كان نائبًا عن أبيه. وتضطرب المصادر العربية فيه أيضًا: المقدِّمةُ تقول إنّ وفاته تقديرًا سنةَ خمسٍ وأربعين قبل الهجرة، أي 578م، والجدولُ يقول 569 — في المقال الواحد.","dateNote":"الجدولُ المُواضَعُ عليه يعطي 554، ونقشُ Ry 506 يَجعل عمرو بن المنذر عاملًا سنةَ 552 - ولعلّه نائبٌ عن أبيه؛ و`endYear` يَمُدّ العهدَ إلى مقتله، وهو نفسُه مُعطًى 568/9 أو 569 أو 570."},"yawm-halima":{"title":"يومُ حليمة","summary":"في حَزيرانَ كسر الغساسنةُ جيشًا لخميًّا قربَ قِنَّسرين. فسقط المنذرُ الثالثُ في المَيدان بعد خمسين سنةً من الغزو؛ وفَقَد الحارثُ بن جبلةَ ابنَه الأكبرَ جبلة. واليومُ مُسمًّى بحليمةَ بنتِ الحارثِ نفسِه، وهو اليومُ الوحيد من أيام العرب الذي يُمكِن تثبيتُه بمعركةٍ مؤرَّخةٍ خارجيًّا.","dispute":"المعركةُ قربَ قِنَّسرين في حَزيران 554 مُسنَدةٌ خارجيًّا؛ والاسمُ «يومُ حليمة» من الرواية العربية، فالجَمعُ بينهما إعادةُ بناءٍ علميةٌ هو نفسُه. وجدولُ مقالٍ مرجعيٍّ يَبسُط المعركةَ على العراق والأردنّ والشام ومتنُه يضعها قربَ قِنَّسرين. والمصادر العربية تُعيِّن حليمةَ بنتَ الحارث نفسِه، وهو أضبطُ من «أميرةٌ غسّانيةٌ أعانت مقاتلي قبيلتها». وهي تُبقي يومَ حليمةَ ويومَ عين أباغَ مفترقَين افتراقًا تامًّا، مَدخلَين متتاليَين مستقلَّين: عينُ أباغَ مقتلُ المنذر بن ماء السماء — الأب — ومرجُ حليمةَ مقتلُ المنذر بن المنذر — الابن. معركتان، جِيلان، الأسرةُ نفسُها، والخصمُ الغسّانيُّ نفسُه.","dateNote":"مُثبَتٌ في حَزيران 554 بالخبر اليوناني عن المعركة قربَ قِنَّسرين؛ وجَمعُ تلك المعركةِ بيوم حليمةَ إعادةُ بناءٍ حديثةٌ هو نفسُه."},"ayn-ubagh":{"title":"يومُ عين أباغ","summary":"نزل المنذرُ بالعين وطلب الفديةَ وإلّا فالحرب. فاقترح الحارثُ الغسّانيُّ أن يُخرِج كلُّ جانبٍ ابنًا للمُبارَزة، فإذا فنيت الأبناءُ خرج الشيخان بنفسَيهما. فعَمَد المنذرُ إلى شُجاعٍ من أصحابه فأوهم الناسَ أنّه ابنُه؛ وجاء مُنشَقٌّ فأخبر الحارث؛ فالتقى الجيشان في الغد، فقُتل المنذر، وحَمَل الحارثُ ابنَيه القتيلَين على بعيرٍ كعِدلَين وجعل جسدَ الملكِ فوقَهما — فمن هنا المثلُ في العِلاوةِ دونَ العِدلَين. ثمّ أحرق الحيرةَ ودفن ابنَيه فيها.","dispute":"غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه. ويُخلَط به يومُ حليمةَ خلطًا دائمًا في الكتابة الحديثة، وابنُ الأثير يُدرِجهما بابَين متتاليَين مستقلَّين بينهما جيل: عينُ أباغَ مقتلُ المنذر بن ماء السماء، ومرجُ حليمةَ مقتلُ ابنه. فالالتباسُ خطأُ الأدب الثانويّ الحديثِ لا خطأُ المصادر العربية. والمصدرُ يَصُوغ المُبارَزةَ اتفاقًا صريحًا لا تقديمةً دينية، وهذا تصحيحٌ لرواية «أنّه ضحّى بابنه».","dateNote":"غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه. وُضع بين الجِيلَين اللخميَّين لأنّ ابنَ الأثير يُدرِجه جيلًا قبل مرجِ حليمة."},"dam-repair-557":{"title":"آخرُ ترميمٍ للسدّ","summary":"آخرُ عملٍ مُسجَّلٍ على سدّ مأرب. وبعدَه لا يبقى أحدٌ له من السُّلطان ما يَستنفِر به الأيدي. والمصادر العربية لا تُعطي سنةَ ترميمٍ أخيرةً أصلًا، وتعطي 575 وحدَها للانهيار النهائي.","dispute":null,"dateNote":"مؤرَّخٌ بنقش الترميم؛ ويُعطي موجَزٌ 558 وتَقرأ النشرةُ 557."},"last-himyarite-text":{"title":"آخرُ نقشٍ حِمْيَريٍّ مؤرَّخ","summary":"نقشُ كنيسةٍ هو آخرُ نصٍّ حِمْيَريٍّ مؤرَّخٍ معروف. فالسجلُّ النقشيُّ الجنوبيّ — وهو التأريخُ الحقيقيُّ الوحيد في الجزيرة — يَسكُت عشرَ سنين قبل عام الفيل المُواضَعِ عليه.","dispute":null,"dateNote":"تحويلُ التأريخ يعطي 559/560."},"barqi-robin-naiit":{"title":"نقشُ ناعط","summary":"نقشٌ سبئيٌّ ناقصٌ من تسعة أسطرٍ على نُصبٍ من ناعط، نُشر سنةَ 2025، يُسمّي أبرهةَ ويَصِف عملًا عسكريًّا حولَ صنعاء. والسطرُ الخامسُ قد يُقرأ فيه «الفيول» والسادسُ «الأُسود»؛ وفي السابع «رحمنن الذي في السماء»، وهي صيغةٌ كانت تُوجَد قبلُ في النصوص اليهودية بالأكثر.","dispute":"قراءةُ الفيلةِ غيرُ مؤكَّدة — الكلمةُ متلِفةٌ وأصلُها مشكوك. فلو ثبتت لكانت أولَ فيلٍ نقشيٍّ في جنوب الجزيرة. فليُعامَل بحثًا جاريًا. وتاريخُ الحدث نفسِه مجهول، والمدى هنا هو المدى المعقولُ لحملات أبرهةَ الشمالية.","dateNote":"النقشُ لا يَحمِل تاريخًا؛ والمدى هو المدى المعقولُ لحملات أبرهةَ الشمالية."},"harith-aaraj-vs-taghlib":{"title":"الحربُ بين الحارث الأعرج وبني تغلب","summary":"حملةٌ غسّانيةٌ منفصلةٌ على تغلب، اصطدم فيها عمرو بن كلثومٍ بالحارث بن أبي شَمِر.","dispute":"يُعرَف عنوانَ بابٍ عند ابن الأثير مع الأسماء المُلحَقةِ به؛ وغيرُ مؤرَّخ. وهو الصِّلةُ الوحيدةُ المُسنَدةُ بين عمرو بن كلثوم والبلاط الغسّاني.","dateNote":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ الحارث الأعرج."},"samawal-dies":{"title":"وفاةُ السموأل","summary":"مات سيّدُ الأبلقِ اليهوديُّ بتيماء، وذِكرُه قائمٌ على رَفضٍ واحد: أبى أن يُسلِّم ودائعَ امرئ القيس، ونَظَر إلى مُحاصِريه يَقتُلون ابنَه بين يدَيه ولا يَخون. و«أوفى من السموأل» مثلٌ بعدَه بقرون.","dispute":"تاريخُ نحو 560 إعادةُ بناء. ونسبُه متنازَعٌ فيه — يجعله ابنُ دريدٍ ابنَ كاهن، ويعطيه الجوالِيقيُّ أمًّا غسّانيةً وأبًا أزديًّا. وغيرُ معلومٍ أكان امرؤ القيس حيًّا أم ميتًا حين وقع الحصار.","dateNote":"نحو 560 إعادةُ بناء، وغيرُ معلومٍ أكان امرؤ القيس حيًّا حين وقع الحصار."},"awara-ii":{"title":"يومُ أوارةَ الثاني","summary":"عمرو بن هندٍ في وجه بني تميم.","dispute":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ عمرو بن هند.","dateNote":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ عمرو بن هند."},"fifty-year-peace":{"title":"صلحُ الخمسين سنة","summary":"أُغلِقت الحربُ الطويلةُ 540–562 بعَهد. فدام أقلَّ من عقد.","dispute":null,"dateNote":null},"imru-constantinople":{"title":"سفارةُ امرئ القيس","summary":"بلغ الأميرُ الكِنديُّ المَسلوبُ يوستنيانوسَ بكتاب تعريفٍ مَرَّ به في أرض غسّان، فعاد بوعودٍ وربّما بجُندٍ قليل. ويُروى أنّ يوستنيانوسَ سأل أكسومَ أن تَنصُره فأبت، لِما بينها وبين كندةَ من ثأر.","dispute":"الرحلةُ أخبارٌ لا سجلّ، وإحدى الصور الثلاثِ للتأريخ تُسقِطها جملةً. فالمصادر العربية تُجري حياتَه 496–544، وذلك يَجعله ميتًا قبل السفارة بسبعةَ عشرَ عامًا؛ وعلى صورة الميلادِ الإنجليزيةِ الأولى هو رجلٌ في الثالثة والستّين أو الرابعة يَعبُر الدنيا في سفارة؛ وعلى الثانية هو في السنّ الصحيحة ولكنّه كان رضيعًا حين قُتل أبوه. والوسيطُ مُسمًّى في المصادر العربية: الحارثُ أميرُ الغساسنة.","dateNote":"مؤرَّخٌ بالرجوع من وفاة الشاعر وحدَها، وهي نفسُها مُعطاةٌ على 561-565 - والتأريخُ العربيُّ لحياته 496-544 يُخرِج السفارةَ من السجلّ ألبتّة."},"imru-death":{"title":"وفاةُ امرئ القيس","summary":"مَرِض في طريق العودة فمات بالأناضول. تقول الحكايةُ إنّ يوستنيانوسَ أرسل إليه حُلّةً مسمومةً بعد وَشايةٍ في البلاط؛ وأكثرُ المؤرّخين يرى أنّه المرضُ الجلديُّ المُزمِن الذي يُسمّيه في شعره. ويُروى أنّ تمثالًا كان على قبره لا يزال يُرى سنةَ 1262.","dispute":"الحُلّةُ المسمومةُ طِرازٌ عالميٌّ في الفولكلور — «الثوبُ المسموم» — لا حكايةٌ خاصّةٌ به؛ فتُستعمَل إشاعةً في داخل العالَم، وهو موقعُها الصحيح. والمصادر العربية تعطي 544 للوفاة لا 565 — رقمٌ يُلغي السفارةَ إلى القسطنطينية إلغاءً تامًّا، وهو أحدُّ تعارضٍ انكشف في المراجعة العربية كلِّها. والمرضُ الجلديُّ هو التفسيرُ المعتاد، ومنه لقبُه «ذو القروح». وغيرُ معلومٍ أيضًا أمات قبلَ حصار الأبلقِ الذي قُتل فيه ابنُ السموألِ من أجل ودائعه أم بعدَه.","dateNote":"مُعطًى على 561-565؛ ولا مصدرَ يُثبِت السنة. والمصادر العربية تؤرِّخ وفاته بـ544، وهو تأريخٌ ثالثٌ لا صورةٌ من هذا."},"amr-ibn-hind-killed":{"title":"مقتلُ عمرو بن هند","summary":"أساءت هندٌ إلى أمّ الشاعر. فقَتَل عمرو بن كلثومٍ التَّغلِبيُّ مَلِكَ لخمٍ على مائدته من أجل ذلك، وخرج من الحيرة. فتولّى أخوه قابوسُ العرشَ بعده.","dispute":"مُعطًى 568/9 في مصدرٍ و569 أو 570 في آخر.","dateNote":"مُعطًى 568/9 في مصدرٍ و569 أو 570 في آخر."},"dahis-race":{"title":"سباقُ داحسٍ والغبراء","summary":"قبل الخيل كانت دِرع. اشترى قيسُ بن زهيرٍ العبسيُّ درعًا من أُحَيحة بن الجُلاح، فأخذها الربيعُ بن زيادٍ ولم يردّها، فأغار قيسٌ على إبل الربيعِ وباعها بمكّةَ واشترى بثمنها خيلًا منها داحس — ثمّ حَمَلت فرسُه بالغبراء. فأصلُ النزاعِ في جذر الحربِ دِرعٌ لا فرس. ثمّ أجرى قيسٌ فرسَيه في وجه الخَطّارِ والحنفاءِ لحذيفةَ بن بدر، في شَوطٍ يُركَض في أربعين ليلة، والرهنُ عشرةُ أذواد. فأكمن رجالٌ في الشِّعاب فصرفوا السابقَ عن الغاية. فأبى الخاسرُ أن يَفُكّ الرهن، وقُتل أهلُ الفائز، فتَلَتْها أربعون سنةَ حربٍ لم تُنتِج فيها القبيلتان بعيرًا ولا فرسًا.","dispute":"ثلاثُ صورٍ للسباق متعارضة، وروايتان في سبب الحرب. فأمّا السبب فالمصادر العربية تضع قبل السباق ما تُسقِطه الحكايةُ الشائعة: اشترى قيسٌ درعًا من أُحَيحة بن الجُلاح، فأخذها الربيعُ بن زيادٍ ولم يردّها، فأغار قيسٌ على إبله وباعها بمكّةَ واشترى بثمنها الخيل — فالأصلُ دِرعٌ لا فرس. والروايتان كلتاهما ينبغي أن تَقوما. وأمّا السباق: فصورةُ العقد الفريد تجعل حَمَلَ بن بدرٍ — لا حذيفةَ — هو مَن أكمن الفتيان، وداحسًا فرسَ قيسٍ المَصروفَ عن الغاية؛ وصورةُ ابن الأثير تجعل داحسًا والغبراءَ كلَيهما لقيس، ورجلًا من بني أسدٍ ألقى داحسًا في الماء فعطَّله، وسقطت الحنفاء، وتقدّمت الغبراءُ الخَطّار — فالاسمُ الذي تُعرَف به الحربُ يَقرِن فرسَين يجعلهما مصدرٌ غَريمَين ومصدرٌ آخرُ رفيقَي إصطبل. والتصعيدُ مُزدوَجٌ كذلك: جاء ابنُ حذيفةَ نَدْبةُ، أو ابنُه مالكٌ، يَطلُب الرهنَ فقَتَله قيس، فاتّفقت القبائل على مائة ناقةٍ ديةً دَفَعها الربيعُ بن زيادٍ وحدَه. وبَرَكةُ الحربِ كلِّها نحو 568–609 إعادةُ بناءٍ لميور لا تاريخُ مصدر.","dateNote":"السباقُ غيرُ مؤرَّخ؛ وبَرَكةُ الحربِ المُواضَعُ عليها نحو 568-609 إعادةُ بناءٍ فيكتوريّةٌ لسِر وليَم ميور لا تاريخُ مصدر، و`endYear` يحمل تلك البَرَكةَ لتُرسَم الحربُ شريطًا."},"harran-inscription":{"title":"نقشُ حرّان","summary":"نقشٌ مزدوجٌ باليونانية والعربية على مَشهد القدّيس يوحنّا، جنوبَ دمشق. بناه شراحيلُ بن طالِمو في «سنةِ 463 بعد خَراب خيبر» — أي أنّ ثمّ تأريخًا عربيًّا محليًّا كان يَجري من غارةٍ على واحةٍ نحوَ سنة 105م.","dispute":"اسمُ أبي الباني يُقرأ في النشرةِ «طالِمو» لا «ظالم» كما يُنقَل كثيرًا.","dateNote":"ثابتٌ بتاريخ التأريخ المحليّ: سنةُ 463 بعد خَراب خيبر، ومَبدؤه نحو 105م."},"dahis-ghadaq":{"title":"يومُ الغَدَق","summary":"يُسمّى أولَ صِدامٍ كبيرٍ في الحرب. انهزمت فزارةُ، وأسر الربيعُ بن زيادٍ حذيفةَ نفسَه، وأخفق حُرُّ بن الحارث في قتله هناك.","dispute":"غيرُ مؤرَّخ؛ ولا يُعرَف إلّا من نصّ ابن الأثير على «المرجة». وقُتل فيه عوفُ بن يزيدَ على يد جُندب بن خلف.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ تحمل موضعَ اليوم في ترتيب العقد الفريد."},"harith-ibn-jabala-dies":{"title":"وفاةُ الحارث بن جبلة","summary":"أربعين سنةً مَلِكًا، وباتريكيوسَ، وصانعَ أساقفةٍ مونوفيزيّين، وصاحبَ حليمة — مات في زلزالٍ مَرويّ. فتولّى ابنُه المنذرُ فبقي اثنتَي عشرةَ سنة.","dispute":null,"dateNote":null},"letter-archimandrites":{"title":"رسالةُ رؤساء الأديرة","summary":"مجمعٌ جَمَعه الغساسنةُ أخرج رسالةً وقَّع عليها مُمثِّلو مائةٍ وسبعةٍ وثلاثين ديرًا. وهي مِقياسُ ما كانت رعايةُ مملكةٍ عربيةٍ عميلةٍ للكنيسةِ تَبلُغه في الحقيقة.","dispute":null,"dateNote":"الرسالةُ مؤرَّخةٌ بـ569 أو 570."},"tarafa-executed":{"title":"إعدامُ طرفة","summary":"هَجا الملكَ في شعره. فأرسله عمرو بن هندٍ وعمَّه المتلمّسَ إلى بلادهما، مع كلٍّ منهما كتابٌ مختومٌ لعامله بالبحرين. ولم يكن أحدُهما يَقرأ. فأقرأ المتلمّسُ كتابَه غلامًا من أهل الحيرة، فعَلِم أنّه يأمر بأن يُدفَن حيًّا، فألقاه في النهر وحثَّ طرفةَ على مِثله — فأبى طرفةُ أن يَفُضّ خاتَمَ المَلِك. وكان نحوَ ابنِ سِتٍّ وعشرين.","dispute":"الدفنُ حيًّا روايةٌ من روايات. والقصّةُ كلُّها أخبارٌ نَمَت حولَ القصائد.","dateNote":"موضوعٌ نحو 569 داخل عهد عمرو بن هند؛ والقصّةُ أخبارٌ نَمَت حولَ القصائد."},"malik-ibn-zuhayr-killed":{"title":"مقتلُ مالك بن زهير","summary":"نزل أخو قيسٍ باللُّقاطة فدُلَّ عليه حذيفةُ فقُتل. ومَرثيةُ عنترةَ فيه من القليل الذي تَنسُبه المصادرُ الأولى إلى عنترةَ حقًّا.","dispute":"غيرُ مؤرَّخ. وقد قُبِل في مَقتله زمانًا مائتا بعيرٍ وأربعةُ أعبُدٍ ورَهائنُ مَحبوسة — وهي واحدةٌ من تسوياتٍ مؤقَّتةٍ عديدةٍ أكلتها الحربُ.","dateNote":"غيرُ مؤرَّخ؛ وُضع بموضعه في تسلسل داحس."},"monasteries-of-hind":{"title":"ديرا هند","summary":"ديران بالحيرة، ديرُ هندٍ الكبرى وديرُ هندٍ الصغرى، كلاهما مبنيٌّ في النصف الثاني من القرن السادس. وهندٌ أميرةٌ كِنديّةٌ تزوّجها المنذرُ الثالث؛ فتنصَّرت وبَنَت ديرَها في العاصمة، وزوجُها لم يَتنصَّر.","dispute":"نساءُ لخمٍ المسمَّياتُ هندًا — الكبرى والصغرى والحُرَقة — يَلتبِسن في الرواية التباسًا مستمرًّا، والمصادر تُسمّي هندًا واحدةً بنتَ النعمان وحفيدتَه في مواضعَ مختلفة.","dateNote":"لا يُؤرَّخان إلّا بالنصف الثاني من القرن السادس."},"sasanian-conquest-yemen":{"title":"الفتحُ الساسانيُّ لليمن","summary":"حملةٌ صغيرةٌ على رأسها وَهْرِز، أبحرت بثماني سُفُنٍ على الأقلّ يُروى أنّ اثنتَين منها غَرِقت، حاصرت صنعاءَ فأنهت الحكمَ الحبشي. فصار جنوبُ الجزيرة ولايةً ساسانية، والفتحُ مَعدودٌ رسميًّا في أسباب الحربِ البيزنطيةِ الفارسيةِ التالية.","dispute":null,"dateNote":"حصارُ صنعاءَ مؤرَّخٌ بـ570 في السجلّ الخارجي؛ وخطٌّ من الأدبيّات يضع الضمَّ الساسانيَّ سنةَ 575 أو 578 بدلًا من ذلك."},"satih-prophecy":{"title":"نبوءةُ سَطيح","summary":"زلزالٌ أسقط أعمدةً في إيوان فارس، وخَمَدت النارُ المقدّسة بإصطَخر، وغاضت بُحيرةُ ساوَة، ورأى الموبَذُ في منامه إبلًا تَقُود خيلًا عربيّةً عَبْرَ دجلة. فأرسل كسرى يَطلُب حكيمًا عربيًّا، فبعث مَلِكُ الحيرة نصرانيًّا رَكِب إلى الشام يَطلُب سَطيحًا — بلا عظامٍ، على حدّ الموت، وصاحبُه شِقٌّ قد مات. فقال سَطيحٌ إنّ نبيًّا عربيًّا سيأتي، وإنّ مُلكَ فارسَ سيَصير إلى العرب، وإنّ عددَ ما سقط من الأعمدة عددُ ما بقي من الملوك. ثمّ مات.","dispute":"يَقرأ سافران سَطيحًا وشِقًّا بناءَين أدبيَّين من أوّل العصر العبّاسي، «واصِلَين» أُدخِلا ليَشُدّا جزيرةَ العربِ القديمةَ والساسانيّين وظهورَ الإسلام في سَردٍ واحد، وعامِلَي تَشريعٍ يُحمَّل بهما عربُ الجاهلية تيّارًا توحيديًّا خافيًا. والمسعوديُّ وابنُ دريدٍ يضعان الآياتِ الفارسيةَ في عهد خسرو الثاني لا الأول. وإسنادُ الخبر الأصلِ مُلفَّق. فاستعمالُ هذين شخصيّتَين من القرن السادس إعادةٌ لأيديولوجيا عبّاسيةٍ لا لواقعِ القرن السادس.","dateNote":"غيرُ مؤرَّخ. وُضع على عَتَبة مولد محمدٍ المُواضَعِ عليها لأنّ هذا موضعُه في السَّرد، لا حيث يؤرِّخه مصدر."},"tikhfa-day":{"title":"يومُ طَخفة","summary":"غَلَبت بنو يَربوعٍ قوّةً لمَلِكٍ لخميّ.","dispute":"وأيُّ مَلِكٍ متنازَعٌ فيه: قائمةُ القلقشندي تقول قابوسَ بن المنذر، وفاجرنيت يقول المنذرَ بن ماء السماء — أبٌ أو ابن. ويُكتَب «طَخفة» في فهرس ابن الأثير و«طَحفة» في فهرس العقد الفريد. وغيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ، والمصادر تختلف في أيّ مَلِكٍ لخميٍّ — أبٌ أو ابن — قاتل فيه."},"year-of-elephant":{"title":"عامُ الفيل","summary":"تقول الروايةُ إنّ أبرهةَ سار شمالًا على مكّةَ بفيلة الحرب، فأخذ طريقَ الطائف، وفَقَد دليلًا قربَ المُغمَّس، فرُدَّ على عَقِبه. وتُعطى السنةُ نفسُها لمولد محمد، ومنها يُحسَب التأريخُ المكّيُّ كلُّه.","dispute":"متنازَعٌ فيه في خمس جهاتٍ على الأقل: المُواضَعةُ نحو 570–571؛ و568 أو 569 من مكتشفاتِ جنوبِ الجزيرة؛ و552 على سَنَد Ry 506، وتَقبَلها غايدا، وهي لا تذكر مكّة؛ و«عقدٌ أو عقدان قبل 570»؛ والرابعَ عشرَ من شباط 572 عند إبراهيم زين وأحمد الوكيل. والمصادر العربية تُضيف سَنَدًا لا ترِده الإنجليزية: المسعوديُّ يجعل الحملةَ في السنة الموافقةِ للسنة الأربعين من حكم كسرى أنوشروان، أي 571م. وعن الزُّهريّ — نقلها عبد الرزّاق الصنعاني — روايةٌ تضعها قبل أن يُولَد أبو النبيّ، وهي تُناقِض مُواضَعةَ سنة 570 من داخل الرواية نفسِها. وسجلُّ أبرهةَ النقشيُّ يَنتهي عند 559/560. وثُلمةٌ في المرجع العربي لا بُدّ من إثباتها هنا: المصادر العربية العامّة لا تذكر CIH 541 باسمه، ولا نقوشَ مريغان، ولا سنةَ 552 ألبتّة — فمسألةُ عام الفيل النقشيةُ غائبةٌ عن المرجع العربي الشائع غيابًا تامًّا، وعلى القارئ بالعربية أن يَرجِع فيها إلى DASI.","dateNote":"متنازَعٌ فيه في خمس جهاتٍ على مدى 552-572. والمُواضَعةُ 570-571 جَمعٌ بُني لتثبيت مولد، والحملةُ الشماليةُ الوحيدةُ المؤرَّخةُ لأبرهة — Ry 506 سنةَ 552 — لا تذكر مكّة."},"muhammad-born":{"title":"مولدُ محمد بن عبد الله","summary":"وُلد بمكّةَ بعد موت أبيه عبد الله بن عبد المطّلب، من بني هاشمٍ من قريش. والمولدُ المُواضَعُ عليه الثانيَ عشرَ من ربيعٍ الأول، ويُعطى السابعَ عشرَ منه أيضًا. والتأريخُ المكّيُّ يُحسَب إلى الأمام من هذه السنة، ولذلك يَسري ما فيها من شكٍّ في كلّ ما يُؤرَّخ بعُمره.","dispute":"السنةُ مَبنيّةٌ على جَمعٍ مع عام الفيل، وذلك الحدثُ متنازَعٌ فيه في خمس جهاتٍ على مدى 552–572 — ومنها 552 على سَنَد Ry 506 وهو لا يذكر مكّة، وروايةُ الزُّهريّ التي تضع الفيلَ قبل أن يُولَد عبدُ الله، وهي تُناقِض جَمعَ المولد من داخل الرواية. ولا دليلَ نقشيًّا ولا أثريًّا ولا وثيقةً خارجيةً على مكّةَ ولا على قريشٍ قبل سنة 632؛ والسجلُّ المكّيُّ كلُّه أدبيٌّ كُتب بعدَها بنحو قرنٍ ونصف.","dateNote":"مُعلَّقٌ بعام الفيل، وهذا الأطلسُ يؤرِّخه على 552-572، فسنةُ المولد تَرِث ذلك المدى كلَّه؛ و570 هو الجَمعُ المُواضَعُ عليه لا تاريخٌ منقول."},"abd-allah-dies":{"title":"وفاةُ عبد الله بن عبد المطّلب","summary":"مات عبدُ الله بن عبد المطّلب خارجَ مكّةَ في سفرِ تجارة، وآمنةُ بنتُ وهبٍ حامل. فوُلد الصبيُّ في بيت جدِّه لا في بيت أبيه.","dispute":"لا مصدرَ يؤرِّخ الوفاةَ تأريخًا مستقلًّا؛ وإنّما تُروى مُدّةً مُقدَّرةً قبل المولد. وروايةُ الزُّهريّ التي تضع عامَ الفيل قبل أن يُولَد عبدُ الله لا يُمكِن التوفيقُ بينها وبين الصورة المعتادةِ التي تجعل عامَ الفيل عامَ المولد.","dateNote":"مؤرَّخٌ بالنسبة إلى المولد وحدَه — نحو ستّة أشهرَ قبله — فالسنةُ تتحرّك مع سنةِ مولدٍ متنازَعٍ فيها على 552-572."},"dahis-muraqqab":{"title":"يومُ المُرَيْقِب","summary":"أولُ يومٍ في قائمة الأيام المُرتَّبةِ الوحيدة التي تُعطيها المصادر لهذه الحرب: لبني عبسٍ على فزارة — على فزارةَ بخاصّةٍ لا على ذبيانَ عمومًا.","dispute":"مَدخلُ فهرسٍ لم يُستخرَج له سَرد. وغيرُ مؤرَّخ.","dateNote":"مَدخلُ فهرسٍ بلا سَردٍ ولا تاريخ؛ والسنةُ تحمل موضعَه في التسلسل."},"sayf-vassal-king":{"title":"حُكمُ سيف بن ذي يزن","summary":"عاد وارثُ حِمْيَرَ — وقد طاف سائلًا النَّصرَ ببيزنطةَ أولًا، ثمّ بالحيرة، ثمّ ببلاط كسرى نفسِه — مَلِكًا عليه خَراج. فطَعَنه خادمٌ حبشيٌّ فمات.","dispute":"الوفاةُ مُعطاةٌ 575 أو 578. وثمّ مشكلةٌ زمنيةٌ في السجلّ: يُروى أنّ الوسيطَ له كان النعمانَ الثالثَ اللخميّ، وعهدُه يبدأ بعد وفاة سيف. وفي المصادر العربية أنّ الذي أدخله على خسرو الأول هو عمرو بن هند.","dateNote":"حُكمُه مُعطًى 571-575، والقَتلُ 575 أو 578."},"dam-final-breach":{"title":"انهيارُ سدّ مأرب","summary":"طَفَح الماءُ على السدّ، وهذه المرّةَ لم يُصلِحه أحد. فالذي يُظهِره السجلُّ ليس سَيلًا واحدًا كارثيًّا بل دورةَ صيانةٍ امتدّت ستّةَ قرونٍ وانتهت بانهيار القدرةِ السياسيةِ على الترميم — في عين الوقت الذي انتقل فيه اليمنُ من أكسومَ إلى فارس.","dispute":"مُعطًى 570 أو 575 ولا مصدرَ لواحدٍ من الرقمَين. ويُقرأ سيلُ العَرِم القرآنيُّ على هذا، وإن كان بعضُ الباحثين يَشُدّ الآيةَ إلى انبثاقٍ نحوَ سنة 145 قبل الميلاد. والرقمُ الذي يُعاد كثيرًا — خمسون ألفَ مهاجر — مَوسومٌ بأنّه بلا سَنَدٍ فلا ينبغي نقلُه خبرًا ثابتًا. والمصادر العربية تعطي 575 رقمًا واحدًا لا مدًى، وتُعطي تفسيرًا سياسيًّا صريحًا: لم يُرمَّم بعدَها لغياب حكومةٍ مركزية، واضطراب الأمن، وتدخُّل الفرس، واستقلالِ زعماء القبائل بإقطاعاتهم.","dateNote":"مُعطًى 570 أو 575، ولا مصدرَ وراءَ واحدٍ من الرقمَين."},"justin-assassination-plot":{"title":"محاولةُ قتلِ المنذرِ الغسّانيّ","summary":"أمر الإمبراطورُ بقتل المنذر غِيلةً. فعَلِم المنذرُ، فقَطَع الصِّلةَ بالإمبراطورية التي خَدَمها أبوه أربعين سنة.","dispute":null,"dateNote":null},"dahis-dhu-husa":{"title":"يومُ ذي حُسى","summary":"لذبيانَ على عبس — وهو الانكسارُ العبسيُّ الواضحُ الوحيد في السلسلة، وكان لا يزال يُرمى به عبسٌ في الشعر بعد الهباءة.","dispute":"مَدخلُ فهرسٍ لم يُستخرَج له سَرد. وغيرُ مؤرَّخ.","dateNote":"مَدخلُ فهرسٍ بلا سَردٍ ولا تاريخ؛ والسنةُ تحمل موضعَه في التسلسل."},"dahis-yamariyya":{"title":"يومُ اليعمَرية","summary":"ظَفَرٌ لعبسٍ موضعُه بين ذي حُسى والهباءة. وتُسقِطه أكثرُ القوائم الشائعة للحربِ إسقاطًا تامًّا.","dispute":"مَدخلُ فهرسٍ لم يُستخرَج له سَرد، ولا موضعَ مُعطًى له. وغيرُ مؤرَّخ.","dateNote":"مَدخلُ فهرسٍ بلا سَردٍ ولا موضعٍ ولا تاريخ؛ والسنةُ تحمل موضعَه في التسلسل."},"ghassanids-sack-hira":{"title":"إحراقُ الحيرة","summary":"في السنة التي صالحوا فيها القسطنطينيةَ نفسِها، أحرق الغساسنةُ عاصمةَ المناذرة.","dispute":null,"dateNote":null},"rusafa-reconciliation":{"title":"الصلحُ في الرصافة","summary":"انقضت ثلاثُ سنواتٍ من القطيعة عند مَشهد القدّيس سرجيوسَ في البادية، بوَساطة قائدٍ بيزنطيّ. وأمر المنذرُ ببناءٍ هناك لا يزال نقشٌ يونانيٌّ يُعرِّفه به.","dispute":"ونقشُ الرصافة نفسُه غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه بلغته. والمصادر العربية تَذكُر من آثارهم بالرصافة «صهاريجَ مدينة الرصافة والقصرَ الأبيضَ والأزرق» وأديرةً كثيرة.","dateNote":"مؤرَّخٌ بـ575 في السجلّ اليوناني؛ ونقشُ الرصافة نفسُه غيرُ مؤرَّخ."},"dahis-habaa":{"title":"يومُ الهباءة","summary":"التقَوا في حرّ الصيف عند البئر، فاقتتلوا من الغداة إلى نصف النهار، فحَجَز بينهم الحرّ. وكان حذيفةُ يَشتكي الحرَّ في فخذَيه، فرجع إلى الماء كما توقَّع قيس، فاقتفت عبسٌ أثرَ الحوافر. وسأل حَمَلٌ أصحابَه مَن أكرهُ مَن يَرونه مُقبلًا، فقالوا: قيسٌ والربيع — فكان المُقبِلان هما. وسأل حَمَلٌ بالله وبالرَّحِم أن يَكُفّ فأبى قيس، يُجيب استغاثتَهم بـ«لبّيكم» ساخرًا — مُعارَضةً لصِبيةٍ كانوا يَستغيثون وهم يُقتَلون. ثمّ طَعنةٌ بمِعبَلةٍ عريضةِ النصل قَطَعت الصُّلب، وأتمَّت عليه السيوف. أكثرُ من أربعِ مئةِ قتيلٍ في جانب ذبيان، في مقابل نحو عشرين من عبس. وسمَّت فزارةُ اليومَ «البَوار» لا الهباءة.","dispute":"غيرُ مؤرَّخ. ونصُّ العقد الفريد لا يُسمّي القاتل؛ ونصّان على «المرجة» يَجزِمان بأنّ قرواشَ بن عمروٍ قَتَل حذيفةَ وأنّ أخاه حَمَلًا وابنَه ماتا هناك أيضًا، وأنّ حُصنَ بن حذيفةَ استُبقي لصِغَره. والمُثلةُ بالجسد مَرويّةٌ رَدًّا لما كان أنزله هو بالصِّبية. والفارسُ العبسيُّ المُسمّى في هذا اليوم شدّادُ بن معاويةَ على جَرْوة — وهو أبو عنترةَ، لا عنترة.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ تحمل موضعَ اليوم في ترتيب العقد الفريد."},"wahriz-returns":{"title":"عودةُ وَهْرِز","summary":"بعد مقتلِ المَلِكِ التابعِ عاد القائدُ الفارسيُّ فأخرج الأحباشَ إخراجًا لا رَجعةَ فيه، وحَكَم واليًا بنفسه، وأقام ابنَ سيفٍ صورةً للمُلك.","dispute":"مؤرَّخٌ بـ575 أو 578؛ والمصادر لا تَختار. وفي العربية أنّه عاد بنحو أربعة آلاف رجل.","dateNote":"مؤرَّخٌ بـ575 أو 578؛ والمصادر لا تَختار."},"amina-dies":{"title":"وفاةُ آمنةَ بنت وهب","summary":"ماتت آمنةُ وابنُها في السادسة تقريبًا، فصار يتيمًا من الجهتَين. والروايةُ تجعل موتَها في طريق العودة من زيارةِ أهلِ زوجها الميتِ بيثرب.","dispute":"مؤرَّخٌ بعُمرِ الصبيِّ وحدَه. ولا يَمَسُّها شيءٌ من خارج العربية ألبتّة.","dateNote":"مَحسوبٌ سنةَ ابنِها السادسة، فالسنةُ تتحرّك مع مولدٍ موضوعٍ في أيّ موضعٍ من 552-572."},"abd-al-muttalib-guardianship":{"title":"كفالةُ عبد المطّلب ثمّ أبي طالب","summary":"صار اليتيمُ إلى جدِّه عبدِ المطّلبِ سيّدِ بني هاشم، وبموتِ الشيخِ بعد نحو سنتَين إلى عمِّه أبي طالب. وهذا النَّقلُ هو الذي أدخله في حِماية بني هاشمٍ أربعين سنةً بعدها، والحِمايةُ هي عينُ ما اضطُرّت المعارضةُ المكّيّةُ إلى الالتفاف عليه فيما بعد.","dispute":"المُدّةُ ووفاةُ عبد المطّلب كلتاهما حِسابٌ من سنةِ مولدٍ متنازَعٍ فيها. ولم يُعثَر على تاريخٍ ألبتّة لزمن عبد المطّلب، والتأريخُ النَّسَبيُّ المكّيُّ الذي وراءَه مُتعارِضٌ من داخله بقرنٍ كامل.","dateNote":"مُدّةُ سنتَين مَحسوبةٌ من سنة الصبيِّ السادسة إلى الثامنة، فتَزحَف مع مولدٍ موضوعٍ في أيّ موضعٍ من 552-572؛ ولا مصدرَ يؤرِّخ زمنَ عبد المطّلب نفسِه ألبتّة."},"hatim-dies":{"title":"وفاةُ حاتم الطائي","summary":"مات سيّدُ طيءٍ الذي كان يُعطي كلَّ شيءٍ إلّا مَركَبه وسِلاحَه، ودُفن قربَ حائل. و«أكرمُ من حاتم» مثلٌ حيٌّ إلى اليوم. وقد عدّه ابنُ عبد ربه أحدَ أكرمِ ثلاثةٍ في الجاهلية، مع كعب بن مامةَ وهَرِم بن سِنان.","dispute":"تاريخُ 578 من «كتاب الأغاني» وحدَه. وروايةٌ أخرى تضع وفاتَه في عام مولدِ محمد، ودِربلو يَذكُر القبرَ في موضعٍ آخرَ تمامًا. ولا تاريخَ لمولده.","dateNote":"تاريخُ 578 من «كتاب الأغاني» وحدَه، وروايةٌ أخرى تضع وفاتَه في عام مولد محمد."},"adi-embassy":{"title":"سفارةُ عدي بن زيد","summary":"أرسل الملكُ الساسانيُّ كاتبَه لشأن العرب — وهو نصرانيٌّ نسطوريٌّ من الحيرة، نشأ في البلاط الفارسي، يتكلّم العربيةَ والفارسيةَ ويُرجَّح السريانية — إلى العاصمة البيزنطية. فعاد بكُتُب.","dispute":null,"dateNote":"سجلُّ بلاطٍ في عهد هرمزد الرابع. والسنةُ منقولةٌ في الرواية العربية لا مُحقَّقةٌ خارجيًّا."},"dahis-faruq":{"title":"يومُ الفروق","summary":"هُزم فيه معاويةُ بن الحارث الكِنديُّ وأهلُ هَجَرَ أمام عبس.","dispute":"وقائمةُ الخاقاني تجعل الفروقَ يومًا لقيسٍ على تميمٍ بدلًا من ذلك، وهذا يُعارِض قراءتَه داخلَ دورة داحس. والاسمُ مُعادُ الاستعمال لأكثرَ من واقعةٍ في أرجح الظنّ. وغيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ، والخاقاني يُدرِج الفروقَ يومًا لقيسٍ على تميمٍ بدلًا من ذلك؛ والسنةُ تحمل موضعَه في التسلسل."},"rahrahan":{"title":"يومُ رحرحان","summary":"بلغت بنو عامرٍ ومعها جيشٌ لخميٌّ أدنى مياهِ بني دارم. فرأت امرأةٌ الجيوشَ فأخبرت زرارةَ مَن القادة، فنَقَل أهلَه ومالَه. ثمّ تَبِعوا ظُعُنَ بني دارمٍ وإبلَهم حتى أدركوها فكانت وقعةٌ شديدة. فأَسَرت بنو عامرٍ ابنَه مَعبَدًا فبقي أسيرَهم حتى مات في الأسر — وذلك هو سببُ الحربِ التاليةِ كلِّه.","dispute":"غيرُ مؤرَّخ؛ ووُضع هنا لأنّه يُروى أنّه قبل شعب جبلةَ بعام. والغالبُ متنازَعٌ فيه: ابنُ الأثير يَجعل بني عامرٍ وجيشَ النعمانِ مُنهزِمَين لمّا أقبل قيسُ بن زهير، وفهرسُ العقد الفريد يَسِم اليومَ «لعامرٍ على تميم» — وهو العكس — وقائمةُ القلقشندي تُلمِح إلى أنّ الاسمَ يُغطّي واقعتَين. وتصحيحٌ مهمّ: خالدُ بن جعفرٍ لم يكن قائدًا في هذا اليوم، فقد كان قُتل قبله؛ والقائدُ أخوه الأحوصُ بن جعفر. ولا يُستعمَل اسمُ «رحرحان» في داخل السَّرد، وإنّما يأتي عنوانًا للباب. وقتلت بنو مالك بن حنظلةَ ابنَ الحَمسِ التغلبيَّ قائدَ النعمان، ومات زرارةُ بن عُدُسٍ في تلك الأيام نفسِها.","dateNote":"غيرُ مؤرَّخ؛ وُضع نحوَ سنةٍ قبل شعب جبلة، وهو الرابطُ الوحيد الذي تُعطيه المصادر."},"al-waqit":{"title":"يومُ الوَقيط","summary":"لبكرٍ من ربيعةَ على تميم. ويَفتَح به العقدُ الفريد عُنقودًا كاملًا من أيام بكرٍ على تميم. والوَقيطُ في تفسير المصدر العربي: المكانُ الصلبُ الذي يَستنقِع فيه الماء.","dispute":"غيرُ مؤرَّخٍ ولا مُعيَّنِ الموضع. وفاجرنيت يُعطي القبيلتَين ولا يُسمّي غالبًا.","dateNote":"غيرُ مؤرَّخٍ ولا مُعيَّنِ الموضع؛ والسنةُ وَضعٌ داخلَ الفترة."},"shib-jabala":{"title":"يومُ شعب جبلة","summary":"استنجد لقيطُ بن زرارةَ لثأر أخيه، فأجابته غطفانُ كلُّها ما عدا بني بدر، وتميمٌ كلُّها ما عدا بني سعد، وانضمّت إليه بنو أسدٍ بحِلفٍ قديم، وأرسل الجونُ الكلبيُّ مَلِكُ هَجَرَ ابنَيه معاويةَ وعمرًا، وأرسل النعمانُ أخاه لأمّه حسّانَ بن برّة. وكان التجمُّعُ على رأس الحولِ من يوم رحرحان. فدخلت عامرٌ وعبسٌ الشِّعبَ الأعمى بمَشورة قيسِ بن زهير، ونَقَلت العِيالَ والأموالَ إليه، وتركت الإبلَ معقولةً بلا سَقيٍ ولا طُعمٍ اثنتَي عشرةَ ليلة. ثمّ أُطلِق العِقال. فلمّا سَمِع القومُ دَويَّها في الشِّعب ظنّوا أنّ الجبلَ انهدم عليهم، وخرجت الرَّجّالةُ آخذين بأذناب الإبل، والفُرسانُ في أثر الرَّجّالة. فقُتل لقيط؛ وأُسر حاجبُ بن زرارة، وسنانُ بن أبي حارثةَ فجَزَّ عروةُ الرحّالُ ناصيتَه وأطلقه، وعمرو بن عمرو بن عُدُس. وانقضى سُلطانُ كندةَ في شمال الجزيرة.","dispute":"خيرُ برهانٍ في هذا الحقلِ على رَخاوة التأريخ. فالمصدران العربيان الأقدمان يُعطيان عددَين مختلفَين من السنين قبل الإسلام، والنسخةُ الإنجليزيةُ تَنقُل الثانيَ وحدَه: العقدُ الفريد يقول «قبل الإسلام بأربعين سنة، وهو العامُ الذي وُلد فيه النبي»، أي نحو 570 وهو أشهرُ الأقوال؛ وقائمةُ الخاقاني تقول «قبل الإسلام بسبع وخمسين سنة»، أي نحو 565. فمع 551 و553 وكاسكلَ نحو 580 وموضعِ بوزورثَ في عهد النعمان الثالث (582–602) يَبلُغ المدى لمعركةٍ واحدةٍ نحوَ ستّين سنةً لا خمسين. والأسوأُ أنّ المعطياتَ تُناقِض أكثرَ الخيارات: فتسميةُ المنذر الرابع (575–580) في القادة توافق كاسكلَ نحو 580 ولا توافق غيرَه. ويُناقِض النصُّ العربيُّ نفسَه داخلَ موضعٍ واحد: يؤرِّخ العقدُ الفريد اليومَ نحو 570 ثمّ يُسمّي في قادته النعمانَ بن المنذر (580–602) وقد أرسل أخاه لأمّه حسّانَ بن برّة — مَلِكٌ لم يَملِك إلّا بعد عشر سنين. والتوصيةُ العملية: نحو 580 تاريخًا داخليًّا، و570 تاريخًا شعبيًّا تَنسِبه الشخصيّات، لأنّ 570 هو عينُ ما يقوله العقدُ الفريد.","dateNote":"مدًى نحو ستّين سنةً متى أُدخِل الحِسابان العربيان كلاهما - 551، و553، و«أربعون سنةً قبل الإسلام، وهو عامُ مولد النبي» في العقد الفريد أي نحو 570، و«سبعٌ وخمسون سنةً قبل الإسلام» عند الخاقاني أي نحو 565، وكاسكل نحو 580، وبوزورث 582-602 - ولا يوافق تسميةَ المنذر الرابعِ في القادة إلّا نحو 580."},"dahis-qatan":{"title":"يومُ قَطَن","summary":"يومٌ في تسلسل داحسٍ لا يُعرَف إلّا من الفهرس المُرتَّب.","dispute":"مَدخلُ فهرسٍ لا غير: لا سَردَ ولا موضعَ ولا تاريخ.","dateNote":"مَدخلُ فهرسٍ بلا سَردٍ ولا موضعٍ ولا تاريخ؛ والسنةُ تحمل موضعَه في التسلسل."},"dhi-najab":{"title":"يومُ ذي نجب","summary":"بعد شعب جبلةَ بعامٍ ثأرت بنو يَربوعٍ من تميم، فقَتَلت ابنَ كَبشةَ ومثَّلت بعدّةٍ من ساداتِ بني كِلاب.","dispute":"مؤرَّخٌ بالنسبة إلى شعب جبلةَ وحدَها — بعدها بعام، عند الخاقاني، وهو يجعل جبلةَ قبل الإسلام بسبع وخمسين سنة. وذلك الرابطُ النسبيُّ أمتنُ من كِلا التاريخَين المُطلقَين.","dateNote":"لا يُؤرَّخ إلّا بأنّه بعد شعب جبلةَ بعام، عند الخاقاني. وذلك الرابطُ النسبيُّ أمتنُ من كِلا التاريخَين المُطلقَين."},"numan-iii-accession":{"title":"تولّي النعمان الثالث","summary":"تولّى آخرُ ملوك لخمٍ العرش. وتنصَّر علنًا على المذهب النسطوري، وفي الأغلب بعد صلح 591، فصارت الحيرةُ مركزًا كنسيًّا كبيرًا له أسقفيّةٌ وبعوثٌ في الخليج.","dispute":"توليتُه مُعطاةٌ 580 و582 في مقالٍ مرجعيٍّ واحد، وآخرُ عهده 595 في موضعٍ و602 في آخر. والمصادر العربية تعطي 582–609 أيضًا، فالاضطرابُ في الطرفَين.","dateNote":"مُعطاةٌ 580 و582 في مقالٍ مرجعيٍّ واحد؛ و581 منتصفُهما، و`endYear` يَمُدّ العهدَ إلى خَلعِه الثابتِ سنةَ 602 لا إلى 595 التي يُعطيها موضعٌ من المقال نفسِه."},"mundhir-ghassanid-exiled":{"title":"نفيُ المنذر الغسّاني","summary":"بعد حملةٍ مُخفِقةٍ على المدائنِ ألقى موريقُ والمنذرُ كلٌّ على الآخرِ التَّبِعة. فاعتُقل المنذرُ وحُبس بالقسطنطينية، ثمّ أُرسل إلى صِقِلّيةَ لمّا صار موريقُ إمبراطورًا. ويقول تأريخٌ سريانيٌّ من القرن الثالثِ عشرَ إنّه عاد إلى بلاده لمّا سقط موريقُ سنةَ 602.","dispute":"مؤرَّخٌ 581 في موضعٍ و582 في آخر، في العُنقود الواحد من المصادر.","dateNote":"مؤرَّخٌ 581 في موضعٍ و582 في آخر."},"dahis-ghadir-qalha":{"title":"يومُ غدير قَلْهى","summary":"يومٌ عند غديرِ ماءٍ لا يُعرَف إلّا من الفهرس المُرتَّب.","dispute":"مَدخلُ فهرسٍ لا غير: لا سَردَ ولا موضعَ ولا تاريخ.","dateNote":"مَدخلُ فهرسٍ بلا سَردٍ ولا موضعٍ ولا تاريخ؛ والسنةُ تحمل موضعَه في التسلسل."},"ghassanid-phylarchate-broken":{"title":"تفتُّتُ الإمارة الغسّانية","summary":"اعتقلت بيزنطةُ النعمانَ السادسَ وحاكمته بالخيانة، فتفكَّك الاتحاد — وانقسم، كما يقول مصدر، إلى خمسةَ عشرَ بطنًا. ويُروى أنّ موريقَ رَفَأه بعد سنتَين أو ثلاثٍ لأنّ الإمبراطوريةَ لم تكن تَضبُط الباديةَ بغيره.","dispute":null,"dateNote":null},"dahis-raqam":{"title":"يومُ الرقم","summary":"لغطفانَ على بني عامر.","dispute":"مُدرَجٌ داخلَ دورة داحسٍ في الفهارس وهو ليس يومَ عبسٍ وذبيانَ ألبتّة. والخاقاني يَجعله لبني فزارةَ على بني عامر. اسمٌ آخرُ مُعادُ الاستعمال. وغيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ، واليومُ ليس قتالَ عبسٍ وذبيانَ ألبتّة؛ والسنةُ لا تحمل إلّا موضعَه في الفهرس."},"fijar-trigger":{"title":"مقتلُ عروة الرحّال","summary":"كَمَن البرّاضُ بن قيسٍ الكِنانيُّ — وقد خَلَعته قبيلتُه — لعروةَ الرحّالِ العامريِّ في شهرٍ حَرامٍ فقَتَله وأخذ لطيمةَ مَلِكِ لخم. فذلك هو الاستحلالُ الذي سُمّيت به حروبُ الفِجار.","dispute":"لا يُؤرَّخ إلّا بعُمر محمدٍ المَرويِّ في الحروب، وهو مُعطًى من أربعَ عشرةَ إلى عشرين، فيضع الدورةَ في الثمانينيات والتسعينيات من القرن السادس. ولاندو-تاسرون تقرأ السببَ قراءةً أخرى: كان لقريشٍ وعامرٍ مصلحةٌ مشتركةٌ في لطائم لخم، وكان بطنُ البرّاضِ مُعاديًا لبني جعفرٍ من أجل عهد جِوارٍ نُقِض.","dateNote":"الدورةُ كلُّها لا تُؤرَّخ إلّا بعُمر محمدٍ المَرويِّ فيها، وهو مُعطًى من أربعَ عشرةَ إلى عشرين."},"fijar-nakhla":{"title":"يومُ نخلة","summary":"حَمَلت هوازنُ على قريشٍ وكنانةَ فنَجَوا إلى الحَرَم عند الليل. ويُعَدّ في الأكثر رابعَ أيام الفِجار، بعد ثلاث مُشاجَراتٍ تَعدّها المصادرُ حربًا واحدةً مرّةً وثلاثًا مرّة.","dispute":"غيرُ مؤرَّخ. وترتيبُ الأيامِ الثمانيةِ أمتنُ من سنةِ أيٍّ منها. والمصادر العربية تَجعل الغلبَ فيه «كَفافًا» — لا لأحدٍ على أحد.","dateNote":"غيرُ مؤرَّخ. وترتيبُ الأيامِ الثمانيةِ أمتنُ من سنةِ أيٍّ منها."},"dahis-araair":{"title":"يومُ عراعر","summary":"قُتل هنا مسعودُ بن مِصادٍ سيّدُ كلب، وانهزمت كلب.","dispute":"هذا ما يقوله نصٌّ على «المرجة»، ونسخةُ النصّ نفسِه تقول إنّ فزارةَ قاتلت عبسًا هنا وغلبت فزارة. فهويّةُ القبيلةِ المغلوبةِ في عراعرَ متنازَعةٌ تنازعًا حقيقيًّا. وغيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ، ونسختا المصدر الواحد تختلفان في أيّ قبيلةٍ غُلِبت؛ والسنةُ تحمل موضعَه في التسلسل."},"fijar-shamta":{"title":"يومُ شَمْطة","summary":"يومٌ من الفِجار قربَ عكاظَ في العام التالي، تقدَّمت فيه كنانةُ أولًا ثمّ انهزمت. والغلبُ لقيسِ عَيلان.","dispute":"غيرُ مؤرَّخ. ويُروى أنّ النبيَّ شَهِد ترتيباتِ هذا اليوم مع بني هاشمٍ تحت راية الزبير بن عبد المطّلب.","dateNote":"غيرُ مؤرَّخ. وترتيبُ الأيامِ الثمانيةِ أمتنُ من سنةِ أيٍّ منها."},"fijar-abla":{"title":"يومُ العَبْلاء","summary":"قتالٌ في أرضِ السوقِ نفسِها، وهو عكاظُ الأول. فرَّت كنانة، والغلبُ لقيسِ عَيلان مرّةً أخرى.","dispute":"غيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ. وترتيبُ الأيامِ الثمانيةِ أمتنُ من سنةِ أيٍّ منها."},"fijar-ukaz":{"title":"يومُ عكاظ","summary":"ويُسمّى يومَ الشَّرب، وهو عكاظُ الثاني. اليومُ الوحيد في الدورة كلِّها الذي غلبت فيه قريشٌ وكنانة.","dispute":"غيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ. وترتيبُ الأيامِ الثمانيةِ أمتنُ من سنةِ أيٍّ منها."},"dahis-dhat-al-jarajir":{"title":"يومُ ذات الجراجر","summary":"يومان متّصلان من القتال بين عبسٍ وذبيان، وهو اليومُ الوحيد الذي تُفرِد فيه المصادرُ شجاعةَ عنترةَ بالذِّكر.","dispute":"غيرُ مؤرَّخ، ولا موضعَ مُعطًى له. والمصادر شديدةُ الشُّحّ في عنترةَ عمومًا: هو مُثبَتٌ في رِثاء مالك بن زهيرٍ وفي بطولة هذا اليوم، وهذا قريبٌ من كلّ ما فيه. ودورُه في المصادر أضعفُ بكثيرٍ من صورته في الذاكرة الشعبية.","dateNote":"غيرُ مؤرَّخٍ ولا مُعيَّنِ الموضع؛ والسنةُ تحمل موضعَه في التسلسل."},"fijar-hurayra":{"title":"يومُ الحَريرة","summary":"اليومُ الثامنُ والأخير، على الحَرّةِ قربَ عكاظ، والغلبُ لهوازن. ثمّ مناوشاتٌ قليلةٌ ثمّ الصلحُ ودَفعُ الديات. فكانت أربعةُ أيامٍ لهوازنَ ويومٌ لقريشٍ وسائرُها مُشاجَرات.","dispute":"قائمةُ الخاقاني تُعطي 589 لنهاية الفِجار الثاني — وهو التاريخُ الميلاديُّ الوحيد في مدوَّنةِ الأيامِ الصغرى لهذه الدورة كلِّها. وما سواه مؤرَّخٌ بعُمر محمد.","dateNote":"قائمةُ الخاقاني تُعطي 589 لنهاية الفِجار الثاني - وهو التاريخُ الميلاديُّ الوحيد في مدوَّنة الأيامِ الصغرى لهذه الدورة."},"numan-shelters-khusraw":{"title":"إيواءُ النعمان لخسرو","summary":"آوى مَلِكُ لخمٍ خسروَ الثانيَ وقد أخرجه المُغتصِبُ بهرامُ چوبين، وقاتل إلى جانبه بالنهروان. وأسند موريقُ إعادتَه. وبعد اثنتَي عشرةَ سنةً أهلكه خسرو.","dispute":null,"dateNote":"الفِرارُ والقتالُ بالنهروانِ يَمتدّان على 590-591."},"sullan-ii":{"title":"يومُ السلّان الثاني (قاعُ القُرَيتَين / يومُ السُّوبان)","summary":"اعتدت بنو عامرٍ على لطيمةِ النعمانِ التي كان يَبعَثها إلى عكاظَ كلَّ سنة، فجهَّز جيشًا على رأسه أخوه لأمّه وبرةُ ومعه بطونُ تميم. فعَلِمت قريشٌ، وأنذر عبدُ الله بن جُدعانَ بني عامرٍ فتهيَّأوا. فأُسر وبرةُ في الحَملة وانهزم الجيش. ونهى ضِرارُ بن عمروٍ — وهو شيخٌ كبير — رجالَه عن الفِرار، وأمسك الرايةَ وبنوه يَتَرَّسون دونه، وأبو براءٍ يُسقِطه مرّةً بعد مرّة. فسأله أبو براءٍ أن يَدُلَّه على رجلٍ له فداءٌ يستحقّ الأسر، فدلَّه على حُبَيش بن دَلَف — وكان أسودَ نحيلًا، فحَسِبه عبدًا وظنّ أنّ ضِرارًا خَدَعه، فافتدى حُبَيشٌ نفسَه بأربعِ مئةِ بعير. وافتدى وبرةُ نفسَه بألفِ بعيرٍ وفرسٍ فأغنى ذلك آسِرَه.","dispute":"ثلاثةُ أسماءٍ ليومٍ واحد: السلّانُ الثاني، ويومُ السُّوبان، وقاعُ القُرَيتَين. والمصادر العربية تُثبِت الثالث، وبه يُحَلّ «يومُ القُرنتَين» الذي بقي مجهولًا — فهو قاعُ القُرَيتَين، اسمٌ بديلٌ لهذا اليوم، فلا حاجةَ إلى افتراض معركةٍ ثانية. وغيرُ مؤرَّخ؛ والنافذةُ عهدُ النعمان الثالث. ونقدُ المصادرِ العربيةِ للأدبِ الثانويِّ موضعُه هنا: خلط جوادٌ عليٌّ بين السلّانَين فربط خَزازًا بهذا، فأرَّخ خَزازًا بزمن النعمان، وهو خطأٌ كبير؛ وخلط الميدانيُّ بينهما أيضًا، فنسب تسميةَ عامرٍ «ملاعبَ الأسِنّة» إلى السلّان الأول وإنّما كانت هنا، ونسب إلى السلّان بيتَ زهير بن جَنابٍ وهو من خَزاز.","dateNote":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ النعمان الثالث."},"peace-591":{"title":"صلحُ ٥٩١","summary":"ردَّ خسرو الثاني دارا ومَيّافارقين، وأُعيد تقسيمُ القوقاز — ولم تدفع بيزنطةُ شيئًا ألبتّة لأولِ مرّة. تحوُّلٌ حقيقيٌّ في المِيزان بين الإمبراطوريّتَين، وآخرُ صُلحٍ قبل الحربِ التي أهلكتهما.","dispute":null,"dateNote":null},"numan-converts":{"title":"تنصُّرُ النعمان","summary":"صار آخرُ ملوك لخمٍ أولَ من تنصَّر من بيته علنًا على المذهب النسطوري، وفي الأغلب بعد صلح 591، وكان لأسقف الحيرةِ في ذلك يد. فكَرِه الفرسُ ذلك وحاولوا رَدَّه.","dispute":"لا يُؤرَّخ إلّا بالاستنباط من صلح 591. وروايةٌ أخرى تجعل امرأ القيس الأولَ أولَ لخميٍّ تنصَّر، قبلَه بقرون.","dateNote":"لا يُؤرَّخ إلّا بالاستنباط من صلح 591."},"hilf-al-fudul":{"title":"حِلفُ الفُضول","summary":"عَقدٌ بين بطونٍ من قريشٍ أن يَقوموا مع المظلومِ في وجه مصلحةِ عشيرته، أُقسِم عليه بعد حادثةٍ غُبِن فيها غريب.","dispute":"غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه، ومقالُ الفِجار لا يَصِل بينهما، فأيُّ سلسلةٍ سببيةٍ من الفِجار إلى هذا القَسَم غيرُ محقَّقة. والبطونُ المُسمَّاةُ على المُواضَعة — هاشمٌ وزُهرةُ وأسدٌ وتَيمٌ والمطّلب — لا يُؤكِّدها شيءٌ متاح. والحادثةُ فيها العاصُ بن وائل.","dateNote":"غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه، والسلسلةُ السببيةُ من الفِجار التي كانت تُؤرِّخه غيرُ محقَّقة."},"muhammad-marries-khadija":{"title":"زواجُ محمدٍ بخديجةَ بنت خويلد","summary":"خديجةُ بنتُ خويلدٍ امرأةٌ قُرَشيّةٌ من بني أسدٍ، ثَكِلت زوجَين وكانت تُمَوِّل القوافل، فاستأجرته في سفرٍ إلى الشام ثمّ تزوّجته. وكانت في الأربعين على حِساب الرواية وهو في الخامسة والعشرين. ولم يَنكِح غيرَها في حياتها، ومالُها ومَكانتُها هما ما حرَّره من طَلَب المعيشة.","dispute":"لا يُؤرَّخ إلّا بعُمره. ودورُها التِّجاريُّ يُعاد في كلّ خبرٍ من أخبار السِّيرة ولا يُفحَص في واحد: لم تُخرِج المراجعةُ إلّا كتاباتٍ تَعَبُّديّةً وشعبية، ولا بحثَ نقديًّا في أنّ امرأةً تُمَوِّل قوافلَ مكّةَ أمرٌ مُمكِنٌ تاريخيًّا.","dateNote":"مَحسوبٌ سنةَ الخامسةِ والعشرين من عُمره، فالمُواضَعةُ نحو 595 تَزحَف مع مولدٍ موضوعٍ في أيّ موضعٍ من 552-572."},"adi-strangled":{"title":"مقتلُ عدي بن زيد","summary":"حَبَس النعمانُ الثالثُ كبيرَ مُشيريه وخَنَقه على ظِنّةِ تدبير. وكان لابن عديٍّ أذنُ كسرى، ويُعتقَد أنّ القَتلَ سَمَّم العلاقةَ بين الساسانيّين ولخم وأسهم في إسقاط البيت — والمصادر العربية تَجعل هذه الحادثةَ الشرارةَ التي أشعلت ذا قار. وهو ثالثُ شاعرٍ قتلته الحيرةُ في خمسٍ وأربعين سنة.","dispute":null,"dateNote":"موضوعٌ نحو 600، قبل سقوط النعمان الثالث نفسِه سنةَ 602."},"al-safqa":{"title":"يومُ الصفقةِ والمشقَّر","summary":"أغارت تميمٌ على لطيمةٍ لكسرى وسَلَبت معها رُسُلَه. فاستدعى الملكُ هَوْذةَ بن علي الحنفيَّ عميلَه باليمامةِ وكلَّفه تأديبَهم، وأرسل معه القائدَ الفارسيَّ المُكعبِرَ وحملةً من الأساورة. فنزلا حصنَ المشقَّرِ بهَجَر، وفي سنةٍ قاسيةٍ أشاعا أنّ عندهما مِيرةً تُباع. فكان التميميّون يُدخَلون جماعاتٍ صغيرةً ويُقتَلون جماعاتٍ صغيرة. فلمّا انكشف الأمرُ قَطَع رجلٌ من عبسٍ السلسلةَ عن الباب فخرج مَن كان عنده، فأغلق المُكعبِرُ الأبوابَ وقَتَل مَن بقي في الحصن. وذلك الإغلاقُ هو الاسم: الصفقة. ووافق اليومُ عيدَ الفِصح، فطَلَب هَوْذةُ مائةً من أسرى تميمٍ فأطلقهم، فجعلها الأعشى في قصيدة.","dispute":"النسخةُ الإنجليزيةُ لم تجد إلّا سطرًا واحدًا من الخاقاني فأدرجت اليومَ في «ما لم يُعثَر عليه»؛ و«تاريخ العرب القديم» لتوفيق برو يعطيه السَّردَ الكاملَ المُلخَّصَ هنا، فاليومُ محلول. وفي هامش المصدر نفسِه روايةٌ أخرى عن جاد المولى تَقلِبه: أنّ تميمًا كَمَنت لهَوْذةَ في وادٍ فأسرته، فلم يُفَكّ أسرُه إلّا بثلاثِ مئةِ بعير. وابنُ الأثير والعقدُ الفريد كلاهما يَقرِن اليومَ في بابٍ واحدٍ بيوم الكلابِ الثاني. وهو باقٍ غيرَ مؤرَّخ، والمشقَّرُ نفسُه غيرُ مُعيَّن.","dateNote":"غيرُ مؤرَّخٍ في كلّ مصدر؛ والسَّردُ العربيُّ يُثبِت ما جرى ولا يُثبِت متى. ولا مَقبَضَ زمنيًّا له إلّا الإطارُ الساسانيّ: عهدُ خسرو برويز."},"dahis-peace":{"title":"صلحُ داحس","summary":"دخل ابنا عمٍّ من مُرّةَ — هَرِمُ بن سِنانٍ والحارثُ بن عوف — في الإصلاح معًا، فتحمَّلا من مالهما ديةَ القتلى من الفريقَين: نحو ثلاثةِ آلافِ بعيرٍ دُفِعت على ثلاث سنوات. فتوقَّفت أربعون سنةً من القتل بين عبسٍ وذبيان. وذَكَرهما زهيرٌ كلَيهما في معلّقته من أجل ذلك. وأمّا قيسُ بن زهيرٍ فلم يَسِر مع قومه، وقال إنّه لن يكون غطفانيًّا، ثمّ تنصَّر وساح في الأرض حتى عُمانَ فترهَّب بها، فقَتَله رجلٌ من عبدِ القيس.","dispute":"المصادر العربية تَحسِم ما لم تَستطِع النسخةُ الإنجليزيةُ تأكيدَه وعدَّته «غير محقَّق»: هَرِمُ بن سِنانٍ وابنُ عمِّه الحارثُ بن عوفٍ دخلا في الإصلاح معًا، وحَمَلا الديات من مالهما نحوَ ثلاثةِ آلافِ بعيرٍ على ثلاث سنوات، وأثنى عليهما زهيرٌ بالاسم في معلّقته لمَوقفهما من الحرب — فالأعلامُ والمُدّةُ والمقدارُ كلُّها مُثبَتة. والنسخةُ الإنجليزيةُ تَنسِب الصلحَ إلى الحارث بن عوفٍ وحدَه، وتَعدّ سلسلةَ هَرِمٍ ← الديات ← المعلّقةِ غيرَ محقَّقة، ولا تجد أبا هَرِمٍ سِنانًا إلّا جامعَ حِلفٍ أخفق في الجانب المقابل؛ وأبٌ وابنٌ على طرفَي مسألةٍ واحدةٍ ليس تعارضًا. وتُصحِّح المصادرُ العربية معها أنّ نسبةَ حَملِ الديات إلى أخيه خارجةَ غيرُ صحيحة. والتاريخُ باقٍ غيرَ مُثبَت: بَرَكةُ الحربِ المُواضَعُ عليها نحو 568–609 إعادةُ بناءٍ فيكتوريّةٌ لسِر وليَم ميور لا تاريخُ مصدر، ولا مصدرَ يؤرِّخ الصلحَ نفسَه. ونهايةُ قيسِ بن زهيرٍ مُزدوَجة: سار مع عبسٍ إلى ذبيانَ فتمّ الصلح، أو أبى فتنصَّر ومات راهبًا بعُمان.","dateNote":"بَرَكةُ الحربِ نحو 568-609 إعادةُ بناءٍ لميور؛ ولا مصدرَ يؤرِّخ الصلح."},"kulab-ii":{"title":"يومُ الكلاب الثاني","summary":"بنو تميمٍ في وجه بني الحارثِ ومذحج، ونائبُ خسرو برويزَ في الخلف، وغارةُ تميمٍ على رُسُله هي السبب. وتجمَّعت بنو الحارثِ بمَشورة كاهن، وخرجت مذحجٌ على غير مَشورةٍ نُصِحت بها.","dispute":"ابنُ الأثير يَقرِنه في بابٍ واحدٍ بيوم الصفقة، والعقدُ الفريد مِثلُه. وفاجرنيت يُسمّيه تميمًا في وجه بني عبدِ المَدانِ من نجران؛ والخاقاني يَجعله لتميمٍ على مذحج. والثلاثةُ تستقيم إن كان عبدُ المَدانِ بطنًا من بني الحارثِ بنجرانَ حَليفًا لمذحج. والمصادر العربية تُعطي الإطارَ الفارسيَّ مفصَّلًا — نائبُ خسرو برويزَ مُرسَلًا إلى اليمن، وغارةُ تميمٍ على رُسُله، وارتفاعُ ذِكرِ هَوْذةَ بن علي الحنفيِّ عند الملكِ لإحسانه إلى المسلوبين — وهي عينُ السلسلةِ التي يَنتج عنها يومُ الصفقة. وغيرُ مؤرَّخ.","dateNote":"غيرُ مؤرَّخ؛ وُضع متأخّرًا لأنّ ابنَ الأثير يَقرِنه في بابٍ واحدٍ بيوم الصفقة."},"nabigha-returns":{"title":"عودةُ النابغة","summary":"عاد إلى الحيرةِ الشاعرُ الذي كان هرب إلى الغساسنةِ من أجل أبياتٍ في المَلِكة، ثمّ اعتزل إلى قومه لمّا سقط النعمان. وهو الحالةُ الوحيدةُ المُسنَدةُ جيّدًا لشاعرٍ يَتردَّد بين البلاطَين العميلَين.","dispute":null,"dateNote":"موضوعٌ مع مقتل عدي بن زيد، نحو 600."},"shaqiqa-bistam":{"title":"يومُ الشَّقيقة ومقتلُ بِسطام","summary":"اليومُ الذي قُتل فيه بِسطامُ بن قيسٍ أشهرُ فُرسان الغارة.","dispute":"عنوانُ بابٍ في قائمة أيامِ ابنِ الأثير لم يُستخرَج له سَرد. وغيرُ مؤرَّخ.","dateNote":"عنوانُ بابٍ في قائمة ابنِ الأثير لم يُستخرَج له سَردٌ ولا تاريخ."},"urwa-dies":{"title":"وفاةُ عروة بن الورد","summary":"الصُّعلوكُ العبسيُّ الذي كان يَسرِق ليُطعِم الفقراء، ويُقال إنّه أكرمُ العربِ القدماء. وبعضُ شعره في امرأةٍ طلَّقها سكرانَ فأسِف عليها صاحيًا.","dispute":"التواريخُ مُعطاةٌ 520–600 ولا آلةَ وراءَ واحدٍ من الرقمَين.","dateNote":"التواريخُ مُعطاةٌ 520 و600 ولا آلةَ وراءَ واحدٍ منهما؛ ونحو 600 هي المُواضَعة."},"numan-deposed":{"title":"خَلعُ النعمان الثالث","summary":"خُلِع الملكُ، وأُخِذ بالمدائن، وحُبس بخانقين، فمات هناك بالطاعون. وصارت الحيرةُ إلى إياسِ بن قبيصةَ الطائيّ، وانقضى البيت. وفي السنة نفسِها قَتَل فوقاسُ موريقَ، وأعلن خسرو الحربَ التي جَرَت إلى 628. مِحورُ الفترة البنيويُّ كلِّها.","dispute":"تأريخان سريانيّان يُعطيان خبرَين مُتنازِعَين في نهايته: أحدُهما وليمةٌ أُهين فيها واحتُبس، والآخرُ قَبضٌ عليه مع بَنيه ثمّ سَمٌّ لهم. وروايةٌ تجعله مُلقًى تحت أرجل الفيلة فوُطئ. والمصادر العربية تُلقي التَّبِعةَ على رَفضه أن يُسلِّم فرسًا أو ابنةً؛ والأرجحُ أنّ السببَ قضيّةُ عدي بن زيد.","dateNote":null},"quraysh-split-605":{"title":"انقسامُ قريش","summary":"انفصلت بنو أميّةَ وبنو نوفلٍ عن المُطَيَّبين. وهو واحدٌ من نقطتَين ثابتتَين فقط تَصلُحان في السياسة المكّيّةِ الداخلية.","dispute":null,"dateNote":"الروايةُ تُعطي 605 مُجرَّدةً للانفصال، ولا شيءَ من خارج العربية يُحقِّقها؛ ومكّةُ لا سجلَّ مؤرَّخًا لها ألبتّة قبل 632."},"kaba-rebuilt-black-stone":{"title":"بناءُ الكعبةِ وتحكيمُ الحجر الأسود","summary":"هَدَمت قريشٌ البيتَ وأعادت بناءَه، ثمّ تنازعت البطونُ مَن يَضَع الحجرَ الأسودَ في رُكنه. والتسويةُ المَرويّةُ أنّ الحجرَ حُمِل في رِداءٍ أخذ مُمثِّلو البطونِ بأطرافه فوضعوه جميعًا. وأيًّا ما جرى فالحكايةُ في عاداتِ أهل مكّةَ في التحكيم لا في البناء.","dispute":"السنةُ مُستخرَجةٌ لا منقولة — خمسَ سنينَ قبل الوحي على حِساب، وسنةَ الخامسةِ والثلاثين من عُمره على آخر، والثاني يُجعلها تتحرّك مع المولدِ المتنازَعِ فيه. وتعظيمُ حجرٍ رُباعيٍّ بمكّةَ مُمكِنٌ على نحوٍ مستقلّ: وَصَف مارينوسُ الصُّوريُّ عربًا يُعظِّمون حجرًا في القرن الثاني. ولكنّ روبان يَحتَجّ بأنّ الكعبةَ لم تَعلُ شأنًا إلّا في آخر القرن السادس، ووِبّ يَحتَجّ بأنّها كانت مَحجًّا إقليميًّا لا جزيريًّا عامًّا.","dateNote":"مَحسوبٌ خمسَ سنينَ قبل الوحي على الحِساب المعتاد، فيُثبَّت بسنة 610؛ والحِسابُ المُنازِعُ له بعُمره خمسًا وثلاثين يَشُدّه إلى سنةِ المولدِ المتنازَعِ فيها فيُوسِّع المدى عقدَين."},"dhi-qar":{"title":"يومُ ذي قار","summary":"غَلَبت بكرُ بن وائلٍ قوّةً ساسانيةً ومعها أعوانٌ من طيءٍ وتغلبَ وإيادٍ على ماءٍ في البادية. والقيادةُ في بكرٍ تَنتقِل من فارسٍ إلى فارسٍ بلا قائدٍ عامّ. وذِكرُه قائمٌ على أنّه اليومُ الذي انتصفت فيه العربُ من الفرس أولَ مرّة.","dispute":"الروايةُ الإسلاميةُ تَبسُطه من 602 إلى 624؛ والبحثُ الحديثُ يُضيِّقه إلى 604–611، والمصادر العربية تُرجِّح 609 وتَذكُر 604 أيضًا، وأرجحُ ما يُنقَل أواخرُ 609 أو مطلعُ 610، وقائمةُ الخاقاني لا تقول إلّا «سنةَ أربعين» أي قريبًا من مولد النبي. والطرفُ الأعلى ليس مُستثقَلًا فحسب بل مَردودٌ في المرجع العربي نفسِه: يَذكُر الأصفهانيُّ في «الأغاني» أنّها وقعت بعد بدرٍ بأشهرَ وأنّ النبيَّ علَّق عليها بالمدينة، ولم يُؤكِّد ذلك أحدٌ من المؤرّخين، وقد ضعَّف الألبانيُّ هذا الحديث — فسنةُ 624 مردودةٌ على أرضٍ عربية، فضلًا عن تعذُّرها لأنّ كلَّ خبرٍ يَشُدّ المعركةَ إلى ما بعد خَلعِ النعمانِ سنةَ 602. والموضعُ متنازَعٌ فيه كذلك: المصادر العربية تضعه عند طريفٍ جنوبَ المدينةِ في شمال الجزيرة، لا في جنوب العراقِ قربَ محافظة ذي قارٍ الحديثة، والتعيينُ الشائعُ استنباطٌ من اسم تلك المحافظة. ولا مصدرَ يُعيِّنه تعيينًا قاطعًا. والمصادر الفارسيةُ لا تذكر المعركةَ ألبتّة، ويرى رضاخاني أنّها ربّما لم تكن إلّا مُناوَشة — وهذا يجعل شُهرتَها رَجعيّةً، وأشدَّ إثارةً للدراما لا أقلّ. وتُضيف المصادر العربية أنّ إيادًا انسحبت باتفاقٍ سرّيٍّ مع بكر، وتَعُدّ المقاتلين نحوَ ثلاثةِ آلافٍ من العرب، وألفًا من الأساورة الفرس، وألفًا من الخنابرين. ولم يُقتَل النعمانُ الثالثُ في المعركة ولا قُبَيلها: خُلِع سنةَ 602، وأُخِذ بالمدائن، وحُبس بخانقين، ومات في أرجح الروايات بالطاعون.","dateNote":"الروايةُ الإسلاميةُ تَبسُطه 602-624؛ والمصادر العربية تُرجِّح 609 وتَذكُر 604 أيضًا، وأرجحُ ما يُنقَل أواخرُ 609 أو مطلعُ 610، وهي تَرُدّ طرفَ 624 صريحًا. وخَلعُ 602 حدٌّ أدنى قاطعٌ لأنّ كلَّ خبرٍ يَشُدّ المعركةَ إلى سقوط النعمان."},"antara-dies":{"title":"وفاةُ عنترة","summary":"مات الفارسُ الشاعرُ العبسيُّ المولودُ عبدًا من جُرحٍ أصابه في غارةٍ قادها وهو شيخٌ كبير على بني نَبهانَ من طيء — رماه زُرُّ بن جابرٍ النبهانيُّ، فعاد فمات عند أهله. وكان في الثانيةِ والثمانين أو الثالثةِ على الحِساب المُواضَعِ عليه، وفي نحو التسعين على سطرٍ آخرَ من الصفحة نفسِها.","dispute":"روايات لا تَجتمِع، والمصادر العربية تُرجِّح واحدةً وتُصحِّح اسمًا. فروايتُها الراجحةُ عند أبي الفرج الأصفهاني: أنّه وهو شيخٌ كبيرٌ أغار على بني نَبهانَ من طيءٍ وطَرَد لهم طريدة، فرماه زُرُّ بن جابرٍ النبهانيُّ، فجُرح وعاد إلى أهله فمات. ونَقَل ابنُ الكلبيِّ أنّ القاتلَ كان يُلقَّب «الأسدَ الرَّهيصَ» الطائي. والاسمُ في المصادر الإنجليزية — «وَسْر بن جابر» — خطأ، وإنّما هو زُرّ. والروايتان المُنازِعتان — قُتل في قتال داحس، أو مات هَرَمًا عند أبي عبيدة — قائمتان، على أنّ الأولى تُناقِض تاريخَ 608 في المدوَّنة نفسِها. والسنةُ نفسُها غيرُ مستقرّةٍ في المقال العربي الواحد: 608 في المقدِّمة، وحياةٌ من 525 إلى 615 في قسم الوفاة، و600 عند الزِّرِكْليّ؛ والصفحةُ تقول إنّه بلغ نحوَ تسعين والجدولُ يقول إنّه توفّي عن ثلاثٍ وثمانين.","dateNote":"المُواضَعةُ 608 تَقعُد إلى جانب 615 و600 عند الزِّرِكْليِّ في مقالٍ عربيٍّ واحد، وإلى جانب رواياتٍ تَقتُله في قتال داحسَ قبلَها بعقود أو تُميته هَرَمًا."},"quss-dies":{"title":"وفاةُ قس بن ساعدة","summary":"مات الخطيبُ الذي كان يقوم في سوق عكاظَ فيَتكلَّم سَجعًا في إلهٍ واحدٍ وفي البعث، ودُفن في شمال الشام في أرجح الظنّ. وبقيت له خُطبةٌ واحدةٌ تُفتَح بـ«أيها الناس، اسمعوا وعُوا».","dispute":"يُعَدّ أسطوريًّا أو شِبهَ أسطوريٍّ ولا يُعرَف إلّا من المصادر الإسلامية. وعُمرُه مُعطًى ثلاثَ مئةٍ وثمانين سنةً أو ستَّ مئةٍ أو سبعَ مئة، وهذا أوضحُ ما يكون من علامات التراكم الأسطوري. ويُسمّى في أخبارٍ أسقفَ نجرانَ وفي أخرى حكيمًا وثنيًّا.","dateNote":"نحو 610 مُواضَعة؛ وعُمرٌ مَرويٌّ من ثلاثِ مئةٍ وثمانين أو ستِّ مئةٍ أو سبعِ مئةِ سنةٍ يُظهِر ما وراءَها من قِلّة."},"taabbata-dies":{"title":"مقتلُ تأبّطَ شرًّا","summary":"قُتل في غارةٍ على بني هُذَيل، وأُلقي جسدُه في غارٍ يُسمّى الرَّخمان. ودِيوانُه مائتان وثمانيةٌ وثلاثون بيتًا في اثنتَين وثلاثين قطعة.","dispute":"تواريخُه مجهولةٌ صريحًا؛ وآخرُ القرن السادس أو أولُ السابع مُستنبَطٌ من أسماء الأعلام في شعره. واللقبُ له ثلاثةُ تفسيراتٍ لا تَجتمِع في «كتاب الأغاني» وحدَه — حَمَل كَبشًا فإذا هو غُول، أو مَلأ مِزوَدَ الكَمأةِ لأمّه حَيّات، أو حَمَل سيفَه تحت إبطه — ويقول الباحثون المُحدَثون إنّه لا ينبغي أخذُ واحدٍ منها على ظاهره. ولم تَخلَعه قبيلتُه، بخلاف أكثر الصعاليك. ولاميّتُه من أشدِّ ما نُسب إلى الوضع.","dateNote":"تواريخُه مجهولةٌ صريحًا؛ وآخرُ القرن السادس أو أولُ السابع مُستنبَطٌ من أسماء الأعلام في شعره."},"revelation-begins":{"title":"بدءُ الوحي في غار حِراء","summary":"في خَلوةٍ في غارٍ على جبل النورِ خارجَ مكّة، أخبر محمدٌ بلِقاءٍ وأمرٍ بالقراءة. والروايةُ تجعله يَرجِع إلى بيته مَرعوبًا، وخديجةَ تَقبَل خبرَه، وابنَ عمِّها ورقةَ بن نوفلٍ — وهو مَعدودٌ في مُوحِّدي العربِ قبل الإسلام — يُعرِّفه بألفاظٍ من الكُتُب السابقة. وبقيت الدعوةُ سِرًّا نحوَ ثلاث سنوات.","dispute":"القصّةُ كلُّها سَردُ سِيرة. وتأريخُها بالسنين قبل الهجرةِ يجعلها أمتنَ من كلّ ما يُحسَب بعُمره، ولكن لا شيءَ من خارج العربية يَمَسُّها، والمصادر تختلف في موضع أخبارٍ أخرى مُبكِّرةٍ من التسلسل، كالإسراء.","dateNote":"اثنتا عشرةَ سنةً قبل الهجرة على الحِساب المعتاد، وهو يُحسَب من مَبدأٍ ثابت؛ والعُمرُ المُواضَعُ عليه أربعين يَشُدّ اللحظةَ نفسَها إلى سنةِ المولدِ المتنازَعِ فيها."},"khansa-muawiya":{"title":"مقتلُ أخوَي الخنساء","summary":"قُتل أخوها معاويةُ في مُناوَشاتِ بني سُلَيمٍ مع مُرّةَ وأسد. فثأر له أخوها صَخرٌ ومات من جِراحه بعد نحوِ سنة. وبقي في هذين المَوتَين أكثرُ من مائةِ مَرثيةٍ ونحوُ ألف بيت.","dispute":"موتُ صَخرٍ مُستنبَطٌ بـ«نحو سنةٍ بعدَه». والخنساءُ نفسُها لا تاريخَ مولدٍ ولا وفاةٍ لها في أيّ مصدرٍ متاح، وإنّما مَرتكزاها 612 و629، ومقتلُ أربعةٍ من بَنيها بالقادسية سنةَ 636 يَلزم منه أنّها عاشت بعد ذلك.","dateNote":"موتُ معاويةَ مؤرَّخٌ 612-613، وموتُ صَخرٍ مُستنبَطٌ بنحو سنةٍ بعدَه."},"public-preaching-begins":{"title":"بدءُ الدعوة الجَهرية","summary":"بعد نحوِ ثلاث سنواتٍ من الدعوةِ سِرًّا بدأ محمدٌ يُخاطِب مكّةَ علنًا، يَدعو إلى إلهٍ واحدٍ ويُنذِر بحِساب. وكان الكلامُ واقعًا مباشرةً على البيت الذي تَحفَظه قريشٌ وعلى الآلهةِ التي تَجذِب مَشاهدُها القبائلَ من الحجاز كلِّه، ومن هنا تُؤرَّخ المعارضةُ القُرَشيةُ المنظَّمة.","dispute":"مُدّةُ ثلاثِ سنينَ مُدوَّرةٌ بعد الوحي الأول، وهذا بناءُ الروايةِ للفترةِ لا تأريخُها. ولا شيءَ من خارج العربية.","dateNote":"تسعُ سنينَ قبل الهجرة على الحِساب المعتاد؛ والرقمُ مُدّةٌ مُدوَّرةٌ في الرواية لا حدثٌ مؤرَّخ."},"jerusalem-falls":{"title":"سقوطُ القدس","summary":"ثلاثةُ أسابيعِ حِصار، ثمّ المدينة، ثمّ الصليبُ المُقدَّس مَحمولًا إلى المدائن. وشَعَر بهذه الواقعةِ المشرقُ النصرانيُّ كلُّه.","dispute":null,"dateNote":null},"aksum-migrations":{"title":"الهجرةُ إلى الحبشة","summary":"عَبَرت جماعاتٌ من أصحاب محمدٍ البحرَ الأحمرَ إلى أكسومَ النصرانية، فأجارهم الحاكمُ الذي تُسمّيه المصادرُ العربية النَّجاشي. ويُروى أنّ وفدًا قُرَشيًّا تَبِعهم فرُدّ. فدَخَلت بذلك مِحنةُ مكّةَ مع خطيبها في سياسةِ البحر الأحمرِ التي كانت أكسومُ وحِمْيَرُ تَتنازَعانها قرنًا — ولاجئو نجرانَ كانوا قد أخذوا الطريقَ نفسَه إلى البلاط نفسِه قبلَها بتسعين سنة.","dispute":"شَكَّ كايتاني ووات في أن تكون هجرتان متميِّزتان أصلًا؛ وقَرَأ وات لفظَ ابن إسحاقَ جماعاتٍ صغيرةً تَصِل واحدةً بعد أخرى، ورَدّ القائمتَين المُعتمَدتَين إلى خلافاتٍ متأخّرةٍ على السابقةِ في الدواوين في عهد عمر. والنَّجاشيُّ لا يُمكِن مُطابَقتُه بقائمة ملوك أكسومَ على ثقة: تعيينُه أرمَحَ من سنة 1895، وإلّا تساحَمُ البديل، واحتجّ هان بأنّ أرمَحَ كان ابنًا لكالب باسمٍ آخر.","dateNote":"مَحسوبةٌ بالسنين قبل الهجرة، على أنّ المصادر تُعطي الجماعةَ الأولى 7 قبل الهجرة (615) أو 9 (613)، والثانيةَ 6 (616) أو 7 (615)؛ وبعضُ الأخبارِ لا يُؤرِّخ الخروجَ الأولَ إلّا بـ«رجبٍ من السنة الخامسةِ من البعثة»."},"hashim-boycott":{"title":"حِصارُ بني هاشمٍ في الشِّعب","summary":"اتّفقت بطونُ قريشٍ على قَطع المُناكَحةِ والمُبايَعةِ عن بني هاشمٍ وبني المطّلب، فانحازوا إلى شِعبٍ على طَرَف البلدة. ولم يكن حِصارًا بل نظامَ مُقاطَعةٍ على عشيرةٍ أبَت أن تُسلِّم واحدًا منها: فالآلةُ المستعملةُ هي آلةُ حِماية العشيرةِ المعتادة، ولذلك وَجَب أن تُوجَّه المقاطعةُ إلى العشيرةِ كلِّها لا إلى الرجل. ثمّ انفرط الأمرُ بعد نحو ثلاث سنين.","dispute":"لا يُؤرَّخ إلّا مُدّةً قبل الهجرة، والبَدءُ مُعطًى نحو 616 والرَّفعُ 619. والصحيفةُ التي يُروى أنّها عُلِّقت بالكعبةِ وخبرُ أَكلِ الأَرَضةِ لها تفصيلٌ سَرديٌّ لا شيءَ من خارج العربية وراءَه.","dateNote":"مُدّةٌ مَحسوبةٌ بالسنين قبل الهجرة، من نحو 7 إلى 3 قبل الهجرة؛ والروايةُ تُعطيها نحوَ ثلاث سنينَ لا بَدءًا وانتهاءً مؤرَّخَين."},"buath":{"title":"يومُ بُعاث","summary":"غَلَبت الأوسُ — وظهرُها قُرَيظةُ والنَّضيرُ من اليهود — الخزرجَ وظهرُها قَينُقاع. وكان عمرو بن النعمانِ البَياضيُّ سيّدُ الخزرجِ أخذ رُهُنًا من القبائل اليهوديةِ فقَتَلهم، فدَفَعها ذلك إلى الصفّ الآخر. وقُتل هو في القتال. ثمّ اختارت القبيلتان المُنهَكتان عبدَ الله بن أُبَيٍّ يَحفَظ السِّلم — والخَلاءُ الذي تَرَكه ضَعفُه هو الذي دخل فيه محمدٌ سنةَ 622.","dispute":"مؤرَّخٌ بالعَدّ إلى الخلف من الهجرة، وهي النقطةُ الثابتةُ الوحيدةُ التي تَملِكها الروايةُ العربية حقًّا. ومقالٌ مرجعيٌّ يُسمّي اليومَ غيرَ حاسمٍ ومقالٌ آخرُ يقول إنّ الأوسَ غلبت. وقد ضعُف أثرُ ابنِ أُبَيٍّ بعد مَقدَم النبيِّ سنةَ 622، وأسلمت القبيلتان فصارتا الأنصار.","dateNote":"مَحسوبٌ بالعَدّ إلى الخلف من الهجرة، وهي النقطةُ الثابتةُ الوحيدةُ التي تَملِكها الروايةُ العربية حقًّا."},"alexandria-falls":{"title":"سقوطُ الإسكندرية","summary":"ذَهَبت مصرُ بعد حِصارٍ سنةً كاملة، وأُبطِل عَطاءُ الحِنطةِ بالقسطنطينية. وتَبِع ذلك طاعون.","dispute":null,"dateNote":"الحِصارُ السنويُّ يَنتهي 619 على الحِساب المعتاد؛ والتأريخُ اليونانيُّ يُجيز 618-620."},"year-of-sorrow":{"title":"عامُ الحزن","summary":"ماتت خديجةُ ومات أبو طالبٍ في العام نفسِه، بُعَيد انفراط المقاطعة. وكان الموتُ الثاني في السياسة بوزن الأولِ في النفس: كان أبو طالبٍ يَحمِل حِمايةَ بني هاشمٍ عن ابن أخيه، ولم يَحمِلها من خَلَفه على رياسة العشيرة. وفي سنتَين كان محمدٌ يَطلُب قبيلةً خارجَ مكّةَ تَقبَله.","dispute":"لا تاريخَ لواحدةٍ من الوَفاتَين. والتسلسلُ — انفراطُ المقاطعة، فموتُ الحامي، فطَلَبُ حَليفٍ من خارج — سلسلةُ الروايةِ السببيةُ هي، وهي أمتنُ تسلسلًا منها تأريخًا.","dateNote":"ثلاثُ سنينَ قبل الهجرة على الحِساب المعتاد؛ والسنةُ مُعطاةٌ 619 أو 620، والوَفاتان موضوعتان بينهما أشهرٌ ولا واحدةَ منهما مؤرَّخة."},"musaylima-claims":{"title":"دَعوى مسيلمة","summary":"أعلن كاهنٌ من بني حنيفةَ في قريته هَدّارَ بوادي الفَلْج أنّه نبيٌّ قبل الهجرة. فوسطُ الجزيرةِ يُخرِج مُدَّعيه، واليمامةُ أرضُ زراعةٍ مُستقِرّةٍ لها حياتُها الدينيةُ الخاصّة.","dispute":null,"dateNote":"لا يُوضَع إلّا بـ«قبل الهجرة»."},"aqaba-pledge-first":{"title":"بيعةُ العقبةِ الأولى","summary":"لَقي اثنا عشرَ رجلًا من يثربَ، أكثرُهم من الخزرج، محمدًا بالعقبةِ قربَ مِنًى في الحجّ، فأَخَذوا على أنفسهم أن يَتَّبِعوه. وكانت يثربُ قد خَرَجت من بُعاثَ قبلَها بأربع سنواتٍ وقبيلتاها العربيّتان مُنهَكتان وزعيمُها التوافقيُّ رقيقُ السُّلطان، والواحةُ تَطلُب حاكمًا من الخارج — وهذا هو الباب الذي تَدخُل منه هذه اللقاءات.","dispute":"المُفاوَضةُ كلُّها مادّةُ سِيرة، ولا تُؤرَّخ إلّا بموضعها من الهجرةِ ومن تقويم الحجّ.","dateNote":"سنةً قبل الهجرة على الحِساب المعتاد، في موسمِ حجّ؛ ولا تاريخَ بالتقويم."},"hijra":{"title":"الهجرة","summary":"انتقل محمدٌ من مكّة إلى يثرب بمن بقي من أصحابه بعد بيعتَي العقبة في موسمَي الحجّ السابقَين، والروايةُ تجعل الوصول في أيلول. وصارت السنةُ مبدأَ التقويم الإسلاميّ، ومن ثَمّ حُسِب إليها أكثرُ تواريخ جزيرة العرب في هذا الأطلس حسابًا رجعيًّا.","dispute":"السنةُ مبدأُ التقويم الهجريّ، فهي التاريخُ الوحيد في الرواية العربية الذي لا يُحسَب على غيره — غير أنّه لا يُثبِته شيءٌ خارجيّ كذلك، وأقدمُ الأخبار اليونانية والسريانية عن العرب متأخّرةٌ عنه. والحدثُ لا يَرِد إلّا في الرواية العربية المتأخّرة، ولذلك دُرِج هنا في «رواية» وإن لم تكن السنةُ موضعَ شكّ. وخروجُ هرقل من القسطنطينية في السنة نفسِها حدثٌ آخر، مصدرُه بيزنطيّ، وقد أُفرِد بمدخلٍ خاصّ.","dateNote":"مَبدأُ التقويم الهجري، ومنه يُحسَب سائرُ التأريخ العربي؛ والروايةُ تضع الوصولَ إلى يثربَ في أيلول 622."},"aqaba-pledge-second":{"title":"بيعةُ العقبةِ الثانية","summary":"بايع في الموضع نفسِه وفدٌ أكبرُ كثيرًا من يثرب — ثلاثةٌ وسبعون رجلًا وامرأتان من الأوسِ والخزرجِ على العَدّ المعتاد — وهذه المرّةَ على أن يَمنَعوه. وتَبِعت الهجرةُ في أشهر.","dispute":"الأعدادُ والشروطُ من السِّيرة. وأمتنُ ما فيه تَوقيتُه، لأنّه يَقَع قُبَيل التاريخِ الوحيدِ الذي تَملِكه الروايةُ العربية حقًّا.","dateNote":"موضوعةٌ في حَزيران 622، أشهرًا قبل الانتقال إلى يثرب؛ والسنةُ ثابتةٌ لأنّها سنةُ الهجرةِ نفسُها، والشهرُ رواية."},"ganzaka-624":{"title":"حملةُ هِرقل","summary":"نَهَب دَوين وكَسَر جيشَ خسروَ بغَنزَكا بعَونِ عربٍ موالين — والعربُ العملاءُ يُقاتِلون في حربٍ إمبراطوريةٍ والإمبراطوريّتان يَنفَد منهما الرجال.","dispute":null,"dateNote":null},"nineveh":{"title":"معركةُ نينوى","summary":"في الثاني عشرَ من كانون الأول كَسَر هِرقلُ الجيشَ الفارسيَّ ثمّ نَهَب دَستَجِرد. وفي سنةٍ كان خسرو الثاني ميتًا وابنُه يَطلُب الصلح.","dispute":null,"dateNote":null},"badhan-ends":{"title":"باذان","summary":"خَدَم آخرُ الولاةِ الساسانيّين في جنوب الجزيرة إلى سنة 628. فينتهي اليمنُ الفارسيُّ وفارسُ نفسُها تَتفكَّك.","dispute":null,"dateNote":null},"asha-dies":{"title":"وفاةُ الأعشى","summary":"مات قُبَيل سنةِ 630 بقليلٍ الشاعرُ الذي أشار إلى ذي قارٍ باسم «معركةِ الحِنو»، ونَظَم في محمدٍ قصيدة. وهو أيضًا شاعرُ يوم الصفقةِ، مَدَح هَوْذةَ لمّا أطلق المائةَ من تميم.","dispute":"لم يُستخرَج اسمُه ولا قبيلتُه ولا تواريخُه بأكثرَ من «مات قُبَيل 630». وكان يَنسُب إلى جنّيٍّ اسمُه مِسحَلٌ أنّه يُلقي عليه شعرَه. واسمُ «الحِنو» هو عينُ اسم اليومِ الخامسِ من أيام البسوسِ عند ابن الأثير، فالاسمُ مُعادُ الاستعمال.","dateNote":"لا يُعطى إلّا بـ«قُبَيل 630»."},"khansa-converts":{"title":"إسلامُ الخنساء","summary":"جاءت في وفدٍ من قومها فأسلمت. وسألها محمدٌ أن تُنشِد وقال لها أن تَمضيَ، ويُروى أنّه فضَّلها على امرئ القيس.","dispute":null,"dateNote":"مَحسوبٌ في التأريخ الهجري من 622."},"allat-shrine-demolished":{"title":"هدمُ بيت اللات","summary":"هُدِمت الصخرةُ المُربَّعةُ وما عليها من بناء، وكانت في يد بني عَتّابٍ من ثقيف، شَرطًا في مُصالَحة القبيلة. وكان حِماها أرضًا لا يُمَسّ فيها شجرٌ ولا صيدٌ ولا دمُ إنسان.","dispute":null,"dateNote":"مؤرَّخٌ بالتأريخ الهجريِّ لتسويةِ الطائف، وهي مُعطاةٌ 630 أو 631."},"durayd-dies":{"title":"مقتلُ دريد بن الصِّمّة","summary":"شيخٌ كبيرٌ حُمِل إلى المَيدان في شِجار، كان قد قاتل في نحوِ مائة معركةٍ ولم يُهزَم في واحدةٍ منها بحسب أبي عبيدة. وبقي على وَثنيّته إلى آخرِه. وسمّاه ابنُ سَلّامٍ أولَ شعراء الفُرسان.","dispute":null,"dateNote":"حُنَينٌ مؤرَّخةٌ في التأريخ الهجري، سنةَ ثمانٍ."},"wadd-demolished":{"title":"هدمُ وَدّ","summary":"بُعِثت في نيسانَ 631 بَعثةٌ لكَسر صنمِ وَدٍّ، وكان في يد بني كلبٍ بالواحة. ووَدٌّ من القليل من هذه الآلهةِ الذي له حياةٌ نقشيةٌ عميقةٌ حقًّا — معابدُ، وتَمائم، وحتى لاويّون في بيته بددان.","dispute":null,"dateNote":"البَعثةُ مؤرَّخةٌ بنيسان 631 في التأريخ الهجري."},"dhu-al-khalasa-demolished":{"title":"هدمُ ذي الخَلَصة","summary":"في نيسانَ أو أيّارَ هُدِمت كُتلةُ المَرو البيضاءُ المسمّاةُ الكعبةَ اليمانيةَ وأُحرِقت بأمر محمد. وكانت بَجيلةُ تَحفَظها وخَثعَمُ تَمنَعها؛ وكان الثأرُ يُقضى عندها بثلاثة أقداح.","dispute":"ولا دليلَ نقشيًّا على هذا المَعبد ألبتّة. ولا يُسنَد إلّا في الحديث وفي فهرسِ ابن الكلبي.","dateNote":"مؤرَّخٌ بنيسان-أيّار 632 في التأريخ الهجري."},"muhammad-dies":{"title":"وفاةُ محمد بن عبد الله","summary":"مات بالمدينةِ بعد حَجّة الوداعِ بأشهر، وله نحوُ إحدى وستّين أو اثنتَين وستّين على الحِساب المُواضَعِ عليه. وفي سنةٍ كانت القوّاتُ التي ستأخذ الحيرةَ وتَبلُغ اليرموكَ في المَيدان؛ وهَدمُ المَشاهدِ الذي يُغلِق هذا الأطلس — وَدٌّ سنةَ 631 وذو الخَلَصةِ سنةَ 632 — من آخر سنتَين من عُمره.","dispute":"السنةُ أمتنُ ما تَبلُغه الروايةُ العربية، لأنّها المَبدأُ الذي يُحسَب منه كلُّ ما بعدها. وأمّا ما ليست عليه فهو الإسنادُ الخارجي: أخبارُ اليونانِ والسريانِ المعاصرةُ لفتوح العربِ تبدأ بعدَها بسنين.","dateNote":"مؤرَّخٌ بالثامن من حَزيران 632، سنةَ إحدى عشرةَ للهجرة - وهو المِحورُ الذي يُحسَب منه التأريخُ الهجريُّ كلُّه، والتاريخُ الوحيد في حياته الذي لا يُحسَب من غيره."},"hira-surrenders":{"title":"تسليمُ الحيرة","summary":"سلَّمت المدينةُ نفسَها إلى خالد بن الوليدِ سنةَ اثنتَي عشرةَ للهجرة. فانطوى في شيءٍ جديدٍ ذلك البلاطُ الذي كان يُعطي الشعراءَ ويَقتُل الشعراءَ ويُدِير أمرَه بالفارسيةِ ويَبعَث السُّفراءَ إلى القسطنطينية.","dispute":null,"dateNote":"مؤرَّخٌ بسنة اثنتَي عشرةَ للهجرةِ في أخبار الفتوح."},"basus-hanw":{"title":"يومُ الحَنْو","summary":"يومٌ غَلَبت فيه بكرٌ تغلبَ — وهو واحدٌ من يومَين من هذه الحربِ لا تُسجِّلهما النسخةُ الإنجليزيةُ ألبتّة. يُثبِته ابنُ الأثير صريحًا ولا يُعطيه سَردًا غيرَ النتيجة. وموضعُه في ترتيبه بعد واردات — حيث قُتل همّامُ بن مرّة — وقبل القصيبات.","dispute":"النسخةُ الإنجليزيةُ تُثبِت سبعةَ أيامٍ من حرب البسوسِ ولا تذكر هذا ولا النَّقِيّة، فالعِدّةُ تسعةٌ لا سبعة — على أنّ ابنَ الأثير نفسَه يُؤطِّر الحربَ بأنّ «الأيامَ الكبرى خمسة»، فعددُه الرسميُّ خمسةٌ وإن سمّى تسعة. ولا موضعَ له ولا تاريخ. والعقدُ الفريد يُدرِج خمسةً من أيام الحربِ لا هذا فيها.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ لا تحمل إلّا موضعَ اليوم في ترتيب ابن الأثير، خامسًا بين واردات والقصيبات."},"basus-naqiyya":{"title":"يومُ النَّقِيّة","summary":"يومٌ آخرُ لبكر، بعد تَحلاقِ اللِّمَمِ وقبل الفصيل — في الجانب المَغلوبِ من المِحور، كشأن كلِّ ما يَتبَع مقتلَ بُجَير. ولا يزيد ابنُ الأثير على تسميته وذِكرِ الغالب.","dispute":"غائبٌ عن النسخة الإنجليزيةِ ألبتّة كغياب الحَنْو؛ وبهما تَبلُغ أيامُ الحربِ المُسمّاةُ تسعةً لا سبعة، وإن كان تأطيرُ ابنِ الأثير نفسِه يجعل الأيامَ الكبرى خمسة. وقائمةُ العقد الفريدِ الخمسةُ لا تَذكُره. ولا موضعَ ولا تاريخَ ولا سَرد.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ لا تحمل إلّا موضعَ اليوم في ترتيب ابن الأثير، ثامنًا بين قضةَ والفصيل."},"hira-palmyrene-garrison":{"title":"تمركزُ قوّاتٍ تَدمُريّةٍ بالحيرة","summary":"أقدمُ ذِكرٍ موثَّقٍ للحيرة: قوّاتٌ تَدمُريّةٌ تَمركَزت في الموضع، قبل أن يَجعله ملوكُ لخمٍ عاصمةً بنحو قرنَين. فالموضعُ على حاشية البادية كان يَستحِقّ حاميةً يومَ كانت تَدمُرُ — لا المدائن — هي القوّةَ الباسطةَ يدَها على بادية الفُرات.","dispute":"خارجُ نافذة الملفّ 300–640، فيُبلَغ بالبحث لا بمِزلاقِ السنين. والنسخةُ الإنجليزيةُ لا تذكر هذا التاريخَ ألبتّة وتَبدأ تاريخَ الحيرةِ بأواخر القرن الرابع، حيث تضع «دائرةُ المعارف الإيرانية» مَقدَمَ مشايخِ لخم؛ والمصادر العربية تُعطي 132 أقدمَ ذِكرٍ موثَّق. ولا شيءَ يَصِل الحاميةَ بالمدينةِ العربيةِ بعدَها إلّا الموضع.","dateNote":"المصادر العربية تُعطي سنةَ 132م أقدمَ ذِكرٍ موثَّقٍ للحيرة، من تمركُزِ قوّاتٍ تَدمُريّةٍ بها؛ والمصادر الإنجليزيةُ لا تَرِده وتَبدأ بالقرن الرابع."},"heraclius-counteroffensive":{"title":"هرقل يبدأ هجومه المضادّ","summary":"خرج هرقل من القسطنطينية في الرابع من نيسان مُبتدئًا الحملةَ التي كسرت فارسَ في ستّ سنين. وهي في سنة الهجرة نفسِها يفصل بينهما أشهر، وبهما معًا يُختَم العصرُ الذي يغطّيه هذا الأطلس: إمبراطوريّةٌ أنهكتها حربُ فارس، وعلى وشك أن تلقى قوّةً لم تكن موجودةً حين بدأت الحرب.","dispute":"مستقلٌّ عن الهجرة ومصدرُه غيرُ مصدرها. وقد كانا فيما مضى مدخلًا واحدًا في هذا الملفّ، فكان رابطٌ واحد يقوم مقام حدثَين لا صلة بينهما.","dateNote":"مؤرَّخٌ في السجلّ البيزنطيّ بالرابع من نيسان سنة 622."}},"people":{"imru-al-qays-poet":{"name":"امرؤ القيس","blurb":"أميرٌ كِنديٌّ مَسلوبٌ سُمّي المَلِكَ الضِّلّيلَ لأنّه لم يَستردّ عرشَ أبيه. كان أبوه حُجرٌ يأخذ الإتاوةَ من بني أسدٍ بقسوة، فلمّا مَنَعوها عاقبهم وطَرَدهم من ديارهم، فقَتَلوه غِيلة؛ فحَلَف الابنُ ألّا يَشرَب خمرًا ولا يَتزيَّن حتى يَثأَر، وعُرِض عليه قتلُ شريفٍ أو ديةٌ من شاءٍ وإبلٍ أو الحرب، فاختار الحرب. ثمّ فَقَد نُصَراءه لمّا رأت بكرٌ وتغلبُ أنّ الثأرَ قد كفى، فاختفى في حصنِ سيّدٍ يهوديٍّ بالأبلقِ وأودعه ثلاثًا — ابنتَه هندًا، وابنَ عمِّه، ودرعَه — فلم يَستردَّها أبدًا. ثمّ رَكِب شمالًا بكتابِ تعريفٍ فمات بالأناضولِ من داءٍ جِلديٍّ كان قد كَتَب عنه في شعره هو. أولُ شاعرٍ كبيرٍ في العربية.","lifeNote":"ثلاثُ مجموعاتٍ من التواريخ لا مجموعتان، وليس فيها واحدةٌ تَخلو من مُعارِض. المصادر العربية تعطي 496–544. والإنجليزيةُ تعطي نحو 496–565 ونحو 526–565، وتقول صريحًا إنّ المؤرّخين مختلفون. والرقمُ العربيُّ 544 للوفاة يُسقِط سفارةَ قيصرَ 561–565 جملةً، إذ يَجعله ميتًا قبلَها بسبعةَ عشرَ عامًا؛ ونحو 496–565 تُلزِم رجلًا في الثالثةِ والستّين أو الرابعةِ بعُبور الدنيا في سفارة؛ ونحو 526–565 تَجعله رضيعًا حين قُتل أبوه نحو 525، وهو ما لا يستقيم مع طَلَب ثأرٍ على يد رجلٍ راشد. فليُعرَض الثلاثُ تَعارُضًا قائمًا، ولا تُختَر واحدةٌ في خَفاء. ولا إسنادَ نقشيًّا ولا خارجيًّا لوجود الشاعرِ نفسِه ولا لتواريخه ألبتّة، وهو غيرُ امرئ القيسِ الذي في نقش النمارةِ سنةَ 328."},"tarafa":{"name":"طرفة بن العبد","blurb":"شاعرٌ شابٌّ بالحيرةِ هَجا الملكَ فأُرسِل إلى بلاده يَحمِل كتابًا مختومًا بقتل نفسه. أقرأ عمُّه كتابَه غلامًا فألقاه في النهر؛ وأبى طرفةُ أن يَفُضّ خاتَمَ المَلِك فحَمَل كتابَه إلى عاملِ البحرين. وله واحدةٌ من المعلّقات.","lifeNote":"التاريخان كلاهما إعادةُ بناء، ويُعطيانه نحوَ ستٍّ وعشرين سنة. ولا شيءَ مستقلٌّ يُثبِت واحدًا منهما."},"al-mutalammis":{"name":"المتلمّس","blurb":"عمُّ طرفة، وهو الذي كان له من العقلِ أن يُقرِئ كتابَه المختومَ غلامًا من المدينةِ قبل أن يُبعِد في الطريقِ فيُدرَك. فألقاه في النهرِ ونجا. وصحيفتُه مثلٌ في العربية إلى اليوم.","lifeNote":"لا تواريخَ له في أيّ مصدرٍ متاح. وهو في السجلّ لا يكاد يوجد إلّا نصفًا ثانيًا من حكاية طرفة."},"amr-ibn-kulthum":{"name":"عمرو بن كلثوم","blurb":"سيّدُ تغلبَ وصاحبُ معلّقة. أساء الملكُ إلى أمّه على المائدةِ فقَتَله بها، وهذا أصرحُ عملِ عُنفٍ يُنسَب إلى شاعرٍ عربيٍّ قطّ. وشعرُه هو أيضًا السببُ الوحيد في أنّ أحدًا يَذكُر يومَ خَزاز، فهو شاعرٌ يَحمِل يومًا كاملًا على ظَهر بيتٍ من شعره.","lifeNote":"لم تُوجَد له تواريخُ غيرُ ما يَلزم من عهد عمرو بن هندٍ 554–568/9. وسنةُ الوفاةِ هنا حَشوٌ يَحمِل موضعَه لا تقدير."},"al-harith-ibn-hilliza":{"name":"الحارث بن حِلِّزة","blurb":"سيّدٌ بَكْريٌّ معلّقتُه مُرافَعةٌ قانونيةٌ شِعرًا، مُوجَّهةٌ إلى مَلِكِ لخمٍ في وجه تغلب. ووجودُها في المُعتمَدِ ربّما يَرجِع بعضُه إلى أنّ الجامعَ نفسَه كان له رُعاةٌ من بكر.","lifeNote":"لا تواريخَ له في موضع. والمَرتكزُ الوحيد أنّ قصيدتَه تُخاطِب عمرو بن هند، فيضعه في 554–568/9."},"zuhayr":{"name":"زهير بن أبي سُلْمى","blurb":"صاحبُ الحِكمةِ في المعلّقات، وأبياتُه الخَواتمُ أشهرُ شِعرِ حِكمةٍ في العصر. نُظمت معلّقتُه بعد ما آلت إليه حربُ داحسٍ والغبراء، وفيها مدحُ هَرِمِ بن سِنانٍ والحارثِ بن عوفٍ بالاسمِ لدَفعهما ديات الفريقَين — نحوَ ثلاثةِ آلافِ بعير — من مالهما الخاصّ. وحَلَف هَرِمٌ ألّا يُسلِّم عليه زهيرٌ إلّا أعطاه، فاستحيا الشاعرُ من كثرة ما يَقبَل، فكان يَمُرّ بالجماعةِ فيُصَبِّحهم رجلًا رجلًا ويترك هَرِمًا. وابنُه كعبٌ مَدَح محمدًا بعدَه. وليُحذَر الالتباسُ بقيسِ بن زهير، فهو رجلٌ آخرُ تمامًا.","lifeNote":"مُتعارِضٌ في صفحةٍ عربيةٍ واحدة: وُلد نحو 520 بنجدٍ وتوفّي نحو 608 في موضع، ووُلد نحو 530 وتوفّي بين 611 و627 بعد أسطرٍ من الصفحة نفسِها. ولا يُعطي نُلدكه إلّا «منتجٌ في آخر القرن السادس». والقبيلةُ مُثبَتةٌ في المصادر العربية — مُزَينة، ومن ناحية أمّ والده مُرّةُ بالحجاز — ونشأ في غطفانَ عند خاله بشامةَ بن الغَدير."},"antara":{"name":"عنترة بن شدّاد","blurb":"ابنُ فارسٍ عبسيٍّ حُرٍّ وامرأةٍ حبشيةٍ مَسبيّةٍ اسمُها زبيبة، وله أخوان لأمّه عبدان: جَريرٌ وشَيبوب. وكان عبدًا لأنّ العربَ لم تكن تَعترِف ببني الإماءِ إلّا إذا امتازوا ببطولةٍ أو شاعريّة — والمصادر العربية تَنُصّ على هذه الآليّةِ صريحًا، وهي التي أُلحِق بها بنسب أبيه. وهو أحدُ أغربةِ العربِ الثلاثة. والرجلُ التاريخيُّ شاعرُ فَخرٍ وقتالٍ شديدُ الحَدِّ له دِيوانٌ صغير، مُثبَتٌ في موضعَين لا أكثر: مَرثيةِ مالك بن زهير، وبطولتِه في ذات الجراجر. والفارسُ العبسيُّ المُسمّى في الهباءةِ أبوه شدّادٌ على جَرْوةَ لا هو. وأمّا بطلُ الفُروسيّةِ في رومانس عَبلةَ فسيرةٌ متأخّرةٌ جدًّا نَمَت بالتراكم الشَّفَويِّ من نحو القرن الثاني عشر.","lifeNote":"رِوايةٌ وإعادةُ بناءٍ لا توثيق، وغيرُ مستقرٍّ داخلَ مقالٍ عربيٍّ واحد: المقدِّمةُ تعطي 608 للوفاة، وقسمُ الوفاةِ يعطي حياةً من 525 إلى 615، والزِّرِكْليُّ يعطي 600؛ والمتنُ يقول إنّه بلغ نحوَ تسعين والجدولُ يقول ثلاثًا وثمانين. والمولدُ موضوعٌ في الربع الأولِ من القرن السادسِ ومُثبَتٌ بسنة 525 من مشاركته في قتال داحسٍ — فالتاريخُ مُستخرَجٌ من المعركةِ لا المعركةُ من التاريخ. ويضع نُلدكه زمنَ إنتاجه في آخر القرن السادس، وذلك يوافق الحروبَ التي تُشير إليها قصيدتُه ويَستثقِل مولدًا سنةَ 525. ومُطالَبةُ السِّيرةِ له بأن يَجيءَ بألفِ ناقةٍ من نوق النعمانِ الثالث (580–602) مُحيلةٌ زمنيًّا على ذلك المولد، وهذا من أسباب أنّ مادّةَ عَبلةَ من طبقة السِّيرةِ الشعبيةِ لا من الأخبارِ القديمة. وقاتلُه زُرُّ بن جابرٍ النبهانيُّ لا «وَسْر بن جابر» الذي في المصادر الإنجليزية."},"labid":{"name":"لبيد بن ربيعة","blurb":"وحدَه من شعراء المعلّقاتِ كان حيًّا لمّا بدأ محمدٌ يَدعو، فأسلم. وقد رَثى مَلِكًا لخميًّا قبل ذلك؛ ثمّ بَعَث إليه واليٌ على الكوفةِ مائةَ بعيرٍ ليَستطيعَ الوفاءَ بنَذرٍ نَذَره أن يُطعِم الناسَ كلّما هَبَّت الصَّبا.","lifeNote":"نحو 560 إلى نحو 661 هو المدى المُواضَعُ عليه، ويَلزم منه عُمرٌ مُفرِط. والرقمان كلاهما ظنّ."},"al-nabigha":{"name":"النابغة الذبياني","blurb":"واسمُه زيادُ بن معاوية. وهو الشاعرُ الوحيد المُسنَدُ تَردُّدُه على البلاطَين العميلَين كلَيهما: أوجبت أبياتٌ في المَلِكةِ اللخميّةِ هربَه إلى الغساسنة، ثمّ عاد نحو 600، ثمّ اعتزل إلى قومه لمّا سقط راعيه. ويُروى أنّ المفضَّلَ وأبا عبيدةَ أدرجا قصيدتَه في السبعِ مكانَ عنترةَ والحارث. ومن بني ذبيان، مولودٌ قربَ مكّة.","lifeNote":"نحو 535 إلى نحو 604، وكلاهما ظنّ، والوفاةُ مُسمّاةٌ صريحًا غيرَ مؤكَّدة. وتسلسلُ رُعاته: المنذرُ الثالثُ بن الحارث، ثمّ خَلَفُه من سنة 562، ثمّ النعمانُ الثالث."},"al-asha":{"name":"الأعشى","blurb":"كان يَنسُب شعرَه إلى جنّيٍّ اسمُه مِسحَل، وغنّى يومَ ذي قارٍ باسمٍ آخرَ هو «الحِنو»، وانتهى إلى نَظم قصيدةٍ في محمد. ويُزاد في المعلّقاتِ أحيانًا. وهو شاعرُ يوم الصفقةِ أيضًا، مَدَح هَوْذةَ لمّا أطلق المائةَ من تميم.","lifeNote":"لا يُسنَد إلّا «مات قُبَيل 630». واسمُه وقبيلتُه — ميمونُ بن قيسٍ من بكرٍ على المُواضَعة — لم يُمكِن تأكيدُهما."},"al-khansa":{"name":"الخنساء","blurb":"تُماضِرُ بنتُ عمرو، والخَنساءُ أي الدقيقةُ قَصَبةِ الأنف، بنتُ سيّدِ قومٍ من بني سُلَيم. أكثرُ من مائة مَرثيةٍ في أخوَين قتيلَين، ونحوُ ألفِ بيتٍ باقيةٍ من شعرٍ قصيرٍ يائسٍ رَفَع الرِّثاءَ إلى منزلة الشعرِ العالي. وجَمَع مَراثيَها بعدها بقرنَين ابنُ السِّكّيت.","lifeNote":"لا تاريخَ مولدٍ ولا وفاةٍ لها في أيّ مصدرٍ متاح. وحياتُها لا تُثبَّت إلّا بثلاثة أحداث: موتُ أخوَيها 612–613، وإسلامُها 629، ومقتلُ أربعةٍ من بَنيها بالقادسيةِ سنةَ 636، ويَلزم منه أنّها عاشت بعد ذلك."},"al-muhalhil":{"name":"المهلهل","blurb":"أخو كُليب، وقائدُ تغلبَ في الحربِ وشاعرُها، حَلَف ألّا يَمَسّ طِيبًا ولا يَشرَب خمرًا حتى يَقتُل بكلّ عُضوٍ من أعضاء أخيه رجلًا من بكر. فغَلَب في كلّ يومٍ كبيرٍ إلى أن قَتَل الفتى الذي جاءه بكتاب صُلح، فغُلِب في كلّ يومٍ بعدَه. وانتهى في اليمنِ مُتزوِّجًا في مذحج، فمات عَطَشًا في يد آسِره.","lifeNote":"غيرُ مؤرَّخٍ ألبتّة. وحتى تعيينُه عديَّ بن ربيعةَ — وهو المعتادُ في الأدب العربي — لم يُمكِن تأكيدُه من المصادر المتاحة، وهي لا تُسمّيه إلّا أبا ليلى المهلهل."},"adi-ibn-zayd":{"name":"عدي بن زيد","blurb":"أنفعُ شخصيّةٍ «من الداخل» في الفترة كلِّها: وُلد بالحيرةِ في أسرةٍ عِباديّةٍ نصرانيةٍ خَدَم جدُّه وأبوه كلاهما المناذرة، وتعلَّم في البلاط الفارسي، يتكلّم العربيةَ والفارسيةَ ويُرجَّح السريانية، وخَدَم دَبيرًا لشأن العربِ في عهد مَلِكَين ساسانيَّين، وأُرسل إلى القسطنطينيةِ سنةَ 579 فعاد بكُتُب. وتزوَّج في البيت المالك، وأسهم في تَولية مَلِكه، فحَبَسه ذلك المَلِكُ وخَنَقه. وزوجُه هندُ بنتُ النعمان — أو حفيدتُه، والمصادر تختلف — نصرانيةٌ موصوفةٌ بجمالٍ بالغ.","lifeNote":"وُلد نحو 550 ومات نحو 600؛ وكلاهما تقريبٌ، إلّا أنّهما مَشدودان إلى سفارةٍ موثَّقةٍ سنةَ 579 وإلى عهدِ مَلِك، فهو أثبتُ مَرساةً من أكثرهم."},"al-shanfara":{"name":"الشنفرى","blurb":"شاعرٌ صُعلوكٌ من عُصبة تأبّطَ شرًّا، مشهورٌ بسُرعة العَدْو. كان قد نَذَر من الأزدِ مائةً فبلغ تسعةً وتسعين؛ ثمّ رَفَس أزديٌّ جُمجمتَه بعد ذلك فدخلت فيه شَظيّةٌ فمات منها، والروايةُ تَعُدّ ذلك المائة. ولاميّةُ العربِ التي صَنَعت شُهرتَه تُنسَب من العصر الوسيطِ إلى وضّاعٍ معروفٍ من القرن الثامن.","lifeNote":"لا تواريخَ له ألبتّة في المصادر المتاحة؛ ووسطُ القرن السادسِ وآخرُه مُواضَعةٌ في كُتُب التعريفِ لم يَستطِع أحدٌ إسنادَها، وتاريخُ الوفاةِ نحو 525 يدور بلا آلة. وقبيلتُه — الأزدُ أو بنو سَلامانَ على المُواضَعة — كذلك بلا سَنَد."},"taabbata-sharran":{"name":"تأبّط شرًّا","blurb":"ثابتُ بن جابرٍ الفَهميّ، أي الذي تأبَّط شرًّا — ولقبٌ له ثلاثةُ تفسيراتٍ لا تَجتمِع، أحدُها أنّه احتَمَل كَبشًا فإذا هو غُول. ولم تَخلَعه قبيلتُه، وذلك نادرٌ في الصعاليك. قاد عُصبةً من جبال السَّراواتِ على بَجيلةَ وهُذَيلٍ والأزدِ وخَثعَم، فقُتل في غارةٍ وأُلقي في غار.","lifeNote":"تواريخُه مجهولةٌ صريحًا؛ وآخرُ القرن السادس أو أولُ السابع مُستنبَطٌ من أسماء الأعلامِ في شعره. وهو من فَهمٍ بغرب الجزيرةِ قربَ الطائفِ ومكّة. ولاميّتُه، وهي التي صنعت شُهرتَه، من أشدِّ ما نُسب إلى الوضع."},"urwa-ibn-al-ward":{"name":"عروة بن الورد","blurb":"الصُّعلوكُ الذي كان يَسرِق ليُطعِم الفقراء، ويُقال إنّه أكرمُ العربِ القدماء. وبعضُ شعره في امرأةٍ طلَّقها سكرانَ فلم يَستطِع رَدَّها صاحيًا. وهو من بني عبس، ومن ثَمّ قِرانُه بعنترةَ في الثقافة الحديثة.","lifeNote":"520–600 مُعطاةٌ ولا شيءَ وراءَ واحدٍ من الرقمَين."},"al-samawal":{"name":"السموأل بن عادياء","blurb":"سيّدٌ يهوديٌّ بتيماءَ بنى جدُّه حصنَ الأبلقِ الأبرقَ على تلٍّ فوقَ طريق الشام. آوى امرأ القيسِ وحَفِظ ودائعَه، فلمّا أسر مُحاصِرٌ ابنَه عائدًا من صيدٍ وخيَّره، تَرَك الفتى يُقتَل بين يدَيه ولم يُسلِّم المال. و«أوفى من السموأل» بقي بعد كلّ شيءٍ آخرَ منه.","lifeNote":"وُلد في أول القرن السادسِ بتيماءَ ومات نحو 560؛ وكلاهما إعادةُ بناء. ونسبُه متنازَعٌ فيه — يَجعله ابنُ دريدٍ ابنَ كاهن، ويُعطيه الجوالِيقيُّ أمًّا غسّانيةً وأبًا أزديًّا. وغيرُ معلومٍ أكان امرؤ القيسِ حيًّا أم ميتًا وقتَ الحصار."},"imru-al-qays-namara":{"name":"امرؤ القيس بن عمرو","blurb":"سُمّي مَلِكَ العربِ كلِّهم على شاهد قبره هو. كَسَر أسدًا، وساق مذحجًا إلى أبواب نجران، وأخضَع مَعدًّا، وولّى عليهم أشرافًا صاروا فيلارخةً للروم — وذلك يَجعل بيتَ لخمٍ في القرن الرابع مُتَّجِهًا إلى روما لا إلى فارس. وهو غيرُ الشاعر.","lifeNote":"هو الحاكمُ العربيُّ الجاهليُّ الوحيدُ الذي تُثبِّت وفاتَه نقشٌ مؤرَّخ: السابعُ من كَسلول، سنةَ 223 للتأريخ البُصرَويّ."},"al-mundhir-iii-lakhmid":{"name":"المنذر بن النعمان","blurb":"خمسون سنةً من الغزوِ من الفُراتِ إلى مصرَ ونزولًا إلى نجد، وقائدان رومانيّان أسيران، والشامُ مُحرَقةٌ مرّتَين، وأربعُ مئةِ راهبةٍ يُروى أنّه جاء بهنّ فقُدِّمن للعُزّى، وظَفَرٌ على بليساريوسَ بقِلينيقوس، وموتٌ في مَيدانٍ بشمال الشامِ على يد الغسّانيِّ الذي قاتله عمرَه كلَّه. وما قبلَه في قائمة لخمٍ فضاءٌ روائيٌّ حُرّ.","lifeNote":"عهدُه 503 أو 505 إلى 554، والوفاةُ في حليمةَ مؤرَّخةٌ خارجيًّا بحَزيران 554. وهو أولُ لخميٍّ تاريخُه حقيقيٌّ سنةً سنة."},"amr-ibn-hind":{"name":"عمرو بن هند","blurb":"نُسب إلى أمّه الكِنديّة، وذِكرُه قائمٌ على عُنفٍ وشِدّةٍ لا تَرعوي. أنزل في بلاطه خيرَ شعراءِ جِيله، وأعدم واحدًا منهم بكتابٍ مختوم، واستقبل وارثًا حِمْيَريًّا فأدخله على كسرى، وقُتل على مائدته هو على يد شاعرٍ آخرَ من شعرائه من أجل إساءةٍ إلى أمّ الرجل.","lifeNote":"عهدُه 554–569 أو 570، والقَتلُ مُعطًى 568/9 أو 569/70. ونقشُ Ry 506 يَجعله عاملًا سنةَ 552، أي سنتَين قبل التوليةِ المُواضَعِ عليها، ولعلّه نائبٌ عن أبيه. وتضطرب المصادر العربية فيه أيضًا: المقدِّمةُ تقول إنّ وفاتَه تقديرًا 578 والجدولُ يقول 569، في المقال الواحد."},"al-mundhir-iv":{"name":"المنذر الرابع","blurb":"لخميٌّ قصيرُ العهدِ لا يُهِمّ إلّا لأنّ اسمَه يَرِد في قادةِ شعب جبلة — وهو التفصيلُ الوحيد الذي يُقيم تاريخَ كاسكلَ نحو 580 لتلك المعركةِ ويُسقِط سائرَ التواريخ.","lifeNote":"عهدُه مُعطًى 574 أو 575 إلى 580 في الجدول المُواضَعِ عليه، وهو إعادةُ بناءٍ متأخّرةٌ لا يُمكِن التحقُّقُ منها."},"al-numan-iii":{"name":"النعمان بن المنذر","blurb":"آخرُ ملوك لخم، وأولُ من تنصَّر من بيته علنًا على المذهب النسطوري. آوى خسروَ الثانيَ وهو فارٌّ وقاتل إلى جانبه، ثمّ خَنَق كبيرَ مُشيريه، ثمّ خَلَعه بعد اثنتَي عشرةَ سنةً الملكُ الذي أنجاه، فأخذه بالمدائن وتَرَكه يموت بالطاعون في حَبسٍ في الجبال. وسقوطُه مِحورُ الفترةِ كلِّها.","lifeNote":"توليتُه مُعطاةٌ 580 و582 في مقالٍ مرجعيٍّ واحد، وآخرُ عهده 595 في موضعٍ و602 في آخر؛ والمصادر العربية تعطي 582–609 أيضًا. وسقوطُ 602 مُثبَتٌ خارجيًّا."},"iyas-ibn-qabisa":{"name":"إياس بن قبيصة الطائي","blurb":"الرجلُ الذي أعطاه كسرى الحيرةَ بعد أن أهلك بيتَها. وكان قد وُلِّي الناحيةَ قبل ذلك، وهو في جانب الفرسِ بذي قار — سيّدٌ عربيٌّ يُدِير مدينةً عربيةً لإمبراطوريةٍ على وَشَكِ أن تَفلِت يدُها.","lifeNote":"أمسك الحيرةَ من 602 إلى 617/18 مع وَالٍ فارسيٍّ معه، على الجدول المُواضَعِ عليه."},"jabalah-iv":{"name":"جبلة بن الحارث","blurb":"مَلِكٌ غسّانيٌّ عاصمتُه مُخيَّمٌ بين حَوران والجولان، مات يُقاتِل الفرسَ في أعلى الجزيرة الفُراتية.","lifeNote":"عهدُه 512–529 في الجدول المُواضَعِ عليه؛ والوفاةُ بثنوريسَ مؤرَّخةٌ خارجيًّا سنةَ 528، ورسالةُ شمعونَ تضع معسكرَه بالجابيةِ نحو 520 — وهي مِرساةٌ مبكّرةٌ صُلبةٌ على غير المعتاد."},"al-harith-ibn-jabala":{"name":"الحارث بن جبلة","blurb":"وهو أريثاسُ باليونانية. جَعَله يوستنيانوسُ مَلِكًا وباتريكيوسَ وولّاه حُلفاءَ بيزنطةَ من العربِ كلَّهم، وهو أعلى لقبٍ أُعطيَ حاكمًا أجنبيًّا قطّ. قاتل بقِلينيقوسَ، فقال مصدرٌ يونانيٌّ إنّه فَرَّ وقال آخرُ إنّه ثَبَت؛ وأغار على آشورَ مع بليساريوس؛ واستخرج من الإمبراطورةِ توليةَ الأسقفِ الذي بنى الكنيسةَ السريانيةَ الأرثوذكسية؛ وقَتَل مَلِكَ لخمٍ بحليمةَ وفَقَد ابنَه الأكبرَ في ذلك؛ وبعين أباغَ حَمَل ابنَين قتيلَين على بعيرٍ وجسدَ مَلِكٍ عدوٍّ فوقهما.","lifeNote":"عهدُه نحو 528 أو 529 إلى 569؛ والخلافُ بين مقالَين مرجعيَّين. وهو مُسنَدٌ خارجيًّا في طوله عند بروكوبيوسَ ومَلالاسَ وغيرهما."},"al-mundhir-ghassanid":{"name":"المنذر بن الحارث","blurb":"وهو ألامونداروسُ باليونانية. أمر إمبراطورُه هو بقتله، فعَلِم فقَطَع الصِّلةَ بالإمبراطورية، ثمّ صالَحه بعد ثلاث سنينَ عند مَشهد القدّيس سرجيوس، ثمّ أحرق الحيرةَ في السنة نفسِها، ثمّ اعتُقل على حملةٍ أخفقت فنُفي إلى صِقِلّية. ولا يزال نقشٌ يونانيٌّ بالرصافةِ يُسمّيه على بناءٍ أنفق عليه.","lifeNote":"عهدُه 569 إلى نحو 581 أو 582، والاعتقالُ مؤرَّخٌ بالوجهَين في المصادر. ويقول تأريخٌ سريانيٌّ متأخّرٌ إنّه عاد إلى بلاده لمّا سقط موريقُ سنةَ 602."},"al-numan-vi":{"name":"النعمان بن المنذر الغسّاني","blurb":"اعتقلته بيزنطةُ وحاكمته بالخيانةِ سنةَ 584، فتفكَّك الاتحادُ الغسّانيُّ إلى بطونه. ويُروى أنّ موريقَ أعاده بعد سنتَين أو ثلاثٍ لأنّ الإمبراطوريةَ لم تكن تَضبُط الباديةَ بغيره.","lifeNote":"عهدُه 581–583 في الجدول المُواضَعِ عليه؛ والاعتقالُ سنةَ 584 مؤرَّخٌ خارجيًّا."},"hujr-akil-al-murar":{"name":"حجر آكل المرار","blurb":"آكلُ المرار، ولّاه مَلِكٌ حِمْيَريٌّ على قبائل مَعدٍّ سنةَ 425. ومُلكُ كندةَ يبدأ به أداةً مُوكَلةً من تاجٍ جنوبيٍّ لحكم النَّوَمة، والمصادر العربية تُجري عهدَه إلى 458.","lifeNote":"المصادر الإنجليزية تقول إنّه لا عهودَ مؤرَّخةً له ألبتّة، وتضعه في أول القرن الخامسِ ووسطِه بالاستنباط من عهد راعيه الحِمْيَريّ وحدَه. والمصادر العربية تعطي تواريخ: وُلّي سنةَ 425 على يد حسنِ بن عمرو بن تُبّاعٍ مَلِكِ حِمْيَر، وعهدُه 425–458. و458 هنا آخرُ ذلك العهدِ وهي مُستعمَلةٌ سنةَ وفاة؛ ولا شيءَ مستقلٌّ يُؤكِّدها، ويُروى أيضًا أنّه حَكَم طويلًا ومات هَرَمًا ببطن عاقل."},"amr-al-maqsur":{"name":"عمرو المقصور بن حُجر","blurb":"خَلَف حُجرًا بنجد، وعهدُه 458–489 على الحِساب العربي، رفضته قبائلُ ربيعةَ وقُتل في الأغلبِ وهو يُقاتلها. والمصادر العربية تكتب لقبَه «المنصور» حيث تكتبه الإنجليزيةُ «المقصور».","lifeNote":"ليس في المصادر الإنجليزية إلّا «قُتل في الأغلبِ في قتالٍ مع ربيعةَ في آخر القرن الخامس». والمصادر العربية تعطي العهدَ 458–489، ومنه سنةُ الوفاةِ 489. وهي تكتب اللقبَ «المنصور» لا «المقصور» — وهو خلافٌ في ضبط العَلَم نفسِه لا في الرجل."},"al-harith-ibn-amr":{"name":"الحارث بن عمرو","blurb":"أشهرُ ملوكِ كندةَ وأولُ من ظَهَر منهم في المصادر البيزنطية، كان له تَكليفٌ حِمْيَريٌّ وعَهدُ حُلفاءٍ بيزنطيٌّ وفيلارخيّةٌ بفلسطينَ في وقتٍ واحد. وتَمَزدَك في عهد مَلِكٍ فارسيٍّ، وفَقَد الحيرةَ لمّا ردَّ الذي بعدَه المناذرةَ إليها. وقُتل في بادية الشام — على يد المنذرِ الثالثِ اللخميّ، أو على يد بني كلب، على حسبِ ما تأخذ من المصادر. وقَسَّم بنوه الأربعةُ أمرَه فأفسدوه.","lifeNote":"عَهدُ الحُلفاءِ سنةَ 502 ووجودُه كلاهما مُسنَدٌ خارجيًّا؛ وكيفيّةُ موته متنازَعٌ فيها. والمصادر العربية تُضيف عهدًا — 489–528 — وتاريخَ تأسيسٍ سنةَ 425 للمملكةِ التي وَرِثها، حيث تقول الإنجليزيةُ إنّها لم تجد عهودًا مؤرَّخة."},"hujr-ibn-al-harith":{"name":"حجر بن الحارث","blurb":"أبو امرئ القيس، وُلّي من كندةَ على أسدٍ وغطفانَ فقُتل لمّا ثارت أسد. وكلُّ ما في أشهرِ سِيرةٍ في الشعر العربي يبدأ من موته. وكان يأخذ منهم الإتاوةَ بقسوة، فمَنَعوها، فعاقبهم وطَرَدهم من ديارهم، فقَتَلوه غِيلة.","lifeNote":"مؤرَّخٌ بالاستنباط المحضِ من انهيار الراعي الحِمْيَريِّ لكندةَ سنةَ 525."},"shurahbil":{"name":"شرحبيل بن الحارث","blurb":"أحدُ الأبناءِ الأربعةِ الذين قَسَّموا أمرَ مَعدّ. أقبل على أخيه ومعه شُذّاذُ العربِ ممّن كانوا مع الملوك، ونادى كلُّ فريقٍ بمائةٍ من الإبل في رأس الآخر، فخَسِر. فطَ
