 read as a composite of separate raid-stories.","tribe":"Taghlib","blurb":"Really named Wāʾil, and called 'little dog' because he staked a puppy at the pastures he reserved for himself and killed anything that came near. He enforced his pasture and water so violently that other tribes came to loathe him. He shot a she-camel that had strayed among his brother-in-law's herd and was speared for it, and forty years of war followed.","path":[]},{"id":"jassas","name":"Jassās ibn Murra","ar":"جساس بن مرة","role":"warrior","birth":null,"death":535,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Shaybān of Bakr","blurb":"He speared Kulayb over a camel and his father refused to hand him over, which is the formal start of the war. He raised Kulayb's son himself, and the boy killed him when he found out who his father's killer was.","path":[]},{"id":"al-basus","name":"Al-Basūs","ar":"البسوس","role":"legendary","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Her name and lineage — al-Basūs bint Munqidh al-Tamīmiyya — appear in Ibn al-Athīr; another account gives her no lineage and only calls her a woman related to Jassās.","tribe":"Tamīm","blurb":"The woman whose lament for a killed she-camel went round the camps and made a man kill his brother-in-law. Whether the camel was hers or a guest's, and whether it had a name, depends entirely which source you read.","path":[]},{"id":"jalila","name":"Jalīla bint Murra","ar":"جليلة بنت مرة","role":"legendary","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated, and absent from several of the sources that cover the war.","tribe":"Shaybān of Bakr","blurb":"Jassās's sister and Kulayb's wife, caught exactly between brother and husband. She had been boasting about her two brothers, which is given as part of why Kulayb was already angry. At the funeral Kulayb's sister reviled her in front of everyone. She went back to her father's house, and the son she bore Kulayb grew up to kill her brother.","path":[]},{"id":"hammam","name":"Hammām ibn Murra","ar":"همام بن مرة","role":"warrior","birth":null,"death":510,"lifeCertainty":"legendary","lifeNote":"Undated, and the sources place his death at three different days — Wāridāt, al-Quṣaybāt or Quḍa.","tribe":"Shaybān of Bakr","blurb":"Jassās's brother, and al-Muhalhil's drinking companion before the war — he was the man who carried the news of Kulayb's death to Kulayb's brother. He was killed by a Taghlibī he had fostered himself, and al-Muhalhil composed an elegy over his body.","path":[]},{"id":"al-harith-ibn-ubad","name":"Al-Ḥārith ibn ʿUbād","ar":"الحارث بن عباد","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. He is absent from every English-language source and recoverable only from the Arabic ayyām chapters.","tribe":"Bakr","blurb":"An old Bakrī champion who sat out the entire war, and came back into it only when the young man he had sent to the enemy with a letter was killed. He shaved his men's heads so they would know each other, cut Taghlib to pieces, took their war-leader prisoner and let him go without recognising him. Whether the dead boy was his son or his nephew, the sources cannot agree.","path":[{"year":525,"placeId":"quda","what":"Leads Bakr at the shaving of the forelocks and captures al-Muhalhil"}]},{"id":"bujayr","name":"Bujayr","ar":"بجير","role":"warrior","birth":null,"death":524,"lifeCertainty":"legendary","lifeNote":"Undated. Ibn al-Athīr makes him al-Ḥārith's son, al-Maʿrifa his nephew; one version has him carrying a peace letter, the other an announcement of withdrawal.","tribe":"Bakr","blurb":"The young man sent to the enemy's war-leader, and killed by him. Both versions of the Basūs war turn on his death: Taghlib win every day before it and lose every day after.","path":[]},{"id":"qays-ibn-zuhayr","name":"Qays ibn Zuhayr","ar":"قيس بن زهير","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. His appearance as a commander at both Dāḥis and Shiʿb Jabala is a useful relative anchor: it puts the two episodes inside one man's fighting life.","tribe":"ʿAbs","blurb":"Chief of ʿAbs, who matched his horse against a Dhubyānī's over a course run across forty nights and was cheated of it. He killed the son who came to collect the stake, refused mercy at the well of al-Habāʾa when a man begged him by God and by kinship, and answered the dying with a taunt. At Shiʿb Jabala he kept his camels from water so they would charge toward it. One account has him ending as a hermit in Oman.","path":[{"year":568,"placeId":"najd","what":"Cheated in the horse race that starts the war"},{"year":577,"placeId":"al-habaa","what":"Refuses mercy at the well and has Ḥudhayfa killed"},{"year":580,"placeId":"shib-jabala","what":"Commands ʿAbs at Shiʿb Jabala"},{"year":600,"placeId":"oman","what":"By one account, a hermit in Oman, killed there"}]},{"id":"hudhayfa","name":"Ḥudhayfa ibn Badr","ar":"حذيفة بن بدر","role":"warrior","birth":null,"death":577,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Dhubyān / Fazāra","blurb":"Chief of Dhubyān, who won the race by cheating and refused to pay when he lost the argument. At al-Habāʾa the heat got into his thighs and he fell back to the water, which is where they caught him. His last words were a curse that Ghaṭafān would never be reconciled, and his body was mutilated in the way the sources say he had done to boys earlier.","path":[{"year":568,"placeId":"najd","what":"Wins the rigged race and refuses the stake"},{"year":569,"placeId":"najd","what":"Taken prisoner at Yawm al-Ghadaq and released"},{"year":577,"placeId":"al-habaa","what":"Run down at the well and killed"}]},{"id":"hamal","name":"Ḥamal ibn Badr","ar":"حمل بن بدر","role":"warrior","birth":null,"death":577,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Dhubyān / Fazāra","blurb":"Ḥudhayfa's brother, who in one version is the man who hid the ambushers along the race course. At al-Habāʾa he asked his men whom they would least like to see coming, they named two, and those two came. He begged by God and by kinship and was refused.","path":[]},{"id":"al-rabi-ibn-ziyad","name":"Al-Rabīʿ ibn Ziyād","ar":"الربيع بن زياد","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"ʿAbs","blurb":"An ʿAbsī who paid a hundred camels of blood-money out of his own property early in the war, took Ḥudhayfa prisoner once, and was one of the two men Ḥamal least wanted to see at the well.","path":[]},{"id":"shaddad","name":"Shaddād ibn Muʿāwiya","ar":"شداد بن معاوية","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"ʿAbs","blurb":"ʿAntara's father, and the named ʿAbsī cavalryman at al-Habāʾa, riding a mare called Jarwa that he praised in verse. He blocked Dhubyān from reaching their horses, which decided the day.","path":[]},{"id":"qarawash","name":"Qarāwash ibn ʿAmr","ar":"قرواش بن عمرو","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"ʿAbs","blurb":"The man who struck with a broad-bladed spear at al-Habāʾa and broke Ḥudhayfa's spine.","path":[]},{"id":"al-harith-ibn-awf","name":"Al-Ḥārith ibn ʿAwf al-Murrī","ar":"الحارث بن عوف المري","role":"patron","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. The English-language peace accounts credit him alone, but the Arabic sources put his cousin Harim ibn Sinān in the mediation beside him and make the two of them jointly responsible for the blood-money — about three thousand camels over three years — and jointly praised in Zuhayr's Muʿallaqa. Harim's father Sinān ibn Abī Ḥāritha appears on the opposite side of the matter, as the failed coalition-builder.","tribe":"Murra","blurb":"The Murrī who cooled the war down, and one of the two men who paid for its end. With his cousin Harim ibn Sinān he covered the blood-price of the dead on both sides out of their own herds and stopped forty years of killing between ʿAbs and Dhubyān. Zuhayr's Muʿallaqa names them both — the connection the English sources could not make and the Arabic ones state outright.","path":[]},{"id":"laqit","name":"Laqīṭ ibn Zurāra","ar":"لقيط بن زرارة","role":"warrior","birth":null,"death":580,"lifeCertainty":"legendary","lifeNote":"Undated except relative to Raḥraḥān, which the sources put about a year earlier.","tribe":"Tamīm","blurb":"He gave protection to the man who had killed a Hawāzin chief, which turned Banū ʿĀmir against him; then his brother was captured and died a prisoner, and he gathered Tamīm, Dhubyān, Asad, Kindite princes and a Lakhmid force to avenge him. He died in the pass at Shiʿb Jabala and took Kindite power in the north down with him.","path":[{"year":580,"placeId":"shib-jabala","what":"Leads the coalition into the pass and is killed"}]},{"id":"zurara","name":"Zurāra ibn ʿUdus","ar":"زرارة بن عدس","role":"warrior","birth":null,"death":579,"lifeCertainty":"legendary","lifeNote":"Undated; he is said to have died in the same days as Raḥraḥān.","tribe":"Tamīm","blurb":"Chief of Banū Dārim, warned by a woman who had seen the armies and could tell him who the commanders were — the one warning in the whole corpus that was actually heeded. He got his family and herds away, but his son Maʿbad was taken and died in captivity.","path":[]},{"id":"mabad","name":"Maʿbad ibn Zurāra","ar":"معبد بن زرارة","role":"warrior","birth":null,"death":579,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Tamīm","blurb":"Captured by Banū ʿĀmir at Raḥraḥān and kept until he died of it. The captive son dying in enemy hands is the day's whole dramatic residue and the reason for everything that follows.","path":[]},{"id":"al-ahwas","name":"Al-Aḥwaṣ ibn Jaʿfar","ar":"الأحوص بن جعفر","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Banū ʿĀmir","blurb":"Brother of the chief whose killing set the Najd chain in motion, and the man who led the final cavalry charge at Shiʿb Jabala.","path":[]},{"id":"abu-bara","name":"Abū Barāʾ ʿĀmir ibn Mālik","ar":"أبو براء عامر بن مالك","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Banū ʿĀmir","blurb":"Called Mulāʿib al-Asinna, the player with spear-points. He led the ʿĀmir and Hawāzin side in the Fijār, and at al-Sullān he knocked an old man down again and again and then asked him to point out someone worth ransoming — and got pointed at a thin black man he took for a slave, who turned out to be worth four hundred camels.","path":[]},{"id":"dirar","name":"Ḍirār ibn ʿAmr al-Ḍabbī","ar":"ضرار بن عمرو الضبي","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Ḍabba","blurb":"An old man who forbade his own men to flee at al-Sullān and held the command with his sons standing over him. And then had the presence of mind, flat on his back, to send his attacker after the richest prisoner on the field disguised as a slave.","path":[]},{"id":"wabra","name":"Wabra ibn Rūmānis al-Kalbī","ar":"وبرة بن رومانس الكلبي","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Kalb","blurb":"Al-Nuʿmān's half-brother and the commander of his army at al-Sullān, captured in his own charge and ransomed for a thousand camels and a horse, which made his captor rich.","path":[]},{"id":"hanzala","name":"Ḥanẓala ibn Thaʿlaba al-ʿIjlī","ar":"حنظلة بن ثعلبة العجلي","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Bakr ibn Wāʾil","blurb":"One of the Bakrī leaders at Dhū Qār — in a battle where, Landau-Tasseron notes, the leadership shifted from warrior to warrior with no commander-in-chief at all.","path":[]},{"id":"bistam","name":"Bisṭām ibn Qays","ar":"بسطام بن قيس","role":"warrior","birth":null,"death":600,"lifeCertainty":"legendary","lifeNote":"Undated; known from a chapter heading with no narrative recovered.","tribe":"Shaybān of Bakr","blurb":"A famous raider whose death gave a fighting day its name.","path":[]},{"id":"hatim-al-tai","name":"Ḥātim al-Ṭāʾī","ar":"حاتم الطائي","role":"patron","birth":null,"death":578,"lifeCertainty":"contested","lifeNote":"The 578 death comes from Kitāb al-Aghānī alone; another tradition puts it in the year of Muḥammad's birth. No birth date exists anywhere.","tribe":"Ṭayyiʾ","blurb":"A chief of Ṭayyiʾ who is said to have given away everything but his mount and his weapons, associated with the Lakhmid court, and still invoked by name in a living proverb. The riddle-quest romances built on him in Persian and Urdu are centuries later.","path":[]},{"id":"al-barrad","name":"Al-Barrāḍ ibn Qays","ar":"البراض بن قيس","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated except through the Fijār's own loose window.","tribe":"Kināna","blurb":"A man his own tribe had expelled, who killed a Banū ʿĀmir notable during a sacred month and seized a king's caravan. The sacrilege that gave the Fijār wars their name.","path":[]},{"id":"urwa-al-rahhal","name":"ʿUrwa al-Raḥḥāl","ar":"عروة الرحال","role":"merchant","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Banū ʿĀmir","blurb":"Killed in a sacred month while escorting the Lakhmid king's caravan, which set four years of fighting going at the fairground.","path":[]},{"id":"qays-ibn-asim","name":"Qays ibn ʿĀṣim","ar":"قيس بن عاصم","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Madhḥij","blurb":"Led the Madhḥij side at al-Kulāb II, in a fight his people's elders had advised against and the other side had been pushed into by a soothsayer.","path":[]},{"id":"hudayr","name":"Ḥuḍayr al-Katāʾib","ar":"حضير الكتائب","role":"warrior","birth":null,"death":617,"lifeCertainty":"approximate","lifeNote":"Dated only by Buʿāth's position before the Hijra.","tribe":"Aws","blurb":"The Aws commander at Buʿāth. His side was losing until he reminded them out loud of every wrong the Khazraj had ever done them, and they turned it around.","path":[{"year":617,"placeId":"buath","what":"Rallies the Aws and wins the day"}]},{"id":"amr-ibn-al-numan","name":"ʿAmr ibn al-Nuʿmān al-Bayāḍī","ar":"عمرو بن النعمان البياضي","role":"warrior","birth":null,"death":617,"lifeCertainty":"approximate","lifeNote":"Dated only by Buʿāth.","tribe":"Khazraj","blurb":"The Khazraj chief who took hostages from the Jewish tribes of the oasis and killed them when they would not hand over property — and so drove those tribes into the other side's camp. He was killed in the fighting that followed.","path":[]},{"id":"ibn-ubayy","name":"ʿAbd Allāh ibn Ubayy","ar":"عبد الله بن أبي","role":"patron","birth":null,"death":631,"lifeCertainty":"approximate","lifeNote":"Chosen as peace-keeper after Buʿāth, c. 617; lost influence after 622.","tribe":"Khazraj","blurb":"Chosen by both exhausted tribes to keep the peace at Yathrib after Buʿāth. The consensus leader of a post-civil-war oasis — and the vacancy his weakness left is the one Muḥammad walked into in 622.","path":[]},{"id":"qusayy","name":"Qusayy ibn Kilāb","ar":"قصي بن كلاب","role":"king","birth":null,"death":null,"lifeCertainty":"contested","lifeNote":"The sharpest chronological contradiction in the whole record: Hawting says his children must have lived in the second half of the fifth century, Watt says Qusayy himself probably died in the second half of the sixth. A hundred years apart, unresolved.","tribe":"Quraysh","blurb":"The man who pulled the scattered descendants of Fihr together, took the Meccan sanctuary and set up the clan offices everything after him runs on. The name Quraysh may come from him.","path":[]},{"id":"durayd","name":"Durayd ibn al-Ṣimma","ar":"دريد بن الصمة","role":"warrior","birth":null,"death":630,"lifeCertainty":"fixed","lifeNote":"Died January 630. His birth is given only as the 6th century.","tribe":"Hawāzin","blurb":"Chief of Banū Jusham, who fought in about a hundred battles and, one authority says, lost none. He stayed a pagan into extreme old age and was carried to his last battle in a litter. Called the first poet of the knights.","path":[]},{"id":"musaylima","name":"Musaylima","ar":"مسيلمة","role":"prophet-figure","birth":null,"death":null,"lifeCertainty":"approximate","lifeNote":"His claim is placed before the Hijra, c. 622; nothing else is fixed.","tribe":"Banū Ḥanīfa","blurb":"A soothsayer of the settled farming Yamāma who declared himself a prophet in his own village before the Hijra. Central Arabia produced its own claimants.","path":[]},{"id":"quss","name":"Quss ibn Sāʿida al-Iyādī","ar":"قس بن ساعدة الإيادي","role":"prophet-figure","birth":null,"death":610,"lifeCertainty":"legendary","lifeNote":"Considered legendary or semi-legendary and known only from Muslim sources. His lifespan is given as 380, 600 or 700 years, which is as clear a marker of accretion as the corpus offers.","tribe":"Iyād","blurb":"He stood up in the market at ʿUkāẓ and preached one God and the resurrection in rhymed prose, and tradition puts the young Muḥammad in the audience. Called a bishop of Najrān in some accounts and a pagan sage in others. One sermon survives.","path":[{"year":600,"placeId":"ukaz","what":"Preaching at the fair"}]},{"id":"zarqa-al-yamama","name":"Zarqāʾ al-Yamāma","ar":"زرقاء اليمامة","role":"seer","birth":null,"death":520,"lifeCertainty":"legendary","lifeNote":"Entirely legendary, and her story's sourcing is weak — a comparative-literature book and a newspaper feature. Her sight-range is given as a week, not the three days usually repeated.","tribe":"Jadīs","blurb":"The blue-eyed woman who could see riders a week away. The enemy came hidden behind trees they carried, and she said the trees were moving, and her people decided she had gone mad. After they killed the men of the camp the invaders tore out her eyes and crucified her. The most persistent shape in the whole corpus is the woman who warns and is not believed.","path":[]},{"id":"satih","name":"Saṭīḥ","ar":"سطيح","role":"seer","birth":null,"death":570,"lifeCertainty":"legendary","lifeNote":"Savran reads both Saṭīḥ and Shiqq as early-ʿAbbāsid literary constructions — connectors inserted to tie ancient Arabia, Persia and the rise of Islam into one narrative — not as remembered 6th-century figures. Using them as period characters reproduces an ʿAbbāsid ideology.","tribe":null,"blurb":"A seer with almost no bones in him, compared to a doormat, whom his companions folded up when they travelled. He and his half-bodied companion got their gift from a prophetess who had predicted the Maʾrib dam's collapse. His last prophecy, delivered on his deathbed to a Christian envoy sent from a Persian king, was that Persian rule would pass to the Arabs — and then he died on the spot.","path":[{"year":570,"placeId":"hira","what":"A Christian of al-Ḥīra is sent to find him with the Persian king's question"}]},{"id":"shiqq","name":"Shiqq","ar":"شق","role":"seer","birth":null,"death":565,"lifeCertainty":"legendary","lifeNote":"Same verdict as for Saṭīḥ: an ʿAbbāsid construction, not a remembered figure. The popular version giving him a jinn mother is not supported by the one specialist source available.","tribe":null,"blurb":"A seer with half a face, half a head and half a body — his name means 'half'. The seer and the half-being are the same image across this whole corpus: the one who sees the unseen is himself not quite a whole man.","path":[]},{"id":"bilqis","name":"Bilqīs","ar":"بلقيس","role":"legendary","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"The Qurʾān never names her; the name and the jinn parentage are both exegetical, from al-Ṭabarī, al-Zamakhsharī and al-Bayḍāwī. No inscription names any such queen, and the Awwām temple folk-named after her was excavated with nothing linking it to her.","tribe":null,"blurb":"The queen of Sabaʾ, unnamed in scripture, who sent gifts that were refused, came to Solomon's palace and lifted her clothes crossing a floor she took for water. The hairy legs that explain the glass floor are a folk elaboration on an exegetical elaboration — two steps out from a text that says only that she bared her shins.","path":[]},{"id":"halima","name":"Ḥalīma bint al-Ḥārith","ar":"حليمة بنت الحارث","role":"legendary","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. The Arabic sources are more precise than the English ones about who she was: a daughter of al-Ḥārith the Ghassanid king himself, and the day is named after her. The proverb usually attached to her — that Ḥalīma's day is no secret — appears in al-Khāqānī's list.","tribe":"Ghassān","blurb":"Daughter of al-Ḥārith ibn Jabala, the Ghassanid king, and not merely a princess who helped her tribe's fighters: the Arabic sources make her the king's own daughter and say the day carries her name because of her. The best-dated battle in the whole Arabic corpus is called after her.","path":[]},{"id":"abu-karib-son","name":"Abū Karib","ar":"أبو كرب","role":"warrior","birth":null,"death":556,"lifeCertainty":"legendary","lifeNote":"Undated.","tribe":"Ghassān","blurb":"Al-Ḥārith's son, who came out for the single combat at ʿAyn Ubāgh and killed the man sent against him — and only then found out it had not been the enemy king's son at all, but a champion in his clothes.","path":[]},{"id":"abu-amr","name":"Abū ʿAmr ibn al-ʿAlāʾ","ar":"أبو عمرو بن العلاء","role":"seer","birth":null,"death":770,"lifeCertainty":"fixed","lifeNote":"An 8th-century Basran philologist, well outside the period, included because of what he said about it.","tribe":null,"blurb":"He sat in a Friday circle at Baṣra while men argued over who had led the Arabs at Khazāz, and ruled against all three candidates on the grounds that the day was older than any of them — adding that he had been asking the question for sixty years and had never found anybody who knew. The most honest sentence in the entire corpus.","path":[]},{"id":"muhammad","name":"Muḥammad ibn ʿAbd Allāh","ar":"محمد بن عبد الله","role":"prophet-figure","birth":570,"death":632,"lifeCertainty":"contested","lifeNote":"The death is the firm end: 8 June 632, the pivot the whole Hijrī chronology is counted from, and the Hijra of 622 is fixed as that calendar's epoch. The birth is not. Tradition pegs it to the Year of the Elephant, and this atlas dates that event across 552-572, so the birth year inherits a twenty-year spread and the conventional 570 is a synchronism built to anchor it rather than a transmitted date. Everything in his life reckoned by age — the marriage, the rebuilding of the Kaʿba, the age of forty at the first revelation — inherits that spread; everything reckoned in years before the Hijra does not. There is no inscriptional, archaeological or external documentary evidence for Mecca or Quraysh before 632, so the Meccan half of his life rests entirely on the later Arabic biographical tradition, written down about a century and a half after the events.","tribe":"Quraysh, clan of Hāshim","blurb":"A Meccan of the Banū Hāshim, posthumous son of ʿAbd Allāh, orphaned young and raised by his grandfather and then his uncle Abū Ṭālib. He married the merchant Khadīja bint Khuwaylid, was known as an arbitrator before he was known as anything else, and from about 610 preached one God, the resurrection and the judgement in a town whose sanctuary held the gods of a whole region's tribes. Boycotted with his clan, bereaved of his wife and his protector in the same year, he sent followers to Christian Aksum, took oaths from men of Yathrib at al-ʿAqaba, and moved to that oasis in 622. He died at Medina in 632, by which time most of the peninsula's tribes had come to terms with him.","path":[{"year":570,"placeId":"mecca","what":"Born at Mecca in the year tradition calls the Year of the Elephant"},{"year":610,"placeId":"hiraa","what":"The revelation begins during a retreat at the cave of Ḥirāʾ"},{"year":621,"placeId":"mina","what":"Takes the first pledge from men of Yathrib at al-ʿAqaba"},{"year":622,"placeId":"yathrib","what":"Moves to Yathrib; the Hijra"},{"year":632,"placeId":"yathrib","what":"Dies at Medina"}]},{"id":"khadija","name":"Khadīja bint Khuwaylid","ar":"خديجة بنت خويلد","role":"merchant","birth":null,"death":619,"lifeCertainty":"contested","lifeNote":"No birth date exists. The tradition makes her about forty at her marriage c. 595 and has her die in the Year of Sorrow, given as 619 or 620. Her standing as a merchant who financed caravans is repeated everywhere in the sīra and interrogated nowhere: the searches for critical scholarship on it turned up only devotional and popular writing.","tribe":"Quraysh, clan of Asad","blurb":"A Meccan businesswoman of the Banū Asad branch of Quraysh, twice widowed, who employed Muḥammad on a Syrian caravan and then married him. She was his only wife while she lived, and the first to accept what he said he had heard at Ḥirāʾ. Her cousin Waraqa ibn Nawfal, named in the lists of pre-Islamic Arab monotheists, is the man the tradition has her take him to.","path":[]},{"id":"abu-talib","name":"Abū Ṭālib ibn ʿAbd al-Muṭṭalib","ar":"أبو طالب بن عبد المطلب","role":"patron","birth":null,"death":619,"lifeCertainty":"contested","lifeNote":"No birth date. His death is placed in the Year of Sorrow, 619 or 620, by its position relative to the Hijra rather than by any record. His floruit, like his father's, is undated in the sources reached.","tribe":"Quraysh, clan of Hāshim","blurb":"Head of the Banū Hāshim after ʿAbd al-Muṭṭalib and guardian of his orphaned nephew. He never accepted his nephew's preaching but extended clan protection over him, which is what made the boycott of the Hāshim necessary and what his death removed. Father of ʿAlī.","path":[]},{"id":"abd-al-muttalib","name":"ʿAbd al-Muṭṭalib ibn Hāshim","ar":"عبد المطلب بن هاشم","role":"patron","birth":null,"death":578,"lifeCertainty":"legendary","lifeNote":"His floruit is undated in every source reached. The conventional 578 for his death is arithmetic off a contested birth year: tradition has him die when his grandson was eight, and the grandson's birth is placed anywhere in 552-572. The stories attached to him — Hubal's arrows choosing his son ʿAbd Allāh for sacrifice and a hundred camels offered instead, his dealings with Abraha in the Elephant narrative, the rediscovery of the Zamzam well — are all narrative, and the hundred-camel blood-price often credited to him could not be sourced to him specifically.","tribe":"Quraysh, clan of Hāshim","blurb":"Head of the Banū Hāshim, custodian of the sanctuary's water and of his clan's share in the Meccan offices, and the figure through whom the Quraysh genealogies pass. His sons included ʿAbd Allāh, Abū Ṭālib, Ḥamza and al-ʿAbbās. The later name of the Banū Hāshim was simply Banū ʿAbd al-Muṭṭalib.","path":[]},{"id":"abd-allah-ibn-abd-al-muttalib","name":"ʿAbd Allāh ibn ʿAbd al-Muṭṭalib","ar":"عبد الله بن عبد المطلب","role":"patron","birth":null,"death":570,"lifeCertainty":"legendary","lifeNote":"Known only as his son's father. The tradition has him die on a trading journey about six months before the birth, which makes his death date move with the birth date across 552-572. Al-Zuhrī preserves a tradition that puts the Year of the Elephant before he was even born, which breaks the synchronism from inside the tradition.","tribe":"Quraysh, clan of Hāshim","blurb":"A son of ʿAbd al-Muṭṭalib, said in the Hubal-arrows story to have been the one chosen for sacrifice and ransomed with a hundred camels. He died young, away from Mecca, leaving a pregnant wife.","path":[]},{"id":"amina-bint-wahb","name":"Āmina bint Wahb","ar":"آمنة بنت وهب","role":"patron","birth":null,"death":577,"lifeCertainty":"legendary","lifeNote":"No dates of her own. Her death is reckoned as her son's sixth year, so it moves with his contested birth year across the whole 552-578 span. Nothing external touches her.","tribe":"Quraysh, clan of Zuhra","blurb":"Of the Banū Zuhra of Quraysh, widowed before her son was born and dead while he was a small child. The tradition has her send him out to a wet-nurse among the Banū Saʿd of Hawāzin, which is the ordinary Meccan practice of the time and not a detail about her.","path":[]},{"id":"al-najashi","name":"Al-Najāshī, the Negus of Aksum","ar":"النجاشي","role":"king","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"The Islamic sources give him only a title, not a name that can be matched to the Aksumite king-list. He has been identified with Armah since 1895 and alternatively with Ella Tsaham, and Hahn has argued Armah was a son of Kāleb under another name; the Aksumite coin sequence gives relative order, not absolute dates, so none of the identifications is fixed. The one near-anchor is Munro-Hay's reading of a three-cross reverse as a reference to the Persian capture of Jerusalem in 614, and that reading is itself conditional.","tribe":"Aksum","blurb":"The Christian king of Aksum who, in the sīra, gave asylum to Meccan emigrants and refused a Qurashī delegation's request to send them back. Whoever he was, the episode puts Mecca inside the Red Sea world that Aksum and Ḥimyar had been fighting over for a century.","path":[]},{"id":"harim-ibn-sinan","name":"Harim ibn Sinān al-Murrī","ar":"هَرِم بن سِنان المُرّي","role":"patron","birth":null,"death":608,"lifeCertainty":"approximate","lifeNote":"The Arabic sources date his death to about 15 years before the Hijra, that is c. 608 CE, on land of the Banū Asad called Ruzāʾ, while he was on his way to al-Nuʿmān III at al-Ḥīra. That date appears in no English-language source at all. His role in the Dāḥis settlement is firm in the Arabic record — he and his cousin al-Ḥārith ibn ʿAwf entered the mediation together and carried the blood-money out of their own property, some three thousand camels over three years — which the English reconstruction had marked unverified and warned against building on. The Arabic sources also correct the report that his brother Khārija carried the blood-money: that is not sound. His father Sinān ibn Abī Ḥāritha stands on the opposite side of the matter, as the man who assembled a larger coalition against ʿAbs and then withdrew without fighting; father and son, not a contradiction.","tribe":"Murra","blurb":"A Dhubyānī nobleman who paid for the end of a forty-year war out of his own herds, together with his cousin al-Ḥārith ibn ʿAwf: three thousand camels over three years, the blood-price of both sides' dead. Zuhayr praised the two of them in his Muʿallaqa for what they did about the war, and Harim gave him so much for the praise that the poet grew ashamed to take it — he took to greeting a gathering by wishing every man in it good morning except Harim. He died on the road to al-Ḥīra, on Asad land, about 608.","path":[{"year":600,"placeId":"najd","what":"Enters the Dāḥis mediation with his cousin al-Ḥārith ibn ʿAwf and pays the blood-money"},{"year":608,"placeId":"najd","what":"Dies on Banū Asad land at Ruzāʾ, travelling to al-Nuʿmān III at al-Ḥīra"}]},{"id":"hawdha-ibn-ali","name":"Hawdha ibn ʿAlī al-Ḥanafī","ar":"هَوْذة بن علي الحنفي","role":"patron","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated. He surfaces in the Arabic account of Yawm al-Ṣafqa as Khusraw's man in al-Yamāma, raised in the king's regard after he treated the Persian envoys whom Tamīm had robbed well. A footnote version from Jād al-Mawlā reverses his fortune entirely: Tamīm ambushed and captured him in a valley and would not release him for less than three hundred camels.","tribe":"Ḥanīfa","blurb":"Khusraw's agent in al-Yamāma, and the man charged with punishing Tamīm for robbing the king's caravan. He is also the one piece of mercy in the story: the day of the killing fell on Easter, so he asked al-Mukaʿbir for a hundred of the Tamīmī prisoners and set them free, and al-Aʿshā made a poem of it.","path":[{"year":600,"placeId":"al-mushaqqar","what":"Draws Tamīm to the fortress of al-Mushaqqar, then frees a hundred of them"}]},{"id":"al-mukabbir","name":"Al-Mukaʿbir","ar":"المُكَعْبِر","role":"warrior","birth":null,"death":null,"lifeCertainty":"legendary","lifeNote":"Undated, and known by a nickname rather than a name. He is the Persian commander sent with a force of asāwira — heavy cavalry — to deal with Tamīm, and the man who closed the gate that gave the day its name.","tribe":null,"blurb":"The Persian officer at al-Mushaqqar. He and Hawdha let the Tamīmīs into the fortress in small parties on a promise of grain in a hard year and killed them group by group; when a man of ʿAbs cut the chain off the door and those at the gate got out, he shut the gates and killed everyone left inside. The day is called al-Ṣafqa, the closing, after what he did with those doors.","path":[{"year":600,"placeId":"al-mushaqqar","what":"Shuts the gates of al-Mushaqqar on the Banū Tamīm"}]}],"polities":[{"id":"lakhmids","name":"Lakhmids of al-Ḥīra","ar":"اللخميون","from":300,"to":602,"kind":"kingdom","capitalId":"hira","blurb":"Arab kings at the desert edge of Mesopotamia, clients of Persia, holding a Christian city of palaces and monasteries and salaried scribes. Their reach was not a border but a pull: tribes of the lower Euphrates and eastern Arabia answered them, and their raiding parties went as far as Egypt and down into Najd. Khusraw II destroyed them in 602.","zones":[{"from":300,"to":500,"centers":[{"lat":31.9,"lon":44.42,"r":180}]},{"from":500,"to":554,"centers":[{"lat":31.9,"lon":44.42,"r":320},{"lat":29.5,"lon":45.5,"r":260},{"lat":25.38,"lon":49.59,"r":200}]},{"from":554,"to":602,"centers":[{"lat":31.9,"lon":44.42,"r":300},{"lat":28.0,"lon":45.0,"r":280},{"lat":25.38,"lon":49.59,"r":200},{"lat":24.15,"lon":47.33,"r":180}]}]},{"id":"ghassanids","name":"Ghassanids / Jafnids","ar":"الغساسنة","from":300,"to":638,"kind":"tribal-confederation","capitalId":"al-jabiya","blurb":"Byzantium's Arab phylarchs in Syria: Miaphysite Christians whose capital was a royal tent camp, whose ceremonial centre was a desert martyr's shrine, and whose king once outranked every other foreign ruler in the empire's protocol. Byzantium broke the confederation in 584 and never fully put it back.","zones":[{"from":300,"to":528,"centers":[{"lat":32.8,"lon":35.98,"r":150}]},{"from":528,"to":569,"centers":[{"lat":32.8,"lon":35.98,"r":300},{"lat":35.63,"lon":38.76,"r":220},{"lat":35.86,"lon":37.03,"r":180}]},{"from":569,"to":584,"centers":[{"lat":32.8,"lon":35.98,"r":280},{"lat":35.63,"lon":38.76,"r":200}]},{"from":584,"to":638,"centers":[{"lat":32.8,"lon":35.98,"r":170},{"lat":32.52,"lon":36.48,"r":130}]}]},{"id":"kinda","name":"Kingdom of Kinda","ar":"مملكة كندة","from":425,"to":550,"kind":"tribal-confederation","capitalId":null,"blurb":"A Ḥimyar-sponsored over-tribal power in Najd, set up to govern the Maʿadd nomads on a southern crown's behalf. The Arabic sources date its founding to 425, when Ḥasan ibn ʿAmr ibn Tubbāʿ, king of Ḥimyar, set Ḥujr Ākil al-Murār over the Maʿadd, and give the reigns in order — Ḥujr 425–458, ʿAmr 458–489, al-Ḥārith 489–528 — where the English sources state outright that no regnal dates could be found. It also held a Byzantine federate treaty and a Palestinian phylarchate at the same time, which is probably why it fractured faster than any other buffer power. After the Ethiopian conquest of Ḥimyar in 525 it broke into small kingdoms that fell one after another between 530 and 540 to successive ʿAdnānī raids. Its kings' sons destroyed what was left among themselves.","zones":[{"from":425,"to":528,"centers":[{"lat":25.0,"lon":44.0,"r":420},{"lat":24.15,"lon":47.33,"r":240}]},{"from":528,"to":550,"centers":[{"lat":25.0,"lon":44.0,"r":260},{"lat":15.9,"lon":48.8,"r":200}]},{"from":550,"to":580,"centers":[{"lat":15.9,"lon":48.8,"r":240}]}]},{"id":"himyar","name":"Ḥimyar","ar":"حمير","from":300,"to":525,"kind":"kingdom","capitalId":"zafar","blurb":"The one Arabian power with a real epigraphic chronology. Kings of Sabaʾ and dhū-Raydān, officially monotheist from about 380 and Judaic for a century and a half after, reaching into central Arabia through clients and into the dam-fed oasis at Maʾrib with public works that needed a state to maintain them.","zones":[{"from":300,"to":380,"centers":[{"lat":14.21,"lon":44.4,"r":300},{"lat":15.42,"lon":45.33,"r":220}]},{"from":380,"to":525,"centers":[{"lat":14.21,"lon":44.4,"r":330},{"lat":15.42,"lon":45.33,"r":260},{"lat":17.49,"lon":44.13,"r":200},{"lat":25.0,"lon":44.0,"r":350}]}]},{"id":"aksum","name":"Aksum","ar":"أكسوم","from":300,"to":640,"kind":"kingdom","capitalId":"aksum","blurb":"The Christian Ethiopian kingdom across the Red Sea, with a Red Sea port, a navy good enough to move an army, and a claim on South Arabia it made good in the 520s.","zones":[{"from":300,"to":640,"centers":[{"lat":14.13,"lon":38.72,"r":350},{"lat":15.26,"lon":39.65,"r":200}]}]},{"id":"aksumite-yemen","name":"Aksumite Yemen","ar":"اليمن الأكسومية","from":525,"to":570,"kind":"kingdom","capitalId":"sanaa","blurb":"Forty-five years of Ethiopian rule in South Arabia, most of it under a general who had taken the country off his own king's viceroy. Churches went up, the dam was repaired, envoys from four powers met at Maʾrib in one room, and armies went north into Maʿadd four times. Then the epigraphic record stops, and ten years later the Persians arrive.","zones":[{"from":525,"to":570,"centers":[{"lat":15.35,"lon":44.21,"r":280},{"lat":15.42,"lon":45.33,"r":220},{"lat":14.21,"lon":44.4,"r":200},{"lat":17.49,"lon":44.13,"r":180}]}]},{"id":"sasanian-yemen","name":"Sasanian Yemen","ar":"اليمن الساسانية","from":570,"to":628,"kind":"kingdom","capitalId":"sanaa","blurb":"Persia took South Arabia with a small expedition and held it for nearly sixty years through vassal kings and then governors. The dam was never repaired again.","zones":[{"from":570,"to":628,"centers":[{"lat":15.35,"lon":44.21,"r":300},{"lat":14.21,"lon":44.4,"r":200},{"lat":17.49,"lon":44.13,"r":170}]}]},{"id":"sasanians","name":"Sasanian Empire","ar":"الإمبراطورية الساسانية","from":300,"to":651,"kind":"empire","capitalId":"ctesiphon","blurb":"The eastern empire, whose southern frontier ran through Arab clients rather than fortifications: the Lakhmids on the Euphrates, a governor in al-Baḥrayn, a province in Oman, a fort on the Omani coast, and from 570 a conquered Yemen.","zones":[{"from":300,"to":570,"centers":[{"lat":33.09,"lon":44.58,"r":600},{"lat":31.9,"lon":44.42,"r":250},{"lat":25.38,"lon":49.59,"r":250},{"lat":23.0,"lon":57.5,"r":250}]},{"from":570,"to":628,"centers":[{"lat":33.09,"lon":44.58,"r":600},{"lat":31.9,"lon":44.42,"r":250},{"lat":25.38,"lon":49.59,"r":250},{"lat":23.0,"lon":57.5,"r":250},{"lat":15.35,"lon":44.21,"r":280}]},{"from":628,"to":651,"centers":[{"lat":33.09,"lon":44.58,"r":500}]}]},{"id":"byzantines","name":"Byzantine Empire","ar":"الإمبراطورية البيزنطية","from":300,"to":640,"kind":"empire","capitalId":"constantinople","blurb":"The western empire, which held the Syrian desert frontier through Arab phylarchs, paid Persia gold to stop fighting four separate times, and then dismantled its own Arab buffer in 584 just before the war that ruined everything.","zones":[{"from":300,"to":640,"centers":[{"lat":41.01,"lon":28.98,"r":450},{"lat":36.2,"lon":36.16,"r":350},{"lat":31.78,"lon":35.23,"r":250},{"lat":31.2,"lon":29.92,"r":300},{"lat":32.52,"lon":36.48,"r":200}]}]},{"id":"quraysh","name":"Quraysh of Mecca","ar":"قريش","from":450,"to":632,"kind":"city-state","capitalId":"mecca","blurb":"Clans holding a sanctuary town in a dry valley, running winter caravans south to Yemen and summer caravans north to Gaza, Bosra and Damascus, buying estates in the cooler town above them and taking over its trade. There is not one inscription, dig or outside document for them before 632.","zones":[{"from":450,"to":580,"centers":[{"lat":21.42,"lon":39.83,"r":110}]},{"from":580,"to":632,"centers":[{"lat":21.42,"lon":39.83,"r":200},{"lat":21.27,"lon":40.42,"r":120},{"lat":21.47,"lon":40.64,"r":90}]}]},{"id":"yathrib","name":"Yathrib","ar":"يثرب","from":300,"to":632,"kind":"city-state","capitalId":"yathrib","blurb":"Not a city but a spread of fortified farmsteads and palm groves, held by two Arab tribes and three Jewish ones in shifting alliance, and fought over for a century until 617 left both Arab tribes exhausted enough to appoint a single peace-keeper.","zones":[{"from":300,"to":632,"centers":[{"lat":24.47,"lon":39.61,"r":70}]}]},{"id":"nabataean-legacy","name":"The Nabataean ruins","ar":"آثار الأنباط","from":106,"to":640,"kind":"tribal-territory","capitalId":"petra","blurb":"A kingdom that ended in 106 and stayed in the landscape: carved tomb facades at Petra and Hegra, high places on the peaks, betyls in their niches, and a dating era still being used in 568. In the 6th century the tombs at Hegra were read as the houses of a race God destroyed.","zones":[{"from":106,"to":640,"centers":[{"lat":30.33,"lon":35.44,"r":200},{"lat":26.79,"lon":37.95,"r":150},{"lat":29.81,"lon":39.87,"r":120}]}]},{"id":"sasanian-bahrayn","name":"Sasanian al-Baḥrayn","ar":"البحرين الساسانية","from":300,"to":632,"kind":"tribal-territory","capitalId":"hajar-bahrayn","blurb":"The eastern coast under Persian suzerainty and Lakhmid administration, with a scatter of Nestorian bishoprics on the islands and a governor who executed poets on a Lakhmid king's written order.","zones":[{"from":300,"to":632,"centers":[{"lat":25.38,"lon":49.59,"r":250},{"lat":26.2,"lon":50.6,"r":120}]}]}],"tribes":[{"id":"bakr","name":"Bakr ibn Wāʾil","ar":"بكر بن وائل","lat":30.2,"lon":45.0,"r":320,"blurb":"A confederation running from south-western Iraq into eastern Arabia, with Shaybān as its strongest branch. Forty years at war with Taghlib over a camel, and then the tribe that beat a Persian column at Dhū Qār and was remembered for it."},{"id":"taghlib","name":"Taghlib","ar":"تغلب","lat":33.0,"lon":40.5,"r":300,"blurb":"Kulayb's and al-Muhalhil's people, who won every great day of the Basūs war until their war-leader killed a peace envoy, and lost every one after. Christianised and dispersed into the Jazīra and lower Iraq, which the war-story explains as a defeat and probably is not."},{"id":"abs","name":"Banū ʿAbs","ar":"بنو عبس","lat":26.2,"lon":41.5,"r":230,"blurb":"ʿAntara's tribe and Qays ibn Zuhayr's, and the ʿAbs of forty years of killing with Dhubyān over a rigged horse race. Some of them stayed out of it to guard Lakhmid caravans, which is exactly the detail that wrecks the war's traditional dates."},{"id":"dhubyan","name":"Dhubyān and Fazāra","ar":"ذبيان وفزارة","lat":26.6,"lon":41.0,"r":250,"blurb":"Ḥudhayfa ibn Badr's people, Ghaṭafānī, and ʿAbs's enemies in the long feud. At al-Habāʾa they lost about four hundred men in a morning and called the day the Perdition."},{"id":"tamim","name":"Banū Tamīm","ar":"بنو تميم","lat":26.5,"lon":45.0,"r":420,"blurb":"A very large tribe across north-eastern Arabia, with Dārim and Yarbūʿ among its branches. It fought nearly everyone — Bakr, ʿĀmir, Madhḥij, the Lakhmids, the Persians at al-Mushaqqar — and much later got accused of female infanticide by its political enemies."},{"id":"asad","name":"Banū Asad","ar":"بنو أسد","lat":26.0,"lon":42.8,"r":200,"blurb":"The tribe that killed Ḥujr and so set the most famous vengeance quest in Arabic poetry going. Also the tribe of ʿAbīd ibn al-Abraṣ, a poet and contemporary of the man who came to avenge his father on them."},{"id":"tayyi","name":"Ṭayyiʾ","ar":"طيء","lat":27.5,"lon":41.7,"r":280,"blurb":"The tribe under the twin mountains at Ḥāʾil, Ḥātim's people, with a reputation for generosity built on one man. They also supplied the chief Khusraw handed al-Ḥīra to in 602."},{"id":"ghatafan","name":"Ghaṭafān","ar":"غطفان","lat":26.0,"lon":41.3,"r":300,"blurb":"The parent grouping over Dhubyān, Fazāra and ʿAbs, so most of the Dāḥis war is internal to it. Ghaṭafān stayed out of the Fijār on the Qays side."},{"id":"hawazin","name":"Hawāzin","ar":"هوازن","lat":21.8,"lon":41.0,"r":320,"blurb":"The confederation that won four of the Fijār days against Quraysh and lost only one. Banū ʿĀmir and Thaqīf sit under it, and so does Labīd."},{"id":"amir","name":"Banū ʿĀmir ibn Ṣaʿṣaʿa","ar":"بنو عامر بن صعصعة","lat":23.0,"lon":44.0,"r":330,"blurb":"Hawāzin's biggest branch, with Kilāb and Kaʿb and Jaʿfar under it. Victors at Shiʿb Jabala, caravan-robbers at al-Sullān, and a party to half the fighting days of Najd."},{"id":"kinda-tribe","name":"Kinda","ar":"كندة","lat":24.0,"lon":45.5,"r":280,"blurb":"Originally South Arabian and moved north into Najd in the 4th or 5th century, where a Ḥimyarite mandate made its chiefs kings over the nomads. Imruʾ al-Qays's house. After Shiʿb Jabala much of it withdrew to Ḥaḍramawt."},{"id":"quraysh-tribe","name":"Quraysh","ar":"قريش","lat":21.42,"lon":39.83,"r":130,"blurb":"The clans of the Meccan sanctuary, split into the Confederates and the Perfumed and into those who lived around the Kaʿba and those on the outskirts. Caravan merchants with alliances bought from the bedouin along the route."},{"id":"aws","name":"Aws","ar":"أوس","lat":24.5,"lon":39.65,"r":45,"blurb":"One of the two Arab tribes of Yathrib, allied with the Jewish Qurayẓa and Naḍīr, and the winners at Buʿāth."},{"id":"khazraj","name":"Khazraj","ar":"خزرج","lat":24.44,"lon":39.57,"r":45,"blurb":"The other Arab tribe of Yathrib, allied with Qaynuqāʿ. Its chief's killing of Jewish hostages is what pushed the other two Jewish tribes to the opposite side and lost him the day and his life."},{"id":"hudhayl","name":"Hudhayl","ar":"هذيل","lat":21.9,"lon":40.0,"r":170,"blurb":"A Ḥijāzī tribe in the hills around Mecca, keepers of the idol Suwāʿ, and the people Taʾabbaṭa Sharran spent his life raiding and died raiding."},{"id":"hanifa","name":"Banū Ḥanīfa","ar":"بنو حنيفة","lat":24.5,"lon":46.7,"r":200,"blurb":"Settled farmers of the Yamāma with date groves and wheat fields, who supplied grain to Mecca and sent skilled workers there. Not nomads at all — and their travellers are the ones recorded asking a valley's jinn for safe passage."},{"id":"madhhij","name":"Madhḥij","ar":"مذحج","lat":15.5,"lon":44.6,"r":280,"blurb":"A large southern grouping, driven to the gates of Najrān in the 328 inscription and still fighting Tamīm at al-Kulāb nearly three centuries later. Al-Muhalhil ended his life married into one of its clans."},{"id":"azd","name":"Azd","ar":"أزد","lat":19.5,"lon":42.0,"r":330,"blurb":"A southern tribal mass whose dispersal northward the genealogies explain by the Maʾrib dam's failure — a story that puts a 2nd-century ancestor in charge of a 6th-century flood, and does real etiological work explaining why Yemeni-descended tribes are in Syria, Mecca and Medina."},{"id":"judham","name":"Judhām","ar":"جذام","lat":29.5,"lon":35.8,"r":200,"blurb":"A tribe of the north-western marches between the Ḥijāz and the Roman frontier, in the orbit of the Byzantine clients."},{"id":"kalb","name":"Banū Kalb","ar":"بنو كلب","lat":31.5,"lon":38.0,"r":350,"blurb":"The dominant tribe at Dūmat al-Jandal and across the Wādī Sirḥān corridor, keepers of the idol Wadd, and a tribe whose men turn up on both imperial sides — including as a Lakhmid army commander and as a possible killer of a Kindite king."},{"id":"iyad","name":"Iyād","ar":"إياد","lat":32.0,"lon":43.5,"r":220,"blurb":"A north Arabian tribe in the Lakhmid orbit, present as Persian auxiliaries at Dhū Qār, and the tribe of the preacher who stood up at ʿUkāẓ and spoke about one God."},{"id":"qudaa","name":"Quḍāʿa","ar":"قضاعة","lat":31.0,"lon":37.0,"r":330,"blurb":"A large northern grouping spanning the Syrian desert margins, with Kalb among its branches, and an opponent of Kinda in the earliest-remembered of the fighting days."},{"id":"thaqif","name":"Thaqīf","ar":"ثقيف","lat":21.27,"lon":40.42,"r":110,"blurb":"The tribe of al-Ṭāʾif, keepers of Allāt's cubic rock, Mecca's commercial rival and its ally in the Fijār."},{"id":"khuzaa","name":"Khuzāʿa","ar":"خزاعة","lat":21.7,"lon":39.6,"r":150,"blurb":"A Ḥijāzī tribe that held the Meccan sanctuary before Quraysh, and which the tradition blames for importing the idols that stood around the Kaʿba."},{"id":"sulaym","name":"Banū Sulaym","ar":"بنو سليم","lat":23.5,"lon":40.8,"r":230,"blurb":"Al-Khansāʾ's tribe, Hawāzin-side in the Fijār, and the people whose skirmishes with Murra and Asad killed both of her brothers and produced a thousand lines of elegy."},{"id":"shayban","name":"Shaybān","ar":"شيبان","lat":30.5,"lon":45.5,"r":220,"blurb":"Bakr's hardest branch: Jassās's clan, the Basūs war's engine, and the core of the force that beat the Persians at Dhū Qār."}]}</script>

<script id="dataar" type="application/json">{"events":{"nabataea-annexed":{"title":"ضمُّ مملكة الأنباط","summary":"ألحَقَ تراجانُ مملكةَ الأنباط بالدولة الرومانية. وحِسابُ السنين من هذا الضمّ — وهو التأريخُ البُصرَويّ — هو الذي يُؤرِّخ نقشَ النمارة وجبل أُسَيس وحمى وحرّان بعد ثلاثة قرونٍ وأربعة. وقبورُهم ومذابحُهم العالية باقيةٌ في المَشهد طولَ تلك المدّة.","dispute":"خارجُ المدى، وأُدرِج لأنّ التأريخَ البُصرَويّ وطبقةَ آثار الأنباط كلَيهما يَمتدّان في الفترة كلِّها.","dateNote":"ثابتٌ في السجلّ الروماني، والتأريخُ البُصرَويّ الذي يُؤرِّخ أربعةً من نقوش هذا الملفّ يُحسَب منه."},"thamud-temple-ruwafa":{"title":"معبدُ رُوافة","summary":"نقشٌ مزدوجٌ باليونانية والنبطية الآرامية يُسجِّل أنّ «ثمودَ رُباثو» بَنَوا معبدًا بعَونٍ روميّ؛ وكانوا وحدةً مساعدةً في الجيش الروماني. فالقومُ الذين يَعدّهم القرآنُ والشعرُ الجاهليُّ أمّةً بائدةً في القديم السحيق كانوا أمرًا قائمًا في القرن الثاني — وكانت عقيدةُ «الحضارة المُهلَكة» عنهم نفسُها حيّةً في القرن السادس.","dispute":"خارجُ مدى الملفّ 300–640، وأُدرِج لأنّه الدليلُ المُعاكِسُ القاطعُ لأسطورة ثمودَ التي كانت شخصيّاتُ العصر تُؤمِن بها. و«الثَّمودية» وَسمًا للنقوش تسميةٌ مغلوطة، لا صِلةَ مُبرهَنةً لها بالقبيلة.","dateNote":"مؤرَّخٌ بالأباطرة المُسمَّين في النصّ اليوناني، وهو يعطي مدًى في الستّينيات من القرن الثاني لا سنةً بعينها."},"zenobia-marid":{"title":"زنوبيا وقصرُ مارد","summary":"ذكرت زنوبيا التَّدمُريّةُ واحةَ دومة، ويُروى أنّ حصنَ مارد صمد لهجومها. بناءٌ قائمٌ إلى اليوم، ومعه حِصارٌ يُسمّى باسمه.","dispute":"قُبَيل المدى، والطبقةُ التَّدمُريّة من مِيراث الفترة.","dateNote":"موضوعٌ بزمن زنوبيا، ولا مصدرَ يؤرِّخ الحصارَ نفسَه."},"himyar-conquers-saba":{"title":"حِمْيَر تضمّ سبأ","summary":"أتمّ شَمِر يُهرعش ما بدأه بيتُه، فجَمَع سبأ — وقَتَبان وحضرموت في يده قبلَها — تحت تاجٍ واحدٍ بظَفار. ومن هنا صار الملوك يَتلقَّبون بملوك سبأٍ وذي رَيدان.","dispute":"قائمةُ الملوك تعطي شَمِرَ 275–300؛ ومقالُ حِمْير يقول «نحو 280» أو «آخر القرن الثالث» ويَمتنِع عن سنةٍ بعينها.","dateNote":"موضوعٌ داخل عهد شَمِر يُهرعش المُواضَع عليه 275-300؛ وأدبيّاتُ حِمْير تمتنع عن سنةٍ محدَّدة."},"namara-inscription":{"title":"نقشُ النَّمارة","summary":"شاهدُ قبرٍ نُقِش في السابع من كَسلول سنةَ 223 للتأريخ البُصرَويّ، لامرئ القيس بن عمرو، وفيه يُسمّى ملكَ العرب كلِّهم. يقول إنّه كَسَر أسدًا، وساق مذحجًا إلى أبواب نجران، وأخضَع مَعدًّا، وولّى عليهم أشرافَ القبائل فصاروا فيلارخةً للروم. أصلبُ تاريخٍ مفردٍ في سجلّ جزيرة العرب في القرن الرابع كلِّه، وهو اليومَ في اللُّوفر.","dispute":"القراءةُ لِج. أ. بلّامي سنة 1985، وقد أزاحت قراءاتٍ أقدمَ مختلفةً عنها، ولا يزال في جزءٍ من اللقب الملكيّ علامةُ استفهام. وهو يَجعل مَلِكًا من بيت لخمٍ مُتَّجِهًا إلى روما، وذلك يُعارِض صورةَ الرواية العربية للمناذرة عملاءَ لفارسَ من أوّل أمرهم إلى آخره.","dateNote":"ثابتٌ بتاريخ التأريخ البُصرَويّ المنقوش على الحَجَر: السابع من كَسلول سنةَ 223."},"marib-temple-last-pagan":{"title":"آخرُ نقشٍ وثنيٍّ في معبد مأرب","summary":"آخرُ نصٍّ وثنيٍّ مؤرَّخٍ في معبد مأرب الكبير. وكانت أكثرُ معابد الجنوب مهجورةً من قبل. فالقصّةُ التي تقع في يمنِ القرن السادس لا ينبغي أن يكون فيها مَعبدُ المَقَه عاملًا — فذلك عالَمٌ أُغلِق قبلَها بمائتَي سنة.","dispute":null,"dateNote":"تحويلُ التأريخ يضع آخرَ نصٍّ وثنيٍّ مؤرَّخٍ في المعبد سنةَ 379/380."},"himyar-monotheist-reform":{"title":"إصلاحُ حِمْيَر الديني","summary":"نقوشٌ ملكيةٌ من كانون الثاني 384 تُسقِط آلهةَ الآباء وتدعو «ربَّ السماء». وفي جيلٍ واحدٍ صار دينُ الدولة العلنيُّ توحيدًا على النحو اليهودي — تُوثِّقه نحو مائةٍ وأربعين إلى مائةٍ وخمسين نقشًا على قرنٍ ونصف، وليس في واحدٍ منها عقيدةٌ مُصرَّحٌ بها.","dispute":"يُبقي روبان على نافذة 380–384 ويُجيز بدءًا أسبقَ منها. وأمّا هل كانت هذه اليهوديةُ رَبّانيّةً فمسألةٌ قائمة: يقرؤها روبان كَهَنوتيّةً غيرَ رَبّانيّةٍ لأنّ النصوص لا تذكر البعثَ قطّ، وتقرؤها غايدا رَبّانيّة.","dateNote":"ثابتٌ في طرفه القريب بالنقوش الملكية من كانون الثاني 384؛ والنافذةُ تُفتَح بصمت 379/380، ويُجيز روبان بدءًا أسبق."},"khazaz-day":{"title":"يومُ خَزاز","summary":"امتنعت مَعدٌّ أن تُؤكَل من أهل اليمن. كان الرجلُ اليمنيُّ يأتي ومعه كاتبٌ وطِنْفِسةٌ يجلس عليها، فيأخذ من أموال نِزارٍ ما شاء. فأوقدوا النارَ على الجبل ثلاثَ ليالٍ ودَخَّنوا ثلاثةَ أيام، فأقبلت القبائل.","dispute":"الرئاسةُ فيه خلافٌ علميٌّ حقيقيٌّ محفوظٌ بنصّه: حَلْقةٌ تلتقي أيامَ الجُمَع بالبصرة تَنازَعت أكان الرئيسُ الأحوصَ بن جعفر أم كُليبَ بن وائل أم زرارةَ بن عُدُس، فحَكَم أبو عمرو بن العلاء عليهم جميعًا بأنّ اليومَ أقدمُ من هؤلاء الرجال، وقال إنّه كان يسأل عنه ستّين سنةً فما وجد من يعرف رئيسَهم. وتَزيد صفحةُ العقد الفريد أنّ اليومَ ما كان يُعرَف أصلًا لولا بيتٌ واحدٌ لعمرو بن كلثوم — والصفحةُ تنقطع قبل المعركة نفسِها. ولا تاريخ.","dateNote":"غيرُ مؤرَّخٍ في كلّ مصدر. وُضع مبكّرًا لأنّ أبا عمرو بن العلاء احتجّ بأنّ اليومَ أقدمُ من كلّ من يُنسَب إليه قيادتُه."},"hira-bishop-410":{"title":"حضورُ أسقفِ الحيرة المجمعَ","summary":"حضر هوشعُ أسقفُ الحيرة المجمعَ الأولَ لكنيسة المشرق. ويُسجِّل المجمعُ نفسُه أساقفةً في مشماهيج ودارِين وهَجَر وهَطّا — فساحلُ الخليج كان له بناءٌ كنسيٌّ قائمٌ سنةَ 410.","dispute":null,"dateNote":null},"rahmanan-first":{"title":"ظهورُ رَحمانَن","summary":"يدخل الاسمُ الإلهيُّ «رحمنن» نقوشَ حِمْير، مُتعاقِبًا مع «إلن» ومع الجمع «أألهن». وهو عينُ الاسم الذي سيستعمله القرآنُ بعد قرنَين: الرحمن.","dispute":null,"dateNote":"منتصفُ النافذة التي يبدأ فيها «رحمنن» بالظهور في النقوش."},"sullan-i":{"title":"يومُ السلّان الأول","summary":"مَعدٌّ في وجه أهل اليمن، في وادٍ فيه ماءٌ وحَلْفاءُ إلى جانب جبل خَزاز، بين الحجاز واليمن. والنصرُ لمَعدّ.","dispute":"القيادةُ متنازَعةٌ على ثلاث صور، وياقوتٌ يجعل الخصومَ مذحجًا وكلبًا. ويتَّهم صاحبُ «معجم الأساطير» جوادًا عليًّا صريحًا بأنّه خلط السلّانَ الأولَ بالثاني، والميدانيَّ بالخطأ نفسِه. ولا تاريخ.","dateNote":"غيرُ مؤرَّخ؛ وُضع داخل القرن الخامس، والجامعون أنفسُهم يَخلِطون السلّانَ الأولَ بالثاني."},"hujr-akil-installed":{"title":"تولِيةُ حُجرٍ آكلِ المرار","summary":"غزا ملكٌ حِمْيَريٌّ وسطَ الجزيرة فولّى حُجرًا آكلَ المرار على قبائل مَعدّ. ومن هنا يبدأ مُلكُ كندة: أداةً لتاجٍ جنوبيٍّ يَحكُم بها النَّوَمة. والمصادر العربية تُسمّي الراعيَ حسنَ بن عمرو بن تُبّاع وتضعه سنةَ 425.","dispute":"المصادر الإنجليزية تقول صريحًا إنّه لا عهودَ مؤرَّخةً لحُجرٍ ألبتّة، وتَستنبِط النافذةَ من عهد راعيه الحِمْيَريّ المُواضَع عليه نحو 390–440، وتُسمّي ذلك الراعيَ أبا كَرِب أسعد. والمصادر العربية تعطي سنةَ تأسيسٍ — 425 — وراعيًا هو حسنُ بن عمرو بن تُبّاع، وسلسلةَ عهودٍ كاملةً بعده: حُجر 425–458، وعمرو 458–489، والحارث 489–528. ولا شيءَ من خارج العربية يُسنِد شيئًا من ذلك. ويُروى أنّه حَكَم طويلًا ومات هَرَمًا ببطن عاقل، وهذا لا يستقيم تمامًا مع عهدٍ يَنتهي بسنةٍ معيَّنة.","dateNote":"المصادر العربية تؤرِّخ تأسيسَ مُلك كندة بسنة 425 وتجعل عهد حُجر 425-458؛ والإنجليزية تقول إنّه لا عهودَ له وتستنبِط نافذةً من عهد أبي كَرِب المُواضَع عليه نحو 390-440. والسنةُ هنا هي العربية 425، والنافذةُ المُستنبَطة باقيةٌ مدًى."},"dam-breach-449":{"title":"انكسارُ السدّ","summary":"انبثاقان كبيران في سنتَين متتاليتَين فتحا سدَّ مأرب. أولُ إخفاقٍ في القرن، وأولُ إخفاقٍ كانت المملكةُ لا تزال من القوّة بحيث تُجيبه.","dispute":null,"dateNote":"ثابتٌ بنقوش السدّ، وهي تُسجِّل انبثاقَين في سنتَين متتاليتَين."},"al-bardan":{"title":"يومُ البَرَدان","summary":"لحُجرٍ آكلِ المرار من كندة على زيد بن الهَبولة من قضاعة — يومٌ قحطانيٌّ خالصٌ لا طرفَ شماليًّا فيه ألبتّة.","dispute":"لا يُعرَف إلّا من مَدخلٍ واحدٍ من سطرٍ عند الخاقاني. ولا تاريخ.","dateNote":"غيرُ مؤرَّخ؛ ولا يُعرَف إلّا من مَدخلٍ من سطرٍ في قائمة الخاقاني، فالسنةُ وَضعٌ لا نقل."},"dam-repair-450":{"title":"ترميمُ شرحبئل يعفر للسدّ","summary":"أعاد الملكُ بناءَ السدّ. وراءَ هذا الترميم ستُّ مئةِ سنةٍ من هذه الدورة، وأمامَه قرنٌ واحد.","dispute":null,"dateNote":"ثابتٌ بنقش الترميم."},"faw-abandoned":{"title":"هَجْرُ قرية الفاو","summary":"مدينةُ قوافلَ قامت نحوَ ألف سنة — خمسةُ معابد، وسوق، وسبعةَ عشرَ بئرًا أو أكثر، ومُتَّكِئون مرسومون على جُدرانها — هُجِرت لمّا نَفَد ماؤها نَفادًا لا رَجعةَ فيه. فالقصّةُ التي تُفتَح نحو 400–500 فيها مدينةٌ عظيمةٌ تموت في حياة من يَذكُرها.","dispute":"لا تأريخَ لها إلّا «نحو القرن الخامس». ومقالُ الموقع نفسُه يُخرِج كندةَ منها نحو 300، وهذا يجعل الدعوى الشائعةَ — أنّ الفاوَ عاصمةُ مملكةِ كندةَ 450–550 — جَمعًا بين طَورَين بينهما قرنٌ ونصف، في أرجح الظنّ. والمصدر العربي يُعارِض نفسَه هنا: يُدرِجها عاصمةً في المتن، ويقول في موضعٍ آخر إنّها هُجرت قبل القرن السادس بزمن.","dateNote":"لا تأريخَ لها إلّا «نحو القرن الخامس»، و450 منتصفُ ذلك القرن."},"cih540-456":{"title":"نقشُ CIH 540","summary":"نقشٌ ملكيٌّ يهوديٌّ مؤرَّخٌ على سدّ مأرب، وهو من أوضح العلامات على أنّ الملوكَ الذين يَصونون المياهَ كانوا قد صاروا مُوحِّدين.","dispute":null,"dateNote":"ثابتٌ بتاريخه الحِمْيَريّ المنقوش فيه."},"zm1-462":{"title":"نقشُ ظ م ١","summary":"نصٌّ حِمْيَريٌّ ملكيٌّ يهوديٌّ مؤرَّخٌ آخر، من العمود الرقيقِ الصادقِ من التواريخ الصُّلبة التي يعطيها جنوبُ الجزيرة ولا يعطيها سائرُها.","dispute":null,"dateNote":"ثابتٌ بتاريخه الحِمْيَريّ المنقوش فيه."},"hima-470":{"title":"نقشُ حمى","summary":"أقدمُ نقشٍ عربيٍّ قديمِ الخطّ مؤرَّخٍ تأريخًا دقيقًا، نُقِش بحمى نحوَ تسعين كيلومترًا شمالَ نجران، نصرانيٌّ فيه صُلبانٌ كبيرةٌ مُزخرَفة. عربيٌّ نصرانيٌّ يَكتُب العربيةَ قبل محمدٍ بقرن، ومعه تاريخٌ مُثبَت.","dispute":null,"dateNote":"ثابتٌ بتاريخ التأريخ المنقوش فيه."},"amr-al-maqsur-killed":{"title":"مقتلُ عمرو المقصور","summary":"رفضته قبائلُ ربيعة خَلَفًا لحُجرٍ بنجد، وقُتل في الأغلب وهو يُقاتلها. ولم تعُد سُلطةُ كندةَ على الشمال بعدَه بغير مُنازِع.","dispute":"لا إسنادَ من خارج العربية. وسلسلةُ العهود العربية — حُجر 425–458، وعمرو 458–489، والحارث 489–528 — هي وحدَها ما يؤرِّخ هذا، والمصادر الإنجليزية تقول صريحًا إنّها لم تجد لهؤلاء الملوك تواريخ. والمصادر العربية تكتب اللقبَ «المنصور» لا «المقصور».","dateNote":"المصادر العربية تُنهي عهدَه سنةَ 489 وهي السنةُ المُثبَتة هنا؛ وليس في الإنجليزية إلّا «قُتل في الأغلب في قتالٍ مع ربيعة في آخر القرن الخامس»."},"basus-war-begins":{"title":"مقتلُ كُليب","summary":"كان كُليبُ بن ربيعة سيّدُ تغلب يَضرِب حِماه على المرعى والماء بالقوّة، فيَشُدّ في المواضع التي يَحميها جَرْوَ كلبٍ وَسْمًا لها، وبُغِض على ذلك. فرمى ناقةً دخلت في إبل جسّاس بن مرّة وهي في جِوار البسوس. فاستغاثت البسوسُ بالذلّ فدار صوتُها في المنازل، وطعن جسّاسٌ كُليبًا، وأبى أبوه أن يُسلِّم ابنَه، فكانت أربعون سنةَ حرب.","dispute":"الناقةُ نفسُها حكايتان مُلحَمتان: ابنُ الأثير يجعلها «سرابًا» لسعد بن شُميس الجَرميّ، آوتها البسوسُ وهي خالةُ جسّاس؛ و«المعرفة» لا تُسمّيها وتجعلها للبسوس نفسِها، ويَقتُل كُليبٌ فصيلَها أولًا ثمّ يرمي ضَرعها. فلا ينبغي تقديمُ اسمٍ قاطعٍ للناقة ولا مالكٍ قاطعٍ لها. والبحثُ الحديث يَعدّ الحربَ كلَّها تركيبًا من أخبار غاراتٍ متفرّقة لا نزاعًا واحدًا.","dateNote":"المقتلُ نفسُه غيرُ مؤرَّخ؛ والتاريخُ الوحيد في المدوَّنة كلِّها هو مدى الحرب 494-534 من جَمعٍ عربيٍّ حديثٍ واحد، و`endYear` يحمل ذلك المدى لتُرسَم الحربُ شريطًا."},"basus-unayza":{"title":"يومُ عنيزة","summary":"أولُ قتالٍ في حرب البسوس، بفَلْجٍ من اليمامة. تَناصَف الفريقان وافترقا بغير ظَفَر.","dispute":"ابنُ الأثير يُسمّيه أولَ الوقائع، و«المعرفة» تجعل ذلك الموضعَ ليوم النهي. ولا تاريخ.","dateNote":"غيرُ مؤرَّخ. والسنةُ تحمل موضعَ اليوم في التسلسل الذي تُعطيه المصادر، وهو أنفعُ من أيّ سنة."},"al-nisar-day":{"title":"يومُ النِّسار","summary":"يومٌ لضَبّةَ وبني تميم.","dispute":"مُدرَجٌ في فهرس ابن الأثير وفهرس العقد الفريد وفي قائمة القلقشندي، ولم يُستخرَج له سَردٌ في موضعٍ ولا تاريخ. والسنةُ هنا منتصفُ الفترة مُجرَّدًا، لا تقديرًا. وهو أضعفُ مَدخلٍ في المدوَّنة كلِّها.","dateNote":"لا مصدرَ يُعطيه تاريخًا ولا موضعًا ولا سَردًا؛ و500 منتصفُ الفترة مُجرَّدًا."},"basus-nahy":{"title":"يومُ النهي","summary":"عند ماءٍ يُسمّى النهيَ وبه بنو شيبان. قاد المهلهلُ تغلبَ في وجه الحارث بن مرّة. قتالٌ شديد، ولم يُقتَل من بني مرّة رجلٌ واحدٌ يومئذٍ. وكان اليومُ لتغلب.","dispute":"غيرُ مؤرَّخ. و«المعرفة» تجعله أولَ وقائع الحرب لا ثانيَها.","dateNote":"غيرُ مؤرَّخ، و«المعرفة» تجعله أولَ وقائع الحرب لا ثانيَها؛ والسنةُ لا تحمل إلّا موضعَه في التسلسل."},"qusayy-takes-kaba":{"title":"قُصَيٌّ يستولي على الكعبة","summary":"جَمَع قُصَيُّ بن كِلاب بني فِهرٍ المتفرِّقين وأخذ أمرَ البيت، ومنه تَنحدِر مناصبُ قريشٍ ووظائفُها كلُّها.","dispute":"التعارضُ الداخليّ هنا عَرضُه قرنٌ كامل. هوتينغ يقول إنّ أبناء قُصَيٍّ — إن صُدِّقت المصادرُ التقليدية — لا بُدّ أن يكونوا عاشوا في النصف الثاني من القرن الخامس؛ ووات يقول إنّ قُصَيًّا نفسَه توفّي في الأغلب في النصف الثاني من القرن السادس. ولا شيءَ يَحِلّ هذا، فالتأريخُ المكّيُّ الداخليُّ قبل نحو 600 حُرٌّ في الحقيقة، بشرط إبقاء التسلسل: قُصَيّ ← عبد مناف ← هاشم ← عبد المطّلب.","dateNote":"التأريخُ المكّيُّ قبل نحو 600 بلا مِرساة: قراءةُ هوتينغ تضع أبناءَ قُصَيٍّ في آخر القرن الخامس، وقراءةُ وات تضع وفاةَ قُصَيٍّ نفسِه في آخر السادس."},"kinda-federates-502":{"title":"كندةُ حُلفاءُ الروم","summary":"أدخلت بيزنطةُ كندةَ في عَهدٍ حُلفاءَ لها. فكان للحارث بن عمروٍ زمانًا تَكليفٌ حِمْيَريٌّ وعَهدٌ بيزنطيٌّ وفيلارخيّةٌ بفلسطينَ في وقتٍ واحد — وهذا في أرجح الظنّ سببُ أنّ كندةَ تفتَّتت أسرعَ من كلّ دولةٍ حاجزةٍ غيرِها.","dispute":null,"dateNote":null},"mundhir-iii-raids-503":{"title":"غزوُ المنذر الثالث","summary":"أغار مَلِكُ الحيرة على فلسطينَ الثالثة وعربيّةَ الصخرية في حرب أنستاسيوس. ومن سنة 503 فصاعدًا تُقيِّد المصادرُ الخارجيةُ تاريخَ المناذرة سنةً سنة؛ وما قبلَه فضاءٌ روائيٌّ حُرّ.","dispute":null,"dateNote":null},"basus-dhanaib":{"title":"يومُ الذنائب","summary":"يُسمّى أعظمَ وقعةٍ في الحرب كلِّها. قُتل من بكرٍ كثير، ومنهم الحارثُ بن مرّة وعمرو بن سدوس. وهو ذروةُ تغلب.","dispute":"غيرُ مؤرَّخ. و«المعرفة» تستعمل الاسمَ نفسَه للموضع الذي طعن فيه جسّاسٌ كُليبًا، وهذا استعمالٌ آخرُ تمامًا.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ تحمل موضعَ اليوم في التسلسل لا غير."},"basus-waridat":{"title":"يومُ واردات","summary":"قتلٌ شديدٌ في بكر. قُتل همّامُ بن مرّة — على يد ناشرةَ، وهو تَغلِبيٌّ كان همّامٌ قد ربّاه — فوقف المهلهلُ على جسده يَرثي عدوَّه.","dispute":"غيرُ مؤرَّخ، والمصادر لا تتّفق أين مات همّام: واردات، أم القصيبات، أم قضة. و«المعرفة» تضع في هذا اليوم مُبارَزةً بين جسّاس وأبي نُوَيرة بدلًا من ذلك.","dateNote":"غيرُ مؤرَّخ، والمصادر لا تتّفق أين مات همّام؛ والسنةُ تحمل موضعَ اليوم في التسلسل."},"zabad-inscription":{"title":"نقشُ زَبَد","summary":"عَتَبةٌ بثلاث لغاتٍ على مَشهد القدّيس سرجيوس — يونانيةٌ وسريانيةٌ وعربيةٌ قديمةُ الخطّ — مؤرَّخةٌ بسنة 823 للتأريخ السلوقي. اليونانيةُ تُسمّي رجالَ الدين والواقفين والمعمارِيَّين سمعانَ ولاونتيوس، والعربيةُ لا تزيد على سؤال الله أن يَذكُر رجالًا مُسمَّين. وهو أقدمُ نصٍّ عربيٍّ قديمِ الخطّ مؤرَّخ، ويُفتَح باستعانةٍ بـ«الإله».","dispute":null,"dateNote":"ثابتٌ بتاريخه المنقوش فيه."},"hima-513":{"title":"مجموعةُ حمى الثانية","summary":"مجموعةٌ أخرى من النقوش العربية قديمةِ الخطّ بحمى، مؤرَّخةٌ بالتأريخ البُصرَويّ. وفي واحدٍ منها يُسمّي كاتبُه نفسَه «عبدَ المسيح».","dispute":null,"dateNote":"ثابتةٌ بتواريخ التأريخ في النقوش."},"basus-qusaybat":{"title":"يومُ القصيبات","summary":"أُصيبت بكرٌ إصابةً شديدةً حتى ظنّوا أنّهم لن يَستقيلوا منها.","dispute":"غيرُ مؤرَّخ. ابنُ الأثير يجعل اليومَ لتغلب، و«المعرفة» تقلب النتيجةَ وتَجزِم أيضًا بأنّ همّامًا قُتل هنا حيث لا يقول ابنُ الأثير إلّا «ويقال».","dateNote":"غيرُ مؤرَّخ، والمصدران الكبيران يَقلِبان النتيجةَ أحدُهما على الآخر؛ والسنةُ تحمل موضعَ اليوم في التسلسل."},"dhu-nuwas-accession":{"title":"تولّي ذي نُواس","summary":"استولى يوسفُ أسأر يثأر، المعروفُ بذي نُواس، على المُلك آخرَ ملوكِ حِمْيَرَ الوطنيّين، فأزاح عاملًا لأكسوم. وعهدُه يَجري من فوره إلى مقتلِ نصارى نجرانَ ثمّ إلى الغزو الحبشي.","dispute":"ثلاثةُ تواريخَ متعارضةٍ لتوليته تدور في مقالَين مرجعيَّين: 517، و522، و«518 أو 522». وتاريخُ ميونرو-هاي للغزو الأكسومي — 525 — مُعلَّقٌ بتوليةٍ سنةَ 518؛ والتوليةُ سنةَ 523 تدفع الغزوَ إلى نحو 530. وآخرُ العهد متنازَعٌ كذلك: المصادر العربية تعطي 517–527 والوفاةَ «عند البحر الأحمر» سنةَ 527، في مقابل 530 في الإنجليزية؛ ومقالٌ عربيٌّ واحدٌ يجعل ميلادَه 468 في مقدِّمته و450 في جدوله.","dateNote":"519 منتصفٌ. والتواريخُ المَرويّة لتوليته 517 و522 و«518 أو 522»، وليس 519 واحدًا منها."},"jabalah-camp-jabiya":{"title":"معسكرُ جبلةَ الرابع بالجابية","summary":"رسالةٌ لشمعون بيت أرشم تضع معسكرَ المَلِك الغسّانيّ بالجابية. لا قصرًا ولا عاصمةً مُسوَّرة، بل مدينةَ خِيَمٍ ملكيّةً بين حَوران والجولان — وهذا ما كانت الدولةُ الغسّانيةُ في الحقيقة.","dispute":null,"dateNote":"موضوعٌ برسالة شمعون بيت أرشم، وهي نفسُها لا تُؤرَّخ إلّا بنحو 518-522."},"tasm-jadis-destroyed":{"title":"إبادةُ جديس","summary":"ادّعى طاغيةُ طَسمٍ حقًّا في عرائس جديسَ قبلَ أزواجهنّ. فأخرج رجالُ جديسٍ في احتفالٍ سيوفًا كانوا قد دفنوها في الرمل فقتلوه. فجاءت حِمْيَرُ ثائرةً: أنذرت امرأةٌ من جديسٍ قومَها بالزحف فلم تُسمَع، فذُبِح الكبارُ وسُبي الصغار.","dispute":"تأريخُ الأخبار هنا غيرُ متماسكٍ عن قصد: تُعَدّ طَسمٌ وجديسٌ معاصرتَين لعادٍ وثمود في القديم السحيق، ثمّ تُبادان في القرن السادس في حياة من يَذكُر. وروايةُ الطبري تجعل الثأرَ جزاءً لمقتلِ حَليفٍ حِمْيَريّ. والطاغيةُ يُسمّى عِمليق؛ وصياغةُ «طاغية الجَوّ» لم يُمكِن التحقُّقُ منها.","dateNote":"غيرُ مؤرَّخ، والأخبارُ تضع هذه الأقوامَ في القديم السحيق وفي حياة أهل القرن السادس في وقتٍ واحد."},"zarqa-blinded":{"title":"زرقاءُ اليمامة","summary":"كانت الزرقاءُ باليمامة تَرى الرُّكبانَ على مَسيرة أسبوع. فتقدَّم العدوُّ مستورًا بأشجارٍ يَحمِلها، فأنذرت قومَها أنّ الشجرَ يسير، فحَسِبوها تَهجُر. فلمّا قُتل رجالُ الحيّ قلعَ الغزاةُ عينَيها وصلبوها.","dispute":"سَنَدُ خبرها ضعيف — كتابٌ في الأدب المقارن ومقالةٌ صحفية، وليس فيهما مصدرٌ متخصِّص — ومَدى البَصَر فيه أسبوعٌ لا الأيامُ الثلاثةُ التي تُعاد كثيرًا. وصفحةُ طَسمٍ وجديسٍ لا تذكرها البتّة وصفحتُها تجعلها جديسيّة، فالوَصلُ التقليديُّ بين الحكايتَين لم يُمكِن التحقُّقُ منه.","dateNote":"غيرُ مؤرَّخ؛ وُضع مع إبادة جديس، وهو وَصلٌ لا تَصِله المصادر في الحقيقة."},"himyar-expels-lakhmids-najd":{"title":"إخراجُ حِمْيَرَ للخميّين من نجد","summary":"استنجدت قبائلُ وسطِ الجزيرة بالجنوب، فدفعت حِمْيَرُ سُلطانَ المناذرة خارجَ النَّجد. فالداخلُ مَسرحٌ تَتنازَعه المنظومتان العميلتان، لا خَلاءً في الوسط.","dispute":null,"dateNote":null},"najran-massacre":{"title":"مذبحةُ نجران","summary":"أخمَد ذو نُواس ثورةَ نجرانَ وقَتَل الحارثَ ونحوَ ثلاثمائةٍ وأربعين من أصحابه، في تشرين الثاني على حِسابٍ من الأحسبة. وثلاثةُ نقوشٍ سبئيةٍ تتّصل بالحادثة، أحدُها مؤرَّخٌ بحَزيران أو تمّوزِ تلك السنة — وهي نصوصٌ سياسيةٌ لا تكاد تذكر الدينَ ألبتّة.","dispute":"المقتلُ مؤرَّخٌ بسنة 523، وخرابُ البلدة مؤرَّخٌ على حِدةٍ بيومِ ثلاثاءَ، الخامس عشر من تشرين، سنةَ 835 سلوقية، أي 524. وعددُ القتلى أوضحُ موضعِ تضخُّمٍ في السجلّ كلِّه، والتضخُّمُ فيه على ثلاث مراحلَ لا مرحلتَين: نحو مائتَين في المصادر المكتوبة قريبًا من الحادثة، وأحدَ عشرَ ألفًا في المصادر العربية — وهي تقول إنّ قوّةَ ذي نُواس بنجرانَ هدمت الأبرشيةَ وقتلت أسقفَها وأحدَ عشرَ ألفًا من المسيحيين، وتجعل مجموعَ القتلى في حملاته على نصارى اليمنِ اثنَين وعشرين ألفًا — وسبعين ألفًا في المصادر المتأخّرة بقرون. والمصادر العربية تُحذِّر في النَّفَس نفسِه من أنّ الرواياتِ السريانيةَ ربّما بالغت. ويُحذِّر روبان من أنّ الأخبار النصرانية تُصوِّر قَمعًا سياسيًّا حربًا دينية. والشهودُ النصرانيون ثلاثة: رسالةُ شمعون بيت أرشم في كانون الثاني 524، و«كتاب الحميريين» السرياني، و«استشهاد أريثاس»؛ ومن الرسالتَين المنشورتَين واحدةٌ وحدَها ربّما لها قيمةٌ تاريخية، ونسبةُ الأُخرَيَين متنازَعٌ فيها.","dateNote":"المقتلُ مؤرَّخٌ بسنة 523؛ وخرابُ البلدة مؤرَّخٌ على حِدةٍ بيومِ ثلاثاءَ، الخامس عشر من تشرين، سنةَ 835 سلوقية، أي 524."},"simeon-letter":{"title":"رسالةُ شمعون","summary":"في كانون الثاني، في عاصمة المناذرة، كتب أسقفٌ مونوفيزيٌّ ما جرى بنجرانَ بعد جَريانه بأشهر. أقربُ شيءٍ إلى وثيقةٍ معاصرةٍ أنتجته جزيرةُ العرب قبل الإسلام، وقد كُتب في بلاط مَلِك العرب التابعِ للفرس.","dispute":"نُشرت رسالتان أُخرَيان على حِدةٍ، عند غويدي سنةَ 1881 وعند عرفان شهيد سنةَ 1971. و«الرسالةُ ج» الأصليةُ وحدَها ربّما لها قيمةٌ تاريخية، ونسبةُ الأُخرَيَين متنازَعٌ فيها.","dateNote":null},"aksumite-invasion":{"title":"الغزوُ الأكسوميُّ لليمن","summary":"أرسل الملكُ كالبُ جيشًا عَبْرَ البحر الأحمر بطلب يوستين الأول. فقُتل ذو نُواس، وانقضى مُلكُ حِمْيَرَ الوطنيّ، وبدأ الحكمُ النصرانيُّ الحبشيُّ في جنوب الجزيرة.","dispute":"مدًى حقيقيٌّ 525–543. يؤرِّخه ميونرو-هاي بـ525 على توليةٍ لذي نُواس سنةَ 518؛ والتوليةُ سنةَ 523 تعطي نحو 530؛ ورجَّح جاك ريكمانز ما يبلغ 543. وبروكوبيوس هو مصدرُ 525. والمصادر العربية تضع وفاةَ ذي نُواس سنةَ 527 لا 530، وهو رقمٌ رابعٌ داخلَ الحُجّة نفسِها.","dateNote":"مدًى حقيقيٌّ في البحث 525-543، مَداره على أيّ تاريخِ توليةٍ يُؤخَذ لذي نُواس. و525 لبروكوبيوس."},"basus-quda":{"title":"يومُ قضةَ / تَحلاقُ اللِّمَم","summary":"حلقت بكرٌ رؤوسَها ليَتعارَفوا في الزَّحمة — استعدادًا للموت، كما يقول مصدر — وخرجت نساؤهم بين المقاتلين بالماء والهَراوى. وعاد الحارثُ بن عُبادٍ وقد اعتزل الحربَ كلَّها، فقادهم لمّا قَتَل المهلهلُ الفتى الذي أرسله بكتاب صُلح. فمزَّق تغلبَ تمزيقًا، وأسر المهلهلَ ثمّ أطلقه وهو لا يعرفه.","dispute":"غيرُ مؤرَّخ. والمصادر تختلف في بُجَير: ابنُ الحارث أم ابنُ أخيه؛ وفي الكتاب: عَرضُ صُلحٍ أم إعلانُ اعتزال. ومقتلُه هو مِحورُ الحربِ البنيويُّ في الروايتَين: تغلبُ تغلب في كلّ يومٍ قبله، وتُغلَب في كلّ يومٍ بعده.","dateNote":"غيرُ مؤرَّخ؛ والسنةُ تحمل موضعَ اليوم في التسلسل. والمصادر تختلف حتى في ابنِ مَن كان بُجَير."},"hujr-killed":{"title":"مقتلُ حُجرِ بن الحارث","summary":"قُتل حُجرُ بن الحارث، وهو الكِنديُّ الموَلَّى على أسدٍ وغطفان، في ثورةٍ أسديّة. ولم يَطلُب القتلةَ من بَنيه إلّا امرؤ القيس، فمن هنا تبدأ رحلةُ الثأر التي تُعرَّف بها أولُ شخصيّةٍ في الشعر العربي.","dispute":"مؤرَّخٌ بالاستنباط المحض: سقط الراعي الحِمْيَريُّ لكندةَ على يد أكسومَ سنةَ 525، فوُضعت الثورةُ إلى جانب ذلك. والتاريخُ يَصطدِم صَدمًا مباشرًا بإحدى صورتَي ميلادِ امرئ القيس، إذ تجعله رضيعًا سنةَ 525.","dateNote":"مؤرَّخٌ بالاستنباط المحض من سقوط الراعي الحِمْيَريّ لكندةَ سنةَ 525، وهو يَصطدِم بإحدى صورتَي ميلاد ابنه."},"shanfara-dies":{"title":"موتُ الشنفرى","summary":"كان قد حلف أن يَقتُل من الأزدِ مائةً، فمات وقد قتل تسعةً وتسعين. ثمّ رَفَس أزديٌّ جُمجمتَه فدخلت في قدمه شَظيّةٌ فمات من عَفَنها — والروايةُ تَعدّ ذلك إتمامًا للقَسَم. دَعوى ميتٍ لم تُقضَ تَعمَل في الدنيا، وهي عينُ فكرةِ الهامَةِ العَطْشى في القتيلِ الذي لم يُثأَر له.","dispute":"لا تواريخَ للشنفرى ألبتّة في المصادر المتاحة؛ ونحو 525 مُواضَعةٌ في كُتُب التعريف. وقبيلتُه — الأزدُ أو بنو سَلامانَ على المُواضَعة — كذلك بلا سَنَد. واللاميّةُ التي صنعت شُهرتَه متنازَعٌ فيها من العصر الوسيط: نسبها التبريزيُّ إلى خَلَف الأحمر، وهو وضّاعٌ معروفٌ للشعر «القديم» في القرن الثامن، وينسبها ابنُ عبد ربه إلى ابن أخٍ له.","dateNote":"لا تواريخَ للشنفرى ألبتّة؛ ونحو 525 مُواضَعةٌ في كُتُب التعريف."},"al-harith-ibn-amr-dies":{"title":"وفاةُ الحارث بن عمرو","summary":"قُتل أشهرُ ملوك كندةَ وأولُ من أُسنِد منهم في المصادر البيزنطية، في بادية الشام. فقسَّم بنوه الأربعةُ أمرَ مَعدٍّ بينهم، وأمضَوا السنين التاليةَ يَقتُل بعضُهم بعضًا.","dispute":"المصادر لا تتّفق أقتلَه المنذرُ الثالثُ اللخميُّ أم بنو كلب.","dateNote":"موضوعٌ نحو 528 من الأخبار البيزنطية، وهي لا تُثبِت السنة."},"jabal-usays":{"title":"نقشُ جبل أُسَيس","summary":"نُقِش «423 بعد بُصرى» على تلٍّ بُركانيٍّ نحوَ مائةٍ وخمسةِ كيلومتراتٍ جنوبَ شرقِ دمشق، ويُوصَف بأنّه النقشُ العربيُّ الجاهليُّ الوحيد ذو المضمون التاريخيّ الحقيقيّ.","dispute":"النشرةُ المتاحة تعطي التاريخَ والموضعَ ولا تعطي النصّ، فالأسماءُ التي تُعلَّق به عادةً لم يُمكِن تأكيدُها.","dateNote":"ثابتٌ بتاريخ التأريخ البُصرَويّ على الحَجَر."},"thannuris":{"title":"معركةُ ثنوريس","summary":"هُزم بليساريوس في أعلى الجزيرة الفُراتية، ومات المَلِكُ الغسّانيُّ جبلةُ الرابعُ في المَيدان. فتولّى ابنُه الحارثُ الفيلارخيّةَ بعده.","dispute":null,"dateNote":null},"harith-made-king":{"title":"تنصيبُ الحارثِ ملكًا","summary":"رفع يوستنيانوسُ الحارثَ بن جبلةَ إلى المُلك ورُتبةِ باتريكيوس، وولّاه أمرَ حُلفاءِ بيزنطةَ من العرب في المشرق كلِّهم — وهو أعلى لقبٍ إمبراطوريٍّ أُعطيَ حاكمًا أجنبيًّا قطّ. فصار مَلِكٌ عربيٌّ واحدٌ مسؤولًا عن التُّخم كلِّه.","dispute":"بدءُ عهده نحو 528 في مقال، و529 في آخر.","dateNote":"رَفعُه مُعطًى نحو 528 في مقالٍ و529 في آخر؛ و`endYear` يَمُدّ عهدَه إلى وفاته المؤرَّخة خارجيًّا سنةَ 569."},"mundhir-syria-raid-529":{"title":"غزوُ المنذر للشام","summary":"أخذ اللخميُّ الخابورَ، وأغار على أرزونَ ونَصيبين، وبلغ أفامِيةَ وأخفق عند أنطاكية، وعاد بسَبْيٍ يُروى أنّ فيه أربعَ مئةِ راهبةٍ قُدِّمت للعُزّى.","dispute":"تفصيلُ تقديمِ الراهبات يأتي من نقلٍ نصرانيٍّ عدائيّ، فيُعامَل على أنّه ما قاله فيه عدوُّه.","dateNote":"الحملةُ تَمتدّ على 528-529 في المصادر اليونانية."},"basus-fusayl":{"title":"يومُ الفصيل","summary":"آخرُ أيام الحرب، والغلبُ فيه لبكر. واسمُه «الفصيل» — وهو عينُ ما تجعل إحدى روايات بدءِ الحربِ كُليبًا يَرميه أولًا.","dispute":"غيرُ مؤرَّخ، ولا يزيد ابنُ الأثير على تسميته. و«المعرفة» لا تذكر الفصيلَ يومًا ولا موضعًا ألبتّة. والرَّجعُ بين الاسم وخبرِ البَدء قد يكون مُفارَقةً جميلة، وقد يكون دليلًا على أنّ خبرَ البَدء نَما إلى الخلف من اسم اليوم — وهذا ربطٌ استنباطيٌّ لا دعوى مصدر.","dateNote":"غيرُ مؤرَّخ، ولا يزيد ابنُ الأثير على تسميته؛ والسنةُ تحمل موضعَ اليوم في التسلسل."},"kulab-i":{"title":"يومُ الكلاب الأول","summary":"لمّا مات المَلِكُ الكِنديُّ اختلف بنوه، فأقبل شرحبيلُ على أخيه سلمةَ ومعه شُذّاذُ العرب ممّن كانوا مع الملوك. ونادى منادي كلِّ فريقٍ بمائةٍ من الإبل في رأس الأخ الآخر. وكان الظَّفَرُ لتغلبَ ولسلمة؛ وطعنَ شرحبيلَ رجلٌ كان له عنده دَمٌ وبعثَ برأسه إلى أخيه، فبكى سلمةُ عليه.","dispute":"غيرُ مؤرَّخٍ ألبتّة. وقائمةُ الخاقاني تُعيِّن الكلابَ ماءً بين الكوفة والبصرة وتوافق في النتيجة؛ وفاجرنيت يُعطي ترتيبًا آخرَ للقبائل.","dateNote":"غيرُ مؤرَّخٍ ألبتّة؛ والنافذةُ حَدسٌ في الجيل."},"callinicum":{"title":"معركةُ قِلينيقوس","summary":"هُزم بليساريوس على الفُرات أمام الفرس والمناذرة، وعُزل بعد تحقيق. وكان الحارثُ بن جبلةَ قد جاء بخمسة آلافٍ من العرب في جانب الروم.","dispute":"يقول بروكوبيوس إنّ العربَ فرُّوا فكلَّفوا بيزنطةَ المعركة؛ ويقول مَلالاس إنّ الحارثَ ثَبَت وفرَّ غيرُه من العرب. مصدران يونانيّان معاصران في تعارضٍ مباشر — والحارثُ أبقى قيادتَه على الحالَين.","dateNote":null},"perpetual-peace":{"title":"الصلحُ الأبديّ","summary":"كان خسرو الأولُ قد تولّى عرشَ فارسَ للتوّ، وكانت الإمبراطوريّتان تريدان مَخرَجًا. فرُدّت الفتوحُ، ودفعت بيزنطةُ أحدَ عشرَ ألفَ رطلٍ من الذهب. وصَمَد الصلحُ ثماني سنوات.","dispute":null,"dateNote":null},"hujras-kills-jassas":{"title":"مقتلُ جسّاس","summary":"ربّى جسّاسٌ الهِجْرِسَ ابنَ كُليبٍ كأنّه ابنُه. فلمّا عَلِم الفتى مَن قَتَل أباه قَتَله.","dispute":"أخبارٌ غيرُ مؤرَّخة.","dateNote":"أخبارٌ غيرُ مؤرَّخة؛ وُضع بعد أيام الحربِ الكبرى لأنّ هذا موضعُه في السَّرد."},"imru-vengeance-war":{"title":"حربُ امرئ القيس","summary":"عرضت عليه أسدٌ ثلاثًا: أن يَقتُل شريفًا يُكافئ أباه، أو يأخذ ديةً من شاءٍ وإبل، أو الحرب. فاختار الحرب. ورَكِبت معه بكرٌ وتغلب، ثمّ انصرفتا لمّا رأتا الثأرَ قد كفى، فبقي لا شيءَ معه. ويُروى أنّ ملكًا حِمْيَريًّا أرسل إليه خمسَ مئةِ رجل.","dispute":"لا تواريخَ ألبتّة. والقصّةُ كلُّها أخبارٌ بُنيت حولَ القصائد. وهي أيضًا الجزءُ من حياته الذي يُحيله تاريخُ الميلادِ المتأخّرُ نحو 526 مستحيلًا.","dateNote":"لا تواريخَ ألبتّة. والقصّةُ أخبارٌ بُنيت حولَ القصائد، وصورةُ الميلادِ المتأخّرةُ للشاعر تُحيلها مستحيلة."},"muhalhil-dies":{"title":"موتُ المهلهل","summary":"بعد أربعين سنةً دعا قومَه إلى السِّلم ورحل إلى اليمن، فنزل في جَنْبٍ من مذحجٍ وتزوَّج هناك. ثمّ أُسر بناحية هَجَرٍ عند رجلٍ حلف ألّا يَسقيَه الماءَ حتى يُرَدّ شيءٌ فُقِد، فسُقي ماءً وَخيمًا فمات عَطَشًا.","dispute":"و«المعرفة» تروي الموتَ نفسَه بأسماءٍ أخرى — قَسَمٌ، وماءٌ ممنوع، وشيءٌ يعود بعد ثلاثٍ متأخّرًا. فهما صورتان لحكايةٍ واحدة، ولا ينبغي لكاتبٍ أن يُقدِّم اسمًا واحدًا قاطعًا لآسِره. ولا تاريخ.","dateNote":"غيرُ مؤرَّخ، والموتُ مَرويٌّ مرّتَين بأسماءٍ مختلفة؛ والسنةُ لا تفعل إلّا أن تُبقيَه بعد الحرب."},"dam-breach-542":{"title":"انكسارُ السدّ مرّةً أخرى","summary":"بعد تسعين سنةً من آخر ترميمٍ أخفق السدُّ من جديد، وهذه المرّةَ في وسط تغيُّرِ حُكم.","dispute":null,"dateNote":"ثابتٌ بنقوش السدّ."},"theodora-jacob":{"title":"شفاعةُ الحارث عند تيودورا","summary":"سأل مَلِكٌ عربيٌّ مونوفيزيٌّ الإمبراطورةَ أساقفةً مونوفيزيّين للشام، فولّت يعقوبَ البُرادعي. ومضى يعقوبُ فبنى ما صار الكنيسةَ السريانيةَ الأرثوذكسية. وهو أبعدُ ما فعله غسّانيٌّ أثرًا في التاريخ.","dispute":null,"dateNote":null},"ukaz-founded":{"title":"سوقُ عكاظ","summary":"واحدٌ وعشرون يومًا كلَّ سنةٍ في ذي القَعدة، قُبَيل الحجّ: تجارةٌ، وخصوماتٌ تُقضى، وأحلافٌ تُعقَد، ومُسابَقاتٌ، وشِعرٌ يُنشَد، وخَطابة. وموضعُها على طريق البَخور الغربيّ هو الذي نمَّاها في القرن السادس.","dispute":"التأسيسُ 501 في الجدول الجانبي، وفترةُ العمل نحو 542–726 في متن المقال نفسِه. والمصادر العربية لا تعطي إحداثياتٍ ولا تاريخَ نشأةٍ ولا انتهاء، وتقول إنّها في سهلٍ منبسطٍ بين مكّةَ والطائف، على ثلاث ليالٍ من مكّةَ وليلةٍ من الطائف، ومن أوّل ذي القعدة إلى العشرين منه. والدعوى المألوفةُ أنّ الشعراءَ تَبارَوا هنا وأنّ القصيدةَ الفائزةَ تُعلَّق بالكعبة لم يُمكِن إسنادُها في الجهتَين، وأكثرُ الباحثين يَرُدّ الشِّقَّ الكعبيَّ منها.","dateNote":"المقالُ نفسُه يعطي 501 للتأسيس ونحو 542-726 لفترة العمل؛ و542 هو الرقمُ المتأخّر منهما."},"abraha-dam-repair":{"title":"ترميمُ أبرهةَ للسدّ","summary":"أعاد القائدُ الحبشيُّ الذي صار مَلِكَ اليمنِ بناءَ السدّ، واحتفل بتمامه بقُدّاس. والنقشُ الذي يُسجِّله نشره إدوارد غلازر أولَ مرّةٍ سنةَ 1897.","dispute":"تاريخُ 543 يَصطدِم بما يُسجِّله CIH 541 من ترميمٍ سنةَ 548. إمّا حملتا عملٍ منفصلتان، وإمّا أنّ أحد التاريخَين خطأ؛ والمصادر لا تَحِلّ ذلك. والمصادر العربية تَصِف النقشَ من غير أن تُسمّيَه: «رقيمٌ عند السدّ من مائةٍ وستّةٍ وثلاثين سطرًا ونحو أربعمائة وسبعين كلمة».","dateNote":"543 في مصدرٍ في مقابل 548 في CIH 541 - إمّا حملتا عملٍ وإمّا رقمٌ خاطئ."},"awara-i":{"title":"يومُ أوارةَ الأول","summary":"المنذرُ بن ماء السماء في وجه بني بكر.","dispute":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ المنذر الثالث لا غير. وهو واحدٌ من أسماء أيامٍ كثيرةٍ ازدوَجت أولًا وثانيًا. وعند القلقشندي: «أُواراه: بني عمرو بن هند وبني تميم». ويُرجَّح أنّ «يوم أحد الجوّ» الذي بقي مجهولًا هو أوارة.","dateNote":"غيرُ مؤرَّخ؛ والنافذةُ عهدُ المنذر الثالث لا غير."},"cih541":{"title":"نقشُ CIH 541","summary":"وثيقةُ السدّ الكبرى، وآخرُ إشارةٍ أثريةٍ إليه قبل النهاية. يُحصي ما أكلته فِرَقُ العمل — خمسين ألفًا وثمانمائةٍ وستَّ مَكاييلَ من الدقيق، وستّةً وعشرين ألفًا من التمر، ولحمًا بقيمة ثلاثة آلافِ بقرةٍ، وسبعةَ آلافٍ ومائتَين من الغنم، وثلاثمائةِ حِمْلِ بعيرٍ من الخمر — ويُسجِّل طاعونًا وحملاتِ أبرهة، ويَصِف مؤتمرَ رُسُلٍ من أكسومَ وبيزنطةَ وفارسَ والغساسنة، ويَذكُر توليةَ خليفةٍ على كندة.","dispute":"اسمُ أبرهةَ في السطر الرابع تالفٌ أو ممحوّ، ولعلّه مُحيَ عمدًا على يد من أراد نِسيانَ الحكم الحبشي. ولا يَحمِل حدثٌ من أحداث النصّ تاريخًا لنفسه، وترميمُ السدّ مؤرَّخٌ بـ543 في موضعٍ وبـ548 بهذا النقش — إمّا موسمَا عملٍ وإمّا خطأ، والمسألةُ غيرُ محلولة. وثُلمةٌ في المرجع العربي موضعُها هذا المُدخَل: المصادر العربية العامّة لا تُسمّي CIH 541 قطّ، ولا تذكر نقوشَ مريغانَ ولا سنةَ 552 ألبتّة. وهي تَصِف هذا النصَّ وصفًا دقيقًا من غير تسمية — «رقيمٌ عند السدّ من مائةٍ وستّةٍ وثلاثي
