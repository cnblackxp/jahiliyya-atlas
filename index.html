// Everything that opens a record goes through here, so the panel, the tabs,
// the layers and the camera can never disagree about what is being looked at.
function reveal(ref,opts){
  opts=opts||{};
  st.sel=ref;
  const k=ref.kind, o=ref.o;
  if(k==='event'&&o.year!=null) setYear(o.year,true);
  if(opts.tab!==false)
    st.tab = k==='event'?'events' : k==='person'?'people' : k==='tribe'?'tribes'
           : k==='polity'?'all' : 'places';
  if(k==='tribe')  st.show.tribes=true;
  if(k==='person') st.show.people=true;
  if(k==='place')  st.show.places=true;
  if(k==='event')  st.show.events=true;
  syncTabs();
  if(opts.move!==false) moveTo(ref);
  else { drawDynamic(); }
  renderPanel(); raiseSheet();
}
function moveTo(ref){
  const k=ref.kind, o=ref.o;
  if(k==='tribe'){ flyToArea(o.lon,o.lat,o.r||180); return; }
  if(k==='polity'){
    const z=(o.zones||[]).find(z=>st.year>=(z.from??-9e9)&&st.year<=(z.to??9e9))||(o.zones||[])[0];
    const c=z&&(z.centers||[])[0];
    if(c) flyToArea(c.lon,c.lat,c.r||300); else drawDynamic();
    return;
  }
  if(k==='place'){ flyTo(o.lon,o.lat,3.2); return; }
  if(k==='event'){
    const pl=o.placeId&&placeById.get(o.placeId);
    if(pl) flyTo(pl.lon,pl.lat,3.2); else drawDynamic();
    return;
  }
  if(k==='person'){
    let cur=null; (o.path||[]).forEach(sp=>{ if(sp.year<=st.year&&(!cur||sp.year>=cur.year)) cur=sp; });
    const pl=cur&&placeById.get(cur.placeId);
    if(pl) flyTo(pl.lon,pl.lat,3.2); else drawDynamic();
    return;
  }
  drawDynamic();
}
// clicking the marker itself: open it, but leave the camera where the user put it
function select(ref){ reveal(ref,{move:false}); }

/* ---------- pan / zoom ---------- */
function clampView(){
  const r=map.getBoundingClientRect(); if(!r.width) return;
  const s=st.view.s, w=WORLD_W*s, h=WORLD_H*s;
  const padX=r.width*0.35, padY=Math.max(r.height*0.35, coverPx()*0.9);
  st.view.tx=Math.min(padX, Math.max(r.width-w-padX, st.view.tx));
  st.view.ty=Math.min(padY, Math.max(r.height-h-padY, st.view.ty));
}
function applyView(){
  clampView();
  gRoot.setAttribute('transform',`translate(${st.view.tx} ${st.view.ty}) scale(${st.view.s})`);
  map.classList.toggle('zoomed', st.view.s > st.view.home*1.3);
  map.style.setProperty('--k', (1/st.view.s).toFixed(4));
  updateScale();
  const sp=document.getElementById('sandpat');
  if(sp) sp.setAttribute('patternTransform','scale('+(1/st.view.s).toFixed(4)+')');
}
function coverPx(){
  const p=document.getElementById('panel');
  if(!p || !window.matchMedia('(max-width:860px)').matches) return 0;
  return p.getBoundingClientRect().height*(1-SNAPS[st.sheet]);
}
let lastCover=0;
function fit(box){
  const r=map.getBoundingClientRect();
  const a=px(box[0],box[3]), b=px(box[2],box[1]);
  const w=b[0]-a[0], h=b[1]-a[1];
  const cover=coverPx(); lastCover=cover;
  const avail=Math.max(120,r.height-cover);
  const s=Math.min(r.width/w, avail/h);
  st.view.s=s; st.view.home=s;
  st.view.tx=-a[0]*s+(r.width-w*s)/2;
  st.view.ty=-a[1]*s+(avail-h*s)/2;
  map.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  applyView();
}
let redrawT=null;
function redrawSoon(ms){ clearTimeout(redrawT); redrawT=setTimeout(drawDynamic, ms??90); }
function zoomAt(f,cx,cy){
  const lo=st.view.home*0.7, hi=st.view.home*22;
  const ns=Math.max(lo,Math.min(hi,st.view.s*f)); if(ns===st.view.s) return;
  const k=ns/st.view.s;
  st.view.tx=cx-(cx-st.view.tx)*k; st.view.ty=cy-(cy-st.view.ty)*k; st.view.s=ns;
  applyView();
  // the transform is instant; re-laying out 60-odd markers is not, so it waits
  // for the gesture to settle instead of stuttering through every wheel tick
  redrawSoon(90);
}
function mapPt(e){const r=map.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function clampS(v){ return Math.max(st.view.home*0.7, Math.min(st.view.home*22, v)); }

/* Touch and mouse are different input models, so they get different handlers.
   Touch: one finger pans, two fingers pan and zoom together about their midpoint.
   Mouse: drag pans, and capture is deferred so a click stays a click.
   Move and up are bound on window, because a touch target that re-renders
   mid-gesture would otherwise take its own pointer events with it. */
(function(){
  const touch=new Map();
  let g1=null, g2=null, mouse=null;
  const isTouch=e=>e.pointerType==='touch'||e.pointerType==='pen';

  function startOneFinger(p){
    g2=null;
    g1={x:p.x, y:p.y, tx:st.view.tx, ty:st.view.ty, armed:false};
  }
  function startTwoFinger(){
    const [a,b]=[...touch.values()];
    g1=null;
    g2={d0:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
        mx:(a.x+b.x)/2, my:(a.y+b.y)/2,
        s0:st.view.s, tx0:st.view.tx, ty0:st.view.ty};
    map.classList.add('drag');
  }
  function onTouchMove(e){
    if(!touch.has(e.pointerId)) return;
    e.preventDefault();
    touch.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=map.getBoundingClientRect();
    if(g2 && touch.size>=2){
      const [a,b]=[...touch.values()];
      const d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
      const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      const m0x=g2.mx-r.left, m0y=g2.my-r.top;
      const s=clampS(g2.s0*(d/g2.d0));
      // hold the world point that was under the midpoint, then follow the midpoint
      st.view.s=s;
      st.view.tx = mx - ((m0x-g2.tx0)/g2.s0)*s;
      st.view.ty = my - ((m0y-g2.ty0)/g2.s0)*s;
      applyView(); redrawSoon(90);
      return;
    }
    if(g1){
      const dx=e.clientX-g1.x, dy=e.clientY-g1.y;
      if(!g1.armed){
        if(Math.hypot(dx,dy)<8) return;          // a tap, not a drag
        g1.armed=true; map.classList.add('drag');
      }
      st.view.tx=g1.tx+dx; st.view.ty=g1.ty+dy; applyView(); redrawSoon(120);
    }
  }
  function onTouchEnd(e){
    if(!touch.has(e.pointerId)) return;
    touch.delete(e.pointerId);
    if(touch.size===1){
      const only=[...touch.values()][0];
      startOneFinger(only); g1.armed=true;        // carry on panning with the finger left down
    } else if(touch.size===0){
      const moved=(g1&&g1.armed)||g2;
      g1=null; g2=null; map.classList.remove('drag');
      window.removeEventListener('pointermove',onTouchMove);
      window.removeEventListener('pointerup',onTouchEnd);
      window.removeEventListener('pointercancel',onTouchEnd);
      if(moved) drawDynamic();
    } else if(touch.size>=2){ startTwoFinger(); }
  }
  function onMouseMove(e){
    if(!mouse) return;
    const dx=e.clientX-mouse.x, dy=e.clientY-mouse.y;
    if(!mouse.armed){
      if(Math.hypot(dx,dy)<5) return;             // a click, not a drag
      mouse.armed=true; map.classList.add('drag');
    }
    st.view.tx=mouse.tx+dx; st.view.ty=mouse.ty+dy; applyView();
  }
  function onMouseUp(){
    const moved=mouse&&mouse.armed;
    mouse=null; map.classList.remove('drag');
    window.removeEventListener('pointermove',onMouseMove);
    window.removeEventListener('pointerup',onMouseUp);
    if(moved) drawDynamic();
  }

  map.addEventListener('pointerdown',e=>{
    if(isTouch(e)){
      // a touch target implicitly captures its own pointer; let it go so the
      // gesture survives the marker underneath being redrawn
      try{ if(e.target.hasPointerCapture&&e.target.hasPointerCapture(e.pointerId))
             e.target.releasePointerCapture(e.pointerId); }catch(_){}
      touch.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(touch.size===1) startOneFinger({x:e.clientX,y:e.clientY});
      else startTwoFinger();
      window.addEventListener('pointermove',onTouchMove,{passive:false});
      window.addEventListener('pointerup',onTouchEnd);
      window.addEventListener('pointercancel',onTouchEnd);
    } else if(e.button===0){
      mouse={x:e.clientX,y:e.clientY,tx:st.view.tx,ty:st.view.ty,armed:false};
      window.addEventListener('pointermove',onMouseMove);
      window.addEventListener('pointerup',onMouseUp);
    }
  });
  // a stray gesture left mid-flight by a resize or a tab switch should not stick
  window.addEventListener('blur',()=>{touch.clear();g1=null;g2=null;mouse=null;map.classList.remove('drag');});
})();
map.addEventListener('dblclick',e=>{const q=mapPt(e);zoomAt(e.shiftKey?1/1.9:1.9,q[0],q[1]);});
map.addEventListener('keydown',e=>{
  const step=60, r=map.getBoundingClientRect();
  const K={ArrowLeft:[step,0],ArrowRight:[-step,0],ArrowUp:[0,step],ArrowDown:[0,-step]}[e.key];
  if(K){e.preventDefault();e.stopPropagation();st.view.tx+=K[0];st.view.ty+=K[1];applyView();return;}
  if(e.key==='+'||e.key==='='){e.preventDefault();zoomAt(1.45,r.width/2,(r.height-coverPx())/2);}
  if(e.key==='-'||e.key==='_'){e.preventDefault();zoomAt(1/1.45,r.width/2,(r.height-coverPx())/2);}
  if(e.key==='0'){e.preventDefault();fit(HOME);drawDynamic();}
});
// A trackpad two-finger drag arrives as a wheel event with small, often fractional
// deltas and a live deltaX; a mouse wheel arrives in chunky line- or page-sized steps.
// A trackpad pinch arrives as a wheel event with ctrlKey set.
function wheelMode(e){
  if(e.ctrlKey) return 'zoom';
  if(st.wheel==='zoom'||st.wheel==='pan') return st.wheel;
  if(e.deltaMode!==0) return 'zoom';
  if(Math.abs(e.deltaX)>0.5) return 'pan';
  if(Math.abs(e.deltaY)>=48 && Number.isInteger(e.deltaY)) return 'zoom';
  return 'pan';
}
map.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=map.getBoundingClientRect();
  if(wheelMode(e)==='pan'){
    st.view.tx-=e.deltaX; st.view.ty-=e.deltaY; applyView();
    redrawSoon(110);
  } else {
    const f=Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0022));
    zoomAt(Math.max(0.5,Math.min(2,f)), e.clientX-r.left, e.clientY-r.top);
  }
},{passive:false});
document.getElementById('zin').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1.45,r.width/2,(r.height-coverPx())/2);};
document.getElementById('zout').onclick=()=>{const r=map.getBoundingClientRect();zoomAt(1/1.45,r.width/2,(r.height-coverPx())/2);};
document.getElementById('zfit').onclick=()=>{fit(HOME);drawDynamic();};
// z is a multiple of the home framing, never an absolute scale — the home scale
// differs between a desktop pane and a phone, so absolute numbers zoom the wrong way.
function flyTo(lon,lat,z){
  const r=map.getBoundingClientRect(), q=px(lon,lat);
  const cover=coverPx();
  st.view.s = st.view.home * (z||2.4);
  st.view.tx = r.width/2 - q[0]*st.view.s;
  st.view.ty = (r.height-cover)/2 - q[1]*st.view.s;
  applyView(); drawDynamic();
}
// frame a circle of radius km around a point, so a tribal range or a sphere fills the view
function flyToArea(lon,lat,km){
  const r=map.getBoundingClientRect(), q=px(lon,lat), cover=coverPx();
  const want=kmToU(km*2.1);
  const s=Math.min(r.width/want, Math.max(140,r.height-cover)/want);
  st.view.s=Math.max(st.view.home*0.75, Math.min(st.view.home*18, s));
  st.view.tx=r.width/2-q[0]*st.view.s;
  st.view.ty=(r.height-cover)/2-q[1]*st.view.s;
  applyView(); drawDynamic();
}

function updateScale(){
  const kmPerUnit = 111.32/S;               // 1 world unit at the standard parallel
  const target = 110;                        // aim for a ~110px bar
  const rawKm = target/st.view.s*kmPerUnit;
  const steps=[10,25,50,100,200,250,500,1000,2000];
  let km=steps[steps.length-1];
  for(const v of steps){ if(v>=rawKm){km=v;break;} }
  const w = km/kmPerUnit*st.view.s;
  const bar=document.querySelector('#scalebar .bar');
  if(bar){bar.style.width=w.toFixed(0)+'px';document.getElementById('scaletxt').textContent=km+(isAr()?' كم':' km');}
  const z=document.getElementById('zoomlvl');
  if(z){const d=detail();
    z.textContent=(st.view.s/st.view.home).toFixed(1)+'× · '+
      (isAr()? (d.maxRank<=0?'المعالم الكبرى':d.maxRank<=1?'المدن':d.maxRank<=2?'البلدات':d.maxRank<=3?'المشاهد':'كل شيء')
             : (d.maxRank<=0?'anchors':d.maxRank<=1?'cities':d.maxRank<=2?'towns':d.maxRank<=3?'shrines':'everything'));}
}

/* ---------- timeline ---------- */
const range=document.getElementById('range');
range.min=Y0; range.max=Y1;
function buildRail(){
  // density
  const svg=document.getElementById('density'); svg.textContent='';
  const B=5, nb=Math.ceil((Y1-Y0)/B), buckets=new Array(nb).fill(0);
  events.forEach(e=>{const i=Math.floor(((e.year??Y0)-Y0)/B); if(i>=0&&i<nb) buckets[i]++;});
  const mx=Math.max(1,...buckets);
  buckets.forEach((v,i)=>{
    if(!v) return;
    const h=3+ (v/mx)*15, w=1000/nb;
    svg.appendChild(el('rect',{x:i*w+.4,y:19-h,width:Math.max(1.1,w-.8),height:h,
      fill:'var(--accent)',opacity:.30,rx:.6}));
  });
  // era bands from polities
  const esvg=document.getElementById('eras'); esvg.textContent='';
  const bands=(D.polities||[]).filter(p=>p.from!=null&&p.to!=null)
    .sort((a,b)=>(a.from-b.from)).slice(0,14);
  const rows=[];
  bands.forEach(p=>{
    let r=0; while(rows[r]!=null && rows[r] > p.from) r++;
    rows[r]=p.to;
    if(r>2) return;
    const x0=(p.from-Y0)/(Y1-Y0)*1000, x1=(p.to-Y0)/(Y1-Y0)*1000;
    const yy=r*5.6, g=el('g');
    g.appendChild(el('rect',{x:x0,y:yy,width:Math.max(2,x1-x0),height:4.3,rx:2,
      fill:'var(--accent2)',opacity:.26}));
    esvg.appendChild(g);
  });
  // spans: events that cover a stretch of years rather than a point
  events.filter(e=>e.endYear&&e.endYear>e.year).forEach(e=>{
    const x0=(e.year-Y0)/(Y1-Y0)*1000, x1=(Math.min(e.endYear,Y1)-Y0)/(Y1-Y0)*1000;
    esvg.appendChild(el('rect',{x:x0,y:12.6,width:Math.max(2,x1-x0),height:3,rx:1.5,
      fill:'var(--trad)',opacity:.45}));
  });
  // ticks
  const tk=document.getElementById('ticks'); tk.textContent='';
  for(let y=Math.ceil(Y0/50)*50;y<=Y1;y+=50){
    const s=document.createElement('span');
    s.style.left=((y-Y0)/(Y1-Y0)*100)+'%'; s.textContent=y; tk.appendChild(s);
  }
}
function currentEra(){
  const act=(D.polities||[]).filter(p=>st.year>=(p.from??9e9)&&st.year<=(p.to??-9e9));
  const names=act.filter(p=>p.kind!=='empire').map(p=>NAME('polities',p));
  return names.slice(0,3).join(' · ');
}
function setYear(y,noScroll){
  st.year=Math.max(Y0,Math.min(Y1,Math.round(y)));
  range.value=st.year;
  document.getElementById('yearNum').textContent=st.year;

  renderPanel(noScroll);
  updatePeek();
}

/* ---------- panel ---------- */
const pbody=document.getElementById('pbody');
function backBtn(){return '<button class="back" data-back="1">'+(isAr()?'→ ':'← ')+st.year+'</button>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function yearStr(e){
  if(e.year==null) return '—';
  const c=(e.estimated?(isAr()?'نحو ':'c. '):'')+e.year;
  return e.endYear? c+'–'+e.endYear : c;
}
function rangeStr(e){
  if(!e.dateRange) return '';
  const [a,b]=e.dateRange;
  return a===b? '' : a+'–'+b;
}
function tagEl(e){return '<span class="tag t-'+(e.evidence||'TRAD')+'">'+(e.evidence||'TRAD')+'</span>';}

document.querySelectorAll('.ptabs button').forEach(b=>{
  b.onclick=()=>{st.tab=b.dataset.tab;st.sel=null;
    if(st.tab==='tribes') st.show.tribes=true;
    syncTabs();drawDynamic();renderPanel();raiseSheet();};
});
function syncTabs(){
  document.querySelectorAll('.ptabs button').forEach(b=>{
    const on=b.dataset.tab===st.tab;
    b.setAttribute('aria-selected',on);
    if(on) try{b.scrollIntoView({block:'nearest',inline:'center'});}catch(_){}
  });
}

function chip(kind,o,label){
  const attr={person:'data-person',place:'data-place',tribe:'data-tribe',polity:'data-polity',event:'data-ev'}[kind];
  const kk={person:'people',place:'places',tribe:'tribes',polity:'polities',event:'events'}[kind];
  return '<span class="chip" '+attr+'="'+esc(o.id)+'">'+typeIco(kind,o)+esc(label||NAME(kk,o))+'</span>';
}
function evCard(e){
  const pl=e.placeId&&placeById.get(e.placeId);
  const ti=NAME('events',e), alt=(isAr()? e.title : e.ar);
  const rng=rangeStr(e);
  return '<div class="ev'+(e.year===st.year?' now':'')+'" data-ev="'+esc(e.id)+'" style="border-left-color:'+evColor(e)+'">'
    +'<div class="r1"><span class="yr">'+esc(yearStr(e))+'</span><span class="ti">'+ico('event','ic-event')+esc(ti)+'</span></div>'
    +(alt&&alt!==ti?'<div class="ar">'+esc(alt)+'</div>':'')
    +'<div class="meta">'+tagEl(e)
    +'<span class="cert '+esc(e.dateCertainty||'')+'">'+esc(Tg('certainty',e.dateCertainty||''))
      +(rng?' · '+rng:'')+'</span>'
    +(pl?'<span class="where">· '+esc(NAME('places',pl))+'</span>':'')
    +'</div></div>';
}

function renderPanel(noScroll){
  const keep=noScroll?pbody.scrollTop:0;
  if(st.sel){
    const r=st.sel;
    pbody.innerHTML = r.kind==='event'?evDetail(r.o): r.kind==='person'?personDetail(r.o)
      : r.kind==='tribe'?tribeDetail(r.o): r.kind==='polity'?polityDetail(r.o) : placeDetail(r.o);

      +(isAr()?'إظهار مدَيات القبائل على الخريطة':'Show tribal ranges on the map')+'</label>';

      +'<div class="r1"><span class="ti">'+ico('tribe','ic-tribe')+esc(NAME('tribes',r.t))+'</span></div>'
      +'<div class="meta"><span class="cert">'+r.all+' '+(isAr()?'حدثًا':'event'+(r.all===1?'':'s'))
      +(r.mem?' · '+r.mem+' '+(isAr()?'شخصية':'figure'+(r.mem===1?'':'s')):'')+'</span>'
      +(r.now?'<span class="tag t-EXT">'+r.now+' '+(isAr()?'في المدى':'in view')+'</span>':'')+'</div></div>';
    if(active.length) h+='<div class="sect">'+(isAr()?('نشطة حول '+y):('Active around '+y))+'</div>'+active.map(card).join('');
    h+='<div class="sect">'+(isAr()?(active.length?'البقيّة':'كلّ القبائل'):(active.length?'The rest':'All tribes'))+'</div>'+quiet.map(card).join('');
    h+='<div class="foot">A tribe is linked to an event when its name appears in the event text, or when a '
      +'figure of that tribe is named in it. That is a reading aid, not a claim in the sources.</div>';
    pbody.innerHTML=h;
  } else if(st.tab==='legend'){
    let h='<h2 class="phead">How to read this map</h2>'
     +'<p class="psub">Four grades of evidence, after the chronology this atlas is built on.</p><div class="leg">';
    for(const k in EV) h+='<div><span class="tag t-'+k+'">'+k+'</span><span>'+EV[k]+'</span></div>';
    h+='</div>';
    h+='<div class="sect">How sure is the date?</div><div class="leg">'
     +'<div><span class="cert">fixed</span><span>An inscription or a dated outside source pins it.</span></div>'
     +'<div><span class="cert">approximate</span><span>Roughly placed, within a decade or so.</span></div>'
     +'<div><span class="cert contested">contested</span><span>Scholars disagree. The card shows the spread.</span></div>'
     +'<div><span class="cert legendary">legendary</span><span>A story with a traditional date, not a record.</span></div>'
     +'<div><span class="cert">'+(isAr()?'نحو ٥٧٠':'c. 570')+'</span><span>A <b>c.</b> in front of a year means the number is a convention or a midpoint, not a transmitted date. '
     +'The card gives the real spread, and says what the date rests on.</span></div>'
     +'</div>';
    const sym=(inner,extra)=>'<svg viewBox="0 0 24 20" fill="none" aria-hidden="true">'+inner+'</svg>';
    h+='<div class="sect">What the symbols mean</div><div class="symkey">'
     +sym('<circle cx="12" cy="10" r="5" fill="var(--mapfg)"/><circle cx="12" cy="10" r="2.1" fill="var(--panel)"/>')+'<span>Capital</span>'
     +sym('<circle cx="12" cy="10" r="4.4" fill="var(--mapfg)"/>')+'<span>City, town, oasis or other settlement</span>'
     +sym('<rect x="8" y="6" width="8" height="8" fill="var(--mapfg)"/>')+'<span>Shrine or sanctuary</span>'
     +sym('<path d="M12 4.5 18 15H6Z" fill="var(--mapfg)"/>')+'<span>Fair or market</span>'
     +sym('<path d="M7 5l10 10M17 5 7 15" stroke="var(--mapfg)" stroke-width="2.2" stroke-linecap="round"/>')+'<span>Battlefield — shown only while its event is in the window</span>'
     +sym('<path d="M12 4 18 10 12 16 6 10Z" fill="var(--accent)"/>')+'<span>Event, coloured by evidence grade</span>'
     +sym('<path d="M12 16C9 12 9.6 8 12 7.2c2.4.8 3 4.8 0 8.8Z" fill="var(--accent)"/>')+'<span>A figure, standing where they were that year</span>'
     +sym('<circle cx="12" cy="10" r="7" fill="var(--accent2)" opacity=".22"/>')+'<span>Tribal range, or a power\u2019s sphere of influence</span>'
     +'</div>';
    h+='<div class="sect">How sure is the place?</div><div class="leg">'
     +'<div><span>●</span><span><b>Solid dot</b> — the site is identified.</span></div>'
     +'<div><span>◎</span><span><b>Faint ring</b> — approximate, right area.</span></div>'
     +'<div><span>⊙</span><span><b>Dashed ring</b> — a guess. The sources name a well or a hill and nothing more.</span></div>'
     +'</div>';
    const tot=events.length, disp=events.filter(e=>e.dispute).length;
    h+='<div class="sect">What is in here</div><div class="leg">'
     +'<div><span class="cert">'+tot+'</span><span>events, of which <b>'+disp+'</b> carry a recorded scholarly dispute</span></div>'
     +'<div><span class="cert">'+(D.people||[]).length+'</span><span>figures, historical and legendary</span></div>'
     +'<div><span class="cert">'+(D.places||[]).length+'</span><span>places</span></div>'
     +'<div><span class="cert">'+(D.polities||[]).length+'</span><span>powers, drawn as spheres of influence</span></div>'
     +'</div>';
    h+='<div class="foot">Spheres of influence are soft blobs on purpose: these powers had reach and clients, not borders. '
      +'Coastlines are modern — the head of the Gulf and the Tihāma shore both sat differently in late antiquity. '
      +'Battlefield pins appear only while an event there falls inside the timeline window. '
      +(D.meta&&D.meta.note?esc(D.meta.note):'')+'</div>';
    pbody.innerHTML=h;
  } else {
    const LN={sands:'Sand seas',ranges:'Mountains & harra',rivers:'Rivers',regions:'Region names',
      polities:'Spheres of influence',tribes:'Tribal ranges',places:'Settlements',events:'Events',people:'Figures'};
    let h='<h2 class="phead">Display</h2><p class="psub">Reading comfort, map layers and what the timeline shows.</p>';
    h+='<div class="sect">Reading</div>';
    h+='<div class="row"><span class="ctl-label">Interface text</span><span class="seg" data-seg="us">'
      +[['0.9','A−'],['1','A'],['1.2','A+'],['1.45','A++']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(String(st.us)===v)+'">'+l+'</button>').join('')+'</span></div>';
    h+='<div class="row"><span class="ctl-label">Map label size</span><span class="seg" data-seg="ms">'
      +[['0.85','Small'],['1','Normal'],['1.25','Large'],['1.6','Largest']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(String(st.ms)===v)+'">'+l+'</button>').join('')+'</span></div>';
    h+='<div class="row"><span class="ctl-label">Map labels</span><span class="seg" data-seg="script">'
      +[['both','Both'],['latin','Latin'],['arabic','العربية']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(st.script===v)+'">'+l+'</button>').join('')+'</span></div>';
    h+='<div class="row"><span class="ctl-label">Contrast</span><span class="seg" data-seg="contrast">'
      +[['normal','Normal'],['high','High']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(st.contrast===v)+'">'+l+'</button>').join('')+'</span></div>';
    h+='<div class="row"><span class="ctl-label">Pulsing markers</span><span class="seg" data-seg="motion">'
      +[['on','On'],['off','Off']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(st.motion===v)+'">'+l+'</button>').join('')+'</span></div>';
    h+='<div class="row"><span class="ctl-label">Scroll wheel</span><span class="seg" data-seg="wheel">'
      +[['auto','Auto'],['pan','Pan'],['zoom','Zoom']].map(([v,l])=>
        '<button data-v="'+v+'" aria-pressed="'+(st.wheel===v)+'">'+l+'</button>').join('')+'</span></div>'
      +'<p class="psub" style="margin:-4px 0 10px">Auto pans on a trackpad two-finger drag and zooms on a mouse wheel. '
      +'Pinch always zooms.</p>';
    h+='<div class="sect">Map layers</div><div class="filters">';
    for(const k in LN) h+='<label><input type="checkbox" id="layer-'+k+'" data-layer="'+k+'"'+(st.show[k]?' checked':'')+'> '+LN[k]+'</label>';
    h+='</div><div class="sect">Show events by evidence</div><div class="filters">';
    for(const k in EV) h+='<label><input type="checkbox" id="evid-'+k+'" data-evid="'+k+'"'+(st.evid.has(k)?' checked':'')+'> <span class="tag t-'+k+'">'+k+'</span> '+EV[k]+'</label>';
    h+='</div><div class="sect">Show events by kind</div><div class="filters">';
    CATS.forEach(c=>h+='<label><input type="checkbox" id="cat-'+esc(c)+'" data-cat="'+esc(c)+'"'+(st.cats.has(c)?' checked':'')+'> '+esc(c)+'</label>');
    h+='</div>';
    h+='<div class="foot"><b>Moving around:</b> drag to pan, scroll or pinch to zoom, double-click to zoom in '
      +'(shift double-click to zoom out). Click the map then use the arrow keys to pan, + and − to zoom, 0 to reset. '
      +'Left and right arrows move the year anywhere else on the page; hold shift for ten-year jumps.</div>';
    pbody.innerHTML=h;
  }
  if(noScroll) pbody.scrollTop=keep;
}

pbody.addEventListener('click',e=>{
  const back=e.target.closest('[data-back]'); if(back){st.sel=null;drawDynamic();renderPanel();return;}
  const go=e.target.closest('[data-go]');
  if(go){st.tab=go.dataset.go;st.sel=null;syncTabs();drawDynamic();renderPanel();return;}
  const ev=e.target.closest('[data-ev]');
  if(ev){const o=events.find(x=>x.id===ev.dataset.ev); if(o) reveal({kind:'event',o}); return;}
  const pe=e.target.closest('[data-person]');
  if(pe){const o=personById.get(pe.dataset.person); if(o) reveal({kind:'person',o}); return;}
  const plc=e.target.closest('[data-place]');
  if(plc){const o=placeById.get(plc.dataset.place); if(o) reveal({kind:'place',o}); return;}
  const po=e.target.closest('[data-polity]');
  if(po){const o=polityById.get(po.dataset.polity); if(o) reveal({kind:'polity',o}); return;}
  const tr=e.target.closest('[data-tribe]');
  if(tr){const o=(D.tribes||[]).find(t=>t.id===tr.dataset.tribe); if(o) reveal({kind:'tribe',o}); return;}
  const yr=e.target.closest('[data-year]');
  if(yr){st.sel=null;setYear(+yr.dataset.year);return;}
});

/* ---------- search ---------- */
const search=document.getElementById('search'), sgBox=document.getElementById('sg');
const SIDX=[];
(D.places||[]).forEach(o=>SIDX.push({t:'place',o,label:o.name,ar:o.ar,sub:o.kind||'place'}));
(D.people||[]).forEach(o=>SIDX.push({t:'person',o,label:o.name,ar:o.ar,
  sub:[o.role,o.tribe].filter(Boolean).join(' · ')||'figure'}));
(D.tribes||[]).forEach(o=>SIDX.push({t:'tribe',o,label:o.name,ar:o.ar,
  sub:(tribeEvents.get(o.id)||[]).length+' events'}));
(D.polities||[]).forEach(o=>SIDX.push({t:'polity',o,label:o.name,ar:o.ar,
  sub:(o.from??'?')+'–'+(o.to??'?')+' CE'}));
events.forEach(o=>SIDX.push({t:'event',o,label:o.title,ar:o.ar,
  sub:(o.year??'?')+' CE · '+(o.category||'event')}));
SIDX.forEach(r=>{r.n=norm(r.label); r.a=r.ar||'';});

const RANK={place:0,person:1,tribe:2,polity:3,event:4};
function suggest(q){
  const nq=norm(q), aq=q.trim();
  if(!nq && !aq) return [];
  const out=[];
  for(const r of SIDX){
    let sc=-1;
    if(nq){
      if(r.n===nq) sc=0;
      else if(r.n.startsWith(nq)) sc=1;
      else if(new RegExp('(^| )'+nq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(r.n)) sc=2;
      else if(r.n.includes(nq)) sc=3;
    }
    if(sc<0 && aq && r.a && r.a.includes(aq)) sc=2;
    if(sc>=0) out.push({r,sc});
  }
  out.sort((a,b)=>a.sc-b.sc || RANK[a.r.t]-RANK[b.r.t] || a.r.label.length-b.r.label.length);
  return out.slice(0,12).map(x=>x.r);
}
let sgList=[], sgAt=-1;
function renderSg(){
  if(!sgList.length){
    sgBox.innerHTML='<div class="sgnone">'+esc(T('nothingMatches'))+'</div>';
    sgBox.hidden=false; search.setAttribute('aria-expanded','true'); return;
  }
  sgBox.innerHTML=sgList.map((r,i)=>
    '<div class="sgrow" role="option" id="sg'+i+'" data-i="'+i+'" aria-selected="'+(i===sgAt)+'">'
    +typeIco(r.t,r.o)
    +'<span class="nm"><b>'+esc(NAME({person:'people',place:'places',tribe:'tribes',polity:'polities',event:'events'}[r.t],r.o))+'</b><span>'+esc(TYPE2(r.t))+' · '+esc(r.sub||'')+'</span></span>'
    +(r.ar?'<span class="arx">'+esc(r.ar)+'</span>':'<span></span>')
    +'</div>').join('');
  sgBox.hidden=false; search.setAttribute('aria-expanded','true');
}
function closeSg(){sgBox.hidden=true;sgAt=-1;search.setAttribute('aria-expanded','false');search.removeAttribute('aria-activedescendant');}
function pick(r){
  if(!r) return;
  closeSg(); search.blur();
  const kind={person:'person',place:'place',tribe:'tribe',polity:'polity',event:'event'}[r.t];
  if(r.t==='person' && r.o.birth!=null) setYear(r.o.birth,true);
  if(r.t==='polity' && r.o.from!=null && (st.year<r.o.from||st.year>(r.o.to??9999))) setYear(r.o.from,true);
  reveal({kind,o:r.o});
}
search.addEventListener('input',()=>{
  const q=search.value;
  if(!q.trim()){closeSg();return;}
  sgList=suggest(q); sgAt=sgList.length?0:-1; renderSg();
  if(sgAt>=0) search.setAttribute('aria-activedescendant','sg0');
});
search.addEventListener('focus',()=>{if(search.value.trim()){sgList=suggest(search.value);sgAt=sgList.length?0:-1;renderSg();}});
search.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSg();return;}
  if(sgBox.hidden&&(e.key==='ArrowDown')&&search.value.trim()){sgList=suggest(search.value);sgAt=0;renderSg();e.preventDefault();return;}
  if(sgBox.hidden) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!sgList.length) return;
    sgAt=(sgAt+(e.key==='ArrowDown'?1:-1)+sgList.length)%sgList.length;
    renderSg();
    search.setAttribute('aria-activedescendant','sg'+sgAt);
    const row=sgBox.querySelector('[data-i="'+sgAt+'"]'); if(row) row.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'){e.preventDefault();pick(sgList[sgAt<0?0:sgAt]);}
});
sgBox.addEventListener('mousedown',e=>{
  const row=e.target.closest('[data-i]'); if(!row) return;
  e.preventDefault(); pick(sgList[+row.dataset.i]);
});
document.addEventListener('click',e=>{ if(!e.target.closest('.sgwrap')) closeSg(); });

/* ---------- mobile sheet ---------- */
const panel=document.getElementById('panel'), grip=document.getElementById('grip');
const SNAPS=[0.84,0.45,0.04];   // peek, half, full — fraction of the panel height it is pushed down by
function isMobile(){return window.matchMedia('(max-width:860px)').matches;}
function setSheet(i,animate){
  st.sheet=Math.max(0,Math.min(SNAPS.length-1,i));
  panel.classList.toggle('dragging',!animate);
  panel.style.setProperty('--sheet-y',(SNAPS[st.sheet]*100)+'%');
  if(animate) requestAnimationFrame(()=>panel.classList.remove('dragging'));
  pbody.style.overflowY = st.sheet===0 ? 'hidden' : 'auto';
  grip.setAttribute('aria-expanded', st.sheet>0);
  const c=coverPx();
  if(Math.abs(c-lastCover)>1){ st.view.ty -= (c-lastCover)/2; lastCover=c; applyView(); drawDynamic(); }
}
function raiseSheet(){ if(isMobile() && st.sheet===0) setSheet(1,true); }
function updatePeek(){
  const n=visibleEvents().filter(e=>e.year===st.year).length;
  const py=document.getElementById('peekYear'), pt=document.getElementById('peekText');
  if(py) py.textContent=st.year;
  if(pt) pt.textContent = n? (n+' event'+(n>1?'s':'')+' · drag up for detail')
                           : 'nothing dated here · drag up';
}
(function(){
  let d=null;
  const H=()=>panel.getBoundingClientRect().height||1;
  grip.addEventListener('pointerdown',e=>{
    if(!isMobile()) return;
    d={y:e.clientY,start:SNAPS[st.sheet],t:Date.now()};
    grip.setPointerCapture(e.pointerId); panel.classList.add('dragging');
  });
  grip.addEventListener('pointermove',e=>{
    if(!d) return;
    const frac=Math.max(0.02,Math.min(0.92,d.start+(e.clientY-d.y)/H()));
    panel.style.setProperty('--sheet-y',(frac*100)+'%');
  });
  function release(e){
    if(!d) return;
    const dy=e.clientY-d.y, dt=Date.now()-d.t, v=dy/Math.max(dt,1);
    let frac=d.start+dy/H();
    let i;
    // a flick steps one snap in its direction; a slow drag settles on the nearest
    if(Math.abs(v)>0.6) i = v<0 ? Math.min(SNAPS.length-1,st.sheet+1) : Math.max(0,st.sheet-1);
    else { i=0; let best=9; SNAPS.forEach((sn,k)=>{const q=Math.abs(sn-frac); if(q<best){best=q;i=k;}}); }
    d=null; setSheet(i,true);
  }
  grip.addEventListener('pointerup',release);
  grip.addEventListener('pointercancel',()=>{d=null;setSheet(st.sheet,true);});
  grip.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet(st.sheet===SNAPS.length-1?0:st.sheet+1,true);}
    if(e.key==='ArrowUp'){e.preventDefault();setSheet(st.sheet+1,true);}
    if(e.key==='ArrowDown'){e.preventDefault();setSheet(st.sheet-1,true);}
  });
})();
document.getElementById('focuspill').onclick=()=>{
  st.tab='all'; st.sel=null; syncTabs(); drawDynamic(); renderPanel();
};
document.getElementById('langBtn').onclick=()=>{
  st.lang = st.lang==='ar'?'en':'ar';
  if(!st.scriptLocked) st.script = st.lang==='ar'?'arabic':'both';
  applyPrefs(); buildRail(); drawDynamic(); renderPanel(); updatePeek();
};
document.getElementById('moreBtn').onclick=function(){
  const c=document.querySelector('.controls');
  const folded=c.classList.toggle('folded');
  this.setAttribute('aria-expanded',!folded);
};

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(st.theme==='auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme',st.theme);
  const b=document.getElementById('themeBtn');
  if(b){ b.textContent = st.theme==='auto'?'◐':st.theme==='dark'?'☾':'☀';
         b.title = 'Theme: '+st.theme+' — click to change'; }
  try{localStorage.setItem('ja-theme',st.theme);}catch(_){}
}
document.getElementById('themeBtn').onclick=()=>{
  st.theme = st.theme==='auto'?'light' : st.theme==='light'?'dark' : 'auto';
  applyTheme(); if(st.tab==='display') renderPanel(true);
};
try{
  const t=localStorage.getItem('ja-theme');
  if(t==='light'||t==='dark'||t==='auto') st.theme=t;
  const pf=JSON.parse(localStorage.getItem('ja-prefs')||'null'); if(pf) Object.assign(st,pf);
}catch(_){}
applyTheme(); applyPrefs();

/* ---------- boot ---------- */
buildStatic(); buildRail();
function relayout(){ const r=map.getBoundingClientRect(); map.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`); applyView(); }
window.addEventListener('resize',()=>{relayout();});
function layoutMode(){
  const m=isMobile();
  document.querySelector('.controls').classList.toggle('folded',m);
  document.getElementById('moreBtn').setAttribute('aria-expanded',!m);
  if(m) setSheet(st.sheet,false); else panel.style.removeProperty('--sheet-y');
  pbody.style.overflowY = (m&&st.sheet===0)?'hidden':'auto';
}
layoutMode();
window.addEventListener('resize',layoutMode);
fit(HOME);
setYear(554);
updatePeek();
})();
