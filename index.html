عَنه رجلٌ كان له عنده دَمٌ وبَعَث بالرأسِ إلى أخيه، فبكى أخوه عليه.","lifeNote":"غيرُ مؤرَّخٍ ألبتّة؛ وُضع بعد وفاة أبيه لا غير."},"salama-ibn-al-harith":{"name":"سلمة بن الحارث","blurb":"أخو شرحبيلَ والغالبُ بالكلاب، ثمّ أظهر النَّدمَ على الرأس الذي جاءه. وطَرَدته تغلبُ بعدَها فلجأ إلى بكرِ بن وائل.","lifeNote":"غيرُ مؤرَّخ."},"shammar-yuharish":{"name":"شمر يُهرعش","blurb":"المَلِكُ الذي أتمّ تَوحيدَ جنوبِ الجزيرةِ تحت حِمْيَر، وأعطى البيتَ لقبَه الطويل: مَلِكُ سبأٍ وذي رَيدان.","lifeNote":"275–300 على المُواضَعةِ من قائمة الملوكِ النقشية؛ والحدودُ طَريّة."},"malkikarib":{"name":"ملكيكرب يهأمن","blurb":"المَلِكُ الذي صارت اليهوديةُ في عهده دينَ حِمْيَرَ عمليًّا، وإن كانت الأسطورةُ تُعطي الفضلَ لابنه.","lifeNote":"نحو 375–400 من قائمة الملوك."},"abu-karib-asad":{"name":"أبو كرب أسعد","blurb":"تَنسُب إليه الأسطورةُ أنّه أولُ من تَهوَّد من حِمْيَر، وهو مُسنَدٌ غازيًا وسطَ الجزيرةِ ومُولِّيًا حُجرًا على مَعدّ — وهو الفِعلُ الذي تَنشأ به مملكةُ كندة.","lifeNote":"نحو 390–440 في قائمة الملوك؛ والأرقامُ إعادةُ بناءٍ من النقوشِ وليست حادّة. والمصادر العربية تُسمّي الراعيَ الذي ولّى حُجرًا حسنَ بن عمرو بن تُبّاعٍ لا أبا كَرِب."},"sharahbiil-yafur":{"name":"شرحبئل يعفر","blurb":"المَلِكُ الذي أعاد بناءَ سدّ مأربَ سنةَ 450 بعد انبثاقَين في سنتَين متتاليتَين.","lifeNote":"نحو 450–465 في قائمة الملوك؛ وترميمُه للسدِّ سنةَ 450 مُثبَتٌ بالنقش."},"dhu-nuwas":{"name":"ذو نُواس","blurb":"يوسفُ أسأر يثأر، آخرُ ملوكِ حِمْيَرَ الوطنيّين وكان يهوديًّا، أخمَد ثورةَ نجرانَ وقَتَل ساداتَها النصارى — فجاء بذلك جيشٌ حبشيٌّ عَبْرَ البحر الأحمرِ أنهى مملكتَه وبيته. ويُروى أنّه أقحم فرسَه في البحر. والمصادر العربية تضع وفاتَه سنةَ 527 والإنجليزيةُ سنةَ 530، ومقالٌ عربيٌّ واحدٌ يُعطي ميلادَه 468 في مقدِّمته و450 في جدوله.","lifeNote":"توليتُه مُعطاةٌ 517 و522 و«518 أو 522» في مقالَين مرجعيَّين. والوفاةُ 527 في المصادر العربية — وهي تجعل العهدَ 517–527 وتقول إنّه مات «عند البحر الأحمر» — و530 في الإنجليزية، فسنةُ الوفاةِ هنا على الرقم العربيِّ والمدى باقٍ مفتوحًا. وميلادُه مُتعارِضٌ داخلَ مقالٍ عربيٍّ واحد: المقدِّمةُ تجعل حياتَه 468–527 والجدولُ يجعل مولدَه 450. والغزوُ الأكسوميُّ الذي قَتَله مَبسوطٌ هو نفسُه 525–543."},"al-harith-najran":{"name":"الحارث النجراني","blurb":"وهو أريثاسُ باليونانية. سيّدُ نصارى نجرانَ، قُتل مع نحوِ ثلاثِ مئةٍ وأربعين من أصحابه. ويتّصل بموته رسالةٌ سريانيةٌ كُتبت بعدَه بأشهر، وكتابٌ سريانيّ، وسِيرةُ قدّيس، وثلاثةُ نقوشٍ سبئية — والنقوشُ هي المعاصرةُ الوحيدةُ، وهي نصوصٌ سياسيةٌ لا تكاد تذكر الدين.","lifeNote":"المقتلُ مؤرَّخٌ بسنة 523، في تشرين الثاني على حِساب، وهو أوثقُ حدثٍ موثَّقٍ في جزيرةِ العربِ الجاهليةِ كلِّها."},"kaleb":{"name":"كالب","blurb":"المَلِكُ النصرانيُّ لأكسوم، أرسل جيشًا عَبْرَ البحر الأحمرِ بعد مقتل نصارى نجران، فخَلَع مَلِكَ حِمْيَرَ وأقام نائبًا عنه — ثمّ فَقَد زِمامَ احتلاله هو، إذ انحاز جيشٌ إلى أبرهةَ وكُسِر الجيشُ الثاني.","lifeNote":"عهدُه غيرُ مُثبَتٍ في المصادر المتاحة؛ والغزوُ الذي أمر به مَبسوطٌ 525–543."},"abraha":{"name":"أبرهة","blurb":"قائدٌ حبشيٌّ أخذ اليمنَ من نائبِ مَلِكه هو، ومَنَع جيشَين أُرسِلا إليه أن يَستردّاه، ورمَّم سدَّ مأربَ واحتفل بقُدّاس، وأنزل في غُرفةٍ واحدةٍ رُسُلًا من أكسومَ وبيزنطةَ وفارسَ والغساسنة، وأغار شمالًا على مَعدٍّ أربعَ مرّاتٍ وأخذ ابنَ مَلِكِ الحيرةِ رَهينة. ثمّ حَكَّ أحدٌ بعدَه اسمَه من السطر الرابعِ من نقشه هو. والروايةُ تَجعله الرجلَ الذي سار بالفيلة على مكّة.","lifeNote":"مُدّتُه مُعطاةٌ من 535 إلى 560 أو 570، والنقوشُ المُفصَّلةُ لا تُغطّي إلّا من 547 إلى 559. ويَحتَجّ روبان بأنّه مات في الأغلب نحو 570، رُجوعًا من عهود بَنيه في أول السبعينيات. فالنافذةُ النقشيةُ الصُّلبةُ 547–559 لا 535–570. وتضطرب المصادر العربية فيه شديدًا: حُكمُه «نحو 525 إلى 553» في المقدِّمة، وفي المتن عبارةٌ مُشوَّشةٌ «من عام 531–547 حتى 55–565» لا يُجزَم منها بشيء، ووفاتُه 570."},"masruq":{"name":"مسروق بن أبرهة","blurb":"ابنُ أبرهةَ من امرأةٍ حِمْيَريّةٍ شريفة، وأخو سيفِ بن ذي يزنَ لأمّه. قُتل في القتالِ لمّا جاء الفرس، وانقضى بموته الحكمُ الحبشيُّ في اليمن.","lifeNote":"571–572 في قائمة الملوك، في نافذةٍ شديدةِ الضِّيقِ تَستثقِل الفتحَ الفارسيَّ سنةَ 570."},"sayf-ibn-dhi-yazan":{"name":"سيف بن ذي يزن","blurb":"وارثٌ حِمْيَريٌّ من أسرةٍ تهوَّدت، نَفاه أبرهةُ ليَتزوَّج أمَّه. فطاف سائلًا النَّصرَ ببيزنطةَ فأبت لأنّها على دين أخيه لأمّه؛ ثمّ بالحيرة؛ ثمّ ببلاط كسرى نفسِه، فأخذ جيشَه على أن يَصير اليمنُ تابعًا لفارس. فعاد مَلِكًا عليه خَراج، فطَعَنه خادمٌ من خَدَمه الأحباشِ فمات. والسِّيرةُ التي نَمَت حوله تُدخِله أرضَ الجنِّ وتُخطِئ في دين الأكسوميّين.","lifeNote":"وُلد نحو 516 بصنعاءَ وقُتل بين 575 و578. وثمّ مشكلةٌ زمنيةٌ في السجلّ: يُروى أنّ النعمانَ الثالثَ اللخميَّ أعانه، وعهدُه يبدأ بعد وفاة سيف. والمصادر العربية تَجعل الذي أدخله على خسرو الأولِ عمرو بن هند."},"wahriz":{"name":"وهرز","blurb":"القائدُ الساسانيُّ الذي أخذ اليمنَ بحملةٍ صغيرةٍ وثماني سُفُنٍ على الأقلّ، يُروى أنّ اثنتَين منها غَرِقت، فحاصر صنعاءَ سنةَ 570، ثمّ عاد بعد مقتلِ المَلِكِ التابعِ بأربعة آلافِ رجلٍ ليَحكُمها بنفسه.","lifeNote":"الفتحُ سنةَ 570 مؤرَّخٌ خارجيًّا؛ وعودتُه مُعطاةٌ 575 أو 578."},"badhan":{"name":"باذان","blurb":"آخرُ الولاةِ الساسانيّين على اليمن، لا قَرابةَ له بأسرة وَهْرِز، في مَنصبه والإمبراطوريةُ التي ولّته تَتفكَّك.","lifeNote":"خَدَم إلى سنة 628."},"khusraw-i":{"name":"خسرو أنوشروان","blurb":"تولّى فابتاع من فوره صُلحًا بأحدَ عشرَ ألفَ رطلٍ من ذهب بيزنطة، وأخذ دارا بحِصارٍ أربعةَ أشهر، وغزا الأناضولَ فكُسِر قربَ مَلَطْية، وأرسل جيشًا يأخذ اليمنَ من الأحباش، ومات وصُلحٌ نصفُ مُعقَّد. ويُروى أنّه مَنَع ملوكَ فارسَ بعدَه أن يَقودوا الجيوشَ بأنفسهم إلّا في وجه مَلِكٍ مِثلِهم.","lifeNote":"عهدُه 531–579، مُثبَتٌ خارجيًّا."},"khusraw-ii":{"name":"خسرو برويز","blurb":"فَرَّ من عرشه هو شابًّا فآواه مَلِكُ لخم، ثمّ أهلكه وأهلك بيتَه بعد اثنتَي عشرةَ سنة، فأخلى جَنْبَه الجنوبيَّ ثمّ أعلن الحربَ التي أخذت القدسَ ومصرَ والصليبَ المُقدَّس — ثمّ فَقَد كلَّ شيءٍ وقَتَله ابنُه.","lifeNote":"عهدُه 590–628، مُثبَتٌ خارجيًّا."},"justinian":{"name":"يوستنيانوس","blurb":"الإمبراطورُ الذي جَعَل مَلِكًا عربيًّا واحدًا مسؤولًا عن التُّخم الشرقيِّ كلِّه، ودَفَع ثمنَ صُلحٍ أبديٍّ دام ثماني سنوات، و— في الحكاية التي رواها العربُ بعدَه — استقبل أميرًا شاعرًا مَسلوبًا ثمّ أرسله إلى بلاده بحُلّةٍ مسمومة.","lifeNote":"عهدُه 527–565، مُثبَتٌ خارجيًّا."},"theodora":{"name":"تيودورا","blurb":"الإمبراطورةُ التي سألها مَلِكٌ عربيٌّ مونوفيزيٌّ سنةَ 542، فأجابته بتَولية الأسقفِ الذي مضى فبنى ما صار الكنيسةَ السريانيةَ الأرثوذكسية.","lifeNote":"ماتت سنةَ 548."},"jacob-baradaeus":{"name":"يعقوب البُرادعي","blurb":"وُلّي أسقفًا بطلبِ مَلِكٍ غسّاني، وهو الذي صَيَّر الشامَ المونوفيزيةَ كنيسةً لها رُتَبُها هي. وهو أبعدُ ما تسبَّب فيه عميلٌ عربيٌّ أثرًا في التاريخ.","lifeNote":"وُلّي سنةَ 542."},"justin-ii":{"name":"يوستينوس الثاني","blurb":"قَطَع الخَراجَ عن فارس، وأشعل حربًا عشرين سنة، وأمر بقتل خيرِ حُلفائه من العرب غِيلة.","lifeNote":"عهدُه 565–578."},"maurice":{"name":"موريكيوس","blurb":"نَفى مَلِكًا عربيًّا عميلًا إلى صِقِلّية، وفَكَّك اتحادَ الآخر، وردَّ مَلِكًا فارسيًّا إلى عرشه — ثمّ قَتَله فوقاسُ سنةَ 602، فأعطى ذلك المَلِكَ الفارسيَّ نفسَه حُجّتَه في الحربِ الأخيرة.","lifeNote":"عهدُه 582–602، وقُتل."},"phocas":{"name":"فوقاس","blurb":"مُغتصِبٌ أعطى قَتلُه لمن قبلَه خسروَ الثانيَ حُجّةَ حرب، في السنة التي أهلك فيها خسرو المناذرة.","lifeNote":"عهدُه 602–610."},"heraclius":{"name":"هِرقل","blurb":"خرج من القسطنطينيةِ في الرابع من نيسانَ 622 — في أسابيعَ من الهجرة — وكَسَر فارسَ في ستّ سنواتٍ كَسرًا تامًّا، فتَرَك الإمبراطوريّتَين كلتَيهما أعجزَ من أن تَضبُطا التُّخمَ الباديَ الذي كانتا قد فكَّكتاه للتوّ.","lifeNote":"عهدُه 610–641."},"hind-bint-al-harith":{"name":"هند بنت الحارث","blurb":"أميرةٌ كِنديّةٌ تزوَّجها المنذرُ الثالثُ اللخميّ، وهي أمُّ عمرو بن هند. تنصَّرت وبَنَت ديرًا في العاصمة، وزوجُها لم يَتنصَّر أبدًا. وهي بنتُ الحارث بن عمرو بن حُجرٍ آكلِ المرار، فهي عمّةُ الشاعر امرئ القيس.","lifeNote":"غيرُ مؤرَّخة. ونساءُ لخمٍ المسمَّياتُ هندًا يَلتبِسن في الرواية التباسًا مستمرًّا، والمصادر تُسمّي واحدةً منهنّ بنتَ النعمانِ وحفيدتَه."},"kulayb":{"name":"كليب بن ربيعة","blurb":"واسمُه في الحقيقة وائل، وسُمّي كُليبًا لأنّه كان يَشُدّ جَرْوَ كلبٍ في المَراعي التي يَحميها لنفسه ويَقتُل كلَّ ما دنا منها. فضَرَب حِماه على المرعى والماءِ بعُنفٍ حتى بَغَضته القبائل. ثمّ رمى ناقةً دَخَلت في إبل ابن خاله فطُعِن بها، فكانت أربعون سنةَ حرب.","lifeNote":"وفاتُه 494 من جَمعٍ عربيٍّ حديثٍ واحدٍ لا غير. والحربُ التي يَبدأ بها تُقرأ اليومَ تركيبًا من أخبار غاراتٍ متفرّقة."},"jassas":{"name":"جساس بن مرة","blurb":"طَعَن كُليبًا من أجل ناقةٍ فأبى أبوه أن يُسلِّمه، وهذا هو البَدءُ الرسميُّ للحرب. وربّى ابنَ كُليبٍ بنفسه، فقَتَله الفتى لمّا عَلِم مَن قاتلُ أبيه.","lifeNote":"غيرُ مؤرَّخ."},"al-basus":{"name":"البسوس","blurb":"المرأةُ التي دار عَويلُها على ناقةٍ مقتولةٍ في المنازلِ فحَمَل رجلًا على قتل ابن خاله. وأمّا هل كانت الناقةُ لها أم لضيفٍ عندها، وهل كان لها اسم، فذلك مَوكولٌ إلى أيّ مصدرٍ تَقرأ.","lifeNote":"اسمُها ونسبُها — البسوسُ بنتُ مُنقِذٍ التميميةُ — في ابن الأثير؛ وخبرٌ آخرُ لا يُعطيها نسبًا ولا يُسمّيها إلّا امرأةً ذاتَ قَرابةٍ بجسّاس."},"jalila":{"name":"جليلة بنت مرة","blurb":"أختُ جسّاسٍ وامرأةُ كُليب، مَحصورةٌ بين أخٍ وزوجٍ حَصرًا تامًّا. وقد كانت تَفخَر بأخوَيها، ويُجعَل ذلك بعضَ سبب غَضَبِ كُليبٍ من قبل. وفي المأتمِ عيَّرتها أختُ كُليبٍ على أعين الناس. فعادت إلى بيت أبيها، ونشأ ابنُها من كُليبٍ فقَتَل أخاها.","lifeNote":"غيرُ مؤرَّخة، وغائبةٌ عن عِدّةٍ من المصادر التي تُغطّي الحرب."},"hammam":{"name":"همام بن مرة","blurb":"أخو جسّاس، وكان نديمَ المهلهلِ قبل الحرب — وهو الذي حَمَل خبرَ مقتلِ كُليبٍ إلى أخي كُليب. وقَتَله تَغلِبيٌّ كان قد ربّاه هو، فرَثاه المهلهلُ على جسده.","lifeNote":"غيرُ مؤرَّخ، والمصادر تضع موتَه في ثلاثة أيامٍ مختلفة — واردات، أو القصيبات، أو قضة."},"al-harith-ibn-ubad":{"name":"الحارث بن عبّاد","blurb":"فارسٌ بَكْريٌّ كبيرٌ اعتزل الحربَ كلَّها، ولم يَعُد إليها إلّا لمّا قُتل الفتى الذي أرسله إلى العدوِّ بكتاب. فحَلَق رؤوسَ رجاله ليَتعارَفوا، ومزَّق تغلبَ تمزيقًا، وأسر قائدَ حربهم ثمّ أطلقه وهو لا يَعرفه. وأمّا الفتى القتيلُ أكان ابنَه أم ابنَ أخيه فالمصادر لا تتّفق.","lifeNote":"غيرُ مؤرَّخ. وهو غائبٌ عن كلّ مصدرٍ بالإنجليزية، ولا يُستخرَج إلّا من أبواب الأيامِ العربية."},"bujayr":{"name":"بجير","blurb":"الفتى المُرسَلُ إلى قائدِ حَربِ العدوّ، فقَتَله. وروايتا حرب البسوسِ كلتاهما تَدور على موته: تغلبُ تغلب في كلّ يومٍ قبله وتُغلَب في كلّ يومٍ بعده. وقال المهلهلُ إنّه أخذ به شِسْعَ نعل كُليب.","lifeNote":"غيرُ مؤرَّخ. ابنُ الأثير يَجعله ابنَ الحارثِ و«المعرفة» تَجعله ابنَ أخيه؛ وروايةٌ تَجعله حاملَ كتاب صُلحٍ والأخرى حاملَ إعلانِ اعتزال."},"qays-ibn-zuhayr":{"name":"قيس بن زهير","blurb":"سيّدُ عبس، أجرى فرسَه في وجه فرسِ ذبيانيٍّ في شَوطٍ يُركَض في أربعين ليلةً فغُدِر به. فقَتَل الابنَ الذي جاء يَطلُب الرهن، وأبى الرَّحمةَ على بئر الهباءةِ لمّا سأله رجلٌ بالله وبالرَّحِم، وأجاب المَوتى بالسُّخرية. وبشعب جبلةَ عطَّش إبلَه ليَحمِلها على الماءِ فتَدُقّ ما لَقيت. ورِوايةٌ تُنهيه راهبًا بعُمان.","lifeNote":"غيرُ مؤرَّخ. وظهورُه قائدًا في داحسٍ وفي شعب جبلةَ كلَيهما مِرساةٌ نسبيّةٌ نافعة: تَضَع القصّتَين داخلَ حياةِ رجلٍ واحدٍ من حياة القتال."},"hudhayfa":{"name":"حذيفة بن بدر","blurb":"سيّدُ ذبيان، فاز بالسباقِ بالغَدرِ وأبى أن يَدفَع لمّا خَسِر الحُجّة. وبالهباءةِ دخل الحرُّ في فخذَيه فرجع إلى الماء، فهناك أدركوه. وآخرُ كلامه دُعاءٌ ألّا تَصطلِح غطفانُ أبدًا، ومُثِّل بجسده بالصورةِ التي تقول المصادرُ إنّه أنزلها بصِبيةٍ من قبل.","lifeNote":"غيرُ مؤرَّخ."},"hamal":{"name":"حمل بن بدر","blurb":"أخو حذيفة، وهو في روايةٍ مَن أكمن الفتيانَ على مَجرى السباق. وبالهباءةِ سأل أصحابَه مَن أكرهُ مَن يَرونه مُقبلًا، فسمَّوا رجلَين، فكان المُقبِلان هما. فسأل بالله وبالرَّحِم فرُدَّ سؤاله.","lifeNote":"غيرُ مؤرَّخ."},"al-rabi-ibn-ziyad":{"name":"الربيع بن زياد","blurb":"عبسيٌّ دَفَع مائةَ بعيرٍ ديةً من مالهِ وحدَه في أول الحرب، وأسر حذيفةَ مرّةً، وكان أحدَ الرجلَين الذين كَرِه حَمَلٌ أن يَراهما على البئر. وهو الذي أخذ درعَ قيسٍ ولم يردّها، فكان ذلك أصلَ النزاع في رواية ابن الأثير.","lifeNote":"غيرُ مؤرَّخ."},"shaddad":{"name":"شداد بن معاوية","blurb":"أبو عنترة، والفارسُ العبسيُّ المُسمّى في الهباءة، على فرسٍ اسمُها جَرْوةُ مَدَحها في شعره. مَنَع ذبيانَ أن تَصِل إلى خيلها، وبذلك حُسِم اليوم.","lifeNote":"غيرُ مؤرَّخ."},"qarawash":{"name":"قرواش بن عمرو","blurb":"الرجلُ الذي طَعَن بالهباءةِ بمِعبَلةٍ عريضةِ النصلِ فقَطَع صُلبَ حذيفة.","lifeNote":"غيرُ مؤرَّخ."},"al-harith-ibn-awf":{"name":"الحارث بن عوف المُرّي","blurb":"المُرّيُّ الذي برَّد الحرب، وأحدُ الرجلَين الذين دفعوا ثمنَ انتهائها. حَمَل مع ابن عمِّه هَرِمِ بن سِنانٍ ديةَ القتلى من الفريقَين من مالهما، فأوقف أربعين سنةً من القتل بين عبسٍ وذبيان. ومعلّقةُ زهيرٍ تُسمّيهما كلَيهما — وهو الرابطُ الذي لم تَستطِعه المصادرُ الإنجليزيةُ وتَنُصّ عليه العربية.","lifeNote":"غيرُ مؤرَّخ. أخبارُ الصلحِ بالإنجليزية تَنسِبه إليه وحدَه، والمصادر العربية تضع ابنَ عمِّه هَرِمَ بن سِنانٍ في الإصلاح إلى جانبه، وتُحمِّلهما الدياتَ معًا — نحوَ ثلاثةِ آلافِ بعيرٍ على ثلاث سنوات — وتَجعل ثناءَ معلّقةِ زهيرٍ عليهما جميعًا. وأبو هَرِمٍ سنانُ بن أبي حارثةَ في الموضع المقابلِ من المسألة، جامعَ حِلفٍ أخفق."},"laqit":{"name":"لقيط بن زرارة","blurb":"أجار قاتلَ سيّدٍ من هوازن، فقَلَب ذلك بني عامرٍ عليه؛ ثمّ أُسر أخوه فمات في الأسر، فجَمَع تميمًا وذبيانَ وأسدًا وأمراءَ كندةَ وقوّةً لخميّةً يَثأَر له. فمات في الشِّعبِ بشعب جبلة، وأسقط معه سُلطانَ كندةَ في الشمال.","lifeNote":"غيرُ مؤرَّخٍ إلّا بالنسبةِ إلى رحرحانَ التي تضعها المصادرُ قبلَها بنحو سنة."},"zurara":{"name":"زرارة بن عُدُس","blurb":"سيّدُ بني دارم، أنذرته امرأةٌ كانت قد رأت الجيوشَ فعَرَفت له مَن القادة — وهو الإنذارُ الوحيد في المدوَّنة كلِّها الذي سُمِع حقًّا. فنَقَل أهلَه ومالَه، ولكنّ ابنَه مَعبَدًا أُسر فمات في الأسر.","lifeNote":"غيرُ مؤرَّخ؛ ويُروى أنّه مات في أيام رحرحانَ نفسِها."},"mabad":{"name":"معبد بن زرارة","blurb":"أسرته بنو عامرٍ برحرحانَ فأبقته أسيرَها حتى مات من ذلك. والابنُ الأسيرُ يَموت في يد العدوِّ هو حاصلُ اليومِ الدراميُّ كلُّه، وسببُ كلِّ ما تَبِعه.","lifeNote":"غيرُ مؤرَّخ."},"al-ahwas":{"name":"الأحوص بن جعفر","blurb":"أخو السيّدِ الذي أشعل مقتلُه سلسلةَ نجد، والرجلُ الذي قاد حَملةَ الفُرسانِ الأخيرةَ بشعب جبلة. وهو القائدُ في رحرحانَ أيضًا، لا أخوه خالدٌ القتيلُ قبلَها.","lifeNote":"غيرُ مؤرَّخ."},"abu-bara":{"name":"أبو براء عامر بن مالك","blurb":"ويُلقَّب مُلاعِبَ الأسِنّة. قاد جانبَ عامرٍ وهوازنَ في الفِجار، وبالسلّانِ أسقط شيخًا كبيرًا مرّةً بعد مرّةٍ ثمّ سأله أن يَدُلَّه على مَن يُستحَقّ فِداؤه — فدلَّه على رجلٍ أسودَ نحيلٍ حَسِبه عبدًا، فكان يُساوي أربعَ مئةِ بعير.","lifeNote":"غيرُ مؤرَّخ."},"dirar":{"name":"ضرار بن عمرو الضبّي","blurb":"شيخٌ كبيرٌ نهى رجالَه هو عن الفِرار بالسلّانِ وأمسك الرايةَ وبنوه قائمون دونه. ثمّ كان له من حُضورِ الذِّهنِ وهو على ظهرِه أن يُرسِل آسِرَه إلى أغنى أسيرٍ في المَيدانِ على أنّه عبد.","lifeNote":"غيرُ مؤرَّخ."},"wabra":{"name":"وبرة بن رومانس الكلبي","blurb":"أخو النعمانِ لأمّه وقائدُ جيشه بالسلّان، أُسر في حَملته هو فافتدى نفسَه بألفِ بعيرٍ وفرسٍ أغنت آسِرَه.","lifeNote":"غيرُ مؤرَّخ."},"hanzala":{"name":"حنظلة بن ثعلبة العجلي","blurb":"أحدُ قادةِ بكرٍ بذي قار — في معركةٍ تُلاحِظ لاندو-تاسرون أنّ القيادةَ فيها كانت تَنتقِل من فارسٍ إلى فارسٍ بلا قائدٍ عامٍّ ألبتّة.","lifeNote":"غيرُ مؤرَّخ."},"bistam":{"name":"بسطام بن قيس","blurb":"فارسُ غارةٍ مشهورٌ أعطى موتُه يومًا من أيام العربِ اسمَه.","lifeNote":"غيرُ مؤرَّخ؛ ولا يُعرَف إلّا من عنوان بابٍ لم يُستخرَج له سَرد."},"hatim-al-tai":{"name":"حاتم الطائي","blurb":"سيّدٌ من طيءٍ يُروى أنّه كان يُعطي كلَّ شيءٍ إلّا مَركَبه وسِلاحَه، له صِلةٌ بالبلاط اللخميّ، ولا يزال اسمُه يُضرَب مثلًا حيًّا. وأمّا رومانسُ الألغازِ التي بُنيت عليه بالفارسيةِ والأرديةِ فمتأخّرةٌ بقرون. وعدّه ابنُ عبد ربه أحدَ أكرمِ ثلاثةٍ في الجاهلية.","lifeNote":"وفاتُه 578 من «كتاب الأغاني» وحدَه؛ وروايةٌ أخرى تضعها في عام مولد محمد. ولا تاريخَ مولدٍ له في موضع."},"al-barrad":{"name":"البراض بن قيس","blurb":"رجلٌ خَلَعته قبيلتُه، قَتَل شريفًا من بني عامرٍ في شهرٍ حَرامٍ وأخذ لطيمةَ مَلِك. وهو الاستحلالُ الذي أعطى حروبَ الفِجارِ اسمَها.","lifeNote":"غيرُ مؤرَّخٍ إلّا في نافذة الفِجارِ الرَّخوة."},"urwa-al-rahhal":{"name":"عروة الرحّال","blurb":"قُتل في شهرٍ حَرامٍ وهو يُجير لطيمةَ مَلِكِ لخم، فأشعل ذلك أربعَ سنواتٍ من القتالِ في أرض السوق. وهو الذي جَزَّ ناصيةَ سنانِ بن أبي حارثةَ بشعب جبلةَ وأطلقه.","lifeNote":"غيرُ مؤرَّخ."},"qays-ibn-asim":{"name":"قيس بن عاصم","blurb":"قاد جانبَ مذحجٍ بالكلابِ الثاني، في قتالٍ نهى عنه شُيوخُ قومه ودُفِع إليه الجانبُ الآخرُ بمَشورة كاهن.","lifeNote":"غيرُ مؤرَّخ."},"hudayr":{"name":"حضير الكتائب","blurb":"قائدُ الأوسِ ببُعاث. كان جانبُه يُهزَم إلى أن ذكَّرهم بصوتٍ عالٍ بكلّ مَظلَمةٍ فعلتها الخزرجُ بهم قطّ، فنَهَضوا وقَلَبوها.","lifeNote":"لا يُؤرَّخ إلّا بموضع بُعاثَ قبل الهجرة."},"amr-ibn-al-numan":{"name":"عمرو بن النعمان البياضي","blurb":"سيّدُ الخزرجِ الذي أخذ رُهُنًا من القبائل اليهوديةِ في الواحةِ فقَتَلهم لمّا أبَوا تسليمَ بعض أموالهم — فدَفَع بذلك تلك القبائلَ إلى مُعسكرِ الجانبِ الآخر. وقُتل هو في القتال الذي تَبِع.","lifeNote":"لا يُؤرَّخ إلّا ببُعاث."},"ibn-ubayy":{"name":"عبد الله بن أبي","blurb":"اختارته القبيلتان المُنهَكتان كلتاهما ليَحفَظ السِّلمَ بيثربَ بعد بُعاث. زعيمُ توافقٍ لواحةٍ خارجةٍ من حربٍ داخلية — والخَلاءُ الذي تَرَكه ضَعفُه هو الذي دخل فيه محمدٌ سنةَ 622.","lifeNote":"اختير حافظًا للسِّلمِ بعد بُعاث، نحو 617؛ وضعُف أثرُه بعد 622."},"qusayy":{"name":"قصي بن كلاب","blurb":"الرجلُ الذي جَمَع بني فِهرٍ المتفرِّقين، وأخذ البيتَ بمكّة، وأقام مناصبَ البطونِ التي يَجري عليها كلُّ ما بعدَه. ويُحتمَل أنّ اسمَ قريشٍ منه.","lifeNote":"أحدُّ تعارضٍ زمنيٍّ في السجلّ كلِّه: يقول هوتينغ إنّ أبناءه لا بُدّ أن يكونوا عاشوا في النصف الثاني من القرن الخامس، ويقول وات إنّ قُصَيًّا نفسَه توفّي في الأغلب في النصف الثاني من السادس. مائةُ سنةٍ بينهما، ولم يُحَلّ."},"durayd":{"name":"دريد بن الصِّمّة","blurb":"سيّدُ بني جُشَم، قاتل في نحوِ مائة معركةٍ ولم يُهزَم في واحدةٍ منها بحسب إمامٍ من أئمّة هذا الشأن. وبقي على وَثنيّته إلى هَرَمٍ شديد، وحُمِل إلى معركته الأخيرةِ في شِجار. وسمّاه ابنُ سَلّامٍ أولَ شعراء الفُرسان.","lifeNote":"مات في كانون الثاني 630. ومولدُه لا يُعطى إلّا بالقرن السادس."},"musaylima":{"name":"مسيلمة","blurb":"كاهنٌ من اليمامةِ الزراعيةِ المُستقِرّة أعلن أنّه نبيٌّ في قريته هو قبل الهجرة. فوسطُ الجزيرةِ يُخرِج مُدَّعيه.","lifeNote":"دَعواه موضوعةٌ قبل الهجرة، نحو 622؛ ولا شيءَ غيرَ ذلك مُثبَت."},"quss":{"name":"قس بن ساعدة الإيادي","blurb":"قام في سوق عكاظَ فخَطَب سَجعًا في إلهٍ واحدٍ وفي البعث، والروايةُ تضع محمدًا شابًّا في السامعين. ويُسمّى في أخبارٍ أسقفَ نجرانَ وفي أخرى حكيمًا وثنيًّا. وبقيت له خُطبةٌ واحدة.","lifeNote":"يُعَدّ أسطوريًّا أو شِبهَ أسطوريٍّ ولا يُعرَف إلّا من المصادر الإسلامية. وعُمرُه مُعطًى ثلاثَ مئةٍ وثمانين سنةً أو ستَّ مئةٍ أو سبعَ مئة، وهذا أوضحُ علامةِ تراكمٍ تُعطيها المدوَّنة."},"zarqa-al-yamama":{"name":"زرقاء اليمامة","blurb":"الزرقاءُ التي كانت تَرى الرُّكبانَ على مَسيرة أسبوع. جاء العدوُّ مستورًا بأشجارٍ يَحمِلها، فقالت إنّ الشجرَ يسير، فقَرَّ قومُها أنّها قد هَجَرت. فلمّا قَتَلوا رجالَ الحيِّ قَلَع الغزاةُ عينَيها وصَلَبوها. وأثبتُ صورةٍ في المدوَّنة كلِّها هي المرأةُ التي تُنذِر فلا تُصدَّق.","lifeNote":"أسطوريةٌ ألبتّة، وسَنَدُ خبرها ضعيف — كتابٌ في الأدب المقارنِ ومقالةٌ صحفية. ومَدى بَصَرها مُعطًى أسبوعًا لا الأيامَ الثلاثةَ التي تُعاد عادةً."},"satih":{"name":"سطيح","blurb":"كاهنٌ لا تكاد فيه عِظام، يُشبَّه بالحَصير، كان أصحابُه يَطوُونه إذا سافروا. وجاءه وصاحبَه النِّصفَ هِبةُ الكِهانةِ من كاهنةٍ كانت قد تنبَّأت بانهيار سدّ مأرب. وآخرُ نُبوءتِه، ألقاها على حدّ الموتِ على رسولٍ نصرانيٍّ أرسله مَلِكٌ فارسيّ، أنّ مُلكَ فارسَ سيَصير إلى العرب — ثمّ مات في موضعه.","lifeNote":"يَقرأ سافران سَطيحًا وشِقًّا كلَيهما بناءَين أدبيَّين من أوّل العصر العبّاسيّ — واصِلَين أُدخِلا ليَشُدّا جزيرةَ العربِ القديمةَ وفارسَ وظهورَ الإسلامِ في سَردٍ واحد — لا شخصَين مَحفوظَين من القرن السادس. فاستعمالُهما شخصيّتَين من الفترةِ إعادةٌ لأيديولوجيا عبّاسية."},"shiqq":{"name":"شق","blurb":"كاهنٌ له نصفُ وجهٍ ونصفُ رأسٍ ونصفُ بدن — واسمُه معناه النصف. والكاهنُ والكائنُ الناقصُ صورةٌ واحدةٌ في هذه المدوَّنة كلِّها: مَن يَرى الغيبَ ليس هو نفسُه رجلًا تامًّا.","lifeNote":"الحكمُ فيه حكمُ سَطيح: بناءٌ عبّاسيٌّ لا شخصٌ محفوظ. والصورةُ الشعبيةُ التي تُعطيه أمًّا من الجنِّ لا يُسنِدها المصدرُ المتخصِّصُ الوحيد المتاح."},"bilqis":{"name":"بلقيس","blurb":"ملكةُ سبأٍ، لا تُسمّى في الكتاب، أرسلت هَدايا فرُدّت، وجاءت قصرَ سليمانَ فكَشَفت عن ساقَيها على أرضٍ حَسِبتها ماءً. وأمّا الساقان الشَّعراوان اللتان تُفسَّر بهما أرضُ الزُّجاجِ فزيادةٌ شعبيةٌ على زيادةٍ تفسيرية — خطوتان من نصٍّ لا يقول إلّا إنّها كَشَفت عن ساقَيها.","lifeNote":"القرآنُ لا يُسمّيها قطّ؛ والاسمُ والنَّسَبُ إلى الجنِّ كلاهما من التفسير، عند الطبريِّ والزَّمخشريِّ والبَيضاوي. ولا نقشَ يُسمّي ملكةً كهذه، ومعبدُ أوام الذي سمّاه الناسُ بها حُفِر فلم يُوجَد فيه ما يَصِله بها."},"halima":{"name":"حليمة بنت الحارث","blurb":"بنتُ الحارث بن جبلةَ المَلِكِ الغسّاني، لا مُجرَّدَ أميرةٍ أعانت مقاتلي قبيلتها: المصادر العربية تَجعلها ابنةَ المَلِكِ نفسِه وتقول إنّ اليومَ يَحمِل اسمَها من أجلها. وأوثقُ معركةٍ مؤرَّخةٍ في المدوَّنة العربيةِ كلِّها تُسمّى بها.","lifeNote":"غيرُ مؤرَّخة. والمصادر العربية أضبطُ من الإنجليزيةِ في تعيينها: بنتُ الحارثِ المَلِكِ الغسّانيِّ نفسِه، واليومُ سُمّي بها. والمثلُ الذي يُعلَّق بها عادةً — «ما يومُ حليمةَ بسرّ» — في قائمة الخاقاني."},"abu-karib-son":{"name":"أبو كرب","blurb":"ابنُ الحارث، خرج للمُبارَزةِ بعين أباغَ فقَتَل الذي أُخرِج إليه — ثمّ عَلِم بعدَها أنّه لم يكن ابنَ المَلِكِ العدوِّ ألبتّة بل شُجاعًا في ثيابه. وقد قال لأبيه إنّه ليس ابنَ المنذر، فأجابه أبوه أنّ الشيخَ لا يَغدِر.","lifeNote":"غيرُ مؤرَّخ."},"abu-amr":{"name":"أبو عمرو بن العلاء","blurb":"جَلَس في حَلْقةٍ تلتقي أيامَ الجُمَع بالبصرةِ والرجالُ يَتنازَعون مَن قاد العربَ بخَزاز، فحَكَم على المُرشَّحين الثلاثةِ جميعًا بأنّ اليومَ أقدمُ منهم جميعًا — وزاد أنّه كان يسأل عن ذلك ستّين سنةً فما وجد من يَعرِف. أصدقُ جملةٍ في المدوَّنة كلِّها.","lifeNote":"لُغويٌّ بصريٌّ من القرن الثامن، خارجَ الفترةِ تمامًا، أُدرِج من أجل ما قاله عنها."},"muhammad":{"name":"محمد بن عبد الله","blurb":"مكّيٌّ من بني هاشم، وُلد بعد موت أبيه عبدِ الله، فيَتِم صغيرًا ورَبّاه جدُّه ثمّ عمُّه أبو طالب. تزوَّج التاجرةَ خديجةَ بنتَ خويلد، وكان يُعرَف حَكَمًا قبل أن يُعرَف بشيءٍ آخر، ثمّ دَعا من نحو سنة 610 إلى إلهٍ واحدٍ وإلى البعثِ والحِسابِ في بلدةٍ بيتُها يَحفَظ آلهةَ قبائلِ إقليمٍ كامل. فقوطع مع عشيرته، وفَقَد امرأتَه وحاميَه في السنة نفسِها، فبَعَث أصحابًا إلى أكسومَ النصرانية، وأخذ أَيمانَ رجالٍ من يثربَ بالعقبة، وانتقل إلى تلك الواحةِ سنةَ 622. ومات بالمدينةِ سنةَ 632، وأكثرُ قبائلِ الجزيرةِ قد صارت إلى مُوادَعته.","lifeNote":"الوفاةُ هي الطرفُ الثابت: الثامنُ من حَزيران 632، وهو المِحورُ الذي يُحسَب منه التأريخُ الهجريُّ كلُّه؛ وهجرةُ 622 مُثبَتةٌ مَبدأً لذلك التقويم. وأمّا المولدُ فليس كذلك. تَشُدّه الروايةُ إلى عام الفيل، وهذا الأطلسُ يؤرِّخ ذلك الحدثَ على 552–572، فسنةُ المولدِ تَرِث مدًى عشرين سنة، و570 المُواضَعُ عليها جَمعٌ بُني لتثبيتها لا تاريخٌ منقول. وكلُّ ما في حياته مَحسوبٌ بالعُمر — الزواجُ، وبناءُ الكعبة، وسنُّ الأربعين عند أول الوحي — يَرِث ذلك المدى؛ وكلُّ ما يُحسَب بالسنين قبل الهجرةِ لا يَرِثه. ولا دليلَ نقشيًّا ولا أثريًّا ولا وثيقةً خارجيةً على مكّةَ ولا على قريشٍ قبل 632، فالشِّقُّ المكّيُّ من حياته قائمٌ كلُّه على روايةِ السِّيرةِ العربيةِ المتأخّرة، وقد كُتبت بعد الحوادثِ بنحو قرنٍ ونصف."},"khadija":{"name":"خديجة بنت خويلد","blurb":"امرأةُ أعمالٍ مكّيّةٌ من بني أسدٍ من قريش، ثَكِلت زوجَين، استأجرت محمدًا في قافلةٍ إلى الشامِ ثمّ تزوَّجته. وكانت وحدَها امرأتَه في حياتها، وأولَ من قَبِل ما قال إنّه سَمِعه بحِراء. وابنُ عمِّها ورقةُ بن نوفل، وهو مَعدودٌ في مُوحِّدي العربِ قبل الإسلام، هو الرجلُ الذي تَجعلها الروايةُ تَذهَب به إليه.","lifeNote":"لا تاريخَ مولدٍ لها. والروايةُ تَجعلها في نحو الأربعين عند زواجها نحو 595، وتُميتها في عام الحزنِ المُعطى 619 أو 620. ومَكانتُها تاجرةً تُمَوِّل القوافلَ تُعاد في كلّ موضعٍ من السِّيرةِ ولا تُسأَل في موضع: لم يُخرِج البحثُ عن دراسةٍ نقديةٍ فيها إلّا كتابةً تَعَبُّديّةً وشعبية."},"abu-talib":{"name":"أبو طالب بن عبد المطلب","blurb":"سيّدُ بني هاشمٍ بعد عبدِ المطّلب، وكافلُ ابن أخيه اليتيم. لم يَقبَل دعوةَ ابن أخيه أبدًا، ولكنّه بَسَط عليه حِمايةَ العشيرة، وهي التي أوجبت مقاطعةَ بني هاشمٍ وهي التي رَفَعها موتُه. وهو أبو عليّ.","lifeNote":"لا تاريخَ مولدٍ له. ووفاتُه موضوعةٌ في عام الحزن، 619 أو 620، بموضعها من الهجرةِ لا بسجلّ. وزمنُه، كزمن أبيه، غيرُ مؤرَّخٍ في المصادر التي وُصل إليها."},"abd-al-muttalib":{"name":"عبد المطلب بن هاشم","blurb":"سيّدُ بني هاشم، صاحبُ سِقاية البيتِ وحَظِّ عشيرته من مناصبِ مكّة، والشخصُ الذي تَمُرّ به أنسابُ قريشٍ كلُّها. ومن بَنيه عبدُ الله وأبو طالبٍ وحمزةُ والعبّاس. وصار اسمُ بني هاشمٍ بعدَه بني عبدِ المطّلب لا غير.","lifeNote":"زمنُه غيرُ مؤرَّخٍ في كلّ مصدرٍ وُصل إليه. و578 المُواضَعُ عليها لوفاته حِسابٌ من سنةِ مولدٍ متنازَعٍ فيها: الروايةُ تُميته وحَفيدُه في الثامنة، ومولدُ الحفيدِ موضوعٌ في أيّ موضعٍ من 552–572. والحِكاياتُ المُعلَّقةُ به — قِداحُ هُبَلَ تَختار ابنَه عبدَ اللهِ للذَّبحِ ثمّ مائةُ بعيرٍ تُعرَض بدلًا منه، وشأنُه مع أبرهةَ في سَرد الفيل، واكتشافُ زمزمَ من جديد — كلُّها سَرد؛ وديةُ المائةِ من الإبلِ التي تُنسَب إليه كثيرًا لم يُمكِن إسنادُها إليه بعينه."},"abd-allah-ibn-abd-al-muttalib":{"name":"عبد الله بن عبد المطلب","blurb":"ابنٌ لعبد المطّلب، يُروى في حكاية قِداحِ هُبَلَ أنّه هو الذي خَرَج سَهمُه للذَّبحِ فافتُدي بمائة بعير. مات شابًّا خارجَ مكّة، وتَرَك امرأةً حاملًا.","lifeNote":"لا يُعرَف إلّا أبًا لابنه. والروايةُ تُميته في سفر تجارةٍ نحوَ ستّة أشهرَ قبل المولد، فتاريخُ وفاته يتحرّك مع تاريخ المولدِ على 552–572. ويَحفَظ الزُّهريُّ روايةً تضع عامَ الفيلِ قبل أن يُولَد هو، وهذا يَكسِر الجَمعَ من داخل الرواية."},"amina-bint-wahb":{"name":"آمنة بنت وهب","blurb":"من بني زُهرةَ من قريش، تَرمَّلت قبل أن يُولَد ابنُها وماتت وهو صبيٌّ صغير. والروايةُ تَجعلها تُرسِله إلى مُرضِعٍ في بني سعدٍ من هوازن، وهذه عادةُ أهل مكّةَ في ذلك الزمان لا تفصيلٌ عنها هي.","lifeNote":"لا تواريخَ خاصّةً بها. ووفاتُها مَحسوبةٌ سنةَ ابنِها السادسة، فتتحرّك مع سنةِ مولدِه المتنازَعِ فيها على المدى 552–578 كلِّه. ولا يَمَسُّها شيءٌ من خارج العربية."},"al-najashi":{"name":"النجاشي","blurb":"مَلِكُ أكسومَ النصرانيُّ الذي أجار في السِّيرةِ المُهاجِرين من مكّةَ وردَّ طَلَبَ وفدٍ قُرَشيٍّ أن يُعيدَهم. وأيًّا مَن كان، فالقصّةُ تُدخِل مكّةَ في عالَمِ البحر الأحمرِ الذي كانت أكسومُ وحِمْيَرُ تَتنازَعانه قرنًا.","lifeNote":"المصادر الإسلامية لا تُعطيه إلّا لقبًا، لا اسمًا يُمكِن مُطابَقتُه بقائمة ملوك أكسوم. وقد عُيِّن أرمَحَ من سنة 1895 وتساحَمَ بديلًا، واحتجّ هان بأنّ أرمَحَ كان ابنًا لكالبَ باسمٍ آخر؛ وتسلسلُ عُملةِ أكسومَ يُعطي ترتيبًا نسبيًّا لا تواريخَ مُطلقة، فلا واحدٌ من التعيينات ثابت. والمِرساةُ الوحيدةُ القريبة قراءةُ ميونرو-هاي لظَهرِ عُملةٍ فيه ثلاثةُ صُلبانٍ إشارةً إلى أَخذِ الفرسِ القدسَ سنةَ 614، وتلك القراءةُ نفسُها مَشروطة."},"harim-ibn-sinan":{"name":"هَرِم بن سِنان المُرّي","blurb":"شريفٌ ذبيانيٌّ دَفَع من إبله هو ثمنَ انتهاءِ حربٍ عُمرُها أربعون سنة، مع ابن عمِّه الحارثِ بن عوف: ثلاثةُ آلافِ بعيرٍ على ثلاث سنوات، ديةُ قتلى الفريقَين. وأثنى زهيرٌ عليهما في معلّقته بما فعلا في الحرب، فأعطاه هَرِمٌ على المَدحِ حتى استحيا الشاعرُ من القَبول — فصار يَمُرّ بالجماعةِ فيُصَبِّح كلَّ رجلٍ فيها ويَترُك هَرِمًا. ومات في طريق الحيرةِ على أرضٍ لبني أسدٍ نحوَ سنةِ 608.","lifeNote":"المصادر العربية تؤرِّخ وفاتَه بنحو خمسةَ عشرَ عامًا قبل الهجرة، أي نحو 608م، في أرضٍ لبني أسدٍ تُسمّى رُزاء، وهو متوجِّهٌ إلى النعمان الثالثِ بالحيرة. وهذا التاريخُ لا يَرِد في مصدرٍ إنجليزيٍّ ألبتّة. ودورُه في صلح داحسٍ مُثبَتٌ في السجلّ العربي — دخل مع ابن عمِّه الحارثِ بن عوفٍ في الإصلاحِ معًا وحَمَلا الدياتَ من مالهما، نحوَ ثلاثةِ آلافِ بعيرٍ على ثلاث سنوات — وهو ما كانت إعادةُ البناءِ الإنجليزيةُ تَسِمه بأنّه غيرُ محقَّقٍ وتُحذِّر من البناء عليه. وتُصحِّح المصادرُ العربية أيضًا ما رُوي من أنّ أخاه خارجةَ هو حاملُ الديات: وذلك غيرُ صحيح. وأبوه سنانُ بن أبي حارثةَ في الموضع المقابلِ من المسألة، جامعَ حِلفٍ أكبرَ على عبسٍ ثمّ انسحب بغير قتال؛ أبٌ وابنٌ لا تعارض."},"hawdha-ibn-ali":{"name":"هَوْذة بن علي الحنفي","blurb":"عميلُ كسرى باليمامة، والمُكلَّفُ بتأديب تميمٍ على سَلْبِ لطيمةِ الملك. وهو أيضًا قِطعةُ الرَّحمةِ الوحيدةُ في الحكاية: وافق يومُ القتلِ عيدَ الفِصح، فطَلَب من المُكعبِرِ مائةً من أسرى تميمٍ فأطلقهم، فجَعَلها الأعشى في قصيدة.","lifeNote":"غيرُ مؤرَّخ. ويَظهَر في السَّردِ العربيِّ ليوم الصفقةِ عميلًا لكسرى باليمامة، ارتفع ذِكرُه عند الملكِ بعد أن أحسن إلى رُسُلِ الفرسِ الذين سَلَبتهم تميم. وروايةُ هامشٍ عن جاد المولى تَقلِب حظَّه قَلبًا تامًّا: أنّ تميمًا كَمَنت له في وادٍ فأسرته ولم تُفَكَّه بأقلَّ من ثلاثِ مئةِ بعير."},"al-mukabbir":{"name":"المُكَعْبِر","blurb":"الضابطُ الفارسيُّ بالمشقَّر. أدخل هو وهَوْذةُ التميميّين الحصنَ جماعاتٍ صغيرةً على وَعدِ مِيرةٍ في سنةٍ قاسيةٍ فقَتَلوهم جماعةً جماعة؛ فلمّا قَطَع رجلٌ من عبسٍ السلسلةَ عن الباب فخرج مَن كان عنده، أغلق الأبوابَ وقَتَل كلَّ مَن بقي في الداخل. واليومُ يُسمّى الصفقةَ، أي الإغلاق، بما فعله بتلك الأبواب.","lifeNote":"غيرُ مؤرَّخ، ويُعرَف بلقبٍ لا باسم. وهو القائدُ الفارسيُّ المُرسَلُ مع قوّةٍ من الأساورةِ لأمرِ تميم، والرجلُ الذي أغلق البابَ الذي أعطى اليومَ اسمَه."}},"places":{"hira":{"name":"الحيرة","blurb":"عاصمةُ المناذرةِ على حاشية البادية، نحوَ سبعةِ كيلومتراتٍ شرقَ جنوبِ النجف، قربَ الكوفةِ اليومَ وقريبًا من الفُرات، وكان فرعٌ من النهر يَبلُغها. والمصادر العربية تؤرِّخ أقدمَ ذِكرٍ موثَّقٍ للموضعِ بسنة 132م، حين تمركزت فيه قوّاتٌ تَدمُريّة — قبل مشايخِ لخمٍ بقرنَين. مدينةٌ عربيةٌ نصرانيةٌ من قصورٍ وأديرةٍ وكُتّابٍ على رِزق، إدارتُها بالفارسية، ولها خطٌّ حِيريٌّ محليٌّ أمدَّ الخطَّ العربيَّ، ويُرسَل إليها صِبيةُ القرى المُجاوِرةِ ليَتعلَّموا الكتابة. وقد قَتَلت ثلاثةً من شعرائها هي في خمسٍ وأربعين سنة."},"khawarnaq":{"name":"الخورنق","blurb":"أشهرُ بناءٍ لخميّ، قربَ الحيرة، يُروى أنّ النعمانَ الأولَ بناه ليُنزِل فيه الأميرَ الساسانيَّ بهرامَ الخامس، ويُقال إنّ معمارَه الروميَّ سِنِمّارَ قُتل لئلّا يَبني مِثلَه في مكانٍ آخر. وكان النعمانُ الثالثُ يَلقى فيه شعراءَ العربِ وله فيه مجلسٌ أدبيٌّ يُسمّى «المؤتمر»؛ وكان القصرُ يَستخدِم الصُّنّاع، ويُستشهَد على ذلك ببيتٍ لعمرو بن كلثوم. وغيرُ مُعيَّنِ الموضع."},"ctesiphon":{"name":"المدائن","blurb":"عاصمةُ الساسانيّين على دِجلة، يأتيها ملوكُ العربِ العملاءُ سائلين، وفيها تعلَّم عديُّ بن زيد، وإليها حُمِل الصليبُ المُقدَّسُ سنةَ 614. وفيها أُخِذ النعمانُ الثالثُ سنةَ 602."},"khanaqin":{"name":"خانقين","blurb":"بلدةٌ في سُفوح زاغروس حَبَس فيها خسرو الثاني آخرَ ملوكِ لخمٍ بعد خَلعه. ويُروى أنّ النعمانَ الثالثَ مات فيها بالطاعون."},"nahrawan":{"name":"النهروان","blurb":"أرضُ قَنواتٍ شرقَ المدائنِ قاتل فيها النعمانُ الثالثُ إلى جانب خسروَ الثانيِ الفارِّ في وجه المُغتصِبِ بهرامَ چوبين."},"dhi-qar":{"name":"ذو قار","blurb":"الماءُ الذي غَلَبت عليه بكرُ بن وائلٍ رَتْلًا ساسانيًّا. وأين كان مسألةٌ متنازَعةٌ تنازعًا حقيقيًّا: المصادر العربية تضعه عند طريفٍ جنوبَ المدينةِ في شمال الجزيرة، والتعيينُ المعتادُ في جنوب العراقِ غربَ الفُراتِ استنباطٌ من اسم المحافظةِ العراقيةِ الحديثة. ولا مصدرَ يُعيِّن الموضع. والإحداثياتُ هنا على التعيين العراقيِّ الشائع، فلتُقرَأ حَدسًا له مُنافِسٌ على ألف كيلومتر."},"constantinople":{"name":"القسطنطينية","blurb":"المدينةُ الإمبراطوريةُ في الطَّرَف الآخرِ من طريق الحيرة. ذهب إليها امرؤ القيسِ يَستجدي جُندًا من يوستنيانوس؛ وذهب إليها عديُّ بن زيدٍ سنةَ 579 رسولًا ساسانيًّا فعاد بكُتُب."},"ankara":{"name":"أنقرة","blurb":"مدينةٌ أناضوليةٌ مَرِض فيها امرؤ القيسِ ومات في طريق العودة. ويُشار إلى قبرٍ بحِضِرلِك على أنّه قبرُه."},"chalcis":{"name":"قنسرين","blurb":"بلدةٌ مُحصَّنةٌ جنوبَ غربِ حلب، تُعَدّ اليومَ مَيدانَ يوم حليمةَ في حَزيران 554، حيث قُتل المنذرُ الثالثُ اللخميّ."},"rusafa":{"name":"الرصافة","blurb":"مَشهدُ القدّيس سرجيوسَ الكبيرُ في البادية، وهو شفيعُ نصارى العرب، وفيه كنائسُ وبناءٌ أمر به المنذرُ الغسّاني. وفيه صالَحت بيزنطةُ الغساسنةَ سنةَ 575. والمصادر العربية تَذكُر من آثارهم بها «صهاريجَ مدينة الرصافة والقصرَ الأبيضَ والأزرق» وأديرةً كثيرة."},"zabad":{"name":"زَبَد","blurb":"قريةٌ جنوبَ شرقِ حلبَ يَحمِل مَشهدُ القدّيس سرجيوسَ فيها أقدمَ نقشٍ عربيٍّ قديمِ الخطّ مؤرَّخ، بثلاث لغاتٍ يونانيةٍ وسريانيةٍ وعربية، من سنة 512."},"callinicum":{"name":"الرقة","blurb":"مَعبرٌ على الفُراتِ كُسِر فيه بليساريوسُ سنةَ 531 على يد الفرسِ والمناذرة، وفيه يُعارِض مصدران يونانيّان أحدُهما الآخرَ مُعارَضةً صريحةً في أفرَّ العربُ الغساسنةُ أم ثَبَتوا."},"thannuris":{"name":"ثنوريس","blurb":"مَيدانٌ في الجزيرةِ الفُراتيةِ سنةَ 528 قُتل فيه المَلِكُ الغسّانيُّ جبلةُ الرابعُ يُقاتِل عن بيزنطة."},"dara":{"name":"دارا","blurb":"الحصنُ الذي بناه أنستاسيوسُ في وجه نَصيبينَ الفارسيةِ من سنة 505، فُقِد لخسروَ الأولِ سنةَ 573 ورُدَّ سنةَ 591. وهو مِحورُ التُّخمِ الشماليِّ كلِّه."},"antioch":{"name":"أنطاكية","blurb":"مدينةُ الشامِ الروميِّ الكبرى، بَلَغها المنذرُ الثالثُ في غزوه ولم يأخذها قطّ، ونَهَبها الفرسُ سنةَ 613."},"damascus":{"name":"دمشق","blurb":"آخرُ مَقصِدِ قوافلِ قريشٍ في الصيفِ شمالًا، والمدينةُ التي كانت معاسكرُ الغساسنةِ وراءَها. سقطت للفرسِ سنةَ 613."},"jerusalem":{"name":"القدس","blurb":"أخذها الفرسُ سنةَ 614 بعد حِصارٍ ثلاثةَ أسابيع؛ وحُمِل الصليبُ المُقدَّسُ إلى المدائن، وهو فَقدٌ شَعَر به المشرقُ النصرانيُّ كلُّه."},"alexandria":{"name":"الإسكندرية","blurb":"ميناءُ مصرَ ومَعمَلُ حِنطتها، سقطت للفرسِ بعد حِصارٍ سنةً كاملةً سنةَ 618 — ثمّ أُبطِل عَطاءُ الخُبزِ بالقسطنطينية."},"bosra":{"name":"بُصرى","blurb":"عاصمةُ عربيّةَ الروميةِ والسوقُ التي تَقصِدها قوافلُ مكّة. وتأريخُها المدنيُّ — ومَبدؤه 105/106م — هو الذي يؤرِّخ نقوشَ النمارةِ وجبلِ أُسَيسٍ وحرّان."},"al-jabiya":{"name":"الجابية","blurb":"المعسكرُ الملكيُّ الغسّانيُّ بين سهل حَورانَ والجولان — مَقَرُّ حُكمٍ كان مدينةَ خِيَمٍ لا عاصمةً مُسوَّرة. وكان الرسلُ الأجانبُ يَخرُجون إليها يَلقَون الملوك. والمصادر العربية تقول إنّهم استقرّوا ببُصرى أولًا ثمّ صارت الجابيةُ عاصمتَهم، وسمّاها شاعرُهم حسّانُ «جابيةَ الجولان»."},"jabal-says":{"name":"جبل أسيس","blurb":"تلٌّ بُركانيٌّ نحوَ مائةٍ وخمسةِ كيلومتراتٍ جنوبَ شرقِ دمشق، منه النقشُ العربيُّ سنةَ 528 الذي يُسمّى في الأكثر النصَّ العربيَّ الجاهليَّ الوحيدَ ذا المضمونِ التاريخيّ."},"namara":{"name":"النمارة","blurb":"موضعٌ بازلتيٌّ في الحَرّةِ نحوَ مائةِ كيلومترٍ جنوبَ شرقِ دمشق، وُجد فيه شاهدُ قبرِ امرئ القيسِ «مَلِكِ العربِ كلِّهم». والحَجَرُ اليومَ في اللُّوفر."},"harran-al-laja":{"name":"حرّان اللجاة","blurb":"قريةٌ جنوبَ دمشقَ يَحمِل مَشهدُ القدّيس يوحنّا فيها نقشًا مزدوجًا باليونانيةِ والعربيةِ من سنة 568، مؤرَّخًا بتأريخٍ عربيٍّ يُحسَب من خَراب خيبر."},"yarmuk":{"name":"اليرموك","blurb":"وادي النهرِ الذي كُسِر فيه الغساسنةُ وجيشُ بيزنطةَ المَيدانيُّ سنةَ 636، فأُغلِقت به الفترة."},"petra":{"name":"البتراء","blurb":"عاصمةُ الأنباطِ الميتة، ضمَّتها رومةُ سنةَ 106، وبقيت قائمةً في المَشهدِ واجهاتٍ منقورةً ومَذابحَ عاليةً يَمُرّ بها مُسافِرو القرن السادس."},"hegra":{"name":"الحِجر","blurb":"مائةٌ وإحدى وثلاثون قبرًا نبطيًّا منقورةً في الصخرِ على نحوِ اثنَي عشرَ كيلومترًا مربّعًا، وجبلُ إثلِبَ حَيُّها الديني. وفي القرن السادسِ كانت تُقرأ بيوتَ ثمودَ، أمّةً أهلكها الله — وهو خطأٌ كان هو نفسُه عقيدةً حيّةً في ذلك الزمان."},"dadan":{"name":"ددان","blurb":"عاصمةُ الواحةِ الأقدمُ تحت العُلا، وفوقها قبورٌ تَحُفُّها الأسود، وفي نقوشها الإلهُ ذو غَيبة. وكانت حقلَ أطلالٍ في آخر العصر القديم."},"al-ula":{"name":"العلا","blurb":"واحةُ نخلٍ طويلةٌ على طريق البَخور، ظَهَر فيها سكّانٌ يهودٌ من القرن الخامس."},"tayma":{"name":"تيماء","blurb":"واحةٌ مُسوَّرةٌ على طريق الشام، تُسمّى في الشعر الجاهليِّ مدينةَ اليهود، ولها ماضٍ نقشيٌّ عميقٌ يَرجِع إلى البابليّينَ وإلى الإله صَلمِ مَحرَم."},"al-ablaq":{"name":"الأبلق","blurb":"حصنُ السموألِ الأبرقُ على تلٍّ عند تيماء، مَنزِلُ المُسافِرين إلى الشامِ ومنه، والموضعُ الذي تَرَك فيه ابنَه يُقتَل ولم يُسلِّم ودائعَ امرئ القيس."},"khaybar":{"name":"خيبر","blurb":"واحةُ نخلٍ على حَرّةٍ سوداءَ فيها سُكنى يهود. وكان «خَرابُها» نحوَ سنة 105م لا يزال مَبدأَ تأريخٍ محليٍّ سنةَ 568."},"dumat-al-jandal":{"name":"دومة الجندل","blurb":"واحةُ مُلتقى الطُّرُقِ في آخر وادي السِّرحان، وسوقٌ سنويةٌ كانت سيادتُها متنازَعةً بين عملاء بيزنطةَ وعملاءِ فارس، وأسواقُها معروفةٌ بالرِّقّ. وفيها كان صنمُ وَدّ، ووُجدت قريبًا منها خَربَشةٌ نصرانيةٌ بالعربية من سنة 548/9. وبنو كلبٍ هم القبيلةُ الغالبةُ بها، فهي مُلتقى الطُّرُقِ الدراميُّ الطبيعيُّ للفترة."},"wadi-sirhan":{"name":"وادي السرحان","blurb":"المُنخَفَضُ الطويلُ الذي يَحمِل الطريقَ من الخليجِ وداخلِ الجزيرةِ صاعدًا إلى جنوب الشام."},"ruwafa":{"name":"روافة","blurb":"أطلالُ معبدٍ دُشِّن سنةَ 165–169 على يد «ثمودِ رُباثو» بعَونٍ روميّ — وهو الدليلُ القاطعُ على أنّ القومَ الذين يَعدّهم القرآنُ بائدين كانوا يَخدِمون في وحداتٍ مساعدةٍ رومية."},"yathrib":{"name":"يثرب","blurb":"بَسطةٌ من الآطامِ المُحصَّنةِ وحوائطِ النخل، في يد الأوسِ والخزرجِ إلى جانب ثلاثِ قبائلَ يهودية، مُنهَكةٌ بقرنٍ من الثَّأرِ سنةَ 617."},"buath":{"name":"بُعاث","blurb":"المَيدانُ قربَ المدينةِ الذي غَلَبت فيه الأوسُ الخزرجَ في آخر قتالٍ قبل الإسلام. وموضعُه بالنسبةِ إلى الواحةِ لا تُعطيه المصادرُ على التحقيق."},"mecca":{"name":"مكة","blurb":"بلدةُ بيتٍ حَرامٍ في وادٍ جافّ، تُدِيرها بطونُ قريشٍ حولَ الكعبةِ وأصنامها. ولا نقشَ ولا حَفرَ ولا وثيقةَ خارجيةَ لمكّةَ قبل 632 — فكلُّ ما فيها أدبيّ."},"arafat":{"name":"عرفات","blurb":"السهلُ خارجَ حَرَمِ مكّةَ يقف فيه الحاجُّ مُتعبِّدًا — وكان حُمْسُ قريشٍ يَرفُضون أن يَخرُجوا من حَرَمهم إليه."},"mina":{"name":"منى","blurb":"الواديُ الذي يَنحَر فيه الحاجّ، وفيه تُعَدّ أيامُ التشريقِ بعد العاشرِ من ذي الحِجّة."},"taif":{"name":"الطائف","blurb":"بلدةٌ باردةٌ مُسوَّرةٌ ذاتُ ثمارٍ فوقَ مكّة، دارُ ثقيفٍ وموضعُ صخرةِ اللاتِ المُربَّعة، وغريمةُ مكّةَ التِّجاريةُ على طريق اليمن."},"ukaz":{"name":"عكاظ","blurb":"السوقُ الكبرى بين نخلةَ والطائف، تَقوم واحدًا وعشرين يومًا كلَّ سنةٍ في ذي القَعدةِ قبل الحجّ. تجارةٌ، وأحلاف، وخصومات، ومُسابَقات، وشِعرٌ يُنشَد — وهي الأرضُ التي سُفِك عليها أكثرُ دم الفِجار. وفي المصادر العربية أنّها في سهلٍ منبسطٍ على ثلاث ليالٍ من مكّةَ وليلةٍ من الطائف."},"majanna":{"name":"مجنة","blurb":"سوقٌ تَقوم قربَ مكّةَ في موسم عكاظَ نفسِه وتُنافِسها. وموضعُها غيرُ مُثبَت."},"dhu-al-majaz":{"name":"ذو المجاز","blurb":"ثالثةُ أسواقِ موسمِ مكّة، تَقوم قريبًا من مَناسكِ الحجّ. وموضعُها غيرُ مُثبَت."},"nakhla":{"name":"نخلة","blurb":"وادٍ في جهة مكّةَ والطائفِ حَمَلت فيه هوازنُ على قريشٍ وكنانةَ فنَجَوا إلى الحَرَمِ عند الليل."},"shamta":{"name":"شمطة","blurb":"مَيدانٌ من الفِجارِ قربَ عكاظ، والغلبُ فيه لهوازن."},"al-abla":{"name":"العبلاء","blurb":"مَيدانٌ من الفِجارِ في عكاظَ نفسِها، والغلبُ فيه لهوازن."},"al-hurayra":{"name":"الحريرة","blurb":"أرضُ حَرّةٍ قربَ عكاظَ قُوتِل فيها يومُ الفِجارِ الثامنُ والأخير."},"al-mushallal":{"name":"المشلل","blurb":"مَعبدُ مَناةَ الساحليُّ بين المدينةِ ومكّة، تَحلِق عنده الأوسُ والخزرجُ رؤوسَها، ولا يَعُدّون حَجًّا تامًّا من غيره."},"nakhlat-al-shamiyya":{"name":"نخلة الشامية","blurb":"واديُ حُراضٍ على طريق مكّةَ والعراق، وفيه كان للعُزّى ثلاثُ شَجَرات، وبيتٌ يُسمّى بُسًّا يُستقسَم فيه، وشِعبٌ حَرام، ومَنحَرٌ للذَّبح."},"hudhayl-country":{"name":"رهاط","blurb":"مَقَرُّ صنمِ سُواع، في بلاد هُذَيلٍ قربَ يَنبُع، وسَدَنتُه بنو لِحيان."},"tabala":{"name":"تبالة","blurb":"كُتلةُ المَرو البيضاءُ المسمّاةُ ذا الخَلَصة، الكعبةَ اليمانية، على الطريق بين مكّةَ وصنعاء. وكان الثأرُ يُقضى عندها بثلاثة قِداحٍ: الآمرِ والناهيِ والمُتربِّص."},"jurash":{"name":"جرش","blurb":"بلدةٌ في مُرتفَعاتِ الجنوبِ كان أهلُها يَحفَظون الإلهَ يَغوثَ، وهو مُسمًّى في الشعرِ ولا نقشَ فيه ألبتّة."},"najran":{"name":"نجران","blurb":"مدينةُ واحةٍ غنيّةٌ على طريق اليمنِ والحجاز، نصرانيةٌ في القرن السادس، فيها مَشهدٌ يُسمّى كعبةَ نجرانَ جَذَب الحاجَّ أربعين سنة. وفي 523 ذُبِح نصارى أهلها."},"hima":{"name":"حمى","blurb":"موضعُ آبارٍ ونقوشٍ صخريةٍ نحوَ تسعين كيلومترًا شمالَ نجران، فيه أقدمُ النقوشِ العربيةِ قديمةِ الخطِّ المؤرَّخةِ تأريخًا دقيقًا — سنةَ 470 وسنةَ 513 — وعِدّةٌ منها نصرانيةٌ منقوشةٌ بصُلبانٍ كبيرةٍ مُزخرَفة."},"marib":{"name":"مأرب","blurb":"عاصمةُ سبأٍ القديمةُ في واحتها المصنوعة، طينٌ مَبنيٌّ طبقاتٍ فوق شبكةِ قَنوات، والسدُّ فوقها، وفيها كنيسةٌ بُنيت في عشرينيات القرن السادس."},"marib-dam":{"name":"سد مأرب","blurb":"سَدٌّ من تُرابٍ وحَجَرٍ عُلوُّه أربعةَ عشرَ مترًا، له مَفايضُ ومَصارف، يُخفِق إخفاقًا مَرئيًّا على طول القرن السادس: انبثاقاتٌ في 449 و450 و542 و548، وترميماتٌ في 450 و557، ثمّ طَفحٌ نحوَ 570 لم يُرمِّمه أحد. والمصادر العربية تَذكُر أربعةَ انهياراتٍ على الأقلّ بحسب التنقيبات، آخرُها سنةَ 575."},"awwam":{"name":"محرم بلقيس","blurb":"أكبرُ مُجمَّعِ معبدٍ في جنوب الجزيرة، بيتُ المَقَه، له سُورٌ بَيضيٌّ دائرتُه سبعُ مئةٍ وسبعةٌ وخمسون مترًا، ومَجرى ماءٍ من مَرمَر، ومَنامٌ يُستقسَم به، ونحوُ عشرين ألفَ قبرٍ إلى جانبه. هُجِر في القرن الرابع. وحُفِر فلم يُوجَد فيه ما يَصِله ببلقيس."},"sirwah":{"name":"صرواح","blurb":"مَعبدٌ للمَقَه غربَ مأربَ فيه نقوشٌ ضَخمةٌ — ومنها كُتلةٌ من سبعة أطنانٍ سقطت من قاعدتها في زلزال."},"baraqish":{"name":"براقش","blurb":"بلدةٌ مَعينيّةٌ مُسوَّرةٌ فيها معبدٌ بستّةَ عشرَ عمودًا مُتَّصلٌ بعَثتَر، ومَذابحُ على طرفَيها رؤوسُ ثِيران."},"sanaa":{"name":"صنعاء","blurb":"مدينةُ المُرتفَعاتِ التي سَبَقت ظَفارَ مَقَرًّا للحُكم، حاصرها الفرسُ سنةَ 570 فصارت عاصمةَ اليمنِ الساسانيّ بعدَها."},"zafar":{"name":"ظفار","blurb":"عاصمةُ حِمْيَرَ الملكيةُ في مُرتفَعاتِ الجنوب، ومنها حَكَم ملوكُ سبأٍ وذي رَيدان قبل أن يَنتقِل مَركَزُ الثِّقَلِ شمالًا إلى صنعاء."},"naiit":{"name":"ناعط","blurb":"موضعٌ في المُرتفَعاتِ نحوَ خمسين كيلومترًا شمالَ صنعاء. منه نقشٌ ناقصٌ لأبرهةَ نُشر سنةَ 2025، وسطرُه الخامسُ قد يُقرأ فيه «الفيول» وقد لا يُقرأ."},"murayghan":{"name":"مريغان","blurb":"الموضعُ الذي نُقِشت فيه نقوشُ حملةِ أبرهةَ الشمالية، ومنها المؤرَّخُ بسنة 552 الذي يُسجِّل غارتَه الرابعةَ على مَعدٍّ ولا يَذكُر مكّةَ قطّ. والمصادر العربية لا تَذكُر نقوشَ مريغانَ ألبتّة."},"aksum":{"name":"أكسوم","blurb":"عاصمةُ الحبشةِ النصرانيةِ عَبْرَ البحر الأحمر، غزت اليمنَ في عشرينيات القرن السادس، ثمّ انحاز جُندُها إلى أبرهةَ فبَقَوا."},"adulis":{"name":"عدوليس","blurb":"ميناءُ أكسومَ على البحر الأحمر، ومنه عَبَرت الأساطيلُ إلى اليمن."},"hadramawt":{"name":"حضرموت","blurb":"أرضُ الوِديانِ الجنوبيةِ الطويلة، بلادُ الإله سَيين، وإليها انسحبت كندةُ لمّا انهار سُلطانُها بنجد. والمصادر العربية لا تُثبِت تلك المُهاجَرةَ حدثًا تاريخيًّا، وإنّما تقول إنّ كندةَ ومذحجًا قاتلتا الحضارمَ في عهد الحميريّين."},"qaryat-al-faw":{"name":"قرية الفاو","blurb":"مدينةُ قوافلَ على حاشية الربع الخالي، فيها خمسةُ معابدَ وسبعةَ عشرَ بئرًا أو أكثر، وفيها الصُّوَرُ الآدميةُ المرسومةُ الوحيدةُ من داخل الجزيرة — مُتَّكِئون، وسُوّاقُ إبل، وأغصانُ عِنَبٍ بالأبيضِ والمَغرةِ والأحمرِ والأسود. هُجِرت نحوَ القرن الخامسِ لمّا نَفَد ماؤها. وتُعرَف في النقوش بـ«قرية كاهل»، وكاهلٌ أكبرُ آلهةِ كندةَ ومذحج."},"shib-jabala":{"name":"شعب جبلة","blurb":"شِعبُ جبلٍ منقطعٌ في بلاد بني عامر، يُقال إنّه نحوَ مائةٍ وخمسين كيلومترًا جنوبَ عنيزة، وفيه كُسِر سُلطانُ كندةَ في شمال الجزيرة. والموضعُ نفسُه غيرُ مُعيَّن."},"unayza":{"name":"عنيزة","blurb":"مَنزِلٌ بنجدٍ تَستعمِله المصادرُ عَلَمًا يُقاس منه موضعُ شعب جبلة."},"najd":{"name":"نجد","blurb":"الهَضبةُ الوسطى: سُهولُ حَصًى، ورملٌ أحمر، وآبارٌ متفرّقة، وبلادُ القبائلِ التي قُوتِل فيها كلُّ يومٍ مُسمًّى من أيام العربِ تقريبًا."},"al-yamama":{"name":"اليمامة","blurb":"جنوبُ شرقِ نجد، بلادُ بني حنيفة — زُرّاعٌ مُستقِرّون لهم حوائطُ نخلٍ وحقولُ حِنطةٍ يُمِدّون مكّةَ بالمِيرة، لا نَوَمة."},"hajar-yamama":{"name":"هجر","blurb":"بلدةُ اليمامةِ الكبرى ومَقَرُّ عاملها. وموضعُها غيرُ مُثبَتٍ على التحقيق."},"falj":{"name":"فلج","blurb":"واديُ آبارٍ باليمامة، فيه كان أولُ قتالِ حربِ البسوسِ بعنيزة، وفيه أعلن مسيلمةُ بعد ذلك أنّه نبيّ."},"hajar-bahrayn":{"name":"هجر البحرين","blurb":"مَقَرُّ شرقِ الجزيرةِ من الواحاتِ تحت سُلطان المناذرةِ والساسانيّين، له أسقفٌ في سجلّات المجامعِ من سنة 410 فصاعدًا."},"al-mushaqqar":{"name":"المشقر","blurb":"حصنٌ بهَجَرِ البحرين، استدرج فيه قائدٌ فارسيٌّ وعميلُ كسرى باليمامةِ بني تميمٍ بوَعدِ مِيرة، فقَتَلوهم جماعاتٍ صغيرة، ثمّ أغلقوا الأبوابَ على من بقي. وغيرُ مُعيَّنِ الموضع."},"bahrayn":{"name":"البحرين","blurb":"ولايةُ الساحلِ الشرقيّ — واحاتُ نخلٍ، ومَغاصاتُ لؤلؤ، ووالٍ فارسيّ، وأسقفيّاتٌ نسطوريةٌ متفرّقة."},"mashmahig":{"name":"مشماهيج","blurb":"كُرسيٌّ جزيريٌّ لكنيسة المشرقِ في الخليج، مُسمًّى في المجامعِ من سنة 410."},"darayn":{"name":"دارين","blurb":"ميناءُ جزيرةٍ في الخليجِ وأسقفيّةٌ على طريق التجارةِ الشرقي."},"suhar":{"name":"صحار","blurb":"ميناءُ عُمانَ الأكبر، يَنظُر شرقًا إلى الهندِ وشمالًا إلى الخليج."},"hormuz":{"name":"هرمز","blurb":"الجانبُ الفارسيُّ من المَضيق، ومنه يَنفُذ شَحنُ الخليجِ كلُّه."},"fulayj":{"name":"فليج","blurb":"حصنٌ ساسانيٌّ متأخّرٌ على ساحل عُمان — وهو أصلبُ دليلٍ أثريٍّ على حُضورٍ عسكريٍّ فارسيٍّ في الجزيرة."},"oman":{"name":"مزون","blurb":"الولايةُ الساسانيةُ في الجنوب الشرقي، ولها أبرشيّتُها النصرانيةُ: بيتُ مَزونايي."},"hail":{"name":"حائل","blurb":"الواحةُ تحت جبلَي طيءٍ التوأمَين، يُروى أنّ عنترةَ مات فيها وأنّ حاتمًا دُفن بها."},"tuwarin":{"name":"توارن","blurb":"مَدفَنُ حاتمٍ الطائيِّ قربَ حائل، وإن كانت رواياتٌ أخرى تضع قبرَه في موضعٍ آخر."},"qusayba":{"name":"القصيبة","blurb":"موضعٌ في القَصيمِ يُعطى مَولدًا لعنترة."},"wadi-abqar":{"name":"وادي عبقر","blurb":"وادٍ عميقٌ بنجدٍ كان الشعراءُ يقولون إنّ مَن نام فيه قد يَزوره جنّيٌّ يُلقي عليه الشِّعر. ولا شيءَ يُؤكِّد أنّه كان موضعًا حقيقيًّا يُعيَّن."},"sarawat":{"name":"السروات","blurb":"عمودُ الجبالِ الغربيّ، أبردُ من السهولِ وأرطبُ، تَختفي فيه عُصَبُ الصعاليكِ وتَسرَح الأزدُ وخَثعَم."},"khazaz":{"name":"خزاز","blurb":"جبلٌ على الطريق بين البصرةِ ومكّة، قريبٌ من أَمَرةَ على يسار الطريق، خلفَه صحراءُ مَنعِجٍ وتَهُبّ عليه ريحٌ من كُورٍ وكُوَير. أوقدت عليه مَعدٌّ النارَ ثلاثَ ليالٍ وامتنعت أن تُؤكَل من أهل اليمن."},"al-kulab":{"name":"الكلاب","blurb":"ماءٌ بين الكوفةِ والبصرة، يُذكَر بـ«أحجارِ الكلاب»، نادى عنده ابنان لمَلِكِ كندةَ كلٌّ منهما بمائةٍ من الإبلِ في رأس أخيه."},"rahrahan":{"name":"رحرحان","blurb":"أرضُ قتالٍ عند «أدنى مياهِ بني دارم» بنجد، أُسر فيها مَعبَدُ بن زرارةَ فمات أسيرًا. ولا تُسمّي المصادرُ موضعًا بعينه وتختلف في الغالب؛ ولا يُستعمَل الاسمُ في داخل السَّردِ بل عنوانًا للباب."},"dhi-najab":{"name":"ذو نجب","blurb":"الموضعُ الذي ثأرت فيه يَربوعُ تميمٍ بعد شعب جبلةَ بعام."},"al-habaa":{"name":"الهباءة","blurb":"بئرٌ في بلاد فزارة، ومركزُ حربِ داحسٍ الدراميّ: قتالٌ من الغداةِ إلى نصف النهارِ في حرّ الصيف، وأَيمانٌ ودُعاءٌ على حرف الماء، وجسدٌ مُمثَّلٌ به."},"dhu-husa":{"name":"ذو حسى","blurb":"الانكسارُ الواضحُ الوحيد الذي أصاب عبسًا في تسلسل داحس، وكان لا يزال يُرمى به عبسٌ في الشعر بعد جيل."},"al-muraqqab":{"name":"المريقب","blurb":"أولُ أيامِ قائمةِ داحسٍ المُرتَّبة، لعبسٍ على فزارة."},"al-faruq":{"name":"الفروق","blurb":"يومٌ غَلَبت فيه عبسٌ قائدًا كِنديًّا وأهلَ هَجَر — وإن كانت قائمةٌ أخرى تَجعله يومَ قيسٍ على تميمٍ لا غير."},"al-raqam":{"name":"الرقم","blurb":"مُدرَجٌ داخلَ دورة داحسٍ وهو في الحقيقة لغطفانَ على بني عامر — اسمُ يومٍ زاح عن موضعه."},"araair":{"name":"عراعر","blurb":"يومٌ لا تتّفق المصادرُ مَن المغلوبُ فيه: روايةٌ تَقتُل فيه سيّدَ كلب، وأخرى تَجعل فزارةَ تَغلِب عبسًا."},"al-nahy":{"name":"النهي","blurb":"ماءٌ وبه بنو شيبان، وأولُ أيامِ حربِ البسوسِ الكبرى أو ثانيها على حسبِ ما تأخذ من المصادر."},"al-dhanaib":{"name":"الذنائب","blurb":"يُسمّى أعظمَ وقعةٍ في حرب البسوس. ومصدرٌ يَستعمِل الاسمَ نفسَه للموضعِ الذي طَعَن فيه جسّاسٌ كُليبًا."},"waridat":{"name":"واردات","blurb":"قتلٌ في بكر، واليومُ الذي وقف فيه المهلهلُ على جسدِ همّامِ بن مرّةَ فرَثى عدوَّه."},"al-qusaybat":{"name":"القصيبات","blurb":"إصابةٌ من الشِّدّةِ بحيث ظنّت بكرٌ أنّها لن تَستقيل منها — وإن كان مصدرٌ يَقلِب النتيجة."},"quda":{"name":"قضة","blurb":"ويُسمّى تَحلاقَ اللِّمَم: حلقت بكرٌ رؤوسَها ليَتعارَفوا، وخرجت نساؤهم بين الجَرحى بالماءِ والهَراوى."},"al-fusayl":{"name":"الفصيل","blurb":"آخرُ أيامِ حربِ البسوس، مُسمًّى بالفصيل — وهو عينُ ما يُروى أنّ قتلَه بَدَأ الحرب."},"ayn-ubagh":{"name":"عين أباغ","blurb":"عينٌ بذاتِ الخِيار، في البادية بين الشامِ والعراق، قُتل عندها المنذرُ بن ماء السماءِ وكُسِر جيشُه."},"al-sullan":{"name":"السلان","blurb":"وادٍ فيه ماءٌ وحَلْفاءُ بتهامةَ إلى جانب جبل خَزاز، على وصف ياقوت. وثمّ يومان بهذا الاسم والمصادر تَخلِط بينهما خلطًا دائمًا؛ والثاني قُوتِل في وادٍ آخرَ لبني عمرو بن تميم، ويُسمّى أيضًا يومَ السُّوبانِ وقاعَ القُرَيتَين."},"al-nisar":{"name":"النسار","blurb":"يومٌ لضَبّةَ وبني تميم، لم يَبقَ منه إلّا مَدخلُ فهرسٍ في قائمتَين وسيطتَين."},"tikhfa":{"name":"طخفة","blurb":"الموضعُ الذي غَلَبت فيه بنو يَربوعٍ مَلِكًا لخميًّا — والمصادر تختلف أكان الأبَ أم الابن."},"awara":{"name":"أوارة","blurb":"يومان بالاسم نفسِه: أحدُهما على بكرٍ في عهد المنذر بن ماء السماء، والثاني على تميمٍ في عهد ابنه عمرو بن هند."},"hiraa":{"name":"غار حراء","blurb":"غارٌ قربَ قِمّةِ تلٍّ شديدِ الانحدارِ نحوَ ثلاثةِ كيلومتراتٍ شمالَ شرقِ حَرَمِ مكّة. والروايةُ تَجعل محمدًا يَخلو فيه مُدَدًا قبل أن يبدأ الوحي، وذلك يوافق التَّحنُّثَ الذي تَرويه السِّيرةُ عن مكّيّينَ آخرين أيضًا."},"al-hanw":{"name":"الحَنْو","blurb":"يومٌ من حرب البسوسِ يُسمّيه ابنُ الأثير وأسقطته النسخةُ الإنجليزيةُ ألبتّة. ولا يُعطيه موضعًا؛ والنقطةُ على الخريطةِ لا تفعل إلّا أن تَحمِله بين سائر أيام الحرب. والأعشى يَستعمِل الاسمَ نفسَه — «معركةَ الحِنو» — لذي قار، فالاسمُ مُعادُ الاستعمال."},"al-naqiyya":{"name":"النَّقِيّة","blurb":"يومٌ آخرُ من البسوسِ يُسمّيه ابنُ الأثير وهو غائبٌ عن النسخة الإنجليزية. ولا موضعَ له في أيّ مصدر؛ والنقطةُ لا تحمل إلّا موضعَه في التسلسل."}},"tribes":{"bakr":{"name":"بكر بن وائل","blurb":"حِلفٌ يَمتدّ من جنوب غربِ العراقِ إلى شرق الجزيرة، وشَيبانُ أشدُّ بطونه. أربعون سنةَ حربٍ مع تغلبَ على ناقة، ثمّ هي القبيلةُ التي غَلَبت رَتْلًا فارسيًّا بذي قارٍ فذُكِرت به."},"taghlib":{"name":"تغلب","blurb":"قومُ كُليبٍ والمهلهل، غَلَبوا في كلّ يومٍ كبيرٍ من حرب البسوسِ إلى أن قَتَل قائدُ حربهم رسولَ صُلح، فغُلِبوا في كلّ يومٍ بعده. تنصَّروا وتفرَّقوا في الجزيرةِ وجنوبِ العراق، وتُفسِّر حكايةُ الحربِ ذلك هزيمةً، والأغلبُ أنّه ليس كذلك."},"abs":{"name":"بنو عبس","blurb":"قبيلةُ عنترةَ وقيسِ بن زهير، وعبسُ أربعين سنةً من القتلِ مع ذبيانَ على سباقٍ مَغشوش. وقد خَرَج بعضُهم من ذلك ليَحرُسوا لطائمَ المناذرة، وهو عينُ التفصيلِ الذي يُخرِّب تواريخَ الحربِ المُواضَعَ عليها."},"dhubyan":{"name":"ذبيان وفزارة","blurb":"قومُ حذيفةَ بن بدرٍ من غطفان، وأعداءُ عبسٍ في الثأر الطويل. وبالهباءةِ فَقَدوا نحوَ أربعِ مئةِ رجلٍ في غَداةٍ واحدةٍ وسمّوا اليومَ «البَوار»."},"tamim":{"name":"بنو تميم","blurb":"قبيلةٌ عظيمةُ الكِثرةِ في شمال شرقِ الجزيرة، ومن بطونها دارمٌ ويَربوع. قاتلت كلَّ أحدٍ تقريبًا — بكرًا، وعامرًا، ومذحجًا، والمناذرة، والفرسَ بالمشقَّر — واتُّهمت بعد زمانٍ طويلٍ بوَأد البناتِ على يد خُصومها السياسيّين."},"asad":{"name":"بنو أسد","blurb":"القبيلةُ التي قَتَلت حُجرًا فأشعلت أشهرَ رحلةِ ثأرٍ في الشعر العربي. وهي أيضًا قبيلةُ عَبيدِ بن الأبرص، شاعرٌ معاصرٌ للرجلِ الذي جاء يَطلُب ثأرَ أبيه منهم."},"tayyi":{"name":"طيء","blurb":"القبيلةُ تحت الجبلَين التوأمَين بحائل، قومُ حاتم، لها ذِكرٌ بالكرمِ بُني على رجلٍ واحد. ومنهم أيضًا السيّدُ الذي سلَّمه كسرى الحيرةَ سنةَ 602."},"ghatafan":{"name":"غطفان","blurb":"الجمعُ الأكبرُ فوقَ ذبيانَ وفزارةَ وعبس، فأكثرُ حربِ داحسٍ داخليٌّ فيها. وخَرَجت غطفانُ من الفِجارِ في جانب قيس."},"hawazin":{"name":"هوازن","blurb":"الحِلفُ الذي غَلَب في أربعةٍ من أيام الفِجارِ على قريشٍ وخَسِر يومًا واحدًا. وتحتها بنو عامرٍ وثقيف، وتحتها لبيد."},"amir":{"name":"بنو عامر بن صعصعة","blurb":"أكبرُ بطونِ هوازن، وتحتها كِلابٌ وكعبٌ وجعفر. غالِبةُ شعب جبلة، وسالِبةُ اللطائمِ بالسلّان، وطَرَفٌ في نصف أيام نجد."},"kinda-tribe":{"name":"كندة","blurb":"أصلُها من جنوب الجزيرةِ وانتقلت شمالًا إلى نجدٍ في القرن الرابعِ أو الخامس، فصيَّر تَكليفٌ حِمْيَريٌّ ساداتَها ملوكًا على النَّوَمة. وهي بيتُ امرئ القيس. وبعد شعب جبلةَ انسحب كثيرٌ منها إلى حضرموت — على أنّ المصادر العربية لا تُثبِت تلك المُهاجَرةَ حدثًا تاريخيًّا."},"quraysh-tribe":{"name":"قريش","blurb":"بطونُ حَرَمِ مكّة، مُنقسِمةٌ إلى الأحلافِ والمطيَّبين، وإلى قريشِ البِطاحِ حولَ الكعبةِ وقريشِ الظواهرِ في أطرافها. تُجّارُ قوافلَ لهم أحلافٌ مُبتاعةٌ من بَدَوِ الطريق."},"aws":{"name":"أوس","blurb":"إحدى قبيلتَي يثربَ العربيّتَين، حَليفةُ قُرَيظةَ والنَّضيرِ من اليهود، والغالبةُ ببُعاث."},"khazraj":{"name":"خزرج","blurb":"قبيلةُ يثربَ العربيةُ الأخرى، حَليفةُ قَينُقاع. وقَتلُ سيّدها رُهُنَ اليهودِ هو الذي دَفَع القبيلتَين اليهوديّتَين الأخريَين إلى الجانب المقابلِ فأذهب عنه اليومَ وحياتَه."},"hudhayl":{"name":"هذيل","blurb":"قبيلةٌ حِجازيةٌ في جبال مكّة، سَدَنةُ صنمِ سُواع، وهم القومُ الذين أمضى تأبّطَ شرًّا عُمرَه يُغير عليهم ومات يُغير عليهم."},"hanifa":{"name":"بنو حنيفة","blurb":"زُرّاعٌ مُستقِرّون باليمامةِ لهم حوائطُ نخلٍ وحقولُ حِنطة، يُمِدّون مكّةَ بالمِيرةِ ويُرسِلون إليها صُنّاعًا مَهَرة. ليسوا نَوَمةً ألبتّة — ومُسافِروهم هم المُسجَّلون يَستجيرون بجنِّ الواديِ في المَرّ."},"madhhij":{"name":"مذحج","blurb":"جمعٌ جنوبيٌّ كبير، سِيق إلى أبواب نجرانَ في نقش 328 وكان لا يزال يُقاتِل تميمًا بالكلابِ بعد ذلك بثلاثة قرونٍ تقريبًا. وأنهى المهلهلُ عُمرَه مُتزوِّجًا في بطنٍ من بطونها."},"azd":{"name":"أزد","blurb":"كِثرةٌ قبَليّةٌ جنوبيةٌ تُفسِّر الأنسابُ تفرُّقَها شمالًا بإخفاق سدّ مأرب — وهي حكايةٌ تَجعل جدًّا من القرن الثاني على رأسِ سَيلٍ من القرن السادس، وتَعمَل عملًا تَعليليًّا حقيقيًّا في بيان كيف صارت قبائلُ يمنيّةُ النَّسَبِ في الشامِ ومكّةَ والمدينة."},"judham":{"name":"جذام","blurb":"قبيلةٌ في مَشارفِ الشمال الغربيِّ بين الحجازِ والتُّخمِ الرومي، في مَدار عملاءِ بيزنطة."},"kalb":{"name":"بنو كلب","blurb":"القبيلةُ الغالبةُ بدومة الجندلِ وعلى مَمَرّ وادي السِّرحان، سَدَنةُ صنمِ وَدّ، وقبيلةٌ يَظهَر رجالُها في الجانبَين الإمبراطوريَّين كلَيهما — ومنهم قائدُ جيشٍ لخميّ، ومنهم قاتلٌ مُحتمَلٌ لمَلِكٍ كِنديّ."},"iyad":{"name":"إياد","blurb":"قبيلةٌ في شمال الجزيرةِ في مَدار المناذرة، حَضَرت أعوانًا للفرسِ بذي قار، وهي قبيلةُ الخطيبِ الذي قام بعكاظَ فتكلَّم في إلهٍ واحد. والمصادر العربية تَزيد أنّها انسحبت بذي قارٍ باتّفاقٍ سرّيٍّ مع بني بكر."},"qudaa":{"name":"قضاعة","blurb":"جمعٌ شماليٌّ كبيرٌ يَمتدّ على حَواشي بادية الشام، وكلبٌ من بطونه، وهو خصمُ كندةَ في أقدمِ ما يُذكَر من أيام العرب."},"thaqif":{"name":"ثقيف","blurb":"قبيلةُ الطائف، سَدَنةُ صخرةِ اللاتِ المُربَّعة، غريمةُ مكّةَ في التجارةِ وحَليفتُها في الفِجار."},"khuzaa":{"name":"خزاعة","blurb":"قبيلةٌ حِجازيةٌ أمسكت حَرَمَ مكّةَ قبل قريش، وتَنسِب إليها الروايةُ إدخالَ الأصنامِ التي كانت حولَ الكعبة."},"sulaym":{"name":"بنو سليم","blurb":"قبيلةُ الخنساء، وفي جانب هوازنَ في الفِجار، وهم القومُ الذين قَتَلت مُناوَشاتُهم مع مُرّةَ وأسدٍ أخوَيها كلَيهما فأخرجت ألفَ بيتٍ من الرِّثاء."},"shayban":{"name":"شيبان","blurb":"أشدُّ بطونِ بكر: عشيرةُ جسّاس، ومُحرِّكُ حربِ البسوس، ونَواةُ القوّةِ التي غَلَبت الفرسَ بذي قار."}},"polities":{"lakhmids":{"name":"اللخميون","blurb":"ملوكٌ عربٌ على حاشية بادية الجزيرةِ الفُراتية، عملاءُ فارس، يُمسِكون مدينةً نصرانيةً من قصورٍ وأديرةٍ وكُتّابٍ على رِزق. ولم يكن مَداهم حدًّا بل جَذبًا: تُجيبهم قبائلُ أسفلِ الفُراتِ وشرقِ الجزيرة، وكانت سَراياهم تَبلُغ مصرَ وتَنزِل إلى نجد. وأهلكهم خسرو الثاني سنةَ 602. وقائمةُ ملوكهم موضعُ الحَذَرِ الأكبر: ما قبل المنذر الثالثِ فضاءٌ روائيٌّ حُرّ، وما من 503 فصاعدًا مُقيَّدٌ سنةً سنة."},"ghassanids":{"name":"الغساسنة","blurb":"فيلارخةُ بيزنطةَ من العربِ بالشام: نصارى مونوفيزيّون عاصمتُهم معسكرُ خِيَمٍ ملكيّ، ومركزُهم الشَّعائريُّ مَشهدُ شهيدٍ في البادية، وكان مَلِكٌ منهم مرّةً أعلى في بروتوكول الإمبراطوريةِ من كلّ حاكمٍ أجنبيٍّ غيره. وكَسَرت بيزنطةُ الاتحادَ سنةَ 584 فلم تُعِده تامًّا قطّ. ولا يُوثَق منهم إلّا جَفنيّو القرن السادس؛ وقوائمُهم العربيةُ سبعةٌ وعشرون مَدخلًا بفتراتٍ متداخلةٍ صريحة تُشير إليها بـ«مع» و«و»، أي حُكمًا مشتركًا، وهذا أصدقُ من جدولٍ مُحكَمٍ متعاقِب."},"kinda":{"name":"مملكة كندة","blurb":"قوّةٌ فوق-قبَليّةٌ بنجدٍ راعيتُها حِمْيَر، أُقيمت لتَحكُم نَوَمةَ مَعدٍّ عن تاجٍ جنوبيّ. والمصادر العربية تؤرِّخ تأسيسَها بسنة 425، حين ولّى حسنُ بن عمرو بن تُبّاعٍ مَلِكُ حِمْيَرَ حُجرًا آكلَ المرارِ على مَعدّ، وتُعطي العهودَ على تَرتيبها — حُجر 425–458، وعمرو 458–489، والحارث 489–528 — حيث تقول المصادرُ الإنجليزيةُ صريحًا إنّها لم تجد عهودًا مؤرَّخة. وكان لها عَهدُ حُلفاءٍ بيزنطيٌّ وفيلارخيّةٌ بفلسطينَ في وقتٍ واحد، وهذا في أرجح الظنّ سببُ أنّها تفتَّتت أسرعَ من كلّ دولةٍ حاجزةٍ غيرها. وبعد غزو الحبشةِ لحِمْيَرَ سنةَ 525 تفرَّقت إلى ممالكَ صغيرةٍ سقطت واحدةً بعد أخرى بين 530 و540 بغاراتٍ عدنانيةٍ متتالية. وأفسد بنو ملوكِها ما بقي بينهم. والصوابُ أنّها قوّةٌ نجديّةٌ فوق-قبَليّةٌ لا عاصمةَ حَضَريّةَ لها مؤكَّدة."},"himyar":{"name":"حمير","blurb":"القوّةُ الوحيدةُ في الجزيرةِ التي لها تأريخٌ نقشيٌّ حقيقيّ. ملوكُ سبأٍ وذي رَيدان، مُوحِّدون رسميًّا من نحو 380 ويهودُ المذهبِ قرنًا ونصفًا بعد ذلك، يَبلُغون وسطَ الجزيرةِ بالعملاءِ ويَبلُغون واحةَ مأربَ المَسقيّةَ من السدِّ بأعمالٍ عامّةٍ لا تُصان إلّا بدولة."},"aksum":{"name":"أكسوم","blurb":"المملكةُ الحبشيةُ النصرانيةُ عَبْرَ البحر الأحمر، لها ميناءٌ على البحر، وأسطولٌ يَكفي لنَقل جيش، ودَعوى في جنوب الجزيرةِ أنفذتها في عشرينيات القرن السادس."},"aksumite-yemen":{"name":"اليمن الأكسومية","blurb":"خمسٌ وأربعون سنةً من الحكم الحبشيِّ في جنوب الجزيرة، أكثرُها تحت قائدٍ أخذ البلادَ من نائبِ مَلِكه هو. فقامت الكنائس، ورُمِّم السدُّ، والتقى رُسُلُ أربعِ دولٍ بمأربَ في غُرفةٍ واحدة، وخَرَجت الجيوشُ شمالًا إلى مَعدٍّ أربعَ مرّات. ثمّ يَسكُت السجلُّ النقشيّ، وبعد عشر سنينَ يَجيء الفرس."},"sasanian-yemen":{"name":"اليمن الساسانية","blurb":"أخذت فارسُ جنوبَ الجزيرةِ بحملةٍ صغيرةٍ وأمسكته نحوَ ستّين سنةً بملوكٍ تابعين ثمّ بولاة. ولم يُرمَّم السدُّ بعدَها قطّ."},"sasanians":{"name":"الإمبراطورية الساسانية","blurb":"الإمبراطوريةُ الشرقية، وتُخمُها الجنوبيُّ يَمُرّ بعملاءَ من العربِ لا بالحُصون: المناذرةُ على الفُرات، ووالٍ بالبحرين، وولايةٌ بعُمان، وحصنٌ على ساحلها، ومن سنة 570 يمنٌ مَفتوح."},"byzantines":{"name":"الإمبراطورية البيزنطية","blurb":"الإمبراطوريةُ الغربية، أمسكت تُخمَ بادية الشامِ بفيلارخةٍ من العرب، ودَفَعت لفارسَ ذهبًا أربعَ مرّاتٍ مُنفصِلةً لتَكُفّ عن القتال، ثمّ فكَّكت حاجزَها العربيَّ هي سنةَ 584 قُبَيل الحربِ التي أهلكت كلَّ شيء."},"quraysh":{"name":"قريش","blurb":"بطونٌ تُمسِك بلدةَ بيتٍ حَرامٍ في وادٍ جافّ، تُجري قوافلَ الشتاءِ جنوبًا إلى اليمنِ وقوافلَ الصيفِ شمالًا إلى غزّةَ وبُصرى ودمشق، وتَبتاع ضِياعًا في البلدةِ الأبردِ فوقَها وتَأخُذ تجارتَها. ولا نقشَ واحدًا ولا حَفرًا ولا وثيقةً خارجيةً لها قبل 632. وبحسب وات، كان لزعمائها نحو سنة 600 شِبهُ احتكارٍ للتجارة بين المحيط الهنديِّ والبحر المتوسط؛ ويقول بيترز في مقابل ذلك إنّ اقتصادَ مكّةَ في زمن قُصَيٍّ كان على الحَجِّ لا على التجارة."},"yathrib":{"name":"يثرب","blurb":"ليست مدينةً بل بَسطةٌ من الآطامِ المُحصَّنةِ وحوائطِ النخل، في يد قبيلتَين عربيّتَين وثلاثٍ يهوديةٍ في أحلافٍ مُتحوِّلة، تُنازَع عليها قرنًا حتى تَرَكت سنةُ 617 القبيلتَين العربيّتَين من الإنهاكِ بحيث ولَّتا حافظًا واحدًا للسِّلم."},"nabataean-legacy":{"name":"آثار الأنباط","blurb":"مملكةٌ انقضت سنةَ 106 وبقيت في المَشهد: واجهاتُ قبورٍ منقورةٌ بالبتراءِ والحِجر، ومَذابحُ عاليةٌ على القِمَم، وأنصابٌ في كُواها، وتأريخٌ لا يزال يُستعمَل سنةَ 568. وفي القرن السادسِ كانت قبورُ الحِجرِ تُقرأ بيوتَ أمّةٍ أهلكها الله."},"sasanian-bahrayn":{"name":"البحرين الساسانية","blurb":"الساحلُ الشرقيُّ تحت سيادةٍ فارسيةٍ وإدارةٍ لخميّة، وفيه أسقفيّاتٌ نسطوريةٌ متفرّقةٌ في الجُزُر، ووالٍ أعدم شاعرًا بكتابٍ من مَلِكٍ لخميّ."}}}</script>
<script>

const EV = {EPI:'Inscription-fixed',EXT:'External source',TRAD:'Later Arabic tradition',RECON:'Modern reconstruction'};
const HUES=['#c8713d','#3f9e8c','#6f7fc4','#a2689e','#8a9a4a','#b1524a','#4e95c0','#c09a3e','#7f8fa6','#9c6f4f','#5aa36d','#b07ab0','#6b93a8'];
(D.polities||[]).forEach((p,i)=>{p._c=HUES[i%HUES.length];});
const CATS = [...new Set(events.map(e=>e.category).filter(Boolean))].sort();

/* ---------- language ---------- */
const UIEN={ui:{
 brand:'Jāhiliyya Atlas', year:'Year', ce:'CE', play:'Play', pause:'Pause',

 language:'Language', back:'Back', source:'Source', disagree:'Where scholars disagree',
 proposedRange:'Could be anywhere in', kind:'Kind', coordinates:'Coordinates', span:'Span',
 seat:'Seat', role:'Role', tribe:'Tribe', dates:'Dates', dating:'Dating',
 rangeCentre:'Range centre', nothingMatches:'Nothing matches that.', events:'events', zones:'Zones'},
 evidence:{EPI:'Inscription-fixed',EXT:'External source',TRAD:'Later Arabic tradition',RECON:'Modern reconstruction'},

function dict(){ return (st.lang==='ar' && UIAR) ? UIAR : UIEN; }
function T(k){ const d=dict(); return (d.ui&&d.ui[k]) || UIEN.ui[k] || k; }
function Tg(group,k){ const d=dict(); return (d[group]&&d[group][k]) || (UIEN[group]&&UIEN[group][k]) || k; }
function isAr(){ return st.lang==='ar'; }
// Arabic prose for a record, falling back to the English while the translation is incomplete
function LOC(kind,o,field){
  if(isAr() && DAR && DAR[kind] && DAR[kind][o.id] && DAR[kind][o.id][field])
    return DAR[kind][o.id][field];
  return o[field];
}
function NAME(kind,o){
  const n=LOC(kind,o,kind==='events'?'title':'name');
  if(n && n!==o[kind==='events'?'title':'name']) return n;
  return (isAr() && o.ar) ? o.ar : (o.name||o.title);
}
function hasAr(){ return !!UIAR; }

/* ---------- icons ---------- */
const ICON={
 person:'<path d="M8 2.4a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2Zm5.2 11.4c0-3.1-2.5-4.8-5.2-4.8s-5.2 1.7-5.2 4.8Z"/>',

 city:'<path d="M1.8 14V7.4h4.4V4.2h3.6v3.2h4.4V14Z"/>',

};
const PKIND={capital:'capital',city:'city',town:'city',oasis:'oasis',shrine:'shrine',fair:'fair',
             battlefield:'battle',site:'site',region:'region'};
const TYPE={event:'Event',person:'Figure',place:'Place',tribe:'Tribe',polity:'Power'};
const TYPEK={event:'tabEvents',person:'tabPeople',place:'place',tribe:'tribe',polity:'powers'};
function TYPE2(k){ return isAr()? (dict().ui[TYPEK[k]]||TYPE[k]) : TYPE[k]; }
function altOf(kind,o){ const n=NAME(kind,o); const en=o.name||o.title; return isAr()? (n!==en?en:null) : (o.ar||null); }
function iconName(kind,o){
  if(kind==='place') return PKIND[o&&o.kind]||'site';
  return kind;
}
function ico(name,cls){
  return '<svg class="ic '+(cls||'')+'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'+(ICON[name]||ICON.site)+'</svg>';
}
function typeIco(kind,o){ return ico(iconName(kind,o),'ic-'+kind); }

/* ---------- name matching for cross-links ---------- */
function norm(x){return (x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[\u02BE\u02BF\u2018\u2019'`\u02BC]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
const tribeKeys=new Map();
(D.tribes||[]).forEach(t=>{
  const base=norm(t.name).replace(/^ban[uiy] /,'');
  const keys=new Set([base]);
  base.split(' ').forEach(w=>{ if(w.length>=4) keys.add(w); });
  tribeKeys.set(t.id,[...keys].filter(Boolean));
});
const evText=new Map(events.map(e=>[e.id,norm((e.title||'')+' '+(e.summary||''))]));
function hasKey(hay,keys){
  return keys.some(k=>k && new RegExp('(^| )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)').test(hay));
}
function tribeOfPerson(p){
  if(!p.tribe) return null;
  const n=norm(p.tribe);
  return (D.tribes||[]).find(t=>hasKey(n,tribeKeys.get(t.id))||hasKey(norm(t.name),[n]))||null;
}
const tribeMembers=new Map(), tribeEvents=new Map();
(D.tribes||[]).forEach(t=>{tribeMembers.set(t.id,[]);tribeEvents.set(t.id,[]);});
(D.people||[]).forEach(p=>{const t=tribeOfPerson(p); if(t) tribeMembers.get(t.id).push(p); p._tribe=t;});
events.forEach(e=>{
  const txt=evText.get(e.id);
  const viaPeople=new Set((e.peopleIds||[]).map(i=>personById.get(i)).filter(Boolean)
    .map(p=>p._tribe&&p._tribe.id).filter(Boolean));
  (D.tribes||[]).forEach(t=>{
    if(viaPeople.has(t.id)||hasKey(txt,tribeKeys.get(t.id))) tribeEvents.get(t.id).push(e);
  });
});
const placeEvents=new Map();
events.forEach(e=>{ if(!e.placeId) return;
  if(!placeEvents.has(e.placeId)) placeEvents.set(e.placeId,[]);
  placeEvents.get(e.placeId).push(e); });

/* ---------- projection ---------- */
const LON0=25, LAT_TOP=45, K=Math.cos(25*Math.PI/180), S=10;
const px = (lon,lat)=>[(lon-LON0)*K*S,(LAT_TOP-lat)*S];
const WORLD_W=(64-LON0)*K*S, WORLD_H=(LAT_TOP-4)*S;
const HOME=[31,10.5,61,38.5]; // default framing

const map = document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
function el(n,a){const e=document.createElementNS(NS,n);if(a)for(const k in a)e.setAttribute(k,a[k]);return e;}
function ring(pts){let d='M';for(let i=0;i<pts.length;i++){const q=px(pts[i][0],pts[i][1]);d+=(i?'L':'')+q[0].toFixed(1)+','+q[1].toFixed(1);}return d+'Z';}
function line(pts){let d='M';for(let i=0;i<pts.length;i++){const q=px(pts[i][0],pts[i][1]);d+=(i?'L':'')+q[0].toFixed(1)+','+q[1].toFixed(1);}return d;}
function kmToU(km,lat){ return km/111.32*S; }

function buildStatic(){
  layer.sea.appendChild(el('rect',{x:-50,y:-50,width:WORLD_W+100,height:WORLD_H+100,fill:'var(--sea)'}));
  GEO.land.forEach(p=>{
    const path = el('path',{d:ring(p.o),fill:'var(--land)',stroke:'var(--coast)','stroke-width':.35,'stroke-linejoin':'round'});
    layer.land.appendChild(path);
  });
  // deserts
  GEO.terrain.sands.forEach(s=>{
    layer.sands.appendChild(el('path',{d:ring(s.o),fill:'var(--sand)',stroke:'var(--sandline)','stroke-width':.25,opacity:.95}));
    layer.sands.appendChild(el('path',{d:ring(s.o),fill:'url(#sandpat)',stroke:'none'}));
  });
  // ranges
  GEO.terrain.ranges.forEach(r=>{
    layer.ranges.appendChild(el('path',{d:line(r.p),fill:'none',stroke:'var(--ridge)','stroke-width':r.w,
      'stroke-linecap':'round','stroke-linejoin':'round',opacity:.5}));
    layer.ranges.appendChild(el('path',{d:line(r.p),fill:'none',stroke:'var(--ridge)','stroke-width':r.w*.4,
      'stroke-linecap':'round','stroke-linejoin':'round',opacity:.75,'stroke-dasharray':'1.6 2.2'}));
  });
  GEO.rivers.forEach(r=>layer.rivers.appendChild(el('path',{d:line(r.p),fill:'none',stroke:'var(--river)','stroke-width':.55,'stroke-linecap':'round',opacity:.85})));
  GEO.lakes.forEach(l=>layer.lakes.appendChild(el('path',{d:ring(l.o),fill:'var(--sea)',stroke:'var(--river)','stroke-width':.3})));

}


function drawLabels(){
  const U = 1/st.view.s;
  layer.labels.textContent='';
  const L = layer.labels;
  const DZ=st.view.s/st.view.home;
  const DD=detail();
  if(!DD.names) return;
  // ridge names, set along the range
  GEO.terrain.ranges.forEach(r=>{
    if(!r.name) return;
    const mid=r.p[Math.floor(r.p.length/2)], a=r.p[0], b=r.p[r.p.length-1];
    const pa=px(a[0],a[1]), pb=px(b[0],b[1]);
    let rot=Math.atan2(pb[1]-pa[1],pb[0]-pa[0])*180/Math.PI;
    if(rot>90) rot-=180; if(rot<-90) rot+=180;
    const q=px(mid[0],mid[1]);
    if(DZ<1.6) return;
    const t=el('text',{x:q[0],y:q[1]-2.2*U,class:'lbl lbl-ridge','text-anchor':'middle',
      transform:`rotate(${rot.toFixed(1)} ${q[0]} ${q[1]})`});
    t.textContent=r.name; L.appendChild(t);
  });
  // region + sand-sea names
  const named=[];
  GEO.terrain.regions.forEach(([n,ar,lon,lat,tier])=>named.push([n,ar,lon,lat,tier]));
  GEO.terrain.sands.forEach(s=>named.push([s.name,s.ar,s.label[0],s.label[1],s.t||1]));
  named.forEach(([n,ar,lon,lat,tier])=>{
    if(tier===2 && (DD.small || DZ<1.3)) return;
    const q=px(lon,lat), cls='';
    if(st.script!=='arabic'||!ar){const t=el('text',{x:q[0],y:q[1],class:'lbl lbl-region'+cls,'text-anchor':'middle'});t.textContent=n;L.appendChild(t);}
    if(ar&&st.script!=='latin'&&(DD.sub||st.script==='arabic')){const yy=st.script==='arabic'?q[1]:q[1]+6.6*U;
      const a=el('text',{x:q[0],y:yy,class:'lbl lbl-region-ar'+cls,'text-anchor':'middle'});a.textContent=ar;L.appendChild(a);}
  });
  GEO.terrain.seas.forEach(([n,ar,lon,lat,rot])=>{
    const q=px(lon,lat);
    const g=el('g',{transform:`rotate(${rot} ${q[0]} ${q[1]})`});
    const t=el('text',{x:q[0],y:q[1],class:'lbl lbl-sea','text-anchor':'middle'});t.textContent=n;
    g.appendChild(t);
    if(ar&&st.script!=='latin'&&DD.sub){const a=el('text',{x:q[0],y:q[1]+6.4*U,class:'lbl lbl-sea-ar','text-anchor':'middle'});a.textContent=ar;g.appendChild(a);}
    L.appendChild(g);
  });

}

/* ---------- dynamic map ---------- */
function activeZone(p,y){
  if(!p.zones) return null;
  for(const z of p.zones){ if(y>=(z.from??-9999) && y<=(z.to??9999)) return z; }
  return null;
}
function evColor(e){return 'var(--'+(e.evidence||'TRAD').toLowerCase()+')';}

// Progressive disclosure. Far out the map shows only the big anchors as plain dots;
// zooming in brings on the lesser places, then the shape-coded symbols, then the labels.
const RANK_KIND={capital:0,city:1,oasis:2,fair:2,shrine:3,town:3,site:4,region:4,battlefield:2};
function detail(){
  const z=st.view.s/st.view.home;
  // a small map pane holds fewer labels, so every tier asks for more zoom
  const small = map.clientWidth<560 || map.clientHeight<430;
  // with a single layer showing there is room for more of it
  const k = (small?1.6:1) * (focusKind()?0.62:1);
  return {z, small,
    maxRank: z<0.95*k?0 : z<1.35*k?1 : z<1.9*k?2 : z<2.8*k?3 : 9,
    shapes:  z>=1.35*k,
    labelRank: z<1.35*k?-1 : z<1.9*k?0 : z<2.8*k?2 : 9,
    names:   !small || z>=0.98,     // region and sea names
    sub:     !small || z>=1.9,      // the Arabic second line under them
    polity:  !small || z>=1.25,
    tribe:   z>=(small?1.5:0.9)*(focusKind()==='tribes'?0.55:1)};
}

// Shape tells you what a pin is at a glance; the rings around it tell you how sure the location is.
function placeMark(g,kind,q,r,U){
  const F='var(--mapfg)', S2='var(--land)', sw=1.5*U;
  // a soft halo first, so a dark symbol still reads over sand and a light one over basalt
  g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r+2.2*U,fill:'var(--land)',opacity:.75}));
  if(kind==='dot'){
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r*.72,fill:F,stroke:S2,'stroke-width':sw*.7}));
    return;
  }
  if(kind==='battlefield'){
    g.appendChild(el('path',{d:`M${q[0]-r} ${q[1]-r}L${q[0]+r} ${q[1]+r}M${q[0]+r} ${q[1]-r}L${q[0]-r} ${q[1]+r}`,
      stroke:F,'stroke-width':1.7*U,'stroke-linecap':'round',fill:'none'}));
  } else if(kind==='fair'){
    g.appendChild(el('path',{d:`M${q[0]} ${q[1]-r*1.45}L${q[0]+r*1.3} ${q[1]+r}L${q[0]-r*1.3} ${q[1]+r}Z`,
      fill:F,stroke:S2,'stroke-width':sw,'stroke-linejoin':'round'}));
  } else if(kind==='shrine'){
    g.appendChild(el('rect',{x:q[0]-r*.95,y:q[1]-r*.95,width:r*1.9,height:r*1.9,fill:F,stroke:S2,'stroke-width':sw}));
  } else if(kind==='capital'){
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:F,stroke:S2,'stroke-width':sw}));
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r*.42,fill:S2}));
  } else if(kind==='oasis'){
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:'none',stroke:F,'stroke-width':r*.55}));
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r*.3,fill:F}));
  } else if(kind==='site'||kind==='region'){
    g.appendChild(el('rect',{x:q[0]-r*.9,y:q[1]-r*.9,width:r*1.8,height:r*1.8,
      fill:'none',stroke:F,'stroke-width':r*.5}));
  } else {
    g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:F,stroke:S2,'stroke-width':sw}));
  }
}

function drawDynamic(){
  const y=st.year;
  for(const k of ['polity','tribes','places','events','people','leaders']) if(layer[k]) layer[k].textContent='';
  drawLabels();
  const U=1/st.view.s;
  const DT=detail(), DTT=DT;

  // polities
  if(layerOn('polities')){
    (D.polities||[]).forEach(p=>{
      if(y<(p.from??-9999)||y>(p.to??9999)) return;
      const z=activeZone(p,y); if(!z) return;
      const g=el('g',{color:p._c});
      (z.centers||[]).forEach(c=>{
        const q=px(c.lon,c.lat), r=kmToU(c.r||200);
        g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:'url(#pg-'+p.id+')'}));
      });
      const c0=(z.centers||[])[0];
      if(c0 && DT.polity){const q=px(c0.lon,c0.lat);
        const t=el('text',{x:q[0],y:q[1]-kmToU(c0.r||200)*.66,class:'lbl lbl-polity','text-anchor':'middle',fill:p._c});
        t.textContent=(st.script==='arabic'&&p.ar)?p.ar:NAME('polities',p); g.appendChild(t);}
      layer.polity.appendChild(g);
    });
  }
  // tribes
  if(layerOn('tribes')){
    (D.tribes||[]).forEach(t=>{
      const q=px(t.lon,t.lat), r=kmToU(t.r||180);
      const selT = st.sel&&st.sel.kind==='tribe'&&st.sel.o.id===t.id;
      const g=el('g',{color:'var(--accent2)',class:'hit'});
      g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r*.5,fill:'transparent'}));
      g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:'url(#tribgrad)'}));
      if(selT){
        g.appendChild(el('circle',{cx:q[0],cy:q[1],r:r,fill:'none',stroke:'var(--accent)',
          'stroke-width':1.6*U,'stroke-dasharray':(5*U)+' '+(4*U),opacity:.95}));
        g.appendChild(el('circle',{cx:q[0],cy:q[1],r:2.6*U,fill:'var(--accent)'}));
      }
      if(DTT.tribe){
        const tx=el('text',{x:q[0],y:q[1],class:'lbl lbl-tribe','text-anchor':'middle'});
        tx.textContent=(st.script==='arabic'&&t.ar)?t.ar:NAME('tribes',t);
        g.appendChild(tx);
      }
      bind(g,{kind:'tribe',o:t});
      if(selT) layer.tribes.appendChild(g); else layer.tribes.insertBefore(g,layer.tribes.firstChild);
    });
  }

  // ---- collect every point marker, then push them apart before drawing ----
  const liveEv = visibleEvents();
  const hotPlaces = new Set(liveEv.map(e=>e.placeId).filter(Boolean));
  const marks=[];

  if(layerOn('places')){
    (D.places||[]).forEach(p=>{
      if(y<(p.from??-9999)||y>(p.to??9999)) return;
      if(p.kind==='battlefield' && !hotPlaces.has(p.id)) return;
      const rank = RANK_KIND[p.kind]??4;
      const isHot = hotPlaces.has(p.id);
      if(rank>DT.maxRank && !isHot) return;
      const q=px(p.lon,p.lat);
      const major = p.kind==='capital';
      marks.push({L:'places', ref:{kind:'place',o:p}, o:p, x0:q[0], y0:q[1], x:q[0], y:q[1],
        glyph: DT.shapes ? (PKIND[p.kind]||'site') : null,
        size: major?20:rank<=1?17.5:16,
        fill:'var(--mapfg)', ring:p.coordConfidence,
        label: ((DT.labelRank>=0 && rank<=DT.labelRank) || (major&&DT.labelRank>=0) || isHot)
               ? ((st.script==='arabic'&&p.ar)?p.ar:NAME('places',p)) : null});
    });
  }
  if(layerOn('events')){
    liveEv.forEach(e=>{
      const pl = e.placeId && placeById.get(e.placeId); if(!pl) return;
      const q=px(pl.lon,pl.lat), exact=e.year===y;
      marks.push({L:'events', ref:{kind:'event',o:e}, o:e, x0:q[0], y0:q[1], x:q[0], y:q[1],
        glyph: DT.shapes?'event':null, size: exact?18:15, fill:evColor(e),
        dim: exact?1:0.55, pulse: exact && st.motion!=='off', label:null, pri:1});
    });
  }
  if(layerOn('people')){
    (D.people||[]).forEach(pr=>{
      if(!pr.path||!pr.path.length) return;
      let cur=null;
      for(const sp of pr.path){ if(sp.year<=y && (!cur||sp.year>=cur.year)) cur=sp; }
      if(!cur) return;
      if(pr.death!=null && y>pr.death+2) return;
      const pl=placeById.get(cur.placeId); if(!pl) return;
      const q=px(pl.lon,pl.lat);
      marks.push({L:'people', ref:{kind:'person',o:pr,at:cur}, o:pr, x0:q[0], y0:q[1], x:q[0], y:q[1],
        glyph: DT.shapes?'person':null, size:17, fill:'var(--accent)', label:null, pri:2});
    });
  }

  separate(marks,U);
  const sid=st.sel&&st.sel.o&&st.sel.o.id;
  marks.sort((a,b)=>((a.o&&a.o.id)===sid?1:0)-((b.o&&b.o.id)===sid?1:0));
  marks.forEach(m=>drawMark(m,U));

  const fk=focusKind(), fp=document.getElementById('focuspill');
  if(fp){
    if(fk){
      const nm={events:T('tabEvents'),people:T('tabPeople'),places:T('tabPlaces'),tribes:T('tabTribes')}[fk];
      const ik={events:'event',people:'person',places:'place',tribes:'tribe'}[fk];
      fp.innerHTML=typeIco(ik,{})+'<b>'+esc(nm)+'</b><span>'+esc(isAr()?'عرض الكلّ':'show all')+'</span>';
      fp.hidden=false;
    } else fp.hidden=true;
  }
  layer.labels.style.display = st.show.regions?'':'none';
  layer.sands.style.display = st.show.sands?'':'none';
  layer.ranges.style.display= st.show.ranges?'':'none';
  layer.rivers.style.display= st.show.rivers?'':'none';
}

// Markers that land on top of each other get nudged apart, and anything moved
// keeps a hairline back to where it really belongs — the pin is a label, the
// line end is the claim.
function separate(ms,U){
  if(ms.length<2 || ms.length>320) return;
  const minD=25*U, maxPull=26*U;
  for(let it=0; it<70; it++){
    let moved=false;
    for(let i=0;i<ms.length;i++){
      for(let j=i+1;j<ms.length;j++){
        const a=ms[i], b=ms[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        if(d>=minD) continue;
        if(d<1e-9){ dx=(i%2?1:-1)*0.001; dy=(j%2?1:-1)*0.001; d=Math.hypot(dx,dy); }
        const push=(minD-d)*0.28, ux=dx/d, uy=dy/d;
        a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push;
        moved=true;
      }
    }
    if(!moved) break;
  }
  ms.forEach(m=>{
    const dx=m.x-m.x0, dy=m.y-m.y0, d=Math.hypot(dx,dy);
    if(d>maxPull){ m.x=m.x0+dx/d*maxPull; m.y=m.y0+dy/d*maxPull; }
    m.off=Math.hypot(m.x-m.x0,m.y-m.y0);
  });
}

function drawMark(m,U){
  const g=el('g',{class:'hit'});
  const selId=st.sel&&st.sel.o&&st.sel.o.id;
  const isSel = selId && m.o && m.o.id===selId;
  if(isSel) m.size=m.size*1.25;
  // leader back to the true position
  if(m.off>2.2*U){
    const ld=el('g');
    ld.appendChild(el('line',{x1:m.x0,y1:m.y0,x2:m.x,y2:m.y,stroke:'var(--mapfaint)',
      'stroke-width':.8*U,opacity:.6}));
    ld.appendChild(el('circle',{cx:m.x0,cy:m.y0,r:1.2*U,fill:'var(--mapfaint)',opacity:.75}));
    layer.leaders.appendChild(ld);
  }
  const r=(m.size/2)*U;
  if(m.pulse){
    const pulse=el('circle',{cx:m.x,cy:m.y,r:r,fill:'none',stroke:m.fill,'stroke-width':1.4*U,opacity:.9});
    pulse.appendChild(el('animate',{attributeName:'r',values:r+';'+(r*2.8)+';'+r,dur:'2.6s',repeatCount:'indefinite'}));
    pulse.appendChild(el('animate',{attributeName:'opacity',values:'.9;0;.9',dur:'2.6s',repeatCount:'indefinite'}));
    g.appendChild(pulse);
  }
  // halo so a filled glyph reads over sand, basalt or sea
  g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r+2*U,fill:'var(--land)',opacity:.88}));
  g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r+2*U,fill:'none',stroke:m.fill,'stroke-width':.9*U,opacity:.45}));
  if(m.glyph){
    const sc=(m.size*U)/16;
    const gl=el('g',{transform:'translate('+(m.x-8*sc)+' '+(m.y-8*sc)+') scale('+sc+')',
      fill:m.fill, opacity:m.dim??1});
    gl.innerHTML=ICON[m.glyph]||ICON.site;
    g.appendChild(gl);
  } else {
    g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r*.55,fill:m.fill,opacity:m.dim??1}));
  }
  if(m.ring==='guessed')
    g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r+3.4*U,fill:'none',stroke:'var(--mapfaint)',
      'stroke-width':.9*U,'stroke-dasharray':(1.6*U)+' '+(2.1*U)}));
  else if(m.ring==='approximate')
    g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r+2.8*U,fill:'none',stroke:'var(--mapfaint)',
      'stroke-width':.7*U,opacity:.45}));
  g.appendChild(el('circle',{cx:m.x,cy:m.y,r:Math.max(r+2.5*U,11.5*U),fill:'transparent'}));
  if(isSel){
    g.appendChild(el('circle',{cx:m.x,cy:m.y,r:r+6*U,fill:'none',stroke:'var(--accent)','stroke-width':1.8*U}));
    if(st.motion!=='off'){
      const halo=el('circle',{cx:m.x,cy:m.y,r:r+6*U,fill:'none',stroke:'var(--accent)','stroke-width':1.2*U});
      halo.appendChild(el('animate',{attributeName:'r',values:(r+6*U)+';'+(r+15*U)+';'+(r+6*U),dur:'2s',repeatCount:'indefinite'}));
      halo.appendChild(el('animate',{attributeName:'opacity',values:'.85;0;.85',dur:'2s',repeatCount:'indefinite'}));
      g.appendChild(halo);
    }
  }
  if(m.label || isSel){
    const t=el('text',{x:m.x+(r+3.4*U),y:m.y+3.6*U,class:'lbl lbl-place',

  bind(g,m.ref);

// A content tab narrows the map to its own kind; All, Legend and Display leave it alone.
const FOCUS={events:'events',people:'people',places:'places',tribes:'tribes'};
const MARKERS=['events','people','places','tribes'];
function focusKind(){ return FOCUS[st.tab]||null; }
function layerOn(k){

  const selK=st.sel&&{place:'places',event:'events',person:'people',tribe:'tribes'}[st.sel.kind];
  if(selK===k) return true;

function visibleEvents(){

/* ---------- tooltip & selection ---------- */
const tip=document.getElementById('tip');
function bind(g,ref){

function typeLine(kind,o){

function showTip(ev,ref){

    h+='<p style="color:var(--trad)">'+esc(o.coordConfidence)+' location</p>';

function moveTip(ev){
